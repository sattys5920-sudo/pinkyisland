name: 비밀번호 재설정

# 비밀번호를 잊은 사람의 아이디를 넣고 실행하면, 그 계정 비밀번호가 저장소 시크릿 TEMP_PW 로 바뀌어요.
# 저장소가 공개라서 비밀번호는 입력받지 않고 시크릿에서만 읽어요. 아이디도 기록에서 가려요.
on:
  workflow_dispatch:
    inputs:
      id:
        description: '게임 아이디 (영어)'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: 아이디 가리기
        env:
          ID: ${{ inputs.id }}
        run: echo "::add-mask::$ID"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 서비스 계정 키 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PW: ${{ secrets.TEMP_PW }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어요."; exit 1; fi
          if [ ${#PW} -lt 5 ]; then echo "TEMP_PW 시크릿이 없거나 5 자보다 짧아요."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@12 --silent --no-audit --no-fund >/dev/null
      - name: 비밀번호 바꾸기
        env:
          ID: ${{ inputs.id }}
          PW: ${{ secrets.TEMP_PW }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        working-directory: ${{ runner.temp }}
        run: |
          node -e '
            const admin = require("firebase-admin");
            const id = String(process.env.ID || "").trim().toLowerCase();
            if (!/^[a-z][a-z0-9_]{2,15}$/.test(id)){ console.log("아이디 모양이 맞지 않아요 (영어로 시작 · 영어 숫자 _ 3~16 자)."); process.exit(1); }
            admin.initializeApp({credential: admin.credential.applicationDefault()});
            // 게임은 아이디를 id@pinkyisland.app 로, 비밀번호 뒤에 ·pinky 를 붙여서 로그인해요 (index.html 의 idEmail · pwPad 와 같아요)
            admin.auth().getUserByEmail(id + "@pinkyisland.app")
              .then(u => admin.auth().updateUser(u.uid, {password: process.env.PW + "·pinky"}))
              .then(() => console.log("바꿨어요. 이제 TEMP_PW 로 로그인할 수 있어요."))
              .catch(e => { console.log(e.code === "auth/user-not-found" ? "그 아이디로 가입한 계정이 없어요." : "실패했어요: " + (e.code || "알 수 없음")); process.exit(1); });
          '
