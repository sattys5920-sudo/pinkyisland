<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>핑키 디저트 아일랜드</title>
<meta name="theme-color" content="#fffafb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핑키 섬">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&display=swap">
<style>
:root{--ink:#6e5260;--soft:#b39aa6;--card:#fffdfd;--pink:#fbdbe5;--pinkd:#e48fac;--line:#f7e6ec;--sea:#cfeefb}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--sea);color:var(--ink);font:700 21px/1.15 "Dongle",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:linear-gradient(#fff,#fff8fa);border-radius:16px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
#hud{left:calc(env(safe-area-inset-left,0px) + 10px)!important;font-size:18px!important;gap:6px 10px!important;flex-wrap:wrap;max-width:calc(100vw - 20px - min(260px,46vw) - 10px);position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:20px;z-index:5}
#hud u{text-decoration:none;font-size:.62em;margin-right:3px;vertical-align:1px}
#hud b{font-weight:inherit}
#hud i{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:4px}
#quest{right:calc(env(safe-area-inset-right,0px) + 10px)!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-width:min(260px,46vw);padding:8px 12px;font-size:19px;z-index:5}
#quest b{display:block;font-size:16px;color:var(--soft)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:6px;z-index:5}
#bar div{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-size:32px;box-shadow:inset 0 -2px 0 #f6e6ec}
#bar div.off{opacity:.28;filter:grayscale(1)}
#bar span{position:absolute;right:3px;bottom:0;font-size:16px;color:var(--ink)}
#chatbox{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(320px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:2px;font-size:19px;text-shadow:0 1px 0 #fff,0 0 4px #fff}
#log p{margin:0;transition:opacity 1s}
#log p.sys{color:var(--pinkd)}
#chatrow{display:flex;gap:6px;pointer-events:auto}
#chatin{flex:1;min-width:0;font:700 20px "Dongle",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffffff0;color:var(--ink)}
.emo{border:0;border-radius:12px;background:#fff;width:44px;min-height:44px;font-size:25px;box-shadow:inset 0 -2px 0 #f6e6ec}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(520px,calc(100vw - 20px));padding:14px 16px;z-index:8}
#talk h3{margin:0 0 4px;font-size:25px;color:var(--pinkd)}
#talk p{margin:0 0 10px;font-size:21px;white-space:pre-line}
#talk #talkNote{font-size:18px;color:var(--soft);margin-top:-6px}
#talk .act{flex-wrap:wrap}
#talk .act.choices{flex-direction:column;align-items:stretch}
.btn.choice{background:#fff;color:var(--ink);text-align:left;box-shadow:inset 0 -3px 0 #f6e6ec,0 0 0 2px #fbe3ea}
.btn.choice::before{content:'▸ ';color:var(--pinkd)}
.mini{border:0;border-radius:10px;background:var(--pink);color:var(--ink);font-size:18px;padding:2px 10px;box-shadow:inset 0 -2px 0 #f2c3d3}
#npcPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:10px;width:min(360px,calc(100vw - 20px));max-height:calc(100% - 150px);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.np{border:0;background:#fff;border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px;box-shadow:inset 0 -2px 0 #f6e6ec}
.np-name{font-size:20px}.np-name small{color:var(--soft);font-size:16px}
.np-place{font-size:16px;color:var(--soft);text-align:right}
.np-h{color:#f08aa8;font-size:16px;letter-spacing:1px}
.np-day{font-size:16px;color:var(--soft);text-align:right}
.np-h small{color:var(--soft);letter-spacing:0}
.np-keep{grid-column:1/-1;font-size:16px;color:var(--pinkd)}
#sideBtns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:flex;flex-direction:column;gap:8px;z-index:5}
.round.swing{width:64px;height:64px;font-size:18px;background:linear-gradient(#fff,#fde4ec);box-shadow:inset 0 -3px 0 #f2c3d3,0 4px 14px #d4a3b52e}
.round{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(#fff,#fff8fa);color:var(--ink);font-size:19px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
#mapPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100% - 150px);overflow:auto;padding:10px;touch-action:pan-y}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px;margin-top:6px}
.mz{background:#fff;border-radius:10px;padding:5px 3px;text-align:center;font-size:15px;line-height:1.25;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 -2px 0 #f6e6ec;min-height:52px;justify-content:center}
.mz b{font-size:16px;font-weight:normal}
.mz small{color:var(--soft);font-size:13px}
.mz i{font-style:normal;color:var(--ink);background:var(--pink);border-radius:8px;padding:0 4px;align-self:center;font-size:13px}
.mz.here{outline:3px solid var(--pinkd)}
.mnote{font-size:16px;color:var(--soft);margin:8px 2px 0}
#fishGame{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(440px,calc(100vw - 20px));padding:12px 14px;z-index:11;display:flex;flex-direction:column;gap:8px;touch-action:none}
#fishGame b{font-size:24px;color:var(--pinkd)}
#fishGame small{font-size:16px;color:var(--soft)}
#fishGame p{margin:0;font-size:19px}
#fgTrack{position:relative;height:54px;border-radius:14px;background:linear-gradient(#bfe6fb,#8fd3f5);overflow:hidden;cursor:grab}
#fgZone{position:absolute;top:6px;bottom:6px;border-radius:10px;background:#ffffff66;border:2px solid #fff}
#fgZone.on{background:#fde4ecaa;border-color:#f2b6c9}
#fgBob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:linear-gradient(#ff5a5a 50%,#fff 50%);box-shadow:0 2px 4px #0003}
#fgMeter{height:10px;border-radius:6px;background:#f6e6ec;overflow:hidden}
#fgBar{height:100%;width:35%;background:#f2b6c9}
img.ic{width:34px;height:34px;vertical-align:middle;margin-right:4px}
img.tic{width:26px;height:26px;vertical-align:middle;margin-right:4px}
#talkIcon{float:right;width:72px;height:72px;margin:-6px -4px 0 8px}
.bag-sec{display:flex;flex-direction:column;gap:4px}
.bag-sec b{font-size:18px;color:var(--soft);padding:0 4px}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.tile{position:relative;border:0;background:#fff;border-radius:12px;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 -2px 0 #f6e6ec;min-height:58px}
.tile img.ic{width:44px;height:44px;margin:0}
.tile i{position:absolute;right:4px;top:2px;font-style:normal;font-size:16px;color:var(--ink)}
.tile s{text-decoration:none;font-size:13px;color:#e8a400;line-height:1}
.tile em{font-style:normal;font-size:13px;line-height:1.2;text-align:center}
.dex .tile s{color:var(--soft)}
.tile.unknown img{opacity:.55}
.tile.on{box-shadow:inset 0 -2px 0 #f6e6ec,0 0 0 2px var(--pinkd)}
.tile.full i{color:#e48fac}
#fade{position:fixed;inset:0;background:#fffafb;opacity:0;pointer-events:none;z-index:6}
.btn{border:0;border-radius:12px;padding:7px 16px;background:var(--pink);color:var(--ink);font-size:21px;box-shadow:inset 0 -3px 0 #f2c3d3}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #f6e6ec}
.btn:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);padding:8px 16px;z-index:9;font-size:20px;transition:opacity .4s;pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}
#ob{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:fixed;inset:0;z-index:20;background:#fffafb;overflow:auto;touch-action:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 40px}
.obc{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.obc h1{margin:0;font-size:46px;color:var(--pinkd);line-height:1.15}
.obc h2{margin:0;font-size:30px}
.obc .sub{margin:0;color:var(--soft);font-size:20px}
.steps{display:flex;gap:6px;font-size:18px;color:var(--soft);flex-wrap:wrap}
.steps span{background:#fff;border-radius:999px;padding:2px 10px}
.steps span.on{background:var(--pink);color:var(--ink)}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.maker{grid-template-columns:1fr}}
.prev{background:#fffafb;border-radius:16px;aspect-ratio:2/1;overflow:hidden}
.prev canvas{width:100%;height:100%;display:block}
.ctrls{display:flex;flex-direction:column;gap:8px}
.row b{font-size:19px;color:var(--soft);display:block;margin-bottom:3px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{font-size:19px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px}
.opts button.sw{width:26px;height:26px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.opts button[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:#f2c3d3}
.opts button.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pinkd)}
.nick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nick input{font:700 25px "Dongle",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 12px;width:min(220px,60vw);color:var(--ink)}
.err{color:#d6335f;font-size:19px;min-height:1.4em;margin:0}
.roofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.roofs button{border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:19px}
.roofs button i{width:52px;height:26px;border-radius:14px 14px 4px 4px;display:block;box-shadow:inset 0 -4px 0 #0002}
.roofs button small{font-size:16px;color:var(--soft)}
.roofs button[aria-pressed="true"]{border-color:var(--pinkd)}
.roofs button:disabled{opacity:.45;cursor:default}
.lots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lots button{border:2px dashed #f0d3dd;background:#fff;border-radius:12px;padding:6px 2px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center}
.lots button i{width:30px;height:16px;border-radius:9px 9px 3px 3px;display:block}
.lots button:disabled{border-style:solid;border-color:transparent;cursor:default}
.lots button[aria-pressed="true"]{border:2px solid var(--pinkd);background:#fff6f9}
.lots .gap{grid-column:span 7;text-align:center;font-size:18px;color:var(--soft);padding:2px}
.act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.note{background:#fff;border-radius:14px;padding:10px 14px;font-size:19px;color:var(--soft)}

/* ===== 폰 화면 (아이폰·갤럭시): 위는 한 줄 정보바, 창은 아래에서 올라오는 시트 ===== */
@media (max-width:640px){
  #hud{left:10px!important;right:10px;max-width:none!important;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;white-space:nowrap;gap:0 10px!important;padding:5px 12px;border-radius:14px}
  #hud::-webkit-scrollbar{display:none}
  #hud span{flex:none}
  #quest{top:calc(env(safe-area-inset-top,0px) + 54px);left:10px;right:10px!important;max-width:none;padding:4px 12px;font-size:16px;display:flex;gap:6px;align-items:baseline;border-radius:12px}
  #quest b{display:inline;font-size:13px;flex:none}
  #npcPanel,#mapPanel{top:auto;left:0;right:0;width:auto;transform:none;bottom:0;max-height:min(72dvh,calc(100% - 120px));border-radius:22px 22px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -6px 24px #c08aa02e;z-index:12}
  #npcPanel::before,#mapPanel::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px;flex:none}
  #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:calc(100vw - 16px)}
  #sideBtns{bottom:calc(env(safe-area-inset-bottom,0px) + 74px);gap:6px}
  .round{width:48px;height:48px;font-size:15px}
  .round.swing{width:60px;height:60px}
  #chatbox{width:calc(100vw - 20px - 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
  #log{font-size:15px;max-height:6em;overflow:hidden;justify-content:flex-end}
  #chatin{min-width:0}
  #toast{top:calc(env(safe-area-inset-top,0px) + 100px)}
  #bar{padding:5px}
  #bar div{width:44px;height:44px}
  #fishGame{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .mini{min-height:34px}
  .mgrid{gap:3px}
  .obc h1{font-size:34px}
}
/* 가로로 눕힌 폰: 높이가 낮아요 */
@media (max-height:460px){
  #quest{display:none}
  #npcPanel,#mapPanel{top:calc(env(safe-area-inset-top,0px) + 50px);bottom:auto;left:calc(env(safe-area-inset-left,0px) + 10px);right:auto;width:min(420px,60vw);max-height:calc(100% - 60px);border-radius:16px;transform:none}
  #npcPanel::before,#mapPanel::before{display:none}
  #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:min(560px,calc(100vw - 180px))}
  #bar{padding:4px}
  #bar div{width:40px;height:40px;font-size:20px}
  #sideBtns{flex-direction:row;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 10px)}
  .round{width:44px;height:44px;font-size:14px}
  .round.swing{width:52px;height:52px}
  #chatbox{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:min(260px,30vw)}
  #log{max-height:4.5em;overflow:hidden;justify-content:flex-end}
}
/* 키패드가 올라온 동안: 채팅창만 남기고 아래 버튼은 숨겨요 */
body.typing #bar, body.typing #sideBtns, body.typing #talk, body.typing #toast{visibility:hidden}
body.typing #chatbox{z-index:30;transition:bottom .12s}
body.typing #log{max-height:4.5em;overflow:hidden;justify-content:flex-end}
body.typing #chatin{background:#fff}
</style>
</head>
<body>

<canvas id="game" aria-label="게임 화면"></canvas>
<div id="hud" class="pill" hidden></div>
<div id="quest" class="pill" hidden></div>
<div id="bar" class="pill" hidden></div>
<div id="chatbox" hidden>
  <div id="log" aria-live="polite"></div>
  <div id="chatrow">
    <input id="chatin" maxlength="80" placeholder="채팅하기" autocomplete="off">
    <button class="emo" data-e="👋" aria-label="손 흔들기">👋</button>
    <button class="emo" data-e="❤️" aria-label="하트">❤️</button>
    <button class="emo" data-e="✨" aria-label="반짝">✨</button>
    <button class="emo" data-e="😢" aria-label="눈물">😢</button>
  </div>
</div>
<div id="talk" class="pill" hidden><img id="talkIcon" alt="" hidden><h3 id="talkName"></h3><p id="talkText"></p><p id="talkNote" hidden></p><div class="act" id="talkAct"></div></div>
<div id="npcPanel" class="pill" hidden></div>
<div id="mapPanel" class="pill" hidden></div>
<div id="sideBtns" hidden><button id="mapBtn" class="round">지도</button><button id="npcBtn" class="round">주민</button><button id="decoBtn" class="round" hidden>꾸미기</button><button id="swingBtn" class="round swing" hidden>휘두르기</button></div>
<div id="fade"></div>
<div id="fishGame" class="pill" hidden><b id="fgTitle">무언가 걸렸어요!</b><div id="fgTrack"><div id="fgZone"></div><div id="fgBob"></div></div><div id="fgMeter"><div id="fgBar"></div></div><p id="fgText"></p><small>누른 채 좌우로 움직여 찌를 따라가요 (키보드: ← →)</small></div>
<div id="toast" class="pill" style="opacity:0"></div>
<div id="ob"><div class="obc" id="obc"><h1>핑키 디저트 아일랜드</h1><p class="sub">섬에 연결하는 중이에요…</p></div></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { NPC_TEXT } from './npcs.js';
import * as CH from './char.js';
import { ART_PART as ART_FISH_A } from './art/fish_a.js';
import { ART_PART as ART_FISH_B } from './art/fish_b.js';
import { ART_PART as ART_CROPS } from './art/crops.js';
import { ART_PART as ART_ORES } from './art/ores.js';
import { ART_PART as ART_MON } from './art/monsters.js';
import { ART_PART as ART_DISH } from './art/dishes.js';
const P = {grass:'#b5e6a3',grass2:'#9fdb8c',path:'#ffe0bf',water:'#9fd9ff',waterHi:'#e8f7ff',cream:'#fff0e0',pink:'#ffa6c9',choco:'#9a5a45',cherry:'#ff5a78',candyA:'#ffa6cf',candyB:'#fff09a',stick:'#fff',soil:'#d69a70',berry:'#ff5a78',leaf:'#6cc46a',rock:'#c3b8d2',gem:'#bf8cff',dust:'#bdb5c9',blush:'#ffadc4',eye:'#5b3345',stitch:'#ffffff',bubble:'#fff',text:'#8a4b63'};
const STARTERS = [['t01|b01','기본 티 + 청바지'],['t02|b02','줄무늬 티 + 반바지'],['t01|b02','기본 티 + 반바지'],['s01','멜빵바지']];
const OPT = {
  skin:  { label:'피부 색', color:true, v:CH.SKINS },
  hairA: { label:'머리 모양 (남)', target:'hair', v:CH.HAIR_M.map(k=>[k, CH.HAIR[k].label]) },
  hairB: { label:'머리 모양 (여)', target:'hair', v:CH.HAIR_F.map(k=>[k, CH.HAIR[k].label]) },
  hairColor: { label:'머리 색', color:true, v:CH.HAIR_COLORS },
  starter: { label:'시작 옷 (옷가게에서 더 살 수 있어요)', target:'starter', v:STARTERS },
};
let EDIT = { ...CH.defaultLook(), starter:'t01|b01' };
function applyStarter(L){ const st = L.starter || 't01|b01'; const n = {...L}; delete n.starter; if (st.startsWith('s')){ n.set = st; } else { const [t,b] = st.split('|'); n.top = t; n.bottom = b; n.set = ''; } return n; }

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

// 클레이 질감: 블러 그림자 대신 (1) 바닥에 붙은 접촉 그림자 (2) 매트한 몸통 그라데이션 (3) 위쪽 가장자리 림 라이트 (4) 아래 가장자리 어두운 음영 (5) 고운 입자
let grainCanvas = null;
function grainPattern(ctx){
  if (ctx.__grain) return ctx.__grain;
  if (!grainCanvas){
    grainCanvas = document.createElement('canvas'); grainCanvas.width = grainCanvas.height = 96;
    const g = grainCanvas.getContext('2d'), img = g.createImageData(96, 96), d = img.data;
    let seed = 7; for (let i=0;i<d.length;i+=4){ seed = (seed*1103515245 + 12345) & 0x7fffffff; const v = seed % 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    g.putImageData(img, 0, 0);
  }
  return ctx.__grain = ctx.createPattern(grainCanvas, 'repeat');
}
function mixHex(a, b, k){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16); const f=(x,y)=>Math.round(x+(y-x)*k); return '#'+[f(A>>16,B>>16),f(A>>8&255,B>>8&255),f(A&255,B&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
const toHex = col => col.startsWith('#') ? (col.length===4 ? '#'+[...col.slice(1)].map(c=>c+c).join('') : col.slice(0,7)) : (()=>{ const m = col.match(/\d+/g); return m ? '#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('') : '#cccccc'; })();
function painter(ctx){
  function paint(path, key, [cx,cy,r]){
    const col = toHex(P[key] || key), big = r >= 6, huge = r > 60, k = huge ? .35 : 1; // 큰 바닥 모양은 효과를 약하게
    ctx.save();
    if (big){ // 접촉 그림자: 같은 모양을 살짝 아래로 어둡게
      ctx.save(); ctx.translate(Math.min(2.5, r*.08), Math.min(5, Math.max(1.2, r*.16))); ctx.globalAlpha = r > 60 ? .08 : .16; path(); ctx.fillStyle = '#5a2e48'; ctx.fill(); ctx.restore();
    }
    const g = ctx.createRadialGradient(cx-r*.38, cy-r*.42, r*.08, cx, cy, r*1.18);
    g.addColorStop(0, mixHex(col, '#fff7ef', .42*k)); g.addColorStop(.5, col); g.addColorStop(1, mixHex(col, '#4a2a40', .26*k));
    path(); ctx.fillStyle = g; ctx.fill();
    if (big){
      path(); ctx.clip();
      // 아래 가장자리 음영 (덩어리감)
      const ao = ctx.createRadialGradient(cx+r*.15, cy+r*.35, r*.55, cx+r*.15, cy+r*.35, r*1.15);
      ao.addColorStop(0, 'rgba(70,30,60,0)'); ao.addColorStop(1, `rgba(70,30,60,${.28*k})`);
      ctx.fillStyle = ao; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 위쪽 림 라이트
      const rim = ctx.createRadialGradient(cx-r*.25, cy-r*.3, r*.78, cx-r*.25, cy-r*.3, r*1.08);
      rim.addColorStop(0, 'rgba(255,250,245,0)'); rim.addColorStop(.75, `rgba(255,250,245,${.42*k})`); rim.addColorStop(1, 'rgba(255,250,245,0)');
      ctx.fillStyle = rim; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 입자
      if (r >= 9){ ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = grainPattern(ctx); ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6); }
    }
    ctx.restore();
  }
  return { ctx,
    circle:(x,y,r,k)=>paint(()=>{ctx.beginPath();ctx.arc(x,y,r,0,7);},k,[x,y,r]),
    ell:(x,y,rx,ry,k)=>paint(()=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);},k,[x,y,Math.max(rx,ry)]),
    rr:(x,y,w,h,r,k)=>paint(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);},k,[x+w/2,y+h/2,Math.max(w,h)/2]),
    tri:(pts,k)=>paint(()=>{ctx.beginPath();ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1]);ctx.lineTo(...pts[2]);ctx.closePath();},k,[pts[1][0],pts[1][1]+6,8]),
    dot:(x,y,r,k,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=P[k]||k;ctx.fill();ctx.restore();},
    shape:(fn,k,box)=>paint(fn,k,box||[0,0,12]),
    stitch:(fn,k='stitch',a=.85)=>{ctx.save();ctx.globalAlpha=a;ctx.setLineDash([2,1.6]);ctx.lineWidth=.9;ctx.strokeStyle=P[k]||k;ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
    line:(fn,k,w=1)=>{ctx.save();ctx.strokeStyle=P[k]||k;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
  };
}

// ===== 스프라이트 캐시: 캐릭터는 자세별로 한 번만 그리고, 그 뒤로는 그림을 붙여 넣어요 (끊김 방지) =====
const spriteCache = new Map(), SPRITE_MAX = 420, TAU = Math.PI*2;
function sprite(key, w, h, ox, oy, drawFn){
  let sp = spriteCache.get(key);
  if (!sp){
    const sc = Math.min(3, Math.max(1, Math.round(view.dpr*view.zoom*2)/2));
    const c = document.createElement('canvas'); c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const x = c.getContext('2d'); x.setTransform(sc,0,0,sc,ox*sc,oy*sc);
    drawFn(painter(x));
    sp = {c, sc, ox, oy};
    if (spriteCache.size >= SPRITE_MAX) spriteCache.delete(spriteCache.keys().next().value);
    spriteCache.set(key, sp);
  }
  return sp;
}
const qphase = (ph, n) => Math.round((((ph % TAU) + TAU) % TAU) / TAU * n) % n;
// 플레이어: 걷기 8단계, 서 있기 4단계. 매트 클레이 페인터로 그려요
function drawPlayer(c, x, y, L, dir, t, walk, s=1, expr='dot'){
  if (!L || !L.top && !L.set) L = CH.migrateLook(L);
  const ph = t*8 + x*.37, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'p|'+JSON.stringify(L)+'|'+dir+'|'+(walk?'w':'i')+q+'|'+expr+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/8 : q/4*TAU/2;
  const B = CH.FIG_BOX;
  const sp = sprite(key, B.w, B.h, B.ox, B.oy, d=>CH.figure(CH.mattePainter(d.ctx), L, dir, t2, walk, expr));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}
// 표정: 잠깐 바뀌었다가 돌아와요. 밤(0~5시)에 가만히 있으면 졸린 눈
let exprNow = 'dot', exprUntil = 0;
function setExpr(e, ms=2000){ exprNow = e; exprUntil = performance.now() + ms; }
function myExpr(){ if (performance.now() < exprUntil) return exprNow; const h = kstHour(); return (h < 5 && !pos.moving) ? 'sleepy' : 'dot'; }
// 동물 주민: 걷기 8단계, 서 있기 4단계
function drawCritter(c, x, y, v, t, walk, s=1, flip=false){
  if (flip){ c.save(); c.translate(x, 0); c.scale(-1, 1); drawCritter(c, 0, y, v, t, walk, s, false); c.restore(); return; }
  const ph = t*7 + x*.3, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'c|'+JSON.stringify(v)+'|'+(walk?'w':'i')+q+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/7 : q/4*TAU/2;
  const sp = sprite(key, 80, 100, 40, 88, d=>critter(d, 0, 0, v, t2, walk, 1));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function blob(d, x, y, fabric, acc, t){
  const c=d.ctx, bob=Math.abs(Math.sin(t*2.5+x))*1.5;
  c.save(); c.translate(x,y);
  d.dot(0,2,11,'rgba(0,0,0,.13)'); c.translate(0,-bob);
  d.ell(-5,1,4,2.6,shade(fabric,-.12)); d.ell(5,1,4,2.6,shade(fabric,-.12));
  d.ell(0,-13,13,13,fabric); d.ell(-14,-11,3.2,4.5,fabric); d.ell(14,-11,3.2,4.5,fabric);
  d.stitch(c=>{c.moveTo(0,-24.5);c.quadraticCurveTo(2,-20,0,-16);});
  for (const ex of [-4.5,4.5]){ d.dot(ex,-14,2.4,'eye'); d.dot(ex-.7,-14.5,.5,'#fff'); d.dot(ex+.7,-13.5,.5,'#fff'); }
  d.dot(-7.5,-10,2.3,'blush',.8); d.dot(7.5,-10,2.3,'blush',.8);
  if (acc==='apron') d.rr(-6,-9,12,8,3,'#ffffff');
  if (acc==='cap'){ d.ell(0,-25,10,4.5,'#5fb3ff'); d.ell(6,-23,7,2,'#4a9be8'); }
  c.restore();
}

// 취향: 'crop:c01'처럼 정확한 아이템이 먼저, 그다음 'crop' 같은 분류
function tasteOf(npc, item){
  const exact = item.split('_')[0], cat = item.split(':')[0];
  for (const k of ['loved','liked','disliked']) if ((npc.tastes[k]||[]).includes(exact)) return k;
  for (const k of ['loved','liked','disliked']) if ((npc.tastes[k]||[]).includes(cat)) return k;
  if (cat==='dish') return 'liked';
  return 'neutral';
}

// 우체부 토리는 시계를 기준으로 마을을 돌아서 모두의 화면에 같은 자리에 보여요
const TORI_PATH = [[1180,912],[880,912],[880,620],[560,560],[880,620],[1240,560],[880,620],[880,912]];
const TORI_SEGS = TORI_PATH.map((a,i)=>{ const b = TORI_PATH[(i+1)%TORI_PATH.length]; return {a, b, walk:Math.hypot(b[0]-a[0], b[1]-a[1])/60*1000}; });
const TORI_TOTAL = TORI_SEGS.reduce((s,g)=>s+g.walk+3000, 0);
function toriPos(now){
  let t = now % TORI_TOTAL;
  for (const g of TORI_SEGS){
    if (t < 3000) return {x:g.a[0], y:g.a[1], mv:false, dx:0};
    t -= 3000;
    if (t < g.walk){ const k = t/g.walk; return {x:g.a[0]+(g.b[0]-g.a[0])*k, y:g.a[1]+(g.b[1]-g.a[1])*k, mv:true, dx:g.b[0]-g.a[0]}; }
    t -= g.walk;
  }
  return {x:TORI_PATH[0][0], y:TORI_PATH[0][1], mv:false, dx:0};
}

// 주민 산책: 자기 자리(home) 주위 range 안에서 7초마다 새 자리로 느긋하게 걸어가요. 시간 기준이라 친구 화면에서도 같은 자리에 있어요
const NPC_RANGE = {momo:55, dandan:55, mongsil:55, bori:60, olly:60, toto:70, lulu:80, pengpeng:80, dodo:70, bibi:110, hana:110, bami:80, kongi:120};
const WANDER_MS = 7000, WANDER_PAUSE = 2800;
function wanderSpot(n, k){
  const h = hash(n.id + '|' + k), r = (NPC_RANGE[n.id] || 70) * (0.35 + (h % 1000) / 1000 * 0.65), a = ((h >>> 10) % 6283) / 1000;
  const x = n.home[0] + Math.cos(a)*r, y = n.home[1] + Math.sin(a)*r*0.6; // 위아래로는 조금만
  return blocked(x, y) ? {x:n.home[0], y:n.home[1]} : {x, y};
}
function wanderPos(n, now){
  const k = Math.floor(now / WANDER_MS), t = now - k*WANDER_MS, a = wanderSpot(n, k-1), b = wanderSpot(n, k);
  if (t < WANDER_PAUSE) return {x:a.x, y:a.y, mv:false, dx:0};
  const u = (t - WANDER_PAUSE) / (WANDER_MS - WANDER_PAUSE), e = u*u*(3-2*u);
  return {x:a.x + (b.x-a.x)*e, y:a.y + (b.y-a.y)*e, mv:Math.hypot(b.x-a.x, b.y-a.y) > 4, dx:b.x-a.x};
}
function updateNpcs(now){
  for (const n of NPCS){
    if (n.zone !== zoneId) continue;
    if (!n.home) n.home = [n.x, n.y];
    const p = n.id==='tori' ? toriPos(now) : wanderPos(n, now);
    n.x = p.x; n.y = p.y; n.mv = p.mv; if (p.dx) n.flip = p.dx < 0;
  }
}

function houseRect(p){ const w = p.wide ? 150 : 112; return {x:p.x-w/2,y:p.y-108,w,h:110}; }
const obstacles = { circles: [], rects: [], ells: [] };
function rebuildObstacles(){
  const z = Z(); const o = {circles:[], rects:[], ells:[]};
  for (const [x,y] of z.trees) o.circles.push({x, y:y+22, r:24});
  for (const p of z.places){
    if (p.kind==='house') o.rects.push(houseRect(p));
    if (p.kind==='fountain') o.circles.push({x:p.x, y:p.y, r:44});
    if (p.kind==='tree') o.circles.push({x:p.x, y:p.y+40, r:46});
    if (p.kind==='pond') o.ells.push({x:p.x, y:p.y, rx:p.rx, ry:p.ry});
    if (p.kind==='lighthouse') o.rects.push({x:p.x-28, y:p.y-150, w:56, h:155});
    if (p.kind==='sea') o.rects.push({x:0, y:0, w:z.W, h:250});
    if (p.kind==='mine'){ o.ells.push({x:520,y:900,rx:220,ry:150}, {x:1080,y:900,rx:220,ry:150}); }
    if (p.kind==='logs') o.rects.push({x:p.x-60, y:p.y-30, w:120, h:40});
  }
  if (zoneId==='home') for (const p of Object.values(players)) if (p.lot!=null){ const L=LOTS[p.lot]; o.rects.push({x:L.x-54,y:L.y-106,w:108,h:108}); }
  Object.assign(obstacles, o);
}
function inCorridor(x, y){
  const z = Z(), ex = z.exits;
  if (ex.n && y < M+10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.s && y > z.H-M-10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.w && x < M+10 && Math.abs(y-z.H/2) < GAP) return true;
  if (ex.e && x > z.W-M-10 && Math.abs(y-z.H/2) < GAP) return true;
  return false;
}
function blocked(x,y){
  const z = Z();
  if (x<4||y<4||x>z.W-4||y>z.H-4) return true;
  if ((x<M||x>z.W-M||y<M||y>z.H-M) && !inCorridor(x,y)) return true;
  if (z.theme==='room' && y < 250) return true;
  for (const e of obstacles.ells) if (((x-e.x)/(e.rx+6))**2 + ((y-e.y)/(e.ry+6))**2 < 1) return true;
  for (const c of obstacles.circles) if ((x-c.x)**2+(y-c.y)**2 < c.r*c.r) return true;
  for (const r of obstacles.rects) if (x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h) return true;
  return false;
}

  if (side) enterZone(ex[side], {n:'s', s:'n', w:'e', e:'w'}[side]);
}
let fadeT = 0;

// 동물 몸 주민: 큰 머리 + 통통한 동물 몸 + 앞발·콩 발 + 꼬리, 옷 대신 작은 소품
function hexShade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return '#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function critter(d, x, y, v, t, walk=true, s=1){
  const c = d.ctx, ph = t*7 + x*.3, step = walk ? Math.sin(ph) : 0;
  const bob = walk ? Math.abs(Math.sin(ph))*1.3 : Math.sin(t*2+x)*.4+.4;
  const K = v.kind, f = v.fur, f2 = v.fur2 || hexShade(f,.55), dark = hexShade(f,-.25), oc = v.color, hy = -27;

  c.save(); c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(0,1,10,3.2,0,0,7); c.fill(); c.restore();
  c.translate(0,-bob);
  // 꼬리·등껍질 (몸 뒤)
  if (K==='fox'){ d.ell(11,-9,5,9,f); d.ell(13,-3,3.4,3.6,'#ffffff'); }
  if (K==='squirrel'){ d.ell(12,-20,7.5,14,f); d.ell(13,-29,6,6,hexShade(f,.25)); }
  if (K==='cat'){ d.ell(10,-8,2.4,6,f); d.ell(12,-14,2.4,4,f); }
  if (K==='dog') d.ell(10,-9,3,5.5,f);
  if (K==='rabbit') d.circle(9,-5,4,'#ffffff');
  if (K==='bear'||K==='panda'||K==='otter') d.circle(9,-5,3.2,K==='panda'?'#ffffff':f);
  if (K==='otter') d.ell(11,-3,3,7,f);
  if (K==='turtle') d.ell(0,-13,12,11,'#6fae5f');
  // 동물 몸: 통통한 몸통 + 밝은 배 + 짧은 앞발 + 콩 같은 발
  const pawC = K==='panda' ? black : K==='penguin' ? '#ffa94d' : dark;
  const a = Math.max(0,step)*1.6, b = Math.max(0,-step)*1.6;
  d.ell(-4.6,-1.6-a,4.2,3,pawC); d.ell(4.6,-1.6-b,4.2,3,pawC);
  if (K==='hedgehog') for (let ang=-2.6;ang<=-.5;ang+=.35) d.tri([[Math.cos(ang)*8-3,-10+Math.sin(ang)*7],[Math.cos(ang)*15,-10+Math.sin(ang)*13],[Math.cos(ang)*8+3,-10+Math.sin(ang)*7+3]],'#8a6248');
  if (K==='sheep') for (let ang=0; ang<6.28; ang+=.55) d.circle(Math.cos(ang)*9.5,-10+Math.sin(ang)*8.5,4.6,'#ffffff');
  d.ell(0,-10,K==='penguin'?10.5:10,10.5,K==='sheep'?'#ffffff':f);
  const belly = (K==='penguin'||K==='panda') ? '#ffffff' : f2;
  if (K!=='sheep') d.ell(0,-8.5,6.4,7,belly);
  const armC = K==='panda' ? black : f;
  for (const [ax,k] of [[-9.6,step],[9.6,-step]]){ if (K==='penguin') d.ell(ax*1.05,-11+k*.8,2.6,6,f); else { d.ell(ax,-11+k*.8,3,4.2,armC); d.dot(ax,-8+k*.8,1.2,hexShade(armC,.35)); } }
  // 옷 대신 작은 소품: 스카프·앞치마·치마
  const O = v.outfit;
  if (O==='apron') d.rr(-5.5,-13.5,11,10,3,v.color2||'#ffffff');
  if (O==='dress') d.ell(0,-4.5,10.5,4,v.color);
  if (O==='chef'){ d.rr(-6.5,-17.5,13,3.6,1.6,'#ffffff'); d.dot(0,-13,1,'#c9c9d6'); }
  if (!['apron','chef','dress'].includes(O) && v.color){ d.rr(-7.5,-18,15,4.2,2,O==='overall'||O==='vest'||O==='sailor' ? (v.color2||v.color) : v.color); d.tri([[2,-15],[6,-9],[8,-15]], O==='overall'||O==='vest'||O==='sailor' ? (v.color2||v.color) : v.color); }
  if (O==='uniform') d.dot(-3,-16,1.3,'#ffd84f');
  if (v.acc==='bag'){ d.line(c=>{c.moveTo(-6,-18);c.lineTo(6,-8);},'#8a5a3b',1.3); d.rr(4,-10,7,6,2,'#c98e5b'); }
  // 머리 뒤에 오는 귀·가시

// Realtime Database는 배열 속 null을 지워 버려서, 텃밭 칸은 false 또는 {stage, wateredAt}로 저장해요 (stage -1 = 빈 텃밭)
function fromDB(p){
  if (!p) return p;
  const g = p.gardens || [], inv = {garden:0, can:false, gold:0, rod:false, pick:false, sword:false, ...(p.inv||{})};
  for (const k of ['seeds','crops','fish','ores','loot']) inv[k] = {...(inv[k]||{})};
  if (inv.seed){ inv.seeds.c01 = (inv.seeds.c01||0) + inv.seed; } delete inv.seed;
  if (inv.tomato){ inv.crops.c01 = (inv.crops.c01||0) + inv.tomato; } delete inv.tomato;
  const closet = [...new Set([...CH.FREE, ...(p.closet||[]), ...(p.hats ? p.hats.split(',') : []), ...CH.lookItems(CH.migrateLook(p.look))])].filter(id=>CH.ITEM(id));
  return { ...p, look:CH.migrateLook(p.look), closet, rel:p.rel||{}, inv,
    gardens:Array.from({length:Math.max(2, Math.min(6, p.plots||2))}, (_,i)=>i).map(i=>{ const s = g[i]; if (!s) return null; return {crop: s.stage>=0 ? {type:s.type||'c01', stage:s.stage, wateredAt:s.wateredAt||null} : null}; }) };
}
function toDB(p){
  return { ...p, gardens: p.gardens.map(g => g ? {stage: g.crop ? g.crop.stage : -1, wateredAt: (g.crop && g.crop.wateredAt) || 0, type: (g.crop && g.crop.type) || ''} : false) };
}
// 입주하지 않은 채 10분이 지난 선점은 다른 사람이 가져갈 수 있어요
function abandoned(c){ return !players[c.uid] && Date.now() - (c.at||0) > 600000; }

let saving=false, saveAgain=false;
async function saveMe(){
  if (saving){ saveAgain=true; return; }
  saving=true;
  try { await net.savePlayer(toDB(me)); }
  catch(e){ toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  saving=false;
  if (saveAgain){ saveAgain=false; saveMe(); }
}

// ===== 데이터 수신 =====
let firstPlayers = true, firstOnline = true;
function onPlayers(raw){
  const next = {};
  for (const [k,v] of Object.entries(raw||{})) if (v) next[k] = fromDB(v);
  players = next;
  rebuildObstacles();
  if (firstPlayers){ firstPlayers = false; if (players[uid]) enterGame(structuredClone(players[uid])); else showMaker(); }
  else if (obStep) renderOb();
}
function onRoofs(raw){
  const next = {};
  for (const [k,v] of Object.entries(raw||{})) if (v) next['roof-'+k] = v;
  claims = next; if (obStep && obStep!=='maker') renderOb();
}
function onOnline(raw){
  const seen = new Set();
  for (const [id, s] of Object.entries(raw||{})){
    if (id===uid || !s || typeof s.x!=='number' || !s.look) continue;
    seen.add(id);
    let o = others.get(id);
    if (!o){ o = {x:s.x, y:s.y, emoAt:s.emoAt}; others.set(id, o); if (!firstOnline) addLog(`${String(s.nick||'누군가').slice(0,8)}님이 섬에 왔어요`, true); }
    if (s.emoAt && s.emoAt!==o.emoAt){ o.emoAt = s.emoAt; if (s.emo && Date.now()-s.emoAt < 5000) bubbles.set(id+'-emo', {text:String(s.emo).slice(0,4), at:performance.now()}); }
    const oz = zoneOk(s.z) ? s.z : 'home';
    if (o.z && o.z!==oz){ o.x = s.x; o.y = s.y; }
    o.z = oz;
    Object.assign(o, {sx:s.x, sy:s.y, dir:s.dir||'down', mvRemote:s.mv, look:CH.migrateLook(s.look), ex:typeof s.ex==='string' ? s.ex : 'dot', nick:String(s.nick||'').slice(0,8), uid:id});
    if (typeof s.tx==='number'){ o.goal = {x:s.tx, y:s.ty}; if (Math.hypot(o.x-s.x, o.y-s.y) > 48){ o.x = s.x; o.y = s.y; } }
    else o.goal = null;
  }
  for (const [id,o] of [...others]) if (!seen.has(id)){ others.delete(id); addLog(`${o.nick}님이 집에 갔어요`, true); }
  firstOnline = false;
  if (me) renderHud();
}
function onChat(m){
  if (!m || typeof m.t!=='string' || !m.t) return;
  const t = m.t.slice(0,80), age = Math.max(0, Date.now() - (m.at||Date.now()));
  addLog(`${String(m.nick||'누군가').slice(0,8)}: ${t}`);
  if (age < 5000) bubbles.set(m.uid===uid ? 'me' : m.uid, {text:t, at:performance.now()-age});
}

function soloNet(){
  const st = {players:{}, roofs:{}};
  return {
    savePlayer: async d => { st.players[uid] = structuredClone(d); onPlayers(structuredClone(st.players)); },
    claimRoof: async i => { st.roofs[i] = {uid, nick:nickVal, at:Date.now()}; onRoofs(st.roofs); return true; },
    releaseRoof: async i => { delete st.roofs[i]; onRoofs(st.roofs); },
    claimLot: async () => true,
    presence: async () => {},
    sendChat: async t => onChat({uid, nick:me.nick, t, at:Date.now()}),
    contestSubmit: async (w, size) => { contestBoard = [{nick:me.nick, size}]; },
    mailSend: async () => { throw new Error('solo'); },
    marketList: async l => { st.market = st.market || {}; st.market['m'+Date.now()] = {...l, at:Date.now()}; onMarket(st.market); },
    marketBuy: async id => { const l = st.market?.[id]; if (!l || l.buyer) return false; l.buyer = uid; l.bnick = me.nick; onMarket(st.market); return true; },
    marketCancel: async id => { const l = st.market?.[id]; if (!l || l.buyer || l.uid!==uid) return false; delete st.market[id]; onMarket(st.market); return true; },
    marketCollect: async id => { const l = st.market?.[id]; if (!l || !l.buyer) return false; delete st.market[id]; setTimeout(()=>onMarket(st.market)); return true; },
    bossReset: (gen, max) => { onBoss({hp:max, max, gen}); },
    bossHit: dmg => { onBoss({...boss, hp: boss.hp - dmg}); },
    listen(){ setTimeout(()=>{ onRoofs({}); onPlayers({}); onBoss(null); }); },
  };
}
function firebaseNet(){
  const db = F.getDatabase(app), meRef = F.ref(db, 'online/'+uid);
  F.onDisconnect(meRef).remove();
  const tx = async (path, data) => {
    try {
      const r = await F.runTransaction(F.ref(db, path), cur => (!cur || cur.uid===uid || abandoned(cur)) ? data : undefined);
      return r.committed && r.snapshot.val()?.uid===uid;
    } catch(e){ return false; }
  };
  return {
    savePlayer: d => F.set(F.ref(db, 'players/'+uid), d),
    claimRoof: i => tx('roofs/'+i, {uid, nick:nickVal, at:Date.now()}),
    releaseRoof: i => F.remove(F.ref(db, 'roofs/'+i)).catch(()=>{}),
    claimLot: i => tx('lots/'+i, {uid, at:Date.now()}),
    presence: p => F.set(meRef, p),
    sendChat: t => F.push(F.ref(db, 'chat'), {uid, nick:me.nick, t, at:F.serverTimestamp()}),
    listen(){
      F.onValue(F.ref(db, 'players'), s=>onPlayers(s.val()), ()=>toast('섬 정보를 불러오지 못했어요.'));
      F.onValue(F.ref(db, 'roofs'), s=>onRoofs(s.val()));
      F.onValue(F.ref(db, 'online'), s=>onOnline(s.val()));
      F.onChildAdded(F.query(F.ref(db, 'chat'), F.limitToLast(15)), s=>onChat(s.val()));
      F.onValue(F.ref(db, 'contest/'+weekKey()), s=>{ contestBoard = Object.values(s.val()||{}).filter(r=>r && typeof r.size==='number').sort((a,b)=>b.size-a.size); });
      F.onChildAdded(F.ref(db, 'mail/'+uid), s=>onMail(s.val(), ()=>F.remove(s.ref).catch(()=>{})));
      F.onValue(F.ref(db, 'boss'), s=>onBoss(s.val()));
      F.onValue(F.ref(db, 'market'), s=>onMarket(s.val()));
    },
    contestSubmit: (w, size) => F.set(F.ref(db, 'contest/'+w+'/'+uid), {nick:me.nick, size}),
    marketList: l => F.push(F.ref(db, 'market'), {...l, at:F.serverTimestamp()}),
    marketBuy: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && !cur.buyer && cur.uid!==uid) ? {...cur, buyer:uid, bnick:me.nick} : undefined, {applyLocally:false}); return r.committed && r.snapshot.val()?.buyer===uid; } catch(e){ return false; } },
    marketCancel: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && !cur.buyer) ? null : undefined, {applyLocally:false}); return r.committed && !r.snapshot.exists(); } catch(e){ return false; } },
    marketCollect: async id => { if (collecting.has(id)) return false; collecting.add(id); try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && cur.buyer) ? null : undefined, {applyLocally:false}); return r.committed && !r.snapshot.exists(); } catch(e){ collecting.delete(id); return false; } },
    mailSend: (to, item) => F.push(F.ref(db, 'mail/'+to), {from:uid, nick:me.nick, item, at:F.serverTimestamp()}),
    bossReset: (gen, max) => F.runTransaction(F.ref(db, 'boss'), cur => (!cur || cur.gen !== gen) ? {hp:max, max, gen} : undefined).catch(()=>{}),
    bossHit: dmg => F.runTransaction(F.ref(db, 'boss/hp'), cur => typeof cur==='number' ? Math.max(0, cur - dmg) : cur).catch(()=>{}),
  };
}

    r.seen = [...(r.seen||'').split(',').filter(Boolean).filter(x=>x!==talk.id), talk.id].slice(-40).join(',');
    saveMe(); renderHud();
    const rep = (c.reply||['...']).map(fillName); let j = 0;
    const after = () => {
      if (j < rep.length-1) return say(title(n), rep[j], [['다음', ()=>{ j++; after(); }]], '', true);
      const all = [...new Set([...ups, ...more])].sort((a,b)=>a-b);
      const nt = gain ? `대답에 ${gain>0 ? '마음이 열렸어요' : '조금 서운해해요'} · 호감도 ${gain>0?'+':''}${gain}` : '';
      if (all.length) say(title(n), rep[j], [['이야기 듣기', ()=>playEvents(n, all)]], nt ? nt+' · 무언가 이야기하고 싶은 눈치예요' : '무언가 이야기하고 싶은 눈치예요', true);
      else say(title(n), rep[j], npcActions(n), nt);
    };
    after();
  };
  show();
}
function talkTo(n){
  const r = relOf(n.id), first = r.talkDay !== today();
  let note = '', ups = [];
  if (first){ r.talkDay = today(); ups = addPts(n, 10); note = '오늘 첫 대화 · 호감도 +10'; }
  if (n.id==='dodo' && !me.inv.pick){ me.inv.pick = true; note = [note, '도도에게 곡괭이를 받았어요! 바위를 눌러 캐 봐요'].filter(Boolean).join(' · '); }
  if (n.id==='bibi' && !me.inv.sword){ me.inv.sword = true; me.inv.weapon = 'w1'; me.inv.weapons = ['w1']; note = [note, '비비에게 나무 검을 받았어요! 몬스터를 바라보고 휘두르기(F 키)를 눌러 싸워요'].filter(Boolean).join(' · '); }
  if (n.id==='lulu' && !me.inv.rod){ me.inv.rod = true; note = [note, '루루에게 낚싯대를 받았어요! 물을 눌러 낚시해 봐요'].filter(Boolean).join(' · '); }
  if (n.soon) note = [note, n.soon].filter(Boolean).join(' · ');
  const hr = kstHour();
  const opening = first && n.greet ? pickLine(n.greet[hr>=5&&hr<11 ? 'morning' : hr>=11&&hr<18 ? 'day' : 'night'], n.id+'g') : '';
  let text = '';
  if (n.id==='hana' && me.quest < 6){
    if (me.quest<=1) text = '안녕! 나는 하나야! 먼저 웰컴 팩을 열고, 집 앞 빈 자리에 텃밭 2칸을 놓아 봐!';
    else if (me.quest===2){ me.inv.can = true; me.quest = 3; text = '텃밭 다 놓았구나! 자, 내 물뿌리개 줄게! 토마토 씨앗 심고 물 줘 봐! 헤헤.'; }
    else if (me.quest<5) text = '씨앗 심고 물 주면 30초마다 한 단계씩 자라! 단계마다 물 또 줘야 해!';
    else text = '토마토가 빨개지면 텃밭을 눌러서 수확해!';
  }
  if (n.id==='hana' && me.quest>=6 && !countOf('seed') && !me.gardens.some(g=>g&&g.crop) && me.inv.gold < CROPS.c01.seed){ invAdd('seed:c01', 2); toast('하나가 토마토 씨앗 2개를 나눠 줬어요'); }
  saveMe(); renderHud();
  const pk = text ? {} : pickTalk(n);
  if (pk.talk) return runTalk(n, pk.talk, opening, note, ups);
  if (!text) text = [opening, pickLine(n.lines && n.lines[tierOf(heartsN(n))], n.id+'l')].filter(Boolean).join('\n') || '...';
  if (pk.locked) note = [note, '조금 더 친해지면 다음 이야기를 들려줄 것 같아요'].filter(Boolean).join(' · ');
  if (ups.length) say(title(n), text, [['이야기 듣기', ()=>playEvents(n, ups)]], (note ? note+' · ' : '') + '무언가 이야기하고 싶은 눈치예요', true);
  else say(title(n), text, npcActions(n), note);
}

const FISH = Object.fromEntries(FISH_LIST.map((f,i)=>['f'+String(i+1).padStart(2,'0'), {name:f[0], zone:f[1], weight:f[2], price:f[3], diff:f[4], min:f[5], max:f[6], color:f[7], time:f[8]}]));
const FISH_ZONES = {pond:1, beach:1, seacave:1};
const STAR_MULT = [0, 1, 1.5, 2.5];
const isNight = () => { const h = kstHour(); return h >= 19 || h < 5; };
const fishKey = (id, st) => `${id}_${st}`;
const parseFish = k => { const [id, st] = k.split('_'); return {id, st:+st||1, f:FISH[id]}; };
const fishName = k => { const {f, st} = parseFish(k); return `${f ? f.name : '물고기'} ${'★'.repeat(st)}`; };
const fishPrice = k => { const {f, st} = parseFish(k); return f ? Math.round(f.price * STAR_MULT[st]) : 0; };
function isWater(x, y){
  for (const p of Z().places){
    if (p.kind==='pond' && ((x-p.x)/p.rx)**2 + ((y-p.y)/p.ry)**2 < 1) return true;
    if (p.kind==='sea' && y < 226) return true;
  }
  return false;
}
let fishing = null; // {phase:'wait'|'bite'|'game', bx, by, biteAt, biteEnd, id}
function rollFish(){
  const night = isNight();
  const list = Object.entries(FISH).filter(([,f])=>f.zone===zoneId && (f.time==='any' || (f.time==='night')===night));
  const w = f => f.weight * (isRain() && f.weight <= 8 ? 2.2 : 1);
  const total = list.reduce((a,[,f])=>a+w(f),0);
  let r = Math.random()*total; for (const [id,f] of list){ if ((r-=w(f)) < 0) return id; } return list[0][0];
}

// 물을 누르면: 물가까지 걸어가서 던져요
function fishTarget(w){
  if (!FISH_ZONES[zoneId] || !isWater(w.x, w.y)) return null;
  if (!me.inv.rod) { toast('낚싯대가 없어요. 사탕 연못의 루루에게 가 봐요'); return {x:pos.x, y:pos.y, act:null, mark:performance.now()}; }
  let sx = w.x, sy = w.y; const dx = pos.x - w.x, dy = pos.y - w.y, len = Math.hypot(dx,dy) || 1;
  for (let k=0; k<200 && (isWater(sx,sy) || blocked(sx,sy)); k++){ sx += dx/len*6; sy += dy/len*6; }
  sx += dx/len*10; sy += dy/len*10;
  return {x:sx, y:sy, act:()=>castAt(w.x, w.y)};
}
function castAt(bx, by){
  if (fishing) return;
  pos.dir = Math.abs(bx-pos.x) > Math.abs(by-pos.y) ? (bx>pos.x?'right':'left') : (by>pos.y?'down':'up');
  fishing = {phase:'wait', bx, by, biteAt: performance.now() + 5000 + Math.random()*7000, id: rollFish(), castAt: performance.now()};
  toast('찌를 던졌어요… 느낌표가 뜨면 탭!');
}
function stopFishing(msg){ fishing = null; $('fishGame').hidden = true; if (msg) toast(msg); }
// 탭/클릭/스페이스: 기다리는 중이면 너무 일찍, 느낌표면 들어 올리기
function fishTap(){
  if (!fishing) return false;
  if (fishing.phase==='wait'){ stopFishing('너무 일찍 당겼어요. 느낌표가 뜰 때까지 기다려요'); return true; }
  if (fishing.phase==='bite'){ startFishGame(); return true; }
  return fishing.phase==='game';
}
const fg = {x:.5, tx:.5, zone:.5, ztarget:.5, progress:.35, next:0, held:false};
function startFishGame(){
  const f = FISH[fishing.id];
  fishing.phase = 'game';
  Object.assign(fg, {x:.5, tx:.5, zone:.5, ztarget:.5, progress:.35, next:0, w: .30 - f.diff*.14});
  $('fgZone').style.width = (fg.w*100)+'%';
  $('fishGame').hidden = false;
}
function setZoneFromPointer(e){ const r = $('fgTrack').getBoundingClientRect(); fg.ztarget = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)); }
function updateFishing(dt, t){
  if (!fishing) return;
  if (fishing.phase==='wait' && t >= fishing.biteAt){ const f = FISH[fishing.id]; fishing.phase = 'bite'; fishing.biteEnd = t + 1100 - f.diff*450; }
  else if (fishing.phase==='bite' && t > fishing.biteEnd) stopFishing('앗, 물고기가 도망갔어요…');
  else if (fishing.phase==='game'){
    const f = FISH[fishing.id];
    if (t > fg.next){ fg.tx = Math.random(); fg.next = t + 350 + Math.random()*(1100 - f.diff*700); }
    const sp = .5 + f.diff*1.6;
    fg.x += Math.max(-sp*dt, Math.min(sp*dt, fg.tx - fg.x)) + (Math.random()-.5)*f.diff*.02;
    fg.x = Math.max(0, Math.min(1, fg.x));
    if (keys.arrowleft||keys.a) fg.ztarget = Math.max(0, fg.ztarget - dt*1.2);
    if (keys.arrowright||keys.d) fg.ztarget = Math.min(1, fg.ztarget + dt*1.2);
    fg.zone += (fg.ztarget - fg.zone) * Math.min(1, dt*10);
    const inside = Math.abs(fg.x - fg.zone) < fg.w/2;
    fg.progress += (inside ? .32 : -.24) * dt;
    $('fgZone').style.left = ((fg.zone - fg.w/2)*100)+'%';
    $('fgZone').classList.toggle('on', inside);
    $('fgBob').style.left = (fg.x*100)+'%';
    $('fgBar').style.width = Math.max(0, Math.min(100, fg.progress*100))+'%';
    $('fgText').textContent = inside ? `끌어오는 중… ${Math.round(fg.progress*100)}%` : '찌를 놓치고 있어요! 따라가요';
    if (fg.progress >= 1) catchFish();
    else if (fg.progress <= 0) stopFishing('줄이 풀려서 물고기가 도망갔어요…');
  }
}
function catchFish(){
  const id = fishing.id, f = FISH[id];
  stopFishing();
  const ratio = Math.pow(Math.random(), 1.5), size = Math.round((f.min + (f.max-f.min)*ratio)*10)/10;
  const st = ratio >= .85 ? 3 : ratio >= .5 ? 2 : 1, k = fishKey(id, st);
  setExpr(st===3 || f.weight < 10 ? 'sparkle' : 'happy', 2500);
  invAdd('fish:'+k, 1);
  me.dex = me.dex || {}; const dx = me.dex[id] || {n:0, best:0, st:0};
  const record = size > dx.best; me.dex[id] = {n:dx.n+1, best:Math.max(dx.best,size), st:Math.max(dx.st,st)};
  saveMe(); renderHud(); contestSubmit(id, size);
  withIcon('fish:'+k); say('낚시', `${f.name}을(를) 낚았어요! ${'★'.repeat(st)}${'☆'.repeat(3-st)}\n크기 ${size}cm${dx.n===0 ? ' · 처음 낚은 물고기!' : record ? ' · 최고 기록!' : ''}`, [], `도감 ${Object.keys(me.dex).length}/50 · 모모 케이크에서 ${fishPrice(k)}G에 팔 수 있어요`);
  if (f.weight <= 2) { if (net && net.sendChat) net.sendChat(`(전설의 ${f.name}을 낚았다! ${size}cm)`).catch(()=>{}); }
}
function drawFishing(ctx, t){
  if (!fishing) return;
  const hx = pos.x + ({left:-12,right:12,up:4,down:8}[pos.dir]||0), hy = pos.y - 22;
  const bob = Math.sin(t/300)*1.5 + (fishing.phase!=='wait' ? Math.sin(t/40)*2 : 0);
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.quadraticCurveTo((hx+fishing.bx)/2, Math.min(hy,fishing.by)-30, fishing.bx, fishing.by+bob); ctx.stroke();
  ctx.fillStyle='#ff5a5a'; ctx.beginPath(); ctx.arc(fishing.bx, fishing.by+bob-2, 4, Math.PI, 0); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(fishing.bx, fishing.by+bob-2, 4, 0, Math.PI); ctx.fill();
  if (fishing.phase!=='wait'){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(fishing.bx, fishing.by+2, 8+Math.sin(t/80)*3, 3, 0, 0, 7); ctx.stroke(); }
  ctx.restore();
  if (fishing.phase==='bite'){ const s = 1 + Math.sin(t/60)*.12; ctx.save(); ctx.translate(pos.x, pos.y-74); ctx.scale(s,s); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill(); ctx.fillStyle='#ff3b6b'; ctx.font='bold 27px "Dongle",sans-serif'; ctx.textAlign='center'; ctx.fillText('!', 0, 7); ctx.restore(); }
}
function fishCount(){ return Object.values(me.inv.fish||{}).reduce((a,b)=>a+b,0); }
function showFishBag(){
  const list = Object.entries(me.inv.fish||{}).filter(([,n])=>n>0).map(([k,n])=>`${fishName(k)} ${n}마리`).join(', ');
  say('물고기 가방', list || '아직 낚은 물고기가 없어요.', [['도감 보기', showDex]], list ? '모모 케이크에서 팔거나 주민에게 선물할 수 있어요' : '연못, 바다, 해식 동굴의 물을 눌러 낚시해 봐요');

// ===== 가방 =====
// 아이템 키: 'crop:c01' 작물, 'seed:c01' 씨앗, 'fish:f01_3' 물고기(별 3), 'ore:o01' 광석, 'loot:m01' 전리품
const CATS = {seed:'seeds', crop:'crops', fish:'fish', ore:'ores', loot:'loot', dish:'dishes', furn:'furn'};

function spawnMob(){
  const z = Z();
  for (let k=0;k<30;k++){
    const x = M + 60 + Math.random()*(z.W - 2*M - 120), y = M + 60 + Math.random()*(z.H - 2*M - 120);
    if (blocked(x,y) || Math.hypot(x-pos.x, y-pos.y) < 320) continue;
    const id = rollMonster(), m = MONSTERS[id];
    mobs.push({id, x, y, hp:m.hp, max:m.hp, cd:0, wander:0, wx:x, wy:y, hurt:0});
    return;

function syncMobs(){
  const want = (COMBAT_ZONES[zoneId] && (zoneId!=='starhill' || isNight())) ? COMBAT_ZONES[zoneId] : 0;
  if (mobZone !== zoneId){ mobZone = zoneId; mobs = []; for (let i=0;i<want;i++) spawnMob(); }
  return want;
}
let respawnT = 0;
function updateMobs(dt, t){
  const want = syncMobs(); if (!want) return;
  if (mobs.length < want && t > respawnT){ spawnMob(); respawnT = t + 25000; }
  const talking = !$('talk').hidden;
  for (const mob of mobs){
    const m = MONSTERS[mob.id], d = Math.hypot(pos.x-mob.x, pos.y-mob.y);
    mob.cd -= dt; mob.hurt -= dt;
    let tx, ty, sp = m.speed;
    if (d < 240 && !talking){ tx = pos.x; ty = pos.y; }
    else { if ((mob.wander -= dt) <= 0){ mob.wander = 1.5 + Math.random()*2.5; mob.wx = mob.x + (Math.random()-.5)*200; mob.wy = mob.y + (Math.random()-.5)*200; } tx = mob.wx; ty = mob.wy; sp *= .4; }
    const dx = tx-mob.x, dy = ty-mob.y, l = Math.hypot(dx,dy);
    if (mob.kb > 0){ mob.kb -= dt; const nx = mob.x + mob.kvx*dt, ny = mob.y + mob.kvy*dt; if (!blocked(nx, mob.y)) mob.x = nx; if (!blocked(mob.x, ny)) mob.y = ny; mob.kvx *= .86; mob.kvy *= .86; continue; }
    if (l > 22 && mob.hurt <= 0){ const nx = mob.x + dx/l*sp*dt, ny = mob.y + dy/l*sp*dt; if (!blocked(nx, mob.y)) mob.x = nx; if (!blocked(mob.x, ny)) mob.y = ny; }
    if (d < 30 && mob.cd <= 0 && !talking){
      mob.cd = 1.2; playerHp -= m.atk; lastHurt = t; pushPlayer(pos.x-mob.x, pos.y-mob.y, 18); setExpr('surprised', 1200);
      fx.push({x:pos.x, y:pos.y-50, text:'-'+m.atk, t, color:'#ff3b6b'});
      if (playerHp <= 0) return faint();
    }
  }
  if (t - lastHurt > 6000 && playerHp < PLAYER_MAX_HP) playerHp = Math.min(PLAYER_MAX_HP, playerHp + 5*dt);
}

  openPanel(`비비의 대장간 · 💰 ${me.inv.gold}G`, `<p class="mnote" style="margin-top:0">무기를 바꾸면 공격력이 세져요. 광석은 광산과 동굴에서 캘 수 있어요.</p>` +
    WEAPON_LIST.map(([id,name,atk,gold,need])=>{ const has = own.includes(id), on = weapon()===WEAPONS[id];
      const cost = [gold?gold+'G':'', ...need.map(([k,n])=>`${itemName(k)} ${invCount(k)}/${n}`)].filter(Boolean).join(' · ');
      return `<button class="np" data-id="${id}"><span class="np-name">🗡️ ${name} <small>공격력 ${atk}</small></span><span class="np-place">${on?'장착 중':has?'장착하기':'만들기'}</span>${has?'':`<span class="np-day">${cost}</span>`}</button>`; }).join(''),
    b=>{ const id = b.dataset.id, w = WEAPONS[id];
      if (!own.includes(id)){
        if (me.inv.gold < w.gold || w.need.some(([k,n])=>invCount(k) < n)) return toast('재료나 돈이 모자라요');
        me.inv.gold -= w.gold; for (const [k,n] of w.need) invAdd(k, -n);
        me.inv.weapons = [...own, id]; toast(`${w.name}을(를) 만들었어요!`);
      } else toast(`${w.name}을(를) 들었어요 · 공격력 ${w.atk}`);
      me.inv.weapon = id; saveMe(); renderHud(); weaponPanel(); });
}
const DIRV = {left:[-1,0], right:[1,0], up:[0,-1], down:[0,1]};
let swingAt = -1e9, swingDir = 'down', lunge = 0;
function pushPlayer(dx, dy, dist){
  const l = Math.hypot(dx,dy)||1, nx = pos.x + dx/l*dist, ny = pos.y + dy/l*dist;
  if (!blocked(nx, pos.y)) pos.x = nx; if (!blocked(pos.x, ny)) pos.y = ny;
}
function faceTo(x, y){ const dx = x-pos.x, dy = y-pos.y; pos.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }
function nearFoe(r=110){ return mobs.some(m=>Math.hypot(pos.x-m.x, pos.y-m.y) < r) || (bossAlive() && Math.hypot(pos.x-BOSS.x, pos.y-BOSS.y) < r+40); }
// 휘두르기: 바라보는 쪽으로 한 발 내딛으며 검을 휘둘러요. 닿은 몬스터는 밀려나요
function swing(){
  if (!me.inv.sword){ toast('검이 없어요. 먼지 숲의 비비에게 가 봐요'); return; }
  const t = performance.now(); if (t - swingAt < 380) return;
  if (fishing) return;
  swingAt = t; swingDir = pos.dir; lunge = .12; target = null;
  const [vx,vy] = DIRV[pos.dir] || DIRV.down;
  const cx = pos.x + vx*26, cy = pos.y + vy*26;
  for (const mob of [...mobs]){
    const dx = mob.x-pos.x, dy = mob.y-pos.y;
    if (Math.hypot(mob.x-cx, mob.y-cy) < 58 && dx*vx + dy*vy > -12) hitMob(mob, t, vx, vy);
  }
  if (bossAlive()){
    const dx = BOSS.x-pos.x, dy = BOSS.y-pos.y;
    if (Math.hypot(BOSS.x-cx, BOSS.y-cy) < 100 && dx*vx + dy*vy > -20){
      const dmg = swordAtk(); bossPending += dmg; bossHurt = .2; fx.push({x:BOSS.x+(Math.random()-.5)*40, y:BOSS.y-90, text:String(dmg), t, color:'#ffffff'});
      if (me.bossHit !== today()){ me.bossHit = today(); saveMe(); }
    }
  }
}
function updateSwing(dt){
  if (lunge > 0){ lunge -= dt; const [vx,vy] = DIRV[swingDir] || DIRV.down; pushPlayer(vx, vy, 170*dt); }
}
function drawSwing(c, t){
  const a = (t - swingAt)/180; if (a < 0 || a > 1) return;
  const base = {right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[swingDir] ?? Math.PI/2;
  const from = base - 1.2, to = from + 2.4*Math.min(1, a*1.6), col = weapon().color;
  c.save(); c.translate(pos.x, pos.y-20); c.globalAlpha = 1 - a*.7; c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 9; c.beginPath(); c.arc(0,0,40,from,to); c.stroke();
  c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(0,0,40,from,to); c.stroke();
  c.rotate(to); c.fillStyle = col; c.strokeStyle = '#6e5260'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(14,-3,34,6,3); c.fill(); c.stroke();
  c.restore();
}
function hitMob(mob, t, vx, vy){
  const dmg = swordAtk(); mob.hp -= dmg; mob.hurt = .3;
  const dx = mob.x-pos.x, dy = mob.y-pos.y, l = Math.hypot(dx,dy)||1;
  const kx = dx/l + (vx||0), ky = dy/l + (vy||0), kl = Math.hypot(kx,ky)||1, power = 300 / (1 + MONSTERS[mob.id].hp/400);
  mob.kvx = kx/kl*power; mob.kvy = ky/kl*power; mob.kb = .18;
  fx.push({x:mob.x, y:mob.y-40, text:String(dmg), t, color:'#ffffff'});
  if (mob.hp <= 0){
    mobs = mobs.filter(m=>m!==mob);
    const m = MONSTERS[mob.id], gold = Math.round(m.atk * (0.8 + Math.random()*.4));
    invAdd('loot:'+mob.id, 1); me.inv.gold += gold;
    me.mdex = me.mdex || {}; const first = !me.mdex[mob.id]; me.mdex[mob.id] = (me.mdex[mob.id]||0) + 1;
    saveMe(); renderHud();
    toast(`${m.name}을(를) 물리쳤어요! ${m.drop} · ${gold}G${first ? ' · 처음 물리친 몬스터!' : ''}`, 'loot:'+mob.id);
    if (mob.id==='m28' && net && net.sendChat) net.sendChat('(동굴의 주인을 물리쳤다!)').catch(()=>{});
  }
}
function faint(){
  playerHp = PLAYER_MAX_HP; mobs = []; mobZone = null;
  const L = LOTS[me.lot]; enterZone('home', null, L.x, L.y + 18);
  say('기절', '눈앞이 깜깜해졌어요… 정신을 차려 보니 집 앞이에요.', [], '체력이 다시 가득 찼어요');
}
function drawMob(d, mob, t){
  const m = MONSTERS[mob.id], c = d.ctx, x = mob.x, y = mob.y, s = .9 + Math.min(1, m.hp/200)*.35, bob = Math.sin(t/180 + x)*1.5;
  c.save(); c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(x,y+1,14*s,4*s,0,0,7); c.fill(); c.restore();
  if (!(mob.hurt > 0 && Math.floor(t/60)%2)){ c.save(); c.translate(x, y-bob); c.scale(s, s); try { ART[mob.id](d, t/1000); } catch(e){} c.restore(); }
  if (mob.hp < mob.max){ c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(x-14, y-52*s, 28, 4); c.fillStyle='#ff5a88'; c.fillRect(x-14, y-52*s, 28*Math.max(0,mob.hp)/mob.max, 4); }
}
function drawFx(c, t){
  for (let i=fx.length-1;i>=0;i--){
    const f = fx[i], a = (t - f.t)/800; if (a > 1){ fx.splice(i,1); continue; }
    c.save(); c.globalAlpha = 1-a; c.font='bold 19px "Dongle",sans-serif'; c.textAlign='center'; c.lineWidth=3; c.strokeStyle='rgba(91,51,69,.7)'; c.strokeText(f.text, f.x, f.y-a*20); c.fillStyle=f.color; c.fillText(f.text, f.x, f.y-a*20); c.restore();
  }
}
// 몬스터·바위를 누르면
function contentTarget(w){
  for (const mob of mobs) if (Math.abs(w.x-mob.x) < 24 && w.y > mob.y-40 && w.y < mob.y+8){
    if (!me.inv.sword){ toast('검이 없어요. 먼지 숲의 비비에게 가 봐요'); return {x:pos.x, y:pos.y, act:null, mark:performance.now()}; }
    const dx = pos.x-mob.x, dy = pos.y-mob.y, l = Math.hypot(dx,dy)||1;
    return {x:mob.x+dx/l*40, y:mob.y+dy/l*40, act:()=>{ faceTo(mob.x, mob.y); swing(); }};
  }
  for (const r of rocksHere()) if (Math.abs(w.x-r.x) < 24 && Math.abs(w.y-r.y) < 20) return {x:r.x, y:r.y+24, act:()=>mineRock(r)};
  return null;
}

// ===== 텃밭 =====
function plantMenu(i){
  const seeds = itemsOf('seed');
  if (!seeds.length) return toast(me.inv.can ? '씨앗이 없어요. 마을 광장의 모모 가게에서 사요' : '씨앗이 없어요.');
  if (seeds.length === 1) return plant(i, seeds[0][0].split(':')[1]);
  say('어떤 씨앗을 심을까요?', '', seeds.map(([k,n])=>[`${itemName(k)} (${n}) · ${fmtMin(CROPS[k.split(':')[1]].min)}`, ()=>{ closeTalk(); plant(i, k.split(':')[1]); }]), '', false, true);
}
function plant(i, type){
  if (!invCount('seed:'+type) || !me.gardens[i] || me.gardens[i].crop) return;
  invAdd('seed:'+type, -1); me.gardens[i].crop = {type, stage:0, wateredAt:null};
  if (me.quest===3) me.quest = 4;
  saveMe(); renderHud(); toast(`${CROPS[type].name} 씨앗을 심었어요 · 다 크는 데 ${fmtMin(CROPS[type].min)}`);
}
function useSlot(i){
  const g = me.gardens[i], now = Date.now();
  if (!g){
    if (!me.inv.garden) return toast('놓을 텃밭이 없어요.');
    me.gardens[i] = {crop:null}; me.inv.garden--;
    if (me.quest===1 && me.gardens.every(Boolean)) { me.quest = 2; toast('텃밭 완성! 서쪽 들판의 하나에게 가 봐요'); } else toast('텃밭을 놓았어요');
  } else if (!g.crop) return plantMenu(i);
  else {
    const c = cropNow(g.crop, now); g.crop = c; const cd = CROPS[c.type] || CROPS.c01;
    if (c.stage>=4){
      const n = cd.y1 + Math.floor(Math.random()*(cd.y2-cd.y1+1));
      g.crop = null; invAdd('crop:'+c.type, n); setExpr('happy', 2000);
      if (me.quest<=5 && me.quest>=4){ me.quest = 6; invAdd('seed:c01', 2); say('하나 · 꼬마 농부', '첫 수확 축하해! 기념으로 토마토 씨앗 2개 더 줄게! 다른 씨앗은 마을 광장 모모 가게에서 살 수 있어!'); }
      else toast(`${cd.name} ${n}개를 수확했어요!`, 'crop:'+c.type);
    } else if (!c.wateredAt){
      if (!me.inv.can) return toast('물뿌리개가 필요해요. 하나를 찾아가요.');
      g.crop = {type:c.type, stage:c.stage, wateredAt:now};
      if (me.quest===4) me.quest = 5;
      toast(`물을 줬어요. ${fmtLeft(stageMs(c.type))} 뒤에 자라요`);
    } else return toast(`${cd.name} · ${STAGE_NAMES[c.stage]} 단계 · ${fmtLeft(c.wateredAt+stageMs(c.type)-now)} 뒤에 자라요`);
  }
  saveMe(); renderHud();
}
function drawSlot(d, s, g, now, mine){
  const c = d.ctx;
  if (!g){
    if (!mine || !me.inv.garden) return;
    c.save(); c.setLineDash([4,4]); c.lineWidth=2; c.strokeStyle = (now/400|0)%2 ? '#ff8fb3' : '#ffffff'; c.beginPath(); c.roundRect(s.x-15,s.y-15,30,30,8); c.stroke(); c.restore();
    c.font='bold 25px "Dongle",sans-serif'; c.textAlign='center'; c.fillStyle='#ff8fb3'; c.fillText('+', s.x, s.y+6);
    return;
  }
  const cr = cropNow(g.crop, now);
  d.rr(s.x-15,s.y-15,30,30,8, cr && cr.wateredAt ? '#b07a55' : 'soil');
  d.stitch(c=>c.roundRect(s.x-12,s.y-12,24,24,6),'#ffffff',.45);
  if (!cr) return;
  const cd = CROPS[cr.type] || CROPS.c01, col = cd.color, st = cr.stage, x = s.x, y = s.y+4;
  if (st===0){ d.dot(x-4,y-2,1.6,'#6b4a35'); d.dot(x+3,y-5,1.6,'#6b4a35'); d.dot(x,y+1,1.6,'#6b4a35'); }
  if (st>=1 && st<4){ d.line(c=>{c.moveTo(x,y);c.lineTo(x,y-8-st*3);},'#4f9e46',2); d.ell(x-4,y-8,4,2,'leaf'); d.ell(x+4,y-10,4,2,'leaf'); }
  if (st===2||st===3){ d.circle(x-6,y-14,6,'leaf'); d.circle(x+6,y-15,6,'leaf'); d.circle(x,y-20,6,'#7fd07a'); }
  if (st===3){ d.dot(x-6,y-17,2,'#ffe066'); d.dot(x+5,y-20,2,'#ffe066'); d.dot(x+1,y-25,2,'#ffe066'); }
  if (st===4 && ART[cr.type]){ d.ell(x-6,y-6,6,3,'leaf'); d.ell(x+6,y-7,6,3,'leaf'); c.save(); c.translate(x, y-14); c.scale(.62,.62); ART[cr.type](d, 0); c.restore(); }
  else if (st===4){
    if (cd.shape==='fruit'){ d.circle(x-6,y-14,6,'leaf'); d.circle(x+6,y-15,6,'leaf'); d.circle(x,y-20,6,'#7fd07a'); d.circle(x-6,y-12,4.5,col); d.circle(x+6,y-14,4.5,col); d.circle(x,y-21,4.5,col); }
    else if (cd.shape==='root'){ d.ell(x-5,y-12,3,7,'leaf'); d.ell(x+5,y-12,3,7,'leaf'); d.ell(x,y-14,3,8,'#7fd07a'); d.ell(x,y-2,7,5,col); }
    else if (cd.shape==='leaf'){ d.circle(x-6,y-8,7,col); d.circle(x+6,y-8,7,col); d.circle(x,y-14,7,shade(col,.2)); }
    else if (cd.shape==='flower'){ d.line(c=>{c.moveTo(x,y);c.lineTo(x,y-20);},'#4f9e46',2); d.ell(x-5,y-8,4,2,'leaf'); for (let a=0;a<6.28;a+=1.05) d.circle(x+Math.cos(a)*5,y-22+Math.sin(a)*5,3.6,col); d.dot(x,y-22,2.6,'#ffe066'); }
    else { d.rr(x-2,y-30,4,30,2,'#5aa857'); d.ell(x-6,y-14,6,2.4,'leaf'); d.ell(x+6,y-20,6,2.4,'leaf'); d.ell(x,y-32,4.5,7,col); }
  }
  if (mine && st<4 && !cr.wateredAt){ const b = Math.sin(now/250)*2; d.dot(x+13,y-28+b,4,'#6fc3ff'); d.tri([[x+9.8,y-29+b],[x+13,y-36+b],[x+16.2,y-29+b]],'#6fc3ff'); }
  if (mine && st===4){ const b = Math.sin(now/250)*2; c.font='14px sans-serif'; c.textAlign='center'; c.fillText('✨', x+14, y-26+b); }
}

// [이름, 재료 [[아이템, 개수]], 회복량]  'fish:*' 는 아무 물고기
const DISH_LIST = [
  ['토마토 수프', [['crop:c01',2]], 25], ['새싹 샐러드', [['crop:c02',1],['crop:c04',1],['crop:c01',1]], 30],
  ['래디시 피클', [['crop:c03',2]], 20], ['시금치 키슈', [['crop:c05',2],['crop:c08',1]], 35],
  ['당근 케이크', [['crop:c06',2],['crop:c12',1]], 40], ['감자 그라탕', [['crop:c07',2],['crop:c08',1]], 40],
  ['옥수수 버터구이', [['crop:c11',2]], 35], ['딸기 케이크', [['crop:c12',3]], 45],
  ['블루베리 머핀', [['crop:c14',3]], 45], ['고구마 맛탕', [['crop:c15',2],['crop:c29',1]], 50],
  ['호박 파이', [['crop:c21',1],['crop:c06',1]], 55], ['수박 화채', [['crop:c22',1],['crop:c12',1]], 55],
  ['멜론 빙수', [['crop:c23',1]], 50], ['파인애플 타르트', [['crop:c24',1],['crop:c12',1]], 60],
  ['바닐라 아이스크림', [['crop:c25',2]], 55], ['라벤더 쿠키', [['crop:c26',1],['crop:c02',1]], 50],
  ['초콜릿 봉봉', [['crop:c27',2]], 60], ['카페라테', [['crop:c28',2]], 45],
  ['솜사탕', [['crop:c29',2]], 40], ['황금딸기 파르페', [['crop:c30',1],['crop:c12',2],['crop:c25',1]], 100],
  ['생선구이', [['fish:*',1]], 35], ['피시 앤 칩스', [['fish:*',1],['crop:c07',2]], 50],
  ['해물 토마토 파스타', [['fish:*',2],['crop:c01',1]], 60], ['물고기 초밥', [['fish:*',3],['crop:c04',1]], 70],
];
const DISHES = Object.fromEntries(DISH_LIST.map((d,i)=>['d'+String(i+1).padStart(2,'0'), {name:d[0], need:d[1], heal:d[2]}]));
function anyFishKeys(){ return itemsOf('fish').sort((a,b)=>fishPrice(a[0].slice(5))-fishPrice(b[0].slice(5))); }
function canCook(id){ return DISHES[id].need.every(([k,n])=> k==='fish:*' ? countOf('fish') >= n : invCount(k) >= n); }
function dishPrice(id){ return Math.round(DISHES[id].need.reduce((a,[k,n])=>a + (k==='fish:*' ? 25 : itemPrice(k))*n, 0) * 1.8) + 40; }
function cook(id){
  if (!canCook(id)) return toast('재료가 모자라요');
  for (const [k,n] of DISHES[id].need){
    if (k==='fish:*'){ let left = n; for (const [fk,c] of anyFishKeys()){ const t = Math.min(left, c); invAdd(fk, -t); left -= t; if (!left) break; } }
    else invAdd(k, -n);
  }
  invAdd('dish:'+id, 1); me.cooked = (me.cooked||0) + 1; setExpr('happy', 2000); saveMe(); renderHud();
  toast(`${DISHES[id].name}을(를) 만들었어요!`); cookPanel();
}
function cookPanel(){
  openPanel(`단단의 요리 · 만든 요리 ${me.cooked||0}개`, Object.entries(DISHES).map(([id,d])=>{
    const need = d.need.map(([k,n])=>`${k==='fish:*' ? '물고기' : itemName(k)} ${n}`).join(' + ');
    return `<button class="np" data-id="${id}" ${canCook(id)?'':'style="opacity:.55"'}><span class="np-name">${iconImg('dish:'+id)}${d.name} <small>${need}</small></span><span class="np-place">${canCook(id)?'만들기':'재료 부족'}</span><span class="np-day">체력 +${d.heal} · ${dishPrice(id)}G</span></button>`;
  }).join(''), b=>cook(b.dataset.id));
}
function eatDish(id){ invAdd('dish:'+id, -1); playerHp = Math.min(PLAYER_MAX_HP, playerHp + DISHES[id].heal); saveMe(); renderHud(); toast(`${DISHES[id].name}을(를) 먹었어요. 체력 +${DISHES[id].heal}`); }

function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = seed || 1; return ()=>{ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// ===== 오늘의 심부름 (토리) =====
function errandsToday(){
  const r = seeded(hash(uid + ':' + today())), list = [];
  const crops = Object.keys(CROPS).filter(id=>CROPS[id].min <= 120), fish = Object.keys(FISH).filter(id=>FISH[id].weight >= 8), ores = Object.keys(ORES).filter(id=>ORES[id].tier<=2 && !ORES[id].sea), loot = Object.keys(MONSTERS).filter(id=>MONSTERS[id].zone==='forest');
  const pick = a => a[Math.floor(r()*a.length)];
  const kinds = ['crop','fish','ore','loot'];
  for (let i=0;i<3;i++){
    const k = kinds[Math.floor(r()*4)];
    if (k==='crop'){ const id = pick(crops); list.push({key:'crop:'+id, n:1+Math.floor(r()*3), label:CROPS[id].name}); }
    if (k==='fish'){ const id = pick(fish), st = r()<.3 ? 2 : 1; list.push({key:'fish:'+id, st, n:1, label:`${FISH[id].name} ${'★'.repeat(st)} 이상`}); }
    if (k==='ore'){ const id = pick(ores); list.push({key:'ore:'+id, n:1+Math.floor(r()*3), label:ORES[id].name}); }
    if (k==='loot'){ const id = pick(loot); list.push({key:'loot:'+id, n:1+Math.floor(r()*2), label:MONSTERS[id].drop}); }
  }
  return list.map((e,i)=>({...e, i, reward: 150 + Math.round(e.key.startsWith('fish:') ? fishPrice(e.key.slice(5)+'_'+e.st)*2.2 : itemPrice(e.key)*e.n*2.2)}));
}
function errandHave(e){
  if (e.key.startsWith('fish:')){ const id = e.key.slice(5); return itemsOf('fish').filter(([k])=>{ const p = parseFish(k.slice(5)); return p.id===id && p.st>=e.st; }).reduce((a,[,n])=>a+n,0) >= e.n; }
  return invCount(e.key) >= e.n;
}
function errandPanel(){
  const st = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
  openPanel('토리의 오늘의 심부름', errandsToday().map(e=>{
    const done = st.includes(String(e.i)), ok = errandHave(e);
    return `<button class="np" data-id="${e.i}" ${done||!ok?'style="opacity:.55"':''}><span class="np-name">${iconImg(e.key)}${e.label} ${e.n}개 <small>가져다주기</small></span><span class="np-place">${done?'완료 ✓':ok?'전달하기':'아직 없어요'}</span><span class="np-day">보상 ${e.reward}G · 토리 호감도 +5</span></button>`;
  }).join('') + '<p class="mnote">심부름은 매일 바뀌어요.</p>', b=>{
    const e = errandsToday()[+b.dataset.id];
    const done = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
    if (done.includes(String(e.i))) return toast('이미 끝낸 심부름이에요');
    if (!errandHave(e)) return toast('아직 물건이 없어요');
    if (e.key.startsWith('fish:')){ let left = e.n; for (const [k,c] of itemsOf('fish')){ const p = parseFish(k.slice(5)); if (p.id!==e.key.slice(5) || p.st<e.st) continue; const t = Math.min(left,c); invAdd(k,-t); left -= t; if (!left) break; } }
    else invAdd(e.key, -e.n);
    me.inv.gold += e.reward; addPts(NPC.tori, 5);
    me.errand = {day:today(), done:[...done, String(e.i)].filter(Boolean).join(',')};
    saveMe(); renderHud(); toast(`심부름 완료! ${e.reward}G를 받았어요`); errandPanel();
  });
}

function wearPreview(L, size=96){

  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');

}

    say(it.name, it.need ? `${it.price?it.price+'G와 ':''}${itemName(it.need)} ${it.n}개로 만들까요?` : `${it.price}G에 살까요? 사면 옷장에 들어가요.`, [[it.need ? '만들기' : '사기', ()=>{
      me.inv.gold -= it.price; if (it.need) invAdd(it.need, -it.n); CLOSET().push(id); renderHud(); closeTalk(); wear(slot, id); toast(`${it.name}을(를) ${it.need?'만들어':'사서'} 입었어요!`); }], ['그만두기', ()=>{ closeTalk(); clothesPanel(); }]], '', true);
  });
}

// ===== 날씨 (펭펭) =====
const WEATHER = [['맑음','☀️',60],['흐림','☁️',20],['비','🌧️',15],['무지개','🌈',5]];
function weatherOf(day){ let r = hash('w'+day) % 100; for (const w of WEATHER){ if ((r -= w[2]) < 0) return w; } return WEATHER[0]; }
const isRain = () => weatherOf(today())[0]==='비';
const isRainbow = () => weatherOf(today())[0]==='무지개';
function forecast(){
  const a = weatherOf(today()), b = weatherOf(today()+1);
  return `오늘은 ${a[1]} ${a[0]}, 내일은 ${b[1]} ${b[0]}! ${a[0]==='비' ? '비 오는 날엔 텃밭에 물을 안 줘도 되고, 희귀한 물고기가 잘 나와.' : a[0]==='무지개' ? '무지개 뜬 날엔 바위에서 귀한 광석이 잘 나와!' : ''}`;
}
let rainT = 0;
function rainWater(t){
  if (!isRain() || t - rainT < 20000) return; rainT = t;
  let n = 0; const now = Date.now();
  for (const g of me.gardens) if (g && g.crop){ const c = cropNow(g.crop, now); if (c.stage < 4 && !c.wateredAt){ g.crop = {type:c.type, stage:c.stage, wateredAt:now}; n++; } else g.crop = c; }
  if (n){ saveMe(); toast(`비가 와서 텃밭 ${n}칸에 물이 들었어요`); }
}
const drops = Array.from({length:70}, (_,i)=>({x:Math.random(), y:Math.random(), s:.6+Math.random()*.6}));
function drawWeather(c, t){
  const z = Z(); if (z.theme==='cave' || z.theme==='room') return;
  const w = cv.width, h = cv.height;
  if (isRain()){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle='rgba(90,110,150,.12)'; c.fillRect(0,0,w,h); c.strokeStyle='rgba(220,235,255,.7)'; c.lineWidth=1.5*view.dpr;
    for (const d of drops){ const y = ((d.y + t/1500*d.s) % 1)*h, x = d.x*w; c.beginPath(); c.moveTo(x,y); c.lineTo(x-3*view.dpr,y+12*view.dpr); c.stroke(); } c.restore(); }
  if (isRainbow()){ c.save(); c.setTransform(1,0,0,1,0,0); c.globalAlpha=.18; ['#ff6b6b','#ffa14f','#ffd84f','#5cc46a','#5b8cff','#a77bff'].forEach((col,i)=>{ c.strokeStyle=col; c.lineWidth=8*view.dpr; c.beginPath(); c.arc(w*.5, h*1.1, h*.9-i*8*view.dpr, Math.PI, 0); c.stroke(); }); c.restore(); }
}
