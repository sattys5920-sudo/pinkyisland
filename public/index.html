// ===== 하루의 빛: 한국 시간 그대로. 해 질 녘(17~19 시)에 어두워지고, 밤에는 가로등·창문·등대가 켜져요 =====
function nightLevel(){ const d = new Date(Date.now() + serverOffset + 9*3600000), h = d.getUTCHours() + d.getUTCMinutes()/60;
  if (h >= 7 && h < 17) return 0; if (h >= 17 && h < 19) return (h-17)/2; if (h >= 5 && h < 7) return 1 - (h-5)/2; return 1; }
const dkLayer = document.createElement('canvas');
function lightsHere(){
  const z = Z(), L = [];
  for (const l of (z.lamps||[])) L.push([l.x, l.y-62, 130, true]);
  if (zoneId==='home') for (const p of Object.values(players)) if (p.lot!=null){ const H = LOTS[p.lot]; L.push([H.x, H.y-40, 80, false]); }
  for (const p of z.places) if (p.kind==='lighthouse') L.push([p.x, p.y-170, 220, true]); else if (p.kind==='house') L.push([p.x, p.y-40, 80, false]);
  if (!admin) L.push([pos.x, pos.y-24, 70, false]);
  for (const o of others.values()) if (o.z===zoneId) L.push([o.x, o.y-24, 55, false]);
  return L;
}
function drawNight(c, t){
  const z = Z(); if (z.theme==='room' || z.theme==='cave') return;
  const lv = nightLevel(); if (lv <= 0) return;
  const w = cv.width, h = cv.height, k = view.dpr*view.zoom, X = x => (x - view.cx)*k, Y = y => (y - view.cy)*k;
  if (dkLayer.width !== w || dkLayer.height !== h){ dkLayer.width = w; dkLayer.height = h; }
  const g = dkLayer.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation = 'source-over'; g.clearRect(0,0,w,h);
  const dusk = Math.max(0, 1 - Math.abs(lv - .45)*2.6); // 해 질 녘엔 살짝 노을빛
  g.fillStyle = `rgba(${Math.round(16 + 80*dusk)},${Math.round(18 + 14*dusk)},${Math.round(58 - 18*dusk)},${(.74*lv).toFixed(3)})`; g.fillRect(0,0,w,h);

}

}

// ===== 경제: 판매처 · 오늘의 시세 · 거래소 =====
// 판매처: 모모는 뭐든 사 주고, 전문 상인은 자기 분야를 더 비싸게 사 줘요. 친한 친구(♥7)가 되면 +10%
const BUYERS = {
  bami:{cats:['forage'], bonus:{forage:1.25}, line:'들꽃이랑 열매, 버섯은 내가 제일 잘 알아. 비싸게 사 줄게.'},
  momo:{cats:['crop','forage','fish','ore','loot','dish','furn'], bonus:{}, line:'뭐든 가져와요~ 다 사 줄게요!'},
  hana:{cats:['crop'], bonus:{crop:1.25}, line:'작물이면 내가 제일 비싸게 사 줄게!'},
  pengpeng:{cats:['fish'], bonus:{fish:1.25}, line:'펭! 물고기라면 제일 비싸게 사 줄게!'},
  dodo:{cats:['ore'], bonus:{ore:1.25}, line:'광석이라면 내가 제값 쳐 주지.'},
  kongi:{cats:['loot'], bonus:{loot:1.25}, line:'충성! 전리품은 경비대가 비싸게 사겠습니다!'},
  dandan:{cats:['dish','crop'], bonus:{dish:1.25, crop:1.05}, line:'요리라면 우리 카페에서 사 갈게요.'},
};
const SELL_CATS = {crop:'작물', forage:'채집물', fish:'물고기', ore:'광석', loot:'전리품', dish:'요리', furn:'가구'};
const baseKey = key => { const [cat, id] = key.split(':'); return cat==='fish' ? 'fish:'+parseFish(id).id : key; };
// 오늘의 인기 품목: 작물·물고기·광석에서 하나씩, 오늘은 2 배 값
function hotToday(){
  const d = today(), pick = (list, salt) => list[hash(d+salt) % list.length];
  return [ 'crop:'+pick(Object.keys(CROPS),'c'), 'fish:'+pick(Object.keys(FISH),'f'), 'ore:'+pick(Object.keys(ORES).filter(id=>ORES[id].tier<=3),'o') ];
}
// 시세: 날마다 품목별로 70%~140% 사이에서 바뀌어요
function marketMul(key){ const b = baseKey(key); if (hotToday().includes(b)) return 2; return .7 + (hash(today()+'|'+b) % 71)/100; }
function soldToday(){ if (!me.sold || me.sold.d !== today()) me.sold = {d:today(), c:{}}; me.sold.c = me.sold.c || {}; return me.sold.c; } // 빈 {} 는 서버에 안 남아서 다시 만들어요
// 같은 물건을 하루에 많이 팔면 값이 조금씩 내려가요 (개당 -3%, 최저 50%)
const glut = (key, extra=0) => Math.max(.5, 1 - .03*((soldToday()[baseKey(key).replace(':','_')]||0) + extra));
function buyerBonus(n, key){
  const by = BUYERS[n.id], cat = key.split(':')[0];
  return (by?.bonus[cat] || 1) + (heartsN(n) >= 7 ? .1 : 0);
}
function unitPrice(key, n, extra=0){ return Math.max(1, Math.round(itemPrice(key) * marketMul(key) * glut(key, extra) * (n ? buyerBonus(n, key) : 1))); }
function sellTotal(key, cnt, n){ let s = 0; for (let i=0;i<cnt;i++) s += unitPrice(key, n, i); return s; }
function sellItem(key, cnt, n){
  cnt = Math.min(cnt, invCount(key)); if (cnt <= 0) return 0;
  const g = sellTotal(key, cnt, n), sk = baseKey(key).replace(':','_'), c = soldToday();
  invAdd(key, -cnt); c[sk] = (c[sk]||0) + cnt; me.inv.gold += g;
  me.earned = (me.earned||0) + g; stat('sold', cnt); questEvent('sell', key, cnt); syncStats();
  return g;
}
const trend = key => { const m = marketMul(key); return m >= 2 ? '<b style="color:#e48fac">인기 ×2</b>' : m >= 1.15 ? '<span style="color:#e48fac">▲</span>' : m <= .85 ? '<span style="color:#7fa6d9">▼</span>' : '<span style="color:var(--soft)">–</span>'; };
function sellPanel(n){
  const by = BUYERS[n.id] || BUYERS.momo;
  const rows = by.cats.flatMap(cat=>itemsOf(cat).map(([k,c])=>({k,c,cat})));
  const all = rows.reduce((a,r)=>a+sellTotal(r.k, r.c, n), 0);
  const bon = Object.entries(by.bonus).map(([c,b])=>`${SELL_CATS[c]} +${Math.round((b-1)*100)}%`).concat(heartsN(n) >= 7 ? ['친한 친구 +10%'] : []).join(' · ');
  openPanel(`${n.name}에게 팔기 · 💰 ${me.inv.gold} G`,
    `<p class="mnote" style="margin-top:0">${esc(by.line)}${bon ? ` <b style="color:var(--ink)">${bon}</b>` : ''}<br>오늘의 인기: ${hotToday().map(k=>itemName(k)).join(', ')} (2 배)</p>` +

// 거래소: 주민(플레이어)끼리 물건을 골드로 사고팔아요. 팔리면 수수료 5%를 빼고 받아요

// 거래할 수 있는 아이템 키인지 (옷·우산·벽지·바닥도 거래돼요)
function itemKeyOk(k){ const m = /^(dish|crop|forage|fish|ore|loot|seed|furn|wear|umb|wall|floor):([A-Za-z0-9_~]{2,12})$/.exec(k || ''); if (!m) return false; const [, cat, id] = m;
  if (cat==='wear'){ const [w, c] = id.split(/[~#]/); return !!slotOfWear(w) && (c===undefined || /^[1-4]$/.test(c)); }
  if (cat==='umb') return !!UMB[id]; if (cat==='wall') return !!WALLS[id]; if (cat==='floor') return !!FLOORS[id]; return /^[a-z0-9_]{2,8}$/.test(id); }
const validListing = l => l && typeof l.item==='string' && itemKeyOk(l.item) && l.n>=1 && l.n<=99 && l.price>=1 && typeof l.uid==='string';

      stat('marketSold'); addLog(`거래소: ${String(l.bnick||'누군가').slice(0,8)} 님이 ${itemName(l.item)} ${l.n} 개를 샀어요! +${g} G`, true); }).catch(()=>{});
  }
  if (!$('npcPanel').hidden && $('npcPanel').dataset.market && $('talk').hidden) marketPanel(); // 사기·내리기 확인 창이 떠 있으면 닫지 않아요
}

     <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="mkAdd">물건 올리기</button><button class="mini" id="mkPrice">오늘의 시세</button></div>
     <div class="bag-sec"><b>사고 싶은 물건 ${others.length}</b>${others.map(row).join('') || '<p class="mnote">아직 올라온 물건이 없어요.</p>'}</div>
     ${mine.length ? `<div class="bag-sec"><b>내가 올린 물건 ${mine.length}/${MARKET_MAX}</b>${mine.map(row).join('')}</div>` : ''}`,
    b=>{ const id = b.dataset.id, l = market[id]; if (!l) return;
      if (l.uid===uid) return say('거래소', `${itemName(l.item)} ${l.n} 개를 내릴까요?`, [['내리기', async ()=>{ if (invRoom(l.item) < l.n){ closeTalk(); return toast(`가방에 ${itemName(l.item)}을(를) ${l.n} 개 넣을 자리가 없어요`); } if (await net.marketCancel(id)){ invAdd(l.item, l.n); saveMe(true); renderHud(); toast('물건을 돌려받았어요'); } else toast('이미 팔렸거나 내릴 수 없어요'); closeTalk(); marketPanel(); }], ['그만두기', marketPanel]], '', true);

// ===== 핑키 홈쇼핑 · 별사탕: 동물의 숲 무처럼 사 두고 값이 오르길 기다려요 =====
// 집에 TV(보리 공방)를 놓으면 볼 수 있어요. 방송은 하루 두 번, 오후 1 시와 밤 10 시에 한 시간씩. 그때만 사고팔 수 있어요.
// 3 일(방송 6 번)이 한 판. 첫 방송 값에서 시작해 판마다 오르내리는 모양이 달라요 (큰 대박 · 작은 대박 · 내리막 · 들쭉날쭉).
// 다음 판 첫 방송이 시작되면 남은 별사탕은 녹아 없어져요. 값은 모두에게 같아요.
const SHOW_HOURS = [13, 22], SHOW_MIN = 60, CANDY_MAX = 500, CANDY_PER = 6;
const TV_ID = Object.keys(FURN).find(k=>FURN[k].shape==='tv');
const kstParts = (t=Date.now() + serverOffset) => { const d = new Date(t + 9*3600000); return {day:Math.floor(d.getTime()/86400000), h:d.getUTCHours(), m:d.getUTCMinutes()}; };
function showLive(){ const {day, h, m} = kstParts(), s = SHOW_HOURS.indexOf(h); return s >= 0 && m < SHOW_MIN ? {slot:day*2 + s, left:SHOW_MIN - m} : null; }
function lastSlot(){ const {day, h} = kstParts(); return h >= SHOW_HOURS[1] ? day*2 + 1 : h >= SHOW_HOURS[0] ? day*2 : day*2 - 1; } // 가장 최근에 시작한 방송
const cycleOf = slot => Math.floor(slot / CANDY_PER);
const slotName = slot => `${['오후 1 시', '밤 10 시'][((slot % 2) + 2) % 2]}`;
const slotTime = slot => (Math.floor(slot/2) * 86400000) - 9*3600000 + SHOW_HOURS[((slot % 2) + 2) % 2] * 3600000; // 방송 시작 시각(ms)
function candyPrice(slot){
  const c = cycleOf(slot), i = slot - c*CANDY_PER, B = 90 + hash('cb'+c) % 21, pat = hash('cp'+c) % 4, r = k => (hash('cr'+c+'|'+k) % 1000) / 1000;
  if (i === 0) return B;
  if (pat <= 1){ const peak = 2 + Math.floor(r('pk') * 4); // 큰 대박(0) · 작은 대박(1): 몇 번 내리다가 한 번 확 올라요
    if (i < peak-1) return Math.round(B * (.9 - .05*i + r(i)*.06));
    if (i === peak-1) return Math.round(B * (pat===0 ? 1.25 + r(i)*.3 : 1.05 + r(i)*.2));
    if (i === peak) return Math.round(B * (pat===0 ? 3 + r(i)*2.5 : 1.4 + r(i)*.6));
    return Math.round(B * (.45 + r(i)*.3)); }
  if (pat === 2) return Math.round(B * (.93 - .09*i + r(i)*.05)); // 내리막
  return Math.round(B * (.6 + r(i)*.85)); // 들쭉날쭉
}
const hasTV = () => !!TV_ID && (me.furn||[]).some(f=>f.id===TV_ID);
// 내 별사탕. 판이 바뀌었으면 녹아요
function myCandy(){
  const c = me.candy;
  if (c && c.n > 0 && c.cycle !== cycleOf(lastSlot())){ toast(`별사탕 ${c.n} 개가 녹아 버렸어요.... 다음엔 3 일 안에 팔아요`); me.candy = null; saveMe(); }
  return me.candy && me.candy.n > 0 ? me.candy : null;
}
function candyTrade(n){
  const live = showLive(); if (!live) return toast('방송 시간에만 사고팔 수 있어요');
  const p = candyPrice(live.slot), c = myCandy();
  if (n > 0){
    n = Math.min(n, CANDY_MAX - (c ? c.n : 0), Math.floor(me.inv.gold / p)); if (n <= 0) return toast(c && c.n >= CANDY_MAX ? `별사탕은 ${CANDY_MAX} 개까지 가질 수 있어요` : '골드가 모자라요');
    me.inv.gold -= p*n; me.candy = {n:(c ? c.n : 0) + n, cost:(c ? c.cost : 0) + p*n, cycle:cycleOf(live.slot)}; stat('candyBought', n);
    toast(`별사탕 ${n} 개를 샀어요 · -${p*n} G`); questEvent('candyBuy', 'candy', n);
  } else {
    if (!c) return; n = Math.min(-n, c.n); const got = p*n, base = Math.round(c.cost * n / c.n);
    c.cost -= base; c.n -= n; if (!c.n) me.candy = null;
    me.inv.gold += got; me.earned = (me.earned||0) + got; if (got > base) stat('stockProfit', got - base); syncStats();
    toast(`별사탕 ${n} 개를 팔았어요 · +${got} G (${got-base >= 0 ? '+' : ''}${got-base} G)`); questEvent('candySell', 'candy', n);
  }
  saveMe(); renderHud(); tvPanel();
}
function tvPanel(){
  if (me && !me.tvSeen){ me.tvSeen = true; saveMe(); setTimeout(tutCheck); }
  if (!hasTV()) return toast('보리 공방에서 동그란 TV를 만들어 집에 놓으면 홈쇼핑을 볼 수 있어요');
  if (Z().house !== uid) return toast('홈쇼핑은 집에 있는 TV로 봐요');
  const live = showLive(), cur = live ? live.slot : lastSlot(), c = myCandy(), cyc = cycleOf(cur), first = cyc * CANDY_PER;
  const nx = live ? null : (()=>{ let k = lastSlot() + 1; return {slot:k, wait:slotTime(k) - (Date.now() + serverOffset)}; })();
  const rows = Array.from({length:CANDY_PER}, (_,i)=>{ const k = first + i, d = Math.floor(k/2) - Math.floor(first/2) + 1, past = k <= lastSlot();
    return `<div class="tv-cell ${live && k===cur ? 'on' : ''}"><small>${d}일째 ${slotName(k)}</small><b>${past ? candyPrice(k) + ' G' : '?'}</b></div>`; }).join('');
  const price = live ? candyPrice(live.slot) : null;
  openPanel(`📺 핑키 홈쇼핑 · 💰 ${me.inv.gold} G`,
    `<div class="np" style="display:block">${live ? `<b style="color:#e0457b">● 지금 방송 중</b> · ${live.left} 분 남았어요<br>오늘의 별사탕 <b style="font-size:30px">${price} G</b>` : `방송 쉬는 시간이에요. 다음 방송: ${slotName(nx.slot)} (${fmtLeft(nx.wait)} 뒤)`}</div>
     <div class="tv-grid">${rows}</div>
     ${c ? `<div class="np" style="display:block">내 별사탕 <b>${c.n}</b> 개 · 평균 ${Math.round(c.cost/c.n)} G${price ? ` · 지금 팔면 ${price*c.n} G (${price*c.n - c.cost >= 0 ? '+' : ''}${price*c.n - c.cost} G)` : ''}<br><small>이번 판이 끝나는 4 일째 오후 1 시 방송이 시작되면 녹아요</small></div>` : ''}
     ${live ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${[10, 50, 100].map(q=>`<button class="mini" data-q="${q}">${q} 개 사기</button>`).join('')}<button class="mini" data-q="999">최대로 사기</button>${c ? `<button class="mini" data-q="-10">10 개 팔기</button><button class="mini" data-q="-${c.n}">전부 팔기</button>` : ''}</div>` : ''}
     <p class="mnote">방송은 매일 오후 1 시, 밤 10 시에 한 시간씩. 그때만 사고팔 수 있어요. 3 일(방송 6 번)이 한 판이고, 값은 판마다 다르게 오르내려요. 다음 판 첫 방송이 시작되면 남은 별사탕은 녹아요. 최대 ${CANDY_MAX} 개.</p>`);
  $('npcPanel').dataset.tv = '1';
  $('npcPanel').querySelectorAll('button[data-q]').forEach(b=>b.onclick = ()=>candyTrade(+b.dataset.q));
}
// 홈쇼핑 창을 열어 두면 방송이 시작하거나 끝날 때 새로 그려요
let tvShown = '';
setInterval(()=>{ if (!me) return; const k = JSON.stringify(showLive()); if (k !== tvShown){ tvShown = k; const p = $('npcPanel'); if (p && !p.hidden && p.dataset.tv) tvPanel(); } }, 15000);
// 섬 주식은 문을 닫았어요: 가지고 있던 주식은 산 값 그대로 돌려줘요
function refundStocks(){
  const own = me.stocks || {}, back = Object.values(own).reduce((a,h)=>a + (h && h.n > 0 ? Math.round(h.cost||0) : 0), 0);
  if (me.stocks) delete me.stocks;
  if (back > 0){ me.inv.gold += back; setTimeout(()=>say('섬 소식', `섬 주식이 문을 닫고 홈쇼핑 별사탕이 생겼어요! 가지고 있던 주식은 산 값 ${back} G를 돌려받았어요.`), 1500); }
}

// ===== 기록(stats) · 업적 · 칭호 =====
function stats(){ me.stats = me.stats || {}; return me.stats; }
function stat(key, n=1){ const st = stats(); st[key] = (st[key]||0) + n; checkAchievements(); return st[key]; }
function statSet(key, v){ const st = stats(); if (st[key] !== v){ st[key] = v; checkAchievements(); } }
function syncStats(){ // 다른 데이터에서 바로 계산되는 기록
  const st = stats(); st.dexFish = Object.keys(me.dex||{}).length; st.dexOre = Object.keys(me.odex||{}).length; st.dexMon = Object.keys(me.mdex||{}).length;
  st.earned = me.earned||0; st.closetCount = (me.closet||[]).length; st.plots = me.plots||2; st.museumDonated = museumTotal() ? museumShared() : 0;
  const hearts = NPCS.map(n=>heartsN(n)); st.maxHearts = Math.max(0, ...hearts); st.friends7 = hearts.filter(h=>h>=7).length; st.soulmates = hearts.filter(h=>h>=10).length;
  st.weaponTier = Math.max(1, WEAPON_LIST.findIndex(w=>w[0]===(me.inv.weapon||'w1')) + 1);

const INV_TABS = [['all','전체'],['crop','작물'],['forage','채집'],['dish','요리'],['fish','물고기'],['ore','광석'],['loot','전리품'],['seed','씨앗'],['wear','옷'],['umb','우산'],['furn','가구'],['wall','벽지'],['floor','바닥']];
const INV_COLS = 6, INV_PAGE = INV_COLS*5;
const bagState = {tab:'all', page:0, sel:null};
function invGrid(cats, st){
  const tabs = INV_TABS.filter(([k])=>k==='all' || cats.includes(k));
  if (!tabs.some(([k])=>k===st.tab)) st.tab = 'all';
  const list = (st.tab==='all' ? cats : [st.tab]).flatMap(c=>itemsOf(c));
  const pages = Math.max(1, Math.ceil(list.length/INV_PAGE)); st.page = Math.max(0, Math.min(st.page, pages-1));
  if (st.sel && !(invCount(st.sel) > 0)) st.sel = null;
  const slice = list.slice(st.page*INV_PAGE, (st.page+1)*INV_PAGE);
  const cells = Array.from({length:INV_PAGE}, (_,i)=>{ const it = slice[i]; if (!it) return '<div class="slot empty"></div>'; const [k,n] = it, cat = k.split(':')[0];
    const tag = cat==='fish' ? `<s>${'★'.repeat(parseFish(k.slice(5)).st)}</s>` : cat==='seed' ? '<s class="sd">씨앗</s>' : '';
    return `<button class="slot${st.sel===k ? ' on' : ''}${n>=STACK_MAX ? ' full' : ''}" data-k="${k}" aria-label="${esc(itemName(k))} ${n} 개">${iconImg(k)}<i>${n}</i>${tag}</button>`; }).join('');
  return `<div class="inv-tabs">${tabs.map(([k,l])=>`<button class="itab${st.tab===k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="inv-grid">${cells}</div>
    <div class="inv-foot"><span>${list.length} 종 · ${list.reduce((a,[,n])=>a+n,0)} 개</span>${pages > 1 ? `<span class="pg"><button class="mini" data-pg="-1" ${st.page ? '' : 'disabled'}>‹</button>${st.page+1} / ${pages}<button class="mini" data-pg="1" ${st.page < pages-1 ? '' : 'disabled'}>›</button></span>` : ''}</div>
    <div class="inv-detail" id="invDetail"></div>`;
}
// 칸·탭·쪽 버튼을 연결해요. detail(el, k) 가 고른 칸의 설명과 버튼을 채워요
function invBind(st, rerender, detail, empty){
  const p = $('npcPanel');
  p.querySelectorAll('.itab').forEach(b=>b.onclick = ()=>{ st.tab = b.dataset.tab; st.page = 0; st.sel = null; rerender(); });
  p.querySelectorAll('[data-pg]').forEach(b=>b.onclick = ()=>{ st.page += +b.dataset.pg; rerender(); });
  p.querySelectorAll('.slot[data-k]').forEach(b=>b.onclick = ()=>{ st.sel = st.sel===b.dataset.k ? null : b.dataset.k; st.jump = !!st.sel; rerender(); });
  const el = $('invDetail'); if (st.sel){ detail(el, st.sel); if (st.jump){ st.jump = false; el.scrollIntoView({block:'nearest', behavior:'smooth'}); } } else el.innerHTML = `<p class="mnote" style="margin:0">${empty}</p>`;
}
function keepScroll(fn){ const p = $('npcPanel'), y = p.hidden ? 0 : p.scrollTop; fn(); p.scrollTop = y; }
function itemDesc(k){
  const [cat, id] = k.split(':');
  let desc = `${invCount(k)}/${STACK_MAX} 개 · ` + (SELL_CATS[cat] ? `팔면 1 개 ${itemPrice(k)} G` : '주민은 안 사요 · 거래소에서 사고팔아요');
  const food = foodOf(k), g = rarityOf(k);
  if (g) desc = `희귀도 ${RARE_STAR(g)} ${RARE_NAME[g]} · ` + desc;
  if (food) desc += ` · 먹으면 체력 +${food.hp} · 기력 +${food.sta}`; else if (cat==='crop') desc += ' · 꽃은 먹을 수 없어요 (선물용)';
  if (cat==='fish'){ const p = parseFish(id), d = (me.dex||{})[p.id]; desc = desc + (d ? ` · 최고 기록 ${d.best} cm` : ''); }
  if (cat==='ore') desc = `희귀도 ${TIER_STAR(ORES[id].tier)} · ` + desc;
  if (cat==='loot') desc = `${MONSTERS[id].name}의 전리품 · ` + desc;
  if (cat==='seed') desc = `다 크는 데 ${fmtMin(CROPS[id].min)} · ` + desc;
  const lore = loreOf(cat==='fish' ? parseFish(id).id : id);
  return {desc, lore: lore ? lore.desc : ''};
}
function detailBox(el, k, buttons){

  const cats = ['crop','forage','dish','fish','ore','loot','seed','wear','umb','furn','wall','floor'];

    `<div class="np"><span class="np-name">💰 ${me.inv.gold} G <small>· 체력 ${Math.ceil(playerHp)}/${maxHp()} · 기력 ${Math.floor(playerSta)}/${maxSta()}</small></span><span class="np-day" style="grid-column:1/-1;text-align:left">도구: ${tools}</span></div>${wornRow()}${invGrid(cats, bagState)}
     <div class="np" style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="dxF">물고기 도감 ${Object.keys(me.dex||{}).length}/50</button><button class="mini" id="dxO">광석 도감 ${Object.keys(me.odex||{}).length}/40</button><button class="mini" id="dxG">채집 도감 ${Object.keys(me.gdex||{}).length}/${FORAGE.length}</button><button class="mini" id="dxM">몬스터 도감 ${Object.keys(me.mdex||{}).length}/30</button><button class="mini" id="bgSend">거래소에 올리기</button><button class="mini" id="bgMarket">거래소</button><button class="mini" id="bgPrice">오늘의 시세</button><button class="mini" id="bgStock">📺 홈쇼핑</button><button class="mini" id="bgCloset">옷</button><button class="mini" id="bgQuest">퀘스트</button><button class="mini" id="bgAch">업적</button></div>`));
  invBind(bagState, ()=>showBag(), (el,k)=>{ const acts = [];
    if (foodOf(k)) acts.push(['먹기', ()=>{ eat(k); showBag(); }]);

    if (kc==='wear') acts.push(['입기', ()=>{ wearItem(k); showBag(); }]);
    if (kc==='umb') acts.push(['우산으로 쓰기', ()=>{ useUmb(k); showBag(); }]);
    if (kc==='wall' || kc==='floor') acts.push([kc==='wall' ? '벽지 바르기' : '바닥 깔기', ()=>{ useInterior(k); showBag(); }]);
    if (kc==='furn') acts.push(['집에 놓기', ()=>{ $('npcPanel').hidden = true; toast('내 집 안에서 [꾸미기]를 눌러 놓아요'); }]);

    detailBox(el, k, acts); }, '칸을 누르면 자세히 볼 수 있어요.');

  $('bgCloset').onclick = ()=>{ bagState.tab = 'wear'; bagState.page = 0; showBag(); }; $('bgQuest').onclick = questLog; $('bgAch').onclick = achPanel;
  $('bgMarket').onclick = marketPanel; $('bgPrice').onclick = pricePanel; $('bgStock').onclick = tvPanel;
  $('dxF').onclick = showDex; $('dxG').onclick = forageDex; $('dxO').onclick = oreDex; $('dxM').onclick = monDex;
  $('bgSend').onclick = marketAdd;

  let vx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let vy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);

  if (fishing && fishing.phase!=='game' && (vx||vy||target)) stopFishing('낚싯대를 거뒀어요');
  if (fishing && fishing.phase==='game'){ vx = 0; vy = 0; }
  if (vx||vy) target = null;
  else if (target){
    const dx = target.x-pos.x, dy = target.y-pos.y, d = Math.hypot(dx,dy);

    else { vx = dx/d; vy = dy/d; }
  }
  const len = Math.hypot(vx,vy);
  pos.moving = len>0;
  if (!len) return;
  vx/=len; vy/=len;
  pos.dir = Math.abs(vx) > Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
  const ox = pos.x, oy = pos.y, nx = pos.x + vx*SPEED*dt, ny = pos.y + vy*SPEED*dt;
  const stuck = blocked(pos.x, pos.y); // 이미 막힌 곳에 서 있으면(새 울타리가 생긴 자리 등) 빠져나갈 수 있게
  if (stuck || !blocked(nx, pos.y)) pos.x = nx;
  if (stuck || !blocked(pos.x, ny)) pos.y = ny;
  walked += Math.hypot(pos.x-ox, pos.y-oy); if (walked > 500){ stats().distanceWalked = (stats().distanceWalked||0) + Math.round(walked); walked = 0; checkAchievements(); }
  checkExit();
  if (target && Math.hypot(pos.x-ox, pos.y-oy) < SPEED*dt*.2){ stuckT += dt; if (stuckT>.35){ const tg = target; target = null; stuckT = 0; if (tg.act && Math.hypot(pos.x-tg.x, pos.y-tg.y) < 64) tg.act(); } } else stuckT = 0;
}

function sendPresence(t){
  if (!net || !me || admin || kicked) return; // 다른 곳에서 접속해 밀려난 창은 위치를 안 보내요
  const tgt = target && !keyMoving ? target : null;
  const p = {z:zoneId, ...(darkDown ? {down:1} : {}), nick:me.nick, look:me.look, roof:me.roof, x:Math.round(pos.x), y:Math.round(pos.y), dir:pos.dir, mv:pos.moving?1:0, emo:emo.e||'', emoAt:emo.at||0, ex:myExpr(), ti:me.title ? titleOf(me.title) : ''};
  if (isRain() && umbKey() && snowOutside()) p.um = umbKey();
  const wp = walkingPet(); if (wp) p.pet = {sp:wp.sp, col:wp.col|0, name:String(wp.name||'').slice(0,8)};
  if (tgt){ p.tx = Math.round(tgt.x); p.ty = Math.round(tgt.y); }
  const sig = JSON.stringify(tgt ? {...p, x:0, y:0, dir:0, mv:0} : p);
  let go = false;
  if (tgt !== lastTarget) go = true;                              // 목적지가 바뀌면 바로 보내요 (나머지는 각자 화면에서 걸어가요)
  else if (keyMoving) go = t-lastPres >= 250;                     // 키보드로 걸을 땐 0.25 초마다
  else if (sig !== presSig) go = t-lastPres >= 120;               // 멈춤, 방향, 이모티콘

}
function moveOthers(dt){
  for (const o of others.values()){
    if (o.goal){
      const dx = o.goal.x-o.x, dy = o.goal.y-o.y, d = Math.hypot(dx,dy);
      if (d < 4){ o.goal = null; o.mv = 0; continue; }
      const st = Math.min(d, SPEED*dt); o.x += dx/d*st; o.y += dy/d*st; o.mv = 1;
      o.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    } else {
      const k = Math.min(1, dt*8); o.x += (o.sx-o.x)*k; o.y += (o.sy-o.y)*k;
      o.mv = o.mvRemote || Math.hypot(o.sx-o.x, o.sy-o.y) > 2 ? 1 : 0;
    }
  }
}

const fullness = pt => { petFull(pt); return Math.max(0, Math.min(100, Math.round(pt.full - (Date.now() - (pt.fullAt||Date.now())) / 3600000 * PET_HOME_RATE))); };
function petSpend(pt, n){ const f = fullness(pt); pt.full = Math.max(0, f - n); pt.fullAt = Date.now(); }
const loveLv = pt => Math.min(10, Math.floor((pt.love||0) / 10));
const petMood = pt => { const f = fullness(pt); return f < 15 ? '너무 배고파서 기운이 없어요' : f < 35 ? '배고파요' : f < 60 ? '밥이 먹고 싶어요' : (pt.love||0) >= 60 ? '아주 행복해요' : '기분 좋아요'; };
// 이 종을 이미 데려간 다른 주민 (없으면 null)
const petTakenBy = sp => { for (const [id,p] of Object.entries(players)) if (id!==uid && petsOf(id).some(x=>x.sp===sp)) return p; const c = petClaims[sp]; if (c && c.uid!==uid && players[c.uid]) return players[c.uid]; return null; };
const CARRIED = new Set(['goldfish']); // 금붕어는 산책할 때 어항째 품에 안고 다녀요 (집에서는 늘 같은 자리)
const walkingPet = () => me && myPets().find(p=>p.walk);
const petCol = pt => PET[pt.sp].cols[Math.max(0, Math.min(2, pt.col|0))];
const petIconCache = new Map();
function petIcon(sp, col, size=96){ const key = sp+'|'+col+'|'+size; if (petIconCache.has(key)) return petIconCache.get(key); const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), k = size/40; x.setTransform(k,0,0,k,size/2, size*.82); try { PET_DRAW[sp](CH.mattePainter(x), 0, 0, PET[sp].cols[col|0], 0, false); } catch(e){} const u = c.toDataURL(); petIconCache.set(key, u); return u; }
// 집 안에서는 시간에 따라 천천히 이곳저곳으로 옮겨 다녀요 (모두에게 같은 자리로 보여요)
function petHomePos(owner, i){
  const z = Z(), seed = hash(owner + i), slot = Math.floor(Date.now() / 9000), r = seeded(seed + slot), r0 = seeded(seed + slot - 1);
  const top = 300, pick = rr => ({x: 90 + rr()*(z.W-180), y: top + rr()*(z.H-top-90)});
  const pt = petsOf(owner)[i]; if (pt && CARRIED.has(pt.sp)){ const f = pick(seeded(seed)); return {x:f.x, y:f.y, walk:false, flip:false}; } // 어항은 늘 같은 자리
  const a = pick(r0), b = pick(r), k = Math.min(1, (Date.now() % 9000) / 3000);
  return {x: a.x + (b.x-a.x)*k, y: a.y + (b.y-a.y)*k, walk: k < 1, flip: b.x < a.x};
}
let petClaims = {}; // petClaims/<종> = {uid}: 같은 종을 동시에 데려가지 않게 서버에서 먼저 잡아요
let petFollow = null, petWalked = 0, petHungryT = 0; // 산책 중인 내 펫의 위치, 걸은 거리
// 배고픈 펫이 있으면 가끔 알려 줘요
function petHungerCheck(t){ if (!me || t < petHungryT) return; petHungryT = t + 300000; const h = myPets().filter(p=>fullness(p) < 35); if (h.length) addLog(`🐾 ${h.map(p=>p.name).join(', ')}이(가) 배고파해요. 집에 가서 밥을 주세요 (밥은 공방 거리 보호소)`, true); }
const othersPets = new Map();
function updatePets(dt){

  const wp = walkingPet();
  if (!wp || Z().house){ petFollow = null; } else {
    const gx = pos.x - 26, gy = pos.y + 4; if (!petFollow || Math.hypot(petFollow.x-gx, petFollow.y-gy) > 300) petFollow = {x:gx, y:gy, walk:false, flip:false};
    const dx = gx-petFollow.x, dy = gy-petFollow.y, dd = Math.hypot(dx, dy); petFollow.walk = dd > 6; if (dd > 6){ const sp = Math.min(dd, 150*dt + dd*2*dt); petFollow.x += dx/dd*sp; petFollow.y += dy/dd*sp; petFollow.flip = dx < 0;
      petWalked += sp; if (petWalked >= PET_WALK_STEP){ petWalked = 0; petSpend(wp, 1); saveMe(); if (fullness(wp) < 15){ wp.walk = false; saveMe(); toast(`${wp.name}이(가) 배고파서 집으로 돌아갔어요. 밥을 챙겨 주세요`); } } }
  }

    if (!f || Math.hypot(f.x-gx, f.y-gy) > 300) f = {x:gx, y:gy}; const dx = gx-f.x, dy = gy-f.y, dd = Math.hypot(dx,dy); f.walk = dd > 6; if (dd > 6){ const sp = Math.min(dd, 150*dt + dd*2*dt); f.x += dx/dd*sp; f.y += dy/dd*sp; f.flip = dx < 0; } othersPets.set(id, f); }
}
function drawPet(c, sp, col, x, y, t, walk, flip){ c.save(); if (flip){ c.translate(x, 0); c.scale(-1, 1); c.translate(-x, 0); } try { PET_DRAW[sp](CH.mattePainter(c), x, y, col, t, walk); } catch(e){} c.restore(); }
function petEntities(d, t){

  return out;
}
function petTap(w){
  if (!Z().house || !me) return null;
  const owner = Z().house, list = petsOf(owner);
  for (const pt of list) if (pt._x!=null && Math.abs(w.x-pt._x) < 16 && w.y > pt._y-28 && w.y < pt._y+6){
    if (owner!==uid) return {x:pos.x, y:pos.y, act:()=>toast(`${players[owner]?.nick||'누군가'} 님의 ${PET[pt.sp].name} '${pt.name}'이에요 · ${petMood(pt)}`), mark:performance.now()};

function shelterPanel(){
  const pets = myPets();

    return `<button class="tile" data-sp="${id}" ${t ? 'style="opacity:.5"' : ''}><img class="ic" src="${petIcon(id, 0)}" alt=""><em>${name}</em><s style="color:var(--soft);text-decoration:none">${mine ? '우리 집' : t ? esc(String(t.nick).slice(0,6)) + ' 님 집' : '입양하기'}</s></button>`; }).join('');

    `<p class="mnote" style="margin-top:0">주인을 기다리는 친구들이에요. 입양은 무료이고 한 사람이 한 마리를 키워요. <b>종마다 한 마리뿐이라 먼저 데려간 사람의 가족이 돼요.</b> 데려간 친구는 집에서 지내요.</p>` +
    `<div class="bag-sec"><b>펫 밥 가게</b>${Object.entries(PET_FOODS).map(([k,f])=>`<button class="np" data-food="${k}"><span class="np-name">${f.icon} ${f.name} <small>배부름 +${f.full} · 친밀도 +${f.love} · 가진 것 ${petFoodCount(k)} 개</small></span><span class="np-place">${f.price.toLocaleString()} G</span></button>`).join('')}</div>` +
    (pets.length ? `<p class="mnote">우리 집 친구 ${pets.length}/${PET_MAX}: ${pets.map(p=>`${esc(p.name)}(${PET[p.sp].name} · 배부름 ${fullness(p)})`).join(', ')}</p>` : '') +
    `<div class="bag-grid">${cards}</div>`);
  $('npcPanel').querySelectorAll('[data-food]').forEach(b=>b.onclick = ()=>{ const k = b.dataset.food, f = PET_FOODS[k]; if (me.inv.gold < f.price) return toast('돈이 모자라요'); me.inv.gold -= f.price; petFoodCount(k); me.inv.pfood[k] = (me.inv.pfood[k]||0) + 1; saveMe(); renderHud(); keepScroll(shelterPanel); toast(`${f.name}을(를) 샀어요`); });

}
function adoptPanel(sp, col=0){
  if (myPets().length >= PET_MAX) return toast('펫은 한 사람이 한 마리만 키울 수 있어요');
  const tk = petTakenBy(sp); if (tk) return toast(`${PET[sp].name}은(는) 이미 ${tk.nick} 님 가족이 됐어요. 다른 친구를 골라 주세요`);
  const P = PET[sp];
  openPanel(`${P.name} 입양하기`, `<button class="mini" id="adBack" style="background:#fff">← 보호소로</button>
    <div class="bag-grid">${P.cols.map((c,i)=>`<button class="tile ${i===col?'on':''}" data-c="${i}"><img class="ic" src="${petIcon(sp, i)}" alt=""><em>${i+1} 번 아이</em></button>`).join('')}</div>
    <label class="field"><b>이름</b><input id="petName" maxlength="8" placeholder="최대 8 글자"></label>

    saveMe(true); renderHud(); $('npcPanel').hidden = true; say('반려동물 보호소', `${name}(${P.name})이(가) 우리 집 식구가 됐어요! 집에 가면 만날 수 있어요. 배고파하면 보호소에서 산 밥을 주세요.`); setTimeout(tutCheck); };
}
function petPanel(pt){
  const f = fullness(pt), lv = loveLv(pt);
  openPanel(`${esc(pt.name)} · ${PET[pt.sp].name}`, `<div class="np" style="grid-template-columns:auto 1fr;align-items:center"><img class="ic" src="${petIcon(pt.sp, pt.col)}" alt="" style="width:64px;height:64px"><span class="np-name">${petMood(pt)} <small>배부름 ${f}/100 · 친밀도 ${'♥'.repeat(lv) || '♡'} (${pt.love||0})</small></span></div>

    `<button class="np" data-id="pat"><span class="np-name">쓰다듬기 <small>한 시간에 한 번 친해져요</small></span></button>` +
    (`<button class="np" data-id="walk"><span class="np-name">${pt.walk ? '산책 그만하기' : '산책 데리고 다니기'} <small>${pt.walk ? '지금 밖에서 따라다녀요 · 걸으면 배가 고파져요' : (CARRIED.has(pt.sp) ? '켜면 어항째 품에 안고 다녀요 (한 마리만)' : '켜면 밖에서 나를 따라다녀요 (한 마리만)')}</small></span></button>`) +
    `<button class="np" data-id="name"><span class="np-name">이름 바꾸기 <small>지금 이름: ${esc(pt.name)}</small></span></button>`,
    b=>{ const id = b.dataset.id;

      if (id==='pat'){ if (Date.now() - (pt.petAt||0) < 3600000){ toast(`${pt.name}이(가) 좋아해요`); return; } pt.petAt = Date.now(); pt.love = (pt.love||0) + 2; saveMe(); toast(`${pt.name}이(가) 꼬리를 흔들어요`); }
