<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>pinkyisland</title>
<meta name="theme-color" content="#fffafb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pinkyisland">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="preload" href="fonts/Maplestory_Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Maplestory_Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--ink:#2a2429;--soft:#6f6569;--card:#fffdfd;--pink:#fbdbe5;--pinkd:#e48fac;--line:#f7e6ec;--sea:#cfeefb}
[hidden]{display:none!important}
button,a,label,input,select,.tile,.btn,.pill{touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
/* 게임 전체 글꼴: 메이플스토리체 (넥슨). 예전 Dongle 크기에 맞춘 화면이라 "Dongle" 이름으로 70% 크기로 불러요 */
@font-face{font-family:"Dongle";font-weight:100 500;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Dongle";font-weight:600 900;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:100 500;font-display:swap;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:600 900;font-display:swap;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
body{margin:0;background:var(--sea);color:var(--ink);font:700 21px/1.15 "Dongle",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#kicked{position:fixed;inset:0;z-index:50;background:rgba(60,30,50,.45);display:grid;place-items:center;padding:16px}#kicked .pill{max-width:340px;padding:18px 20px;text-align:center}#kicked b{font-size:24px}#kicked p{font-size:18px;color:var(--soft)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:linear-gradient(#fff,#fff8fa);border-radius:16px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
#hud{left:calc(env(safe-area-inset-left,0px) + 10px)!important;font-size:18px!important;gap:6px 10px!important;flex-wrap:wrap;max-width:calc(100vw - 20px - min(260px,46vw) - 10px);position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:20px;z-index:5}
#stats{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 56px);width:min(330px,calc(100vw - 20px - min(260px,46vw) - 10px));display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 4px;gap:3px 6px;align-items:center;padding:5px 8px 4px;background:rgba(255,250,252,.9);border-radius:12px;box-shadow:inset 0 -2px 0 #f7e3ea,0 3px 10px #d4a3b51f}
#stats #lvTag{grid-row:1/3;background:#b58cff;color:#fff;border-radius:9px;padding:1px 7px;font-size:17px;font-weight:normal;line-height:1.3}
#stats .sb{position:relative;height:16px;border-radius:8px;background:#f6e3ea;overflow:hidden;box-shadow:inset 0 1px 2px #0001}
#stats .sb s{position:absolute;left:0;top:0;bottom:0;border-radius:8px;text-decoration:none;transition:width .25s}
#stats .sb.hp s{background:linear-gradient(#ff9bb5,#ff6b8f)}
#stats .sb.st s{background:linear-gradient(#ffe27a,#ffc23f)}
#stats .sb.low{animation:lowPulse .8s ease-in-out infinite}
@keyframes lowPulse{50%{box-shadow:0 0 0 2px #ff6b8f}}
#stats .sb em{position:absolute;inset:0;font-style:normal;font-size:14px;line-height:16px;text-align:center;color:#5a3a4a;white-space:nowrap}
#stats .xb{grid-column:2/4;height:4px;border-radius:2px;background:#efe6fb;overflow:hidden;position:relative}
#stats .xb s{position:absolute;left:0;top:0;bottom:0;background:#b58cff;text-decoration:none;transition:width .25s}
#stats .xb em{display:none}
body.dlg-on #stats{visibility:hidden}
#hud u{text-decoration:none;font-size:.62em;margin-right:3px;vertical-align:1px}
img.ui{width:1.05em;height:1.05em;vertical-align:-.2em;margin:0 .12em}
#hud img.ui{width:20px;height:20px;vertical-align:-4px;margin:0 3px 0 0}
img.mi{width:30px;height:30px;vertical-align:middle;display:block}
img.bi{width:34px;height:34px;display:block;pointer-events:none}
.emo img.bi{width:30px;height:30px;margin:auto}
.btn img.ui{width:1.15em;height:1.15em}
.np-name img.ui{width:28px;height:28px;vertical-align:-8px;margin:0 6px 0 0}
#hud b{font-weight:inherit}
#hud i{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:4px}
#quest{right:calc(env(safe-area-inset-right,0px) + 10px)!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-width:min(260px,46vw);padding:8px 12px;font-size:19px;z-index:5}
#quest b{display:block;font-size:16px;color:var(--soft)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:6px;z-index:5}
#bar div{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-size:32px;box-shadow:inset 0 -2px 0 #f6e6ec}
#bar div.off{opacity:.28;filter:grayscale(1)}
#bar span{position:absolute;right:3px;bottom:0;font-size:16px;color:var(--ink)}
#bar .qk{background:#fff6fa;box-shadow:inset 0 0 0 2px #ffd3e4,inset 0 -2px 0 #f6e6ec;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar .qk i{position:absolute;left:4px;top:0;font-size:12px;font-style:normal;color:#e09ab6;line-height:1.1}
#bar .qk.empty{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px #f0bfd2;font-size:24px;color:#e09ab6}
#bar .qk:active{transform:scale(.9)}
#bar .sep{width:2px;background:#f3cfe0;box-shadow:none;border-radius:2px;margin:6px 1px}
#chatbox{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(320px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:4px;font-size:19px;text-shadow:0 1px 0 #fff,0 0 4px #fff}
#log p{margin:0;transition:opacity 1s}
#log p.sys{color:var(--ink);opacity:.85}
#chatrow{display:flex;gap:6px;pointer-events:auto}
#friendBtn{position:relative}#dmBadge{position:absolute;right:-2px;top:-2px;min-width:20px;height:20px;border-radius:10px;background:#ff5a8a;color:#fff;font-size:14px;line-height:20px;font-weight:normal;padding:0 5px}
.np.dm-row{grid-template-columns:auto 1fr auto;align-items:center;gap:0 8px}.np.dm-row .np-name{text-align:left;min-width:0}.dm-dot{width:10px;height:10px;border-radius:50%;background:#cfc3c9;align-self:center;margin-right:2px}.dm-dot.on{background:#5fd07a;box-shadow:0 0 0 3px #5fd07a33}
.dm-unread{background:#ff5a8a;color:#fff;border-radius:10px;padding:0 7px;font-size:14px;margin-left:4px}
.dm-head{flex:none;display:flex;align-items:center;gap:8px}.dm-head b{font-size:20px;font-weight:normal}.dm-head small{color:var(--soft);font-size:15px;margin-right:auto}
.dm-list{flex:1 1 auto;min-height:180px;max-height:46dvh;overflow:auto;display:flex;flex-direction:column;gap:6px;background:#fff6f9;border-radius:14px;padding:10px}
.dm-msg{max-width:78%;align-self:flex-start;background:#fff;border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:18px;line-height:1.35;box-shadow:inset 0 -2px 0 #f3dbe5;white-space:pre-wrap;overflow-wrap:anywhere}
.dm-msg.me{align-self:flex-end;background:var(--pink);border-radius:14px 14px 4px 14px;box-shadow:inset 0 -2px 0 #f2c3d3}
.dm-msg small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.dm-line{display:flex;gap:6px;align-items:flex-start;align-self:flex-start;max-width:86%}.dm-line .dm-msg{max-width:100%;align-self:flex-start}.dm-col{display:flex;flex-direction:column;gap:2px;min-width:0}.dm-col b{font-weight:normal;font-size:14px;color:var(--soft);margin-left:2px}
.dm-pic{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:#ffeaf2;box-shadow:0 0 0 2px #fff}span.dm-pic{background:none;box-shadow:none}span.dm-pic.dm-init{background:#ffd6e6;box-shadow:0 0 0 2px #fff;display:grid;place-items:center;font-size:18px;color:var(--ink)}
.dm-ava{position:relative;width:42px;height:42px;flex:none}.dm-ava img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ffeaf2;box-shadow:0 0 0 2px #fff}.dm-ava .dm-dot{position:absolute;right:-1px;bottom:-1px;margin:0;border:2px solid #fff}
.dm-day{align-self:center;font-size:13px;color:var(--soft);background:#fff;border-radius:10px;padding:0 10px}
.dm-in{flex:none;display:flex;gap:6px}.dm-in input{flex:1;min-width:0;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink)}
body:not(.chat-open) #chatrow,body:not(.chat-open) #emorow,body:not(.chat-open) #chatHist{display:none}
body.chat-open #log{display:none}
#chatHist{pointer-events:auto;max-height:min(38vh,320px);overflow-y:auto;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 8px;box-shadow:0 2px 8px rgba(80,40,60,.12);display:flex;flex-direction:column;gap:3px;font-size:15px;overscroll-behavior:contain}
#chatHist p{margin:0;line-height:1.35;word-break:break-all}#chatHist p b{color:#c2457a;margin-right:6px}#chatHist p.me b{color:#7a5cc9}#chatHist time{color:#b9a0ac;font-size:11px;margin-left:6px}#chatHist p.sys{color:#9b7d8b;font-size:13px}
body.typing #chatHist{max-height:min(22vh,160px)} /* 채팅은 [채팅] 버튼을 누를 때만 열려요 (평소엔 화면을 가리지 않게) */
#emorow{display:flex;gap:6px;pointer-events:auto}
#log p{background:rgba(255,255,255,.72);border-radius:10px;padding:2px 10px;align-self:flex-start;max-width:100%;text-shadow:none}
#chatin{flex:1;min-width:0;font:700 20px "Dongle",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffffff0;color:var(--ink)}
.tv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tv-cell{background:#fff;border-radius:10px;padding:3px 6px;text-align:center;line-height:1.05}.tv-cell small{display:block;font-size:15px;color:var(--soft)}.tv-cell.on{background:#ffe0ec;outline:2px solid #ff8fb6}
.emo.send{width:auto;padding:0 12px;font:700 21px "Dongle",sans-serif;color:#fff;background:#ff8fb6;box-shadow:inset 0 -2px 0 #e06a96}
.emo{border:0;border-radius:12px;background:#fff;width:44px;min-height:44px;font-size:25px;box-shadow:inset 0 -2px 0 #f6e6ec}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(520px,calc(100vw - 20px));padding:14px 16px;z-index:13}
#talk h3{margin:0 0 4px;font-size:25px;color:var(--ink)}
#talk p{margin:0 0 10px;font-size:21px;white-space:pre-line}
#talk .sd{color:#9a8792;font-weight:400;font-style:italic}
/* ===== 이야기 대화창 ===== */

:root{--dlg-k:1}
#dlgDim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:13}
body.dlg-on #bar,body.dlg-on #sideBtns,body.dlg-on #swingBtn,body.dlg-on #chatbox,body.dlg-on #quest{visibility:hidden}
body.dlg-on #toast{z-index:16}
#dlg{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;min-height:140px;box-sizing:border-box;padding:34px 20px 20px;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;box-shadow:0 6px 0 #f0d3df,0 14px 30px rgba(90,40,64,.22);z-index:14;font-family:Maple,system-ui,sans-serif;color:#3a2c33;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation}
#dlg .dlg-who{position:absolute;top:-34px;left:16px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#dlg .dlg-who.right{left:auto;right:58px;flex-direction:row-reverse}
#dlg .dlg-who.off{visibility:hidden}
#dlg .dlg-face{width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-sizing:content-box;background:#ffe8f1;box-shadow:0 3px 8px rgba(90,40,64,.18);object-fit:cover}
#dlg .dlg-name{margin-bottom:12px;background:var(--nc,#d0457a);color:#fff;font-weight:800;font-size:16px;line-height:1;padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
#dlg .dlg-heart{margin-bottom:15px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#c2456f}
#dlg .dlg-heart em{display:block;width:34px;height:6px;border-radius:3px;background:#f6dbe6;overflow:hidden}#dlg .dlg-heart em s{display:block;height:100%;background:#ff7aa8;text-decoration:none}
#dlg .dlg-who.right .dlg-heart{display:none}
#dlg .dlg-logbtn{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid #f3d6e2;background:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#dlg .dlg-body{position:relative;min-height:calc(18px*var(--dlg-k)*1.6*2)}
#dlg .dlg-text{margin:0;font-size:calc(18px*var(--dlg-k));line-height:1.6;font-weight:400;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;padding-right:34px}
#dlg .dlg-text.narr{font-size:calc(15px*var(--dlg-k));color:#7a6670;font-weight:400}
#dlg .dlg-text.narr::before{content:'✦ ';color:#e79bbb}
#dlg .dlg-more{position:absolute;right:0;bottom:2px;font-size:13px;color:#e07aa3;animation:dlgBob 1.1s ease-in-out infinite}
@keyframes dlgBob{50%{transform:translateY(4px)}}
#dlg .dlg-choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dlg .dlg-choices button{height:48px;width:100%;border:2px solid #f3d6e2;border-radius:16px;background:#fff0f6;color:#3a2c33;font:400 calc(16px*var(--dlg-k)) Maple,system-ui,sans-serif;text-align:left;padding:0 16px;box-shadow:0 3px 0 #f0d3df;cursor:pointer}
#dlg .dlg-choices button:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3df}
#dlg .dlg-hint{margin:10px 0 0;font-size:13px;color:#9a8792}
#dlg .dlg-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#dlg .dlg-acts button{border:0;border-radius:999px;background:#ffe3ee;color:#5a3a4a;font:600 14px Maple,system-ui,sans-serif;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #f2c9d9}
#dlg .dlg-acts button.ghost{background:#fff;border:2px solid #f3d6e2;box-shadow:none}
#dlg .dlg-acts img{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
#dlg .dlg-pop{position:absolute;top:-58px;left:92px;background:#fff;border:2px solid #ffc2d7;color:#d0457a;font:800 15px Maple,system-ui,sans-serif;padding:4px 10px;border-radius:999px;opacity:0;pointer-events:none}
#dlg .dlg-pop.on{animation:dlgPop 1.8s ease-out forwards}
@keyframes dlgPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#dlgCard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;padding:18px 28px;text-align:center;box-shadow:0 6px 0 #f0d3df,0 16px 34px rgba(90,40,64,.25);font-family:Maple,system-ui,sans-serif;animation:dlgCard 1.5s ease forwards;pointer-events:none;max-width:calc(100vw - 48px)}
#dlgCard small{display:block;font-size:14px;color:#9a8792;font-weight:600}#dlgCard b{display:block;margin-top:4px;font-size:22px;color:#3a2c33;font-weight:800}
@keyframes dlgCard{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#dlgLog{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;z-index:17;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;display:flex;flex-direction:column;font-family:Maple,system-ui,sans-serif;color:#3a2c33;box-shadow:0 14px 30px rgba(90,40,64,.25)}
#dlgLog .dl-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:2px solid #f6e3eb}#dlgLog .dl-head b{font-size:17px;margin-right:auto;white-space:nowrap}#dlgLog .dl-head span{white-space:nowrap}#dlgLog .dl-head{gap:5px}
#dlgLog .dl-head button{border:2px solid #f3d6e2;background:#fff;border-radius:999px;padding:4px 9px;font-size:14px;font-weight:600;font-family:inherit;color:#5a3a4a;cursor:pointer;white-space:nowrap;line-height:1.2}#dlgLog .dl-head button.on{background:#ffe3ee}
#dlgLog .dl-list{overflow:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#dlgLog .dl-row{font-size:calc(15px*var(--dlg-k));line-height:1.55}#dlgLog .dl-row b{display:block;font-size:13px;color:var(--nc,#d0457a)}#dlgLog .dl-row.narr{color:#7a6670}#dlgLog .dl-row.narr::before{content:'✦ ';color:#e79bbb}#dlgLog .dl-row.player{text-align:right}
#talk #talkNote{font-size:18px;color:var(--soft);margin-top:-6px}
#talk .act{flex-wrap:wrap}
#talk .act.choices{flex-direction:column;align-items:stretch}
.btn.choice{background:#fff;color:var(--ink);text-align:left;box-shadow:inset 0 -3px 0 #f6e6ec,0 0 0 2px #fbe3ea}
.btn.choice::before{content:'▸ ';color:var(--pinkd)}
.mini{border:0;border-radius:10px;background:var(--pink);color:var(--ink);font-size:18px;padding:2px 10px;box-shadow:inset 0 -2px 0 #f2c3d3}
#npcPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 40px));max-height:min(76vh,calc(100% - 120px));overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;border-radius:20px}
#dim{display:none;position:fixed;inset:0;background:rgba(60,30,50,.22);z-index:9}
body:has(#npcPanel:not([hidden])) #dim,body:has(#mapPanel:not([hidden])) #dim{display:block}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.np-head b{font-size:1.15em}
.np{border:0;background:#fff;border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px;box-shadow:inset 0 -2px 0 #f6e6ec}
.np-name{font-size:20px}.np-name small{color:var(--soft);font-size:16px}
.np-place{font-size:16px;color:var(--soft);text-align:right}
.np-h{color:#f08aa8;font-size:16px;letter-spacing:1px}
.np-day{font-size:16px;color:var(--soft);text-align:right}

  #stats{left:10px;right:10px;width:auto}

  #quest b{display:inline;font-size:13px;flex:none}

  #chatbox{width:calc(100vw - 20px - 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}

  #chatin{min-width:0}
  #toast{top:calc(env(safe-area-inset-top,0px) + 100px)}

  #bar div{width:44px;height:44px}
  #fishGame{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

// 클레이 질감: 블러 그림자 대신 (1) 바닥에 붙은 접촉 그림자 (2) 매트한 몸통 그라데이션 (3) 위쪽 가장자리 림 라이트 (4) 아래 가장자리 어두운 음영 (5) 고운 입자
let grainCanvas = null;
function grainPattern(ctx){
  if (ctx.__grain) return ctx.__grain;
  if (!grainCanvas){
    grainCanvas = document.createElement('canvas'); grainCanvas.width = grainCanvas.height = 96;
    const g = grainCanvas.getContext('2d'), img = g.createImageData(96, 96), d = img.data;
    let seed = 7; for (let i=0;i<d.length;i+=4){ seed = (seed*1103515245 + 12345) & 0x7fffffff; const v = seed % 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    g.putImageData(img, 0, 0);
  }
  return ctx.__grain = ctx.createPattern(grainCanvas, 'repeat');
}
function mixHex(a, b, k){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16); const f=(x,y)=>Math.round(x+(y-x)*k); return '#'+[f(A>>16,B>>16),f(A>>8&255,B>>8&255),f(A&255,B&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
const toHex = col => col.startsWith('#') ? (col.length===4 ? '#'+[...col.slice(1)].map(c=>c+c).join('') : col.slice(0,7)) : (()=>{ const m = col.match(/\d+/g); return m ? '#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('') : '#cccccc'; })();
function painter(ctx){
  function paint(path, key, [cx,cy,r]){
    const col = toHex(P[key] || key), big = r >= 6, huge = r > 60, k = huge ? .35 : 1; // 큰 바닥 모양은 효과를 약하게
    ctx.save();
    if (big){ // 접촉 그림자: 같은 모양을 살짝 아래로 어둡게
      ctx.save(); ctx.translate(Math.min(2.5, r*.08), Math.min(5, Math.max(1.2, r*.16))); ctx.globalAlpha = r > 60 ? .08 : .16; path(); ctx.fillStyle = '#5a2e48'; ctx.fill(); ctx.restore();
    }
    const g = ctx.createRadialGradient(cx-r*.38, cy-r*.42, r*.08, cx, cy, r*1.18);
    g.addColorStop(0, mixHex(col, '#fff7ef', .42*k)); g.addColorStop(.5, col); g.addColorStop(1, mixHex(col, '#4a2a40', .26*k));
    path(); ctx.fillStyle = g; ctx.fill();
    if (big){
      path(); ctx.clip();
      // 아래 가장자리 음영 (덩어리감)
      const ao = ctx.createRadialGradient(cx+r*.15, cy+r*.35, r*.55, cx+r*.15, cy+r*.35, r*1.15);
      ao.addColorStop(0, 'rgba(70,30,60,0)'); ao.addColorStop(1, `rgba(70,30,60,${.28*k})`);
      ctx.fillStyle = ao; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 위쪽 림 라이트
      const rim = ctx.createRadialGradient(cx-r*.25, cy-r*.3, r*.78, cx-r*.25, cy-r*.3, r*1.08);
      rim.addColorStop(0, 'rgba(255,250,245,0)'); rim.addColorStop(.75, `rgba(255,250,245,${.42*k})`); rim.addColorStop(1, 'rgba(255,250,245,0)');
      ctx.fillStyle = rim; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 입자
      if (r >= 9){ ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = grainPattern(ctx); ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6); }
    }
    ctx.restore();
  }
  return { ctx,
    circle:(x,y,r,k)=>paint(()=>{ctx.beginPath();ctx.arc(x,y,r,0,7);},k,[x,y,r]),
    ell:(x,y,rx,ry,k)=>paint(()=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);},k,[x,y,Math.max(rx,ry)]),
    rr:(x,y,w,h,r,k)=>paint(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);},k,[x+w/2,y+h/2,Math.max(w,h)/2]),
    tri:(pts,k)=>paint(()=>{ctx.beginPath();ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1]);ctx.lineTo(...pts[2]);ctx.closePath();},k,[pts[1][0],pts[1][1]+6,8]),
    dot:(x,y,r,k,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=P[k]||k;ctx.fill();ctx.restore();},
    shape:(fn,k,box)=>paint(fn,k,box||[0,0,12]),
    stitch:(fn,k='stitch',a=.85)=>{ctx.save();ctx.globalAlpha=a;ctx.setLineDash([2,1.6]);ctx.lineWidth=.9;ctx.strokeStyle=P[k]||k;ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
    line:(fn,k,w=1)=>{ctx.save();ctx.strokeStyle=P[k]||k;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
  };
}

// ===== 스프라이트 캐시: 캐릭터는 자세별로 한 번만 그리고, 그 뒤로는 그림을 붙여 넣어요 (끊김 방지) =====
const spriteCache = new Map(), SPRITE_MAX = 420, TAU = Math.PI*2;
function sprite(key, w, h, ox, oy, drawFn){
  let sp = spriteCache.get(key);
  if (!sp){
    const sc = Math.min(3, Math.max(1, Math.round(view.dpr*view.zoom*2)/2));
    const c = document.createElement('canvas'); c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const x = c.getContext('2d'); x.setTransform(sc,0,0,sc,ox*sc,oy*sc);
    drawFn(painter(x));
    sp = {c, sc, ox, oy};
    if (spriteCache.size >= SPRITE_MAX) spriteCache.delete(spriteCache.keys().next().value);
    spriteCache.set(key, sp);
  }
  return sp;
}
const qphase = (ph, n) => Math.round((((ph % TAU) + TAU) % TAU) / TAU * n) % n;
// 플레이어: 걷기 8 단계, 서 있기 4 단계. 매트 클레이 페인터로 그려요
function drawPlayer(c, x, y, L, dir, t, walk, s=1, expr='dot'){
  if (!L || !('top' in L) && !L.set) L = CH.migrateLook(L);
  const ph = t*8 + x*.37, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'p|'+JSON.stringify(L)+'|'+dir+'|'+(walk?'w':'i')+q+'|'+expr+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/8 : q/4*TAU/2;
  const B = CH.FIG_BOX;
  const sp = sprite(key, B.w, B.h, B.ox, B.oy, d=>CH.figure(CH.mattePainter(d.ctx), L, dir, t2, walk, expr));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function myExpr(){ if (prayUntil && performance.now() < prayUntil) return 'pray'; return (me && me.look && me.look.expr) || 'dot'; }
// 동물 주민: 걷기 8 단계, 서 있기 4 단계
function drawCritter(c, x, y, v, t, walk, s=1, flip=false){
  if (v && v.a1) return drawPlayer(c, x, y, v.a1, walk ? (flip ? 'left' : 'right') : 'down', t, walk, s, 'dot');
  if (flip){ c.save(); c.translate(x, 0); c.scale(-1, 1); drawCritter(c, 0, y, v, t, walk, s, false); c.restore(); return; }
  const ph = t*7 + x*.3, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'c|'+JSON.stringify(v)+'|'+(walk?'w':'i')+q+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/7 : q/4*TAU/2;
  const sp = sprite(key, 80, 100, 40, 88, d=>critter(d, 0, 0, v, t2, walk, 1));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function blob(d, x, y, fabric, acc, t){
  const c=d.ctx, bob=Math.abs(Math.sin(t*2.5+x))*1.5;
  c.save(); c.translate(x,y);
  d.dot(0,2,11,'rgba(0,0,0,.13)'); c.translate(0,-bob);
  d.ell(-5,1,4,2.6,shade(fabric,-.12)); d.ell(5,1,4,2.6,shade(fabric,-.12));
  d.ell(0,-13,13,13,fabric); d.ell(-14,-11,3.2,4.5,fabric); d.ell(14,-11,3.2,4.5,fabric);
  d.stitch(c=>{c.moveTo(0,-24.5);c.quadraticCurveTo(2,-20,0,-16);});
  for (const ex of [-4.5,4.5]){ d.dot(ex,-14,2.4,'eye'); d.dot(ex-.7,-14.5,.5,'#fff'); d.dot(ex+.7,-13.5,.5,'#fff'); }
  d.dot(-7.5,-10,2.3,'blush',.8); d.dot(7.5,-10,2.3,'blush',.8);
  if (acc==='apron') d.rr(-6,-9,12,8,3,'#ffffff');
  if (acc==='cap'){ d.ell(0,-25,10,4.5,'#5fb3ff'); d.ell(6,-23,7,2,'#4a9be8'); }
  c.restore();
}

const TORI_PATH = [[1180,912],[880,912],[880,620],[560,560],[880,620],[1240,560],[880,620],[880,912]].map(([x,y])=>[zk(x), zk(y)]);
const TORI_SEGS = TORI_PATH.map((a,i)=>{ const b = TORI_PATH[(i+1)%TORI_PATH.length]; return {a, b, walk:Math.hypot(b[0]-a[0], b[1]-a[1])/60*1000}; });
const TORI_TOTAL = TORI_SEGS.reduce((s,g)=>s+g.walk+3000, 0);
function toriPos(now){
  let t = now % TORI_TOTAL;
  for (const g of TORI_SEGS){
    if (t < 3000) return {x:g.a[0], y:g.a[1], mv:false, dx:0};
    t -= 3000;
    if (t < g.walk){ const k = t/g.walk; return {x:g.a[0]+(g.b[0]-g.a[0])*k, y:g.a[1]+(g.b[1]-g.a[1])*k, mv:true, dx:g.b[0]-g.a[0]}; }
    t -= g.walk;
  }
  return {x:TORI_PATH[0][0], y:TORI_PATH[0][1], mv:false, dx:0};
}

const NPC_RANGE = {momo:55, dandan:55, mongsil:55, bori:60, olly:60, toto:70, pengpeng:80, dodo:70, hana:110, bami:80, kongi:120};
const WANDER_MS = 7000, WANDER_PAUSE = 2800;
function wanderSpot(n, k){
  const h = hash(n.id + '|' + k), r = (NPC_RANGE[n.id] || 70) * (0.35 + (h % 1000) / 1000 * 0.65), a = ((h >>> 10) % 6283) / 1000;
  const x = n.home[0] + Math.cos(a)*r, y = n.home[1] + Math.sin(a)*r*0.6; // 위아래로는 조금만
  return blocked(x, y) ? {x:n.home[0], y:n.home[1]} : {x, y};
}
function wanderPos(n, now){
  const k = Math.floor(now / WANDER_MS), t = now - k*WANDER_MS, a = wanderSpot(n, k-1), b = wanderSpot(n, k);
  if (t < WANDER_PAUSE) return {x:a.x, y:a.y, mv:false, dx:0};
  const u = (t - WANDER_PAUSE) / (WANDER_MS - WANDER_PAUSE), e = u*u*(3-2*u);
  return {x:a.x + (b.x-a.x)*e, y:a.y + (b.y-a.y)*e, mv:Math.hypot(b.x-a.x, b.y-a.y) > 4, dx:b.x-a.x};
}

function drawFence(d, L){
  const c = d.ctx, x0 = L.x - FENCE.w/2, x1 = L.x + FENCE.w/2, y0 = L.y + FENCE.top, y1 = y0 + FENCE.h, gate = 18;
  c.save(); c.globalAlpha = .9; c.fillStyle = 'rgba(176,122,85,.10)'; c.beginPath(); c.roundRect(x0, y0, FENCE.w, FENCE.h, 10); c.fill(); c.restore();
  const rail = (ax, ay, bx, by) => { d.line(k=>{ k.moveTo(ax, ay-4); k.lineTo(bx, by-4); k.moveTo(ax, ay+1); k.lineTo(bx, by+1); }, '#d9a877', 2.2, 1); };
  rail(x0, y0, L.x-gate, y0); rail(L.x+gate, y0, x1, y0); rail(x0, y1, x1, y1); rail(x0, y0, x0, y1); rail(x1, y0, x1, y1);
  const post = (x, y) => { d.rr(x-2.6, y-9, 5.2, 11, 2, '#c98e5b'); d.circle(x, y-9, 2.8, '#e8c39e'); };
  for (let x = x0; x <= L.x-gate+0.1; x += (L.x-gate-x0)/3) post(x, y0); for (let x = L.x+gate; x <= x1+0.1; x += (x1-L.x-gate)/3) post(x, y0);

}

function inCorridor(x, y){
  const z = Z(), ex = z.exits;
  if (ex.n && y < M+10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.s && y > z.H-M-10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.w && x < M+10 && Math.abs(y-z.H/2) < GAP) return true;
  if (ex.e && x > z.W-M-10 && Math.abs(y-z.H/2) < GAP) return true;
  return false;
}
function blocked(x,y){
  const z = Z();
  if (x<4||y<4||x>z.W-4||y>z.H-4) return true;
  if ((x<M||x>z.W-M||y<M||y>z.H-M) && !inCorridor(x,y)) return true;
  if (z.theme==='room' && y < 250) return true;
  if (z.floors){ const f = floorOf(y, z.floors), ly = y - floorTop(f, z.floors); if (ly < 262 || (ly > FLOOR_H - 8 && f !== 1)) return true; } // 층 벽 · 층 사이 어둠
  for (const e of obstacles.ells) if (((x-e.x)/(e.rx+6))**2 + ((y-e.y)/(e.ry+6))**2 < 1) return true;

  for (const r of obstacles.rects) if (x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h) return true;
  return false;
}
// 구역 가장자리 길 끝에 닿으면 다음 구역으로 넘어가요
function checkExit(){
  const z = Z(), ex = z.exits;
  let side = null;
  if (ex.n && pos.y < 30) side = 'n'; else if (ex.s && pos.y > z.H-30) side = 's';
  else if (ex.w && pos.x < 30) side = 'w'; else if (ex.e && pos.x > z.W-30) side = 'e';
  if (side && z.dark){ const [dx, dy] = darkDoorOf(z.dark); return enterZone(darkDoorZone(z.dark), null, dx, dy + 44); }
  if (side && z.house){ const p = z.house===uid ? me : players[z.house], L = LOTS[(p && p.lot!=null) ? p.lot : me.lot]; return enterZone('home', null, L.x, L.y + 24); }
  if (side) enterZone(ex[side], {n:'s', s:'n', w:'e', e:'w'}[side]);
}
function freeSpot(x, y){
  const z = Z(); x = Math.max(M+30, Math.min(z.W-M-30, x)); y = Math.max(M+30, Math.min(z.H-M-30, y));
  for (let r=0; r<900; r+=24) for (let a=0; a<6.28; a+=r ? 24/r : 7){ const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r; if (!blocked(nx, ny)) return [nx, ny]; }
  return [z.W/2, z.H/2];
}
let fadeT = 0;
function enterZone(id, from, x, y){
  if (!zoneOk(id)) id = 'home';
  decorating = null;
  if (me && obStep == null && zoneId && zoneId !== id) stat('zoneMoves');
  if (me){ const v = (me.visited||'home').split(',').filter(Boolean); const zid = id.includes(':') ? id.split(':')[0] : id; if (!v.includes(zid)){ v.push(zid); me.visited = v.join(','); syncStats(); } }
  zoneId = id; const z = Z(); target = null; staticSig = ''; if (jukeOn && z.house !== uid) jukeStop(); if (z.depth && me && !admin) setTimeout(()=>toast(`${z.name} · 추천 레벨 ${[0,15,25,35,45][z.depth]} 이상 · 여럿이 같이 와요`), 900);
  if (x!=null){ pos.x = x; pos.y = y; }
  else if (from==='n'){ pos.x = z.W/2; pos.y = M+40; }
  else if (from==='s'){ pos.x = z.W/2; pos.y = z.H-M-30; }
  else if (from==='w'){ pos.x = M+40; pos.y = z.H/2; }
  else if (from==='e'){ pos.x = z.W-M-40; pos.y = z.H/2; }
  rebuildObstacles(); fadeT = performance.now();
  if (blocked(pos.x, pos.y)){ const [fx_, fy_] = freeSpot(pos.x, pos.y); pos.x = fx_; pos.y = fy_; } // 예전 자리가 막혀 있거나 구역 밖이면 가까운 빈자리로
  if (me){ chatZone(); renderDecor(); me.zone = id.startsWith('house:') ? 'home' : id.startsWith('dark:') ? (darkDoorZone(id.slice(5)) || 'village') : id; me.zx = Math.round(id.startsWith('dark:') ? darkDoorOf(id.slice(5))[0] : pos.x); me.zy = Math.round(id.startsWith('dark:') ? darkDoorOf(id.slice(5))[1] + 40 : pos.y); saveMe(); renderHud(); if (!$('mapPanel').hidden) renderMap(); }
  toast(`${z.name}`);
}

  const lk = CH.migrateLook(p.look), worn = Object.entries(lk.cc||{}).filter(([,c])=>c).map(([slot,c])=>{ const id = slot==='set' ? lk.set : lk[slot]; return id && id!=='none' ? id+'#'+c : null; }).filter(Boolean);
  const closet = [...new Set([...CH.FREE, ...(p.closet||[]), ...(p.hats ? p.hats.split(',') : []), ...CH.lookItems(lk), ...worn])].filter(k=>k.split('#')[0] !== 'none' && CH.ITEM(k.split('#')[0]));
  return { ...p, look:CH.migrateLook(p.look), closet, rel:p.rel||{}, inv,
    gardens:Array.from({length:Math.max(2, Math.min(PLOT_MAX, p.plots||2))}, (_,i)=>i).map(i=>{ const s = g[i]; if (!s) return null; return {crop: s.stage>=0 ? {type:s.type||'c01', stage:s.stage, wateredAt:s.wateredAt||null} : null}; }) };
}

// ===== 배경 음악: 들어오면 무한 반복. 메뉴에서 끄고 켤 수 있어요 (이 기기에 기억) =====
// public/audio/bgm.mp3 가 있으면 그 곡을 반복 재생하고, 없으면 섬 오르골 곡(직접 만든 곡)을 브라우저에서 연주해요.
const BGM_FILE = 'audio/bgm.mp3', BGM_VOL = .35;
let bgmAudio = null, bgmCtx = null, bgmGain = null, bgmTimer = 0, bgmNext = 0, bgmStep = 0, bgmUseSynth = false, bgmStarted = false;
const bgmOn = () => { try { return localStorage.getItem('pinky-bgm') !== 'off'; } catch(e){ return true; } };
function bgmSet(on){ try { localStorage.setItem('pinky-bgm', on ? 'on' : 'off'); } catch(e){} if (on) bgmStart(); else bgmStop(); toast(on ? '배경 음악을 켰어요' : '배경 음악을 껐어요'); }
// 오르골 곡: 다장조 16 마디, 1 박 = 0.5 초. [음높이(반음, 0 = 도), 길이(박)] · null 은 쉼표
const BGM_MEL = [[4,1],[7,1],[12,1.5],[11,.5],[9,1],[7,1],[9,2],[5,1],[9,1],[12,1],[14,1],[12,2],[11,1],[7,1],[4,1],[7,1],[9,1.5],[7,.5],[5,1],[4,1],[2,3],[null,1],
  [4,1],[7,1],[12,1.5],[14,.5],[16,1],[14,1],[12,2],[9,1],[12,1],[17,1],[16,1],[14,2],[12,1],[11,1],[9,1],[11,1],[12,1.5],[7,.5],[4,1],[2,1],[0,3],[null,1]];
const BGM_BASS = [0,0,5,5,7,7,0,0, 0,0,5,5,7,7,0,0]; // 마디마다 2 박씩 (반음, 도 기준)
const BGM_BEAT = .5;
function bgmNote(f, at, dur, vol, type){ const o = bgmCtx.createOscillator(), g = bgmCtx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + .015); g.gain.exponentialRampToValueAtTime(.0005, at + dur); o.connect(g); g.connect(bgmGain); o.start(at); o.stop(at + dur + .05); }
const hz = semi => 261.63 * Math.pow(2, semi/12);
function bgmSchedule(){
  const beats = BGM_MEL.reduce((n,[,b])=>n+b, 0), loopLen = beats * BGM_BEAT;
  while (bgmNext < bgmCtx.currentTime + 1.2){
    const t0 = bgmNext; let t = t0;
    for (const [n, b] of BGM_MEL){ if (n!=null){ bgmNote(hz(n+12), t, Math.max(.6, b*BGM_BEAT*1.6), .16, 'sine'); bgmNote(hz(n+24), t, .35, .03, 'triangle'); } t += b*BGM_BEAT; }
    for (let i=0; i*4 < beats; i++){ const n = BGM_BASS[i % BGM_BASS.length], at = t0 + i*4*BGM_BEAT; bgmNote(hz(n-12), at, 1.9, .07, 'triangle'); bgmNote(hz(n-5), at + 2*BGM_BEAT, 1.2, .035, 'sine'); }
    bgmNext = t0 + loopLen;
  }
}
function bgmStart(){
  if (!bgmOn() || document.visibilityState==='hidden' || jukeOn) return;
  bgmStarted = true;
  if (!bgmUseSynth){
    if (!bgmAudio){ bgmAudio = new Audio(BGM_FILE); bgmAudio.loop = true; bgmAudio.volume = BGM_VOL; bgmAudio.addEventListener('error', ()=>{ bgmUseSynth = true; bgmAudio = null; bgmStart(); }, {once:true}); }
    bgmAudio.play().catch(()=>{}); return;
  }
  try {
    if (!bgmCtx){ bgmCtx = new (window.AudioContext || window.webkitAudioContext)(); bgmGain = bgmCtx.createGain(); bgmGain.gain.value = BGM_VOL; bgmGain.connect(bgmCtx.destination); }
    bgmCtx.resume(); if (!bgmTimer){ bgmNext = Math.max(bgmNext, bgmCtx.currentTime + .1); bgmSchedule(); bgmTimer = setInterval(bgmSchedule, 400); }
  } catch(e){}
}
function bgmStop(){ if (bgmAudio) bgmAudio.pause(); if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = 0; } if (bgmCtx) bgmCtx.suspend().catch(()=>{}); }
// 브라우저는 처음 화면을 누르기 전엔 소리를 못 내요. 첫 터치·키 입력 때 시작해요

// ===== 주크박스: 집의 주크박스를 누르면 섬 노래(jukebox.js) 중 하나를 골라 무한 반복. 듣는 동안 배경 음악은 쉬고, 집 밖으로 나가면 꺼져요 =====

function dlgText(t){
  t = fillName(String(t||'')).replace(/[.…]{2,}[,.]?/g, '……').replace(/……(\s*……)+/g, '……');
  return t.replace(/(^|[\s"'“‘(~])([가-힣]{1,2}), (?=([가-힣]))/g, (m, a, b, c) => cho(b[0]) === cho(c) ? a + b + PAUSE + ' ' : m);

function toBeats(pages, who='npc'){
  const out = [];
  for (const pg of pages){ if (!pg) continue; let buf = [];
    const flush = () => { if (buf.length){ out.push({who, text:buf.join('\n')}); buf = []; } };
    for (const line of dlgText(pg).split('\n')) for (const part of line.split(/(\([^()]*\))/)){
      const p = part.trim(); if (!p) continue;
      if (/^\(.*\)$/.test(p)){ flush(); out.push({who:'narr', text:p.slice(1, -1).trim()}); }
      else { if (buf.length && (buf.join('').length + p.length > 52 || buf.length >= 3)) flush(); buf.push(p); }
    }
    flush();
  }
  return out;
}
function exprOf(t, who){

  if (/헤헤|하하|호호|허허|좋아|최고|고마|기뻐|신난|냠|웃/.test(t)) return 'happy';

}

// ===== 주민 이야기: 하트마다 한 화씩 열려요 =====
// ♥0 1화 → ♥1 2화 → ♥2 3화 → ♥3 4화 → ♥4 스토리 → ♥5 → ♥6 → ♥7 스토리 → ♥8 → ♥9 → ♥10 스토리 → 그 뒤 이야기 2 화 (마지막 화는 다음 날)

const CATS = {seed:'seeds', crop:'crops', fish:'fish', ore:'ores', loot:'loot', forage:'forage', dish:'dishes', furn:'furn', wear:'wear', umb:'umbrellas', wall:'walls', floor:'floors', star:'stars'};
function bagOf(cat){ me.inv[CATS[cat]] = me.inv[CATS[cat]] || {}; return me.inv[CATS[cat]]; }
function invCount(key){ const [cat, id] = key.split(':'); return bagOf(cat)[id] || 0; }
// 가방: 같은 물건은 한 칸에 겹쳐 쌓여요. 한 칸 최대 500 개 — 넘치는 만큼은 버려지고 알려 줘요
const STACK_MAX = 500;
let stackToastT = 0;
function invAdd(key, n=1){
  const [cat, id] = key.split(':'); const b = bagOf(cat); const cur = b[id]||0; let next = cur + n;
  if (next > STACK_MAX){ const over = next - STACK_MAX; next = STACK_MAX; const now = performance.now(); if (now - stackToastT > 1500){ stackToastT = now; toast(`${itemName(key)}은(는) 500 개까지만 쌓여요. ${over} 개는 가방에 못 넣었어요`); } }
  b[id] = next; if (b[id] <= 0) delete b[id];
  if (me?.quick && me.quick.includes(key)) queueMicrotask(quickCounts);
  return next - cur;
}
const invRoom = key => STACK_MAX - invCount(key);
function itemName(key){
  const [cat, id] = key.split(':');
  if (cat==='fish') return fishName(id);
  if (cat==='crop') return CROPS[id]?.name || '작물';
  if (cat==='seed') return (CROPS[id]?.name || '') + ' 씨앗';
  if (cat==='ore') return ORES[id]?.name || '광석';
  if (cat==='loot') return MONSTERS[id]?.drop || '전리품';
  if (cat==='dish') return DISHES[id]?.name || '요리';
  if (cat==='furn') return FURN[id]?.name || '가구';
  if (cat==='forage') return FG[id]?.name || '채집물';
  if (cat==='wear'){ const [wid, c] = id.split(/[~#]/), it = CH.ITEM(wid); return (it?.name || '옷') + (+c ? ` (${+c+1} 번 색)` : ''); }
  if (cat==='umb') return (UMB[id]?.name || '') + ' 우산';
  if (cat==='wall') return (WALLS[id]?.name || '') + ' 벽지';
  if (cat==='floor') return (FLOORS[id]?.name || '') + ' 바닥';
  if (cat==='star') return '별 조각';

}
function itemPrice(key){
  const [cat, id] = key.split(':');
  if (cat==='fish') return fishPrice(id);
  if (cat==='crop') return CROPS[id]?.sell || 0;
  if (cat==='seed') return Math.round((CROPS[id]?.seed || 0) / 2);
  if (cat==='ore') return ORES[id]?.price || 0;
  if (cat==='loot') return MONSTERS[id]?.dropPrice || 0;
  if (cat==='dish') return DISHES[id] ? dishPrice(id) : 0;
  if (cat==='furn') return FURN[id] ? Math.round(FURN[id].gold/2) : 0;
  if (cat==='forage') return FG[id]?.price || 0;
  if (cat==='wear') return Math.round((CH.ITEM(id.split(/[~#]/)[0])?.price || 0)/2);
  if (cat==='umb') return Math.round((UMB[id]?.price || 0)/2);
  if (cat==='wall' || cat==='floor') return Math.round(((cat==='wall' ? WALLS : FLOORS)[id]?.price || 0)/2);
  if (cat==='star') return STAR_PRICE;
  return 0;
}
function itemsOf(cat){ return Object.entries(bagOf(cat)).filter(([,n])=>n>0).map(([id,n])=>[cat+':'+id, n]); }
function sumValue(cat){ return itemsOf(cat).reduce((a,[k,n])=>a+itemPrice(k)*n, 0); }
function countOf(cat){ return itemsOf(cat).reduce((a,[,n])=>a+n, 0); }

function rollOre(zid){
  const mz = MINE_ZONES[zid];
  const list = Object.entries(ORES).filter(([,o])=>mz.tiers.includes(o.tier) && (mz.sea || !o.sea));
  const w = o => TIER_W[o.tier] * (o.sea ? 3 : 1) * (isRainbow() && o.tier >= 3 ? 2.5 : 1);
  const total = list.reduce((a,[,o])=>a+w(o),0);
  let r = Math.random()*total; for (const [id,o] of list){ if ((r -= w(o)) < 0) return id; } return list[0][0];
}

  const mz = MINE_ZONES[zoneId]; if (!mz) return [];

  const done = m && m.h === rockKey() ? m.done.split(',') : [];

const rockHits = {};

  if (rockHits[key] < 3){ toast(`바위를 캐는 중.... (${rockHits[key]}/3)`); return; }
  delete rockHits[key];
  const id = rollOre(zoneId), o = ORES[id], n = o.tier===1 ? 1 + Math.floor(Math.random()*3) : 1;
  invAdd('ore:'+id, n); setExpr(o.tier >= 4 ? 'sparkle' : 'happy', 2200); stat('oreMined', n); questEvent('mine', 'ore:'+id, n); gainExp(o.tier*2*n);

  me.mined[zoneId] = {h:rockKey(), done: (m && m.h===rockKey() ? m.done+',' : '') + r.i};
  me.odex = me.odex || {}; const first = !me.odex[id]; me.odex[id] = (me.odex[id]||0) + n;

  if (o.tier >= 5 && net && net.sendChat) net.sendChat(`(전설의 광석 ${o.name}을(를) 캤다!)`).catch(()=>{});
}

function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = seed || 1; return ()=>{ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

function errandsToday(){
  const r = seeded(hash(uid + ':' + today())), list = [];
  const crops = Object.keys(CROPS).filter(id=>CROPS[id].min <= 120), fish = Object.keys(FISH).filter(id=>FISH[id].weight >= 8), ores = Object.keys(ORES).filter(id=>ORES[id].tier<=2 && !ORES[id].sea), loot = Object.keys(MONSTERS).filter(id=>MONSTERS[id].zone==='forest');
  const pick = a => a[Math.floor(r()*a.length)];
  const kinds = ['crop','fish','ore','loot'];
  for (let i=0;i<3;i++){
    const k = kinds[Math.floor(r()*4)];
    if (k==='crop'){ const id = pick(crops); list.push({key:'crop:'+id, n:1+Math.floor(r()*3), label:CROPS[id].name}); }
    if (k==='fish'){ const id = pick(fish), st = r()<.3 ? 2 : 1; list.push({key:'fish:'+id, st, n:1, label:`${FISH[id].name} ${'★'.repeat(st)} 이상`}); }
    if (k==='ore'){ const id = pick(ores); list.push({key:'ore:'+id, n:1+Math.floor(r()*3), label:ORES[id].name}); }
    if (k==='loot'){ const id = pick(loot); list.push({key:'loot:'+id, n:1+Math.floor(r()*2), label:MONSTERS[id].drop}); }
  }
  return list.map((e,i)=>({...e, i, reward: 150 + Math.round(e.key.startsWith('fish:') ? fishPrice(e.key.slice(5)+'_'+e.st)*2.2 : itemPrice(e.key)*e.n*2.2)}));
}
function errandHave(e){
  if (e.key.startsWith('fish:')){ const id = e.key.slice(5); return itemsOf('fish').filter(([k])=>{ const p = parseFish(k.slice(5)); return p.id===id && p.st>=e.st; }).reduce((a,[,n])=>a+n,0) >= e.n; }
  return invCount(e.key) >= e.n;
}
function errandPanel(){
  const st = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
  openPanel('토리의 오늘의 심부름', errandsToday().map(e=>{
    const done = st.includes(String(e.i)), ok = errandHave(e);
    return `<button class="np" data-id="${e.i}" ${done||!ok?'style="opacity:.55"':''}><span class="np-name">${iconImg(e.key)}${e.label} ${e.n} 개 <small>가져다주기</small></span><span class="np-place">${done?'완료 ✓':ok?'전달하기':'아직 없어요'}</span><span class="np-day">보상 ${e.reward} G · 토리 호감도 +5</span></button>`;
  }).join('') + '<p class="mnote">심부름은 매일 바뀌어요.</p>', b=>{
    const e = errandsToday()[+b.dataset.id];
    const done = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
    if (done.includes(String(e.i))) return toast('이미 끝낸 심부름이에요');

    if (e.key.startsWith('fish:')){ let left = e.n; for (const [k,c] of itemsOf('fish')){ const p = parseFish(k.slice(5)); if (p.id!==e.key.slice(5) || p.st<e.st) continue; const t = Math.min(left,c); invAdd(k,-t); left -= t; if (!left) break; } }
    else invAdd(e.key, -e.n);

    saveMe(); renderHud(); toast(`심부름 완료! ${e.reward} G를 받았어요`); errandPanel();
  });
}

const MUSEUM_CAT = {f:'물고기', o:'광석', m:'몬스터 전리품'};

function onMuseum(v){ v = v || {}; museum = {f:v.f || {}, o:v.o || {}, m:v.m || {}}; museumSync();

function museumSet(k){ return new Set(((me.museum||{})[k]||'').split(',').filter(Boolean)); }
function museumTotal(){ return me ? ['f','o','m'].reduce((a,k)=>a+museumSet(k).size, 0) : 0; } // 내가 기증한 수
function museumShared(){ return ['f','o','m'].reduce((a,k)=>a+Object.keys(museum[k]).length, 0); } // 섬 전체
function museumName(cat, id){ return cat==='f' ? FISH[id]?.name : cat==='o' ? ORES[id]?.name : MONSTERS[id]?.drop; }
// 함께 쓰기 전에 혼자 기증해 둔 것은 비어 있는 칸이면 내 이름으로 올려요

  openPanel(`올리 박물관 · 섬 전체 ${shared}/${90 + Object.keys(MONSTERS).length}`, head + body);

const drops = Array.from({length:70}, (_,i)=>({x:Math.random(), y:Math.random(), s:.6+Math.random()*.6}));

// ===== 우산: 몽실이네 우산 가게에서 무늬를 사고 색은 마음대로 골라요. 골라 두면 비 올 때 바깥에서 저절로 펼쳐 써요 (다른 사람에게도 보여요) =====

const UMB_COLS = [['분홍','#ff9cc0'],['딸기','#ff6b7a'],['귤','#ffa94d'],['레몬','#ffd84d'],['풀잎','#9ad66b'],['하늘','#8cc8ff'],['라벤더','#b49bff'],['크림','#f6efe6']];

// 클레이 우산: 볼록한 지붕(그라데이션·가장자리 음영) + 동글동글 끝 구슬 + 홈 파인 살 + 나무 손잡이

  const col = UMB_COLS[ci|0][1], d = painter(c), light = ['#ffd84d','#f6efe6','#9ad66b'].includes(col), ink = light ? '#ff8fb6' : '#fff8f0';

  if (id==='u3') for (const k of [-.66, 0, .66]){ c.beginPath(); c.moveTo(cx + k*R*.15 - 4, cy-30); c.quadraticCurveTo(cx + k*R*.75 - 5, cy-14, cx + k*R - 5, cy+10); c.lineTo(cx + k*R + 5, cy+10); c.quadraticCurveTo(cx + k*R*.75 + 5, cy-14, cx + k*R*.15 + 4, cy-30); c.fill(); }

  if (id==='u5') for (const [dx,dy,k] of [[-18,-6,1],[0,-18,.9],[16,-4,1],[-4,2,.7],[24,-16,.6],[-26,-17,.6]]) { const hx2 = cx+dx, hy = cy+dy; c.beginPath(); c.moveTo(hx2, hy+4*k); c.bezierCurveTo(hx2-7*k, hy-1*k, hx2-4*k, hy-7*k, hx2, hy-3*k); c.bezierCurveTo(hx2+4*k, hy-7*k, hx2+7*k, hy-1*k, hx2, hy+4*k); c.fill(); }
  if (id==='u6') for (const [dx,dy,k] of [[-17,-5,1],[3,-17,.9],[18,-3,1],[-1,3,.6],[-26,-17,.55],[24,-18,.55]]) { c.beginPath(); for (let i=0;i<10;i++){ const r = (i%2 ? 2.3 : 5.4)*k, a = -Math.PI/2 + i*Math.PI/5; c.lineTo(cx+dx + Math.cos(a)*r, cy+dy + Math.sin(a)*r); } c.closePath(); c.fill(); }
  // 살 홈: 어두운 선 + 바로 옆 밝은 선
  c.globalAlpha = 1; for (const k of [-.5, 0, .5]) for (const [o, st] of [[0, 'rgba(90,40,70,.20)'], [1.2, 'rgba(255,255,255,.28)']]){ c.strokeStyle = st; c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx+o, cy-29); c.quadraticCurveTo(cx + k*R*.88 + o, cy-14, cx + k*R + o, cy+7); c.stroke(); }

const umbIcons = {};

// ===== 하루의 빛: 한국 시간 그대로. 해 질 녘(17~19 시)에 어두워지고, 밤에는 가로등·창문·등대가 켜져요 =====
function nightLevel(){ const d = new Date(Date.now() + serverOffset + 9*3600000), h = d.getUTCHours() + d.getUTCMinutes()/60;
  if (h >= 7 && h < 17) return 0; if (h >= 17 && h < 19) return (h-17)/2; if (h >= 5 && h < 7) return 1 - (h-5)/2; return 1; }
const dkLayer = document.createElement('canvas');
function lightsHere(){
  const z = Z(), L = [];
  for (const l of (z.lamps||[])) L.push([l.x, l.y-62, 130, true]);
  if (zoneId==='home') for (const p of Object.values(players)) if (p.lot!=null){ const H = LOTS[p.lot]; L.push([H.x, H.y-40, 80, false]); }
  for (const p of z.places) if (p.kind==='lighthouse') L.push([p.x, p.y-170, 220, true]); else if (p.kind==='house') L.push([p.x, p.y-40, 80, false]);
  if (!admin) L.push([pos.x, pos.y-24, 70, false]);
  for (const o of others.values()) if (o.z===zoneId) L.push([o.x, o.y-24, 55, false]);
  return L;
}
function drawNight(c, t){
  const z = Z(); if (z.theme==='room' || z.theme==='cave') return;
  const lv = nightLevel(); if (lv <= 0) return;
  const w = cv.width, h = cv.height, k = view.dpr*view.zoom, X = x => (x - view.cx)*k, Y = y => (y - view.cy)*k;
  if (dkLayer.width !== w || dkLayer.height !== h){ dkLayer.width = w; dkLayer.height = h; }
  const g = dkLayer.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation = 'source-over'; g.clearRect(0,0,w,h);
  const dusk = Math.max(0, 1 - Math.abs(lv - .45)*2.6); // 해 질 녘엔 살짝 노을빛
  g.fillStyle = `rgba(${Math.round(16 + 80*dusk)},${Math.round(18 + 14*dusk)},${Math.round(58 - 18*dusk)},${(.74*lv).toFixed(3)})`; g.fillRect(0,0,w,h);
  g.globalCompositeOperation = 'destination-out';
  const lights = lightsHere();
  for (const [x,y,r] of lights){ const R = r*k, gr = g.createRadialGradient(X(x), Y(y), 0, X(x), Y(y), R); gr.addColorStop(0,'rgba(0,0,0,.95)'); gr.addColorStop(.55,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(X(x), Y(y), R, 0, 7); g.fill(); }
  c.save(); c.setTransform(1,0,0,1,0,0); c.drawImage(dkLayer, 0, 0);
  // 불빛 자체의 따뜻한 빛
  c.globalCompositeOperation = 'lighter';
  for (const [x,y,r,lamp] of lights) if (lamp){ const R = r*.55*k, fl = .9 + Math.sin(t/300 + x)*.05, gr = c.createRadialGradient(X(x), Y(y), 0, X(x), Y(y), R); gr.addColorStop(0, `rgba(255,206,110,${(.32*lv*fl).toFixed(3)})`); gr.addColorStop(1,'rgba(255,190,90,0)'); c.fillStyle = gr; c.beginPath(); c.arc(X(x), Y(y), R, 0, 7); c.fill(); }
  c.restore();
}
function drawWeather(c, t){
  const z = Z(); if (z.theme==='cave' || z.theme==='room') return;
  const w = cv.width, h = cv.height;
  if (isSnow()){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle='rgba(235,242,255,.10)'; c.fillRect(0,0,w,h); c.fillStyle='rgba(255,255,255,.92)';
    for (const f of flakes){ const y = ((f.y + t/9000*f.s) % 1)*h, x = (f.x + Math.sin(t/1400 + f.p)*.015)*w; c.beginPath(); c.arc(x, y, f.r*view.dpr, 0, 7); c.fill(); } c.restore(); }
  if (wxNow()[2]==='cloud'){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle='rgba(120,120,140,.08)'; c.fillRect(0,0,w,h); c.restore(); }
  if (isRain()){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle='rgba(90,110,150,.12)'; c.fillRect(0,0,w,h); c.strokeStyle='rgba(220,235,255,.7)'; c.lineWidth=1.5*view.dpr;
    for (const d of drops){ const y = ((d.y + t/1500*d.s) % 1)*h, x = d.x*w; c.beginPath(); c.moveTo(x,y); c.lineTo(x-3*view.dpr,y+12*view.dpr); c.stroke(); } c.restore(); }
  if (isRainbow() && nightLevel() < .5){ c.save(); c.setTransform(1,0,0,1,0,0); c.globalAlpha=.18; ['#ff6b6b','#ffa14f','#ffd84f','#5cc46a','#5b8cff','#a77bff'].forEach((col,i)=>{ c.strokeStyle=col; c.lineWidth=8*view.dpr; c.beginPath(); c.arc(w*.5, h*1.1, h*.9-i*8*view.dpr, Math.PI, 0); c.stroke(); }); c.restore(); }
}

// ===== 토리 우체국 · 편지 =====
// 플레이어끼리 · 주민(NPC)에게 · 오투모에게 편지를 써요 (300 자). 플레이어끼리는 서로 답장하고, 주민과 오투모의 답장은 관리자가 써요.
// 받은 편지: letters/<받는 사람>. 주민은 'npc_<id>', 오투모는 'otumo'. 내가 보낸 편지 사본: lettersOut/<나>
const OTUMO = {key:'otumo', name:'오투모'};
const LETTER_MAX = 300;
let letters = {}, lettersOut = {}, letterSeen = null;
const letterWho = key => key===OTUMO.key ? OTUMO.name : key && key.startsWith('npc_') ? (NPC[key.slice(4)]?.name || '주민') : (players[key]?.nick || '');
const unreadLetters = () => Object.values(letters).filter(l=>l && !l.read).length;
function onLetters(v){
  const next = {}; for (const [id,l] of Object.entries(v||{})) if (l && typeof l.text==='string') next[id] = l;
  const fresh = Object.entries(next).filter(([id,l])=>!l.read && letterSeen && !letterSeen.has(id));
  letterSeen = new Set(Object.keys(next)); letters = next;
  if (!fresh.length && !onLetters.told){ const n = Object.values(next).filter(l=>!l.read).length; if (n){ onLetters.told = true; setTimeout(()=>{ addLog(`✉️ 읽지 않은 편지가 ${n} 통 있어요. 집 앞 우편함에서 읽어요`, true); toast(`읽지 않은 편지 ${n} 통 · 집 앞 우편함`); }, 2500); } } // 접속해 보니 와 있던 답장도 알려 줘요
  for (const [,l] of fresh){ addLog(`✉️ ${String(l.nick || letterWho(l.from) || '누군가').slice(0,10)} 님에게서 편지가 왔어요. 집 앞 우편함이나 토리 우체국에서 읽어요`, true); toast('우편함에 편지가 왔어요 · 집 앞 우편함'); }
  if (!$('npcPanel').hidden && $('npcPanel').dataset.post) postPanel(postView);
}
function onLettersOut(v){ lettersOut = {}; for (const [id,l] of Object.entries(v||{})) if (l && typeof l.text==='string') lettersOut[id] = l; if (!$('npcPanel').hidden && $('npcPanel').dataset.post && postView.tab==='out') postPanel(postView); }
const dateOf = at => { const d = new Date((at||0) + 9*3600000); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
let postView = {tab:'in'};
function postPanel(v){
  postView = v || {tab:'in'}; const tab = postView.tab;
  const inList = Object.entries(letters).sort((a,b)=>(b[1].at||0)-(a[1].at||0)), outList = Object.entries(lettersOut).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  const tabs = `<div class="inv-tabs"><button class="itab${tab==='in'||tab==='read' ? ' on' : ''}" data-pt="in">받은 편지${unreadLetters() ? ` ${unreadLetters()}` : ''}</button><button class="itab${tab==='write' ? ' on' : ''}" data-pt="write">편지 쓰기</button><button class="itab${tab==='out' ? ' on' : ''}" data-pt="out">보낸 편지</button></div>`;

  let body = '';
  if (tab==='in') body = inList.length ? inList.map(x=>row(x, false)).join('') : '<p class="mnote">아직 받은 편지가 없어요.</p>';
  if (tab==='out') body = outList.length ? outList.map(x=>row(x, true)).join('') : '<p class="mnote">아직 보낸 편지가 없어요.</p>';
  if (tab==='read'){ const l = letters[postView.id];
    if (!l) return postPanel({tab:'in'});
    const canReply = l.from && l.from !== uid && (l.from===OTUMO.key || l.from.startsWith('npc_') || players[l.from]);
    body = `<div class="letter-paper"><small>${dateOf(l.at)} · ${esc(String(l.nick || letterWho(l.from) || '누군가').slice(0,10))} 님이 보낸 편지</small><p>${esc(l.text)}</p></div>
      <div class="idt-acts">${canReply ? '<button class="btn" data-pa="reply">답장 쓰기</button>' : ''}<button class="btn ghost" data-pa="del">지우기</button><button class="btn ghost" data-pa="back">목록</button></div>`; }

    body = `<p class="mnote" style="margin:0 2px">섬 친구, 동물 주민, 오투모에게 편지를 보낼 수 있어요. 주민과 오투모의 답장은 시간이 조금 걸려요.</p>

  const ta = $('ltText'); if (ta) ta.oninput = ()=>{ postView.draft = ta.value; $('ltCount').textContent = `${ta.value.length} / ${LETTER_MAX}`; };
  const sel = $('ltTo'); if (sel) sel.onchange = ()=>{ postView.to = sel.value; };
  p.querySelectorAll('[data-pa]').forEach(b=>b.onclick = async ()=>{ const a = b.dataset.pa, l = letters[postView.id];
    if (a==='back') return postPanel({tab:'in'});
    if (a==='del'){ net.letterDel(uid, postView.id).catch(()=>{}); delete letters[postView.id]; return postPanel({tab:'in'}); }
    if (a==='reply') return postPanel({tab:'write', to:l.from, replyTo:postView.id});

      catch(e){ b.disabled = false; toast('보내지 못했어요. 잠시 뒤 다시 해 봐요'); } }
  });
}
function onMail(m, remove){

// ===== 경제: 판매처 · 오늘의 시세 · 거래소 =====
// 판매처: 모모는 뭐든 사 주고, 전문 상인은 자기 분야를 더 비싸게 사 줘요. 친한 친구(♥7)가 되면 +10%
const BUYERS = {
  bami:{cats:['forage'], bonus:{forage:1.25}, line:'들꽃이랑 열매, 버섯은 내가 제일 잘 알아. 비싸게 사 줄게.'},
  momo:{cats:['crop','forage','fish','ore','loot','dish','furn','star'], bonus:{}, line:'뭐든 가져와요~ 다 사 줄게요!'},
  hana:{cats:['crop'], bonus:{crop:1.25}, line:'작물이면 내가 제일 비싸게 사 줄게!'},
  pengpeng:{cats:['fish'], bonus:{fish:1.25}, line:'펭! 물고기라면 제일 비싸게 사 줄게!'},
  dodo:{cats:['ore'], bonus:{ore:1.25}, line:'광석이라면 내가 제값 쳐 주지.'},
  kongi:{cats:['loot'], bonus:{loot:1.25}, line:'충성! 전리품은 경비대가 비싸게 사겠습니다!'},
  dandan:{cats:['dish','crop'], bonus:{dish:1.25, crop:1.05}, line:'요리라면 우리 카페에서 사 갈게요.'},
};
const SELL_CATS = {crop:'작물', forage:'채집물', fish:'물고기', ore:'광석', loot:'전리품', dish:'요리', furn:'가구', star:'별 조각'};
const baseKey = key => { const [cat, id] = key.split(':'); return cat==='fish' ? 'fish:'+parseFish(id).id : key; };
// 오늘의 인기 품목: 작물·물고기·광석에서 하나씩, 오늘은 2 배 값
function hotToday(){
  const d = today(), pick = (list, salt) => list[hash(d+salt) % list.length];
  return [ 'crop:'+pick(Object.keys(CROPS),'c'), 'fish:'+pick(Object.keys(FISH),'f'), 'ore:'+pick(Object.keys(ORES).filter(id=>ORES[id].tier<=3),'o') ];
}
// 시세: 날마다 품목별로 70%~140% 사이에서 바뀌어요
function marketMul(key){ const b = baseKey(key); if (hotToday().includes(b)) return 2; return .7 + (hash(today()+'|'+b) % 71)/100; }
function soldToday(){ if (!me.sold || me.sold.d !== today()) me.sold = {d:today(), c:{}}; me.sold.c = me.sold.c || {}; return me.sold.c; } // 빈 {} 는 서버에 안 남아서 다시 만들어요
// 같은 물건을 하루에 많이 팔면 값이 조금씩 내려가요 (개당 -3%, 최저 50%)
const glut = (key, extra=0) => Math.max(.5, 1 - .03*((soldToday()[baseKey(key).replace(':','_')]||0) + extra));
function buyerBonus(n, key){
  const by = BUYERS[n.id], cat = key.split(':')[0];
  return (by?.bonus[cat] || 1) + (heartsN(n) >= 7 ? .1 : 0);
}
// 주민에게 팔 때 값 올림: 직접 캐고·잡고·키우고·만든 것만 1.5 배 (가구는 산 값의 절반 그대로 — 사서 되팔아 남기지 않게)
const SELL_BOOST = {crop:1.5, forage:1.5, fish:1.5, ore:1.5, loot:1.5, dish:1.5};
const sellBase = key => itemPrice(key) * (SELL_BOOST[key.split(':')[0]] || 1);
function unitPrice(key, n, extra=0){ if (key.startsWith('star:')) return STAR_PRICE; // 별 조각은 시세 없이 늘 같은 값
  return Math.max(1, Math.round(sellBase(key) * marketMul(key) * glut(key, extra) * (n ? buyerBonus(n, key) : 1))); }
function sellTotal(key, cnt, n){ let s = 0; for (let i=0;i<cnt;i++) s += unitPrice(key, n, i); return s; }
function sellItem(key, cnt, n){
  cnt = Math.min(cnt, invCount(key)); if (cnt <= 0) return 0;
  const g = sellTotal(key, cnt, n), sk = baseKey(key).replace(':','_'), c = soldToday();
  invAdd(key, -cnt); c[sk] = (c[sk]||0) + cnt; me.inv.gold += g;
  me.earned = (me.earned||0) + g; stat('sold', cnt); questEvent('sell', key, cnt); syncStats();
  return g;
}
const trend = key => { const m = marketMul(key); return m >= 2 ? '<b style="color:#e48fac">인기 ×2</b>' : m >= 1.15 ? '<span style="color:#e48fac">▲</span>' : m <= .85 ? '<span style="color:#7fa6d9">▼</span>' : '<span style="color:var(--soft)">–</span>'; };
function sellPanel(n){
  const by = BUYERS[n.id] || BUYERS.momo;
  const rows = by.cats.flatMap(cat=>itemsOf(cat).map(([k,c])=>({k,c,cat})));
  const all = rows.reduce((a,r)=>a+sellTotal(r.k, r.c, n), 0);
  const bon = Object.entries(by.bonus).map(([c,b])=>`${SELL_CATS[c]} +${Math.round((b-1)*100)}%`).concat(heartsN(n) >= 7 ? ['친한 친구 +10%'] : []).join(' · ');
  openPanel(`${n.name}에게 팔기 · 💰 ${me.inv.gold} G`,
    `<p class="mnote" style="margin-top:0">${esc(by.line)}${bon ? ` <b style="color:var(--ink)">${bon}</b>` : ''}<br>오늘의 인기: ${hotToday().map(k=>itemName(k)).join(', ')} (2 배)</p>` +
    (rows.length ? `<button class="mini" id="spAll" style="align-self:flex-start">전부 팔기 +${all} G</button>` +
      rows.map(r=>`<button class="np" data-id="${r.k}"><span class="np-name">${iconImg(r.k)}${esc(itemName(r.k))} <small>×${r.c}</small></span><span class="np-place">${unitPrice(r.k, n)} G ${trend(r.k)}</span><span class="np-day">전부 ${sellTotal(r.k, r.c, n)} G</span></button>`).join('')
      : `<p class="mnote">${n.name}에게 팔 수 있는 물건이 없어요.</p>`),
    b=>{ const k = b.dataset.id, c = invCount(k);
      const opts = [[`1 개 팔기 (+${sellTotal(k,1,n)} G)`, ()=>{ const g = sellItem(k,1,n); saveMe(); renderHud(); toast(`${itemName(k)} 1 개 · +${g} G`, k); sellPanel(n); }]];
      if (c > 1) opts.push([`${c} 개 전부 팔기 (+${sellTotal(k,c,n)} G)`, ()=>{ const g = sellItem(k,c,n); saveMe(); renderHud(); toast(`${itemName(k)} ${c} 개 · +${g} G`, k); sellPanel(n); }]);
      opts.push(['그만두기', ()=>sellPanel(n)]);
      withIcon(k); say(itemName(k), `오늘 시세 ${Math.round(marketMul(k)*100)}% · 1 개 ${unitPrice(k,n)} G`, opts, '같은 물건을 많이 팔면 값이 조금씩 내려가요', true); });
  const allBtn = $('spAll'); if (allBtn) allBtn.onclick = ()=>{ let g = 0; for (const r of rows) g += sellItem(r.k, r.c, n); saveMe(); renderHud(); toast(`전부 팔았어요 · +${g} G`); sellPanel(n); };
}
function pricePanel(){
  const hot = hotToday();
  const pick = (cat, list) => list.map(id=>cat+':'+id).sort((a,b)=>marketMul(b)-marketMul(a));
  const sec = (label, keys) => `<div class="bag-sec"><b>${label}</b>${keys.slice(0,5).map(k=>`<div class="np"><span class="np-name">${iconImg(k)}${esc(itemName(k))}</span><span class="np-place">${Math.round(marketMul(k)*100)}% ${trend(k)}</span></div>`).join('')}</div>`;
  openPanel('오늘의 시세', `<p class="mnote" style="margin-top:0">시세는 매일 아침 바뀌어요. 인기 품목은 2 배! 전문 상인(하나·펭펭·도도·콩이·단단)에게 팔면 더 비싸요.</p>
    ${sec('오늘의 인기 품목', hot)}${sec('작물 비싼 순', pick('crop', Object.keys(CROPS)).filter(k=>!hot.includes(k)))}${sec('물고기 비싼 순', pick('fish', Object.keys(FISH)).filter(k=>!hot.includes(k)))}${sec('광석 비싼 순', pick('ore', Object.keys(ORES)).filter(k=>!hot.includes(k)))}`);
}

// 거래소: 주민(플레이어)끼리 물건을 골드로 사고팔아요. 팔리면 수수료 5%를 빼고 받아요
const MARKET_FEE = .05, MARKET_MAX = 5;
let market = {};
// 거래할 수 있는 아이템 키인지 (옷·우산·벽지·바닥도 거래돼요)
function itemKeyOk(k){ const m = /^(dish|crop|forage|fish|ore|loot|seed|furn|wear|umb|wall|floor):([A-Za-z0-9_~]{2,12})$/.exec(k || ''); if (!m) return false; const [, cat, id] = m;
  if (cat==='wear'){ const [w, c] = id.split(/[~#]/); return !!slotOfWear(w) && (c===undefined || /^[1-4]$/.test(c)); }
  if (cat==='umb') return !!UMB[id]; if (cat==='wall') return !!WALLS[id]; if (cat==='floor') return !!FLOORS[id]; return /^[a-z0-9_]{2,8}$/.test(id); }
const validListing = l => l && typeof l.item==='string' && itemKeyOk(l.item) && l.n>=1 && l.n<=99 && l.price>=1 && typeof l.uid==='string';
function onMarket(v){
  market = {};
  for (const [id,l] of Object.entries(v||{})) if (validListing(l)) market[id] = l;
  // 내 물건이 팔렸으면 골드를 받아요

// ===== 핑키 홈쇼핑 · 별사탕: 동물의 숲 무처럼 사 두고 값이 오르길 기다려요 =====
// 집에 TV(보리 공방)를 놓으면 볼 수 있어요. 방송은 하루 두 번, 오후 1 시와 밤 10 시에 한 시간씩. 그때만 사고팔 수 있어요.
// 3 일(방송 6 번)이 한 판. 첫 방송 값에서 시작해 판마다 오르내리는 모양이 달라요 (큰 대박 · 작은 대박 · 내리막 · 들쭉날쭉).

const SHOW_HOURS = [13, 22], SHOW_MIN = 60, CANDY_MAX = 500, CANDY_PER = 6;

const hasTV = () => !!TV_ID && (me.furn||[]).some(f=>f.id===TV_ID);
// 내 별사탕: 산 방송부터 3 일 뒤 같은 시각 방송까지 팔 수 있고, 그 방송이 끝나면 녹아요. 산 묶음마다 따로 세고, 팔 때는 먼저 산 것부터

function myCandy(){

let stuckT = 0, walked = 0;
function step(dt){
  if (darkDown){ pos.moving = false; target = null; return; } // 쓰러지면 못 움직여요
  let vx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let vy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  keyMoving = !!(vx||vy);
  if (fishing && fishing.phase!=='game' && (vx||vy||target)) stopFishing('낚싯대를 거뒀어요');
  if (fishing && fishing.phase==='game'){ vx = 0; vy = 0; }
  if (vx||vy) target = null;
  else if (target){
    const dx = target.x-pos.x, dy = target.y-pos.y, d = Math.hypot(dx,dy);
    if (d < 5 || (target.act && d < 30)){ const a = target.act; target = null; if (a) a(); }
    else { vx = dx/d; vy = dy/d; }
  }
  const len = Math.hypot(vx,vy);
  pos.moving = len>0;
  if (!len) return;
  vx/=len; vy/=len;
  pos.dir = Math.abs(vx) > Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
  const ox = pos.x, oy = pos.y, spd = SPEED * (performance.now() < playerSlowUntil ? .5 : 1), nx = pos.x + vx*spd*dt, ny = pos.y + vy*spd*dt;
  const stuck = blocked(pos.x, pos.y); // 이미 막힌 곳에 서 있으면(새 울타리가 생긴 자리 등) 빠져나갈 수 있게
  if (stuck || !blocked(nx, pos.y)) pos.x = nx;
  if (stuck || !blocked(pos.x, ny)) pos.y = ny;
  walked += Math.hypot(pos.x-ox, pos.y-oy); if (walked > 500 && me){ stats().distanceWalked = (stats().distanceWalked||0) + Math.round(walked); walked = 0; checkAchievements(); }
  checkExit();
  if (target && Math.hypot(pos.x-ox, pos.y-oy) < SPEED*dt*.2){ stuckT += dt; if (stuckT>.35){ const tg = target; target = null; stuckT = 0; if (tg.act && Math.hypot(pos.x-tg.x, pos.y-tg.y) < 64) tg.act(); } } else stuckT = 0;
}

let lastPres = 0, presSig = '', lastTarget = null;
function sendPresence(t){
  if (!net || !me || admin || kicked) return; // 다른 곳에서 접속해 밀려난 창은 위치를 안 보내요
  const tgt = target && !keyMoving ? target : null;
  const p = {z:zoneId, ...(darkDown ? {down:1} : {}), nick:me.nick, look:me.look, roof:me.roof, x:Math.round(pos.x), y:Math.round(pos.y), dir:pos.dir, mv:pos.moving?1:0, emo:emo.e||'', emoAt:emo.at||0, ex:myExpr(), ti:me.title ? titleOf(me.title) : '', ...(me.inv?.ring ? {rg:me.inv.ring} : {})};
  if (isRain() && umbKey() && snowOutside()) p.um = umbKey();
  const wp = walkingPet(); if (wp) p.pet = {sp:wp.sp, col:wp.col|0, name:String(wp.name||'').slice(0,8)};
  if (tgt){ p.tx = Math.round(tgt.x); p.ty = Math.round(tgt.y); }
  const sig = JSON.stringify(tgt ? {...p, x:0, y:0, dir:0, mv:0} : p);
  let go = false;
  if (tgt !== lastTarget) go = true;                              // 목적지가 바뀌면 바로 보내요 (나머지는 각자 화면에서 걸어가요)
  else if (keyMoving) go = t-lastPres >= 250;                     // 키보드로 걸을 땐 0.25 초마다
  else if (sig !== presSig) go = t-lastPres >= 120;               // 멈춤, 방향, 이모티콘
  if (!go) return;
  lastTarget = tgt; presSig = sig; lastPres = t;
  net.presence(p).catch(()=>{});
}

const ringTagCache = {};
function ringTagURL(nick, rid){ const k = nick+'|'+rid; if (ringTagCache[k]) return ringTagCache[k]; const cv = document.createElement('canvas'); cv.width = 280; cv.height = 90; const x = cv.getContext('2d'); x.scale(2, 2); ringTag(x, nick, 70, 28, null, rid, 300); return ringTagCache[k] = cv.toDataURL(); }
const ringIconCache = {};
function ringIconURL(id){ if (ringIconCache[id]) return ringIconCache[id]; const cv = document.createElement('canvas'); cv.width = cv.height = 96; ringIcon(cv.getContext('2d'), 48, 52, 92, id); return ringIconCache[id] = cv.toDataURL(); }
const RING_TOP = {r05:1, r08:1, r09:1, r10:1, r07:1, r11:1}; // 이름표 위로 솟는 장식 → 발과 안 겹치게 이름표를 조금 더 내려요
// 이름은 발 밑, 칭호는 머리 위
const nameDy = rid => RING_TOP[rid] ? 34 : 22;
function nameTag(c, text, x, y, color, rid, t){ if (!(rid && ringTag(c, text, x, y, color, rid, t))) tag(c, text, x, y, color); }
function tag(c, text, x, y, color){
  c.font='bold 18px "Dongle",sans-serif'; c.textAlign='center';
  const w = c.measureText(text).width + 12;
  c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.roundRect(x-w/2, y-12, w, 17, 8); c.fill();
  if (color){ c.fillStyle=color; c.beginPath(); c.roundRect(x-w/2, y-12, 5, 17, [8,0,0,8]); c.fill(); }
  c.fillStyle='#6b3a4d'; c.fillText(text, x+(color?2:0), y+1);
}
function bubble(c, text, x, y){
  const ik = EMOJI_UI[text];
  if (ik){ c.fillStyle='#fff'; c.beginPath(); c.roundRect(x-18, y-34, 36, 34, 14); c.fill(); c.beginPath(); c.moveTo(x-5,y); c.lineTo(x,y+6); c.lineTo(x+5,y); c.fill(); c.drawImage(uiCanvas(ik, 96), x-14, y-31, 28, 28); return; }
  c.font='bold 19px "Dongle",sans-serif'; c.textAlign='center';
  const w = Math.min(200, c.measureText(text).width + 18);
  c.fillStyle='#fff'; c.beginPath(); c.roundRect(x-w/2, y-24, w, 24, 12); c.fill();
  c.beginPath(); c.moveTo(x-5,y); c.lineTo(x,y+6); c.lineTo(x+5,y); c.fill();

// 걷는 동안 위쪽 카드가 반투명해져서 위쪽 길이 잘 보여요 (멈추고 0.6 초 뒤 돌아와요)
let walkT = 0, walkOn = false;
function walkFade(t){ if (pos.moving) walkT = t; const on = t - walkT < 600 && !darkDown; if (on !== walkOn){ walkOn = on; document.body.classList.toggle('walking', on); } }
// ===== 배달 주문서: 주민들이 2 시간마다 하나씩 주문을 보내요 (나만의 주문 · 한 번에 3 개 · 하루 5 건까지 배달) =====
// 제시간 안에 그 주민에게 가져가면 시세의 2.5 배 + 호감도, 늦으면 반값. 늦은 주문은 6 시간 뒤 사라져요
const DLV_SLOT = 2 * 3600000, DLV_MAX = 3, DLV_DAY = 5, DLV_PTS = 15;
const DLV_POOL = [ // [물건, 최소, 최대] — 섬에서 흔히 구하는 것 위주

  ...['o01','o02','o03','o04','o05','o11','o12'].map(id=>['ore:'+id, 3, 6]),

const dlvName = k => k === 'fish:*' ? '아무 물고기' : itemName(k);

const dlvTime = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000); return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; };
function dlvDone(){ if (me.dlvDay !== today()){ me.dlvDay = today(); me.dlvN = 0; } return me.dlvN || 0; }
// 지난 시간만큼 새 주문을 받아요 (주문 내용은 아이디·시간으로 정해져서 새로고침해도 같아요)
function dlvRefresh(){
  if (!me || admin) return; const now = dlvNow(), slot = Math.floor(now / DLV_SLOT);
  me.orders = (me.orders || []).filter(o => o && NPC[o.npc] && now < o.due + 6 * 3600000);
  if (me.orderSlot == null) me.orderSlot = slot - 1;
  let changed = false;
  for (let sl = Math.max(me.orderSlot + 1, slot - DLV_MAX + 1); sl <= slot; sl++){
    if (me.orders.length >= DLV_MAX || dlvDone() >= DLV_DAY) break;
    const r = seeded(hash(uid + '|dlv|' + sl)), npcs = NPCS.filter(n => !me.orders.some(o => o.npc === n.id)), n = npcs[Math.floor(r() * npcs.length)];
    const [k, a, b] = DLV_POOL[Math.floor(r() * DLV_POOL.length)], cnt = a + Math.floor(r() * (b - a + 1)), at = Math.max(sl * DLV_SLOT, now - 5 * 60000);
    const each = k === 'fish:*' ? 25 : itemPrice(k), reward = Math.max(300, Math.round(each * cnt * 2.5 / 10) * 10 + 100);
    me.orders.push({id:'o' + sl, npc:n.id, k, n:cnt, at, due:at + (60 + Math.floor(r() * 4) * 20) * 60000, reward}); changed = true;
  }
  me.orderSlot = slot; if (changed){ saveMe(); toast('📦 새 배달 주문이 왔어요! 아래 배달 칸을 눌러 봐요'); }
  renderDlvChip();
}
const dlvFor = id => (me && me.orders || []).find(o => o.npc === id);

  const n = NPC[o.npc]; if (!n || !me.orders.includes(o)) return;
  if (dlvHave(o.k) < o.n) return toast(`${dlvName(o.k)} ${o.n} 개가 필요해요 (지금 ${dlvHave(o.k)} 개)`);
  if (dlvDone() >= DLV_DAY) return toast(`오늘 배달은 ${DLV_DAY} 건까지예요 · 내일 또 해요`);
  if (o.k === 'fish:*'){ let left = o.n; for (const [fk, c] of anyFishKeys()){ const t = Math.min(left, c); invAdd(fk, -t); left -= t; if (!left) break; } } else invAdd(o.k, -o.n);
  const onTime = dlvLeft(o) > 0, g = onTime ? o.reward : Math.round(o.reward / 2 / 10) * 10;
  me.inv.gold += g; me.earned = (me.earned||0) + g; me.dlvN = dlvDone() + 1; me.orders = me.orders.filter(x => x !== o);
  if (onTime) addPts(n, DLV_PTS); stat('deliveries'); syncStats(); saveMe(true); renderHud();

function dlvPanel(){

      : `<p class="mnote">지금은 주문이 없어요. ${dlvDone() >= DLV_DAY ? '오늘 배달을 다 했어요! 내일 또 와요.' : '다음 주문은 ' + dlvTime((Math.floor(dlvNow() / DLV_SLOT) + 1) * DLV_SLOT - dlvNow()) + ' 뒤에 와요.'}</p>`),
    b => { const o = me.orders.find(x => x.id === b.dataset.id); if (!o) return; const n = NPC[o.npc];

// 아래 배달 칸: 가장 급한 주문을 늘 보여 줘요

// ===== 오늘의 섬 목표: 다 같이 하나의 목표, 달성하면 기여한 사람 모두 8,000 G =====

  const d = today(); if (d === goalDay || !net || !net.goalWatch) return;
  goalDay = d; goalData = {}; goalOff && goalOff(); goalOff = net.goalWatch(d, v => { goalData = v || {}; goalLoaded = d; goalPay(d, goalData); renderGoal(); if (admin) renderAdmin(); });
  if (!admin && net.goalGet) net.goalGet(d - 1).then(v => { goalPay(d - 1, v || {}); goalRankPay(d - 1, v || {}); }).catch(()=>{}); // 어제 못 받은 보상 + 어제 순위 보상
}
// 목표 활동을 하면 내 기여를 1 씩 올려요 (모아서 1.5 초마다 저장)
function goalCount(key, n){
  if (admin || !me || !net || !net.goalSet || goalOf(today()).k !== key || !(n > 0)) return;
  const d = today(); goalWatch();
  if (goalLoaded !== d || goalSum(goalData) >= goalOf(d).n) return; // 이미 달성한 뒤(또는 현황을 받기 전)의 활동은 기여로 안 세요 → 끝난 뒤 한 마리 잡고 보상 받는 일 없음
  goalData[uid] = (Number(goalData[uid]) || 0) + n; renderGoal();
  if (goalPending) return; goalPending = true;
  setTimeout(()=>{ goalPending = false; net.goalSet(d, goalData[uid] | 0).catch(()=>{}); goalPay(d, goalData); }, 1500);
}
function goalPay(day, data){
  if (admin || !me) return; const g = goalOf(day);
  if (!((Number(data[uid]) || 0) > 0) || goalSum(data) < g.n) return;
  const paid = me.goalPaid || (me.goalPaid = {}); if (paid[day]) return;
  paid[day] = 1; for (const k of Object.keys(paid)) if (+k < today() - 3) delete paid[k];
  me.inv.gold += GOAL_REWARD; me.earned = (me.earned||0) + GOAL_REWARD; saveMe(true); renderHud();
  toast(`🎯 ${day === today() ? '오늘' : '어제'}의 섬 목표 달성! 기여한 보상 ${GOAL_REWARD.toLocaleString()} G 를 받았어요`);
}
// 관리자 화면: 오늘의 섬 목표 진행 · 기여 순위
function adminGoalSec(){
  goalWatch(); const g = goalOf(today()), sum = goalSum(goalData), rows = goalRank(), pct = Math.min(100, Math.floor(sum / g.n * 100));

    <small>달성하면 기여자 모두 ${GOAL_REWARD.toLocaleString()} G · 1·2·3 등은 자정에 순위 보상</small></div>`;

// 하루가 끝나면(다음 날 접속하거나 자정을 넘기면) 순위가 확정돼요. 같은 수면 같은 등수
function goalRankPay(day, data){
  if (admin || !me || day >= today()) return; const g = goalOf(day), mine = Number(data[uid]) || 0;
  if (!(mine > 0) || goalSum(data) < g.n) return;
  const paid = me.goalRankPaid || (me.goalRankPaid = {}); if (paid[day]) return;
  const rank = 1 + Object.entries(data).filter(([id, v]) => id !== uid && (Number(v) || 0) > mine).length;
  paid[day] = 1; for (const k of Object.keys(paid)) if (+k < today() - 3) delete paid[k];
  const bonus = GOAL_RANK[rank - 1]; if (!bonus){ saveMe(); return; }
  me.inv.gold += bonus; me.earned = (me.earned||0) + bonus;
  let msg = `🏅 어제 섬 목표 기여 ${rank}등! 추가 보상 ${bonus.toLocaleString()} G`;
  if (rank === 1){ me.stitles = [...new Set([...(me.stitles||[]), 'goal1'])]; me.title = 'goal1'; msg += ` · 칭호 '${SPECIAL_TITLES.goal1}'`; }
  saveMe(true); renderHud(); setTimeout(()=>toast(msg), 1800);
}
const goalLeft = () => { const ms = (today() + 1) * 86400000 - (Date.now() + serverOffset + 9*3600000), h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000); return `${h}:${String(m).padStart(2,'0')} 남음`; };

  const g = goalOf(today()), sum = goalSum(goalData), mine = Number(goalData[uid]) || 0, done = sum >= g.n, rk = goalRank().findIndex(([id]) => id === uid);

// ===== 오투모 경매: 관리자가 오투모로 들어가 시작해요. 오투모 자리 둘레가 경매장이고, 그 안에 들어온 사람만 값을 불러요 =====

// 부른 골드는 바로 맡겨 두고(가방에서 빠져요), 더 높은 값이 나오거나 취소되면 돌려받아요. 낙찰되면 물건이 들어와요

function onAuction(v){

  if (m && aucLive() && aucSeen !== m.id){ aucSeen = m.id;
    if (!admin && me && Date.now() + serverOffset - (m.at || 0) < 120000){
      const zn = zoneName(m.z);
      say('🔨 오투모 경매', `오투모가 경매를 시작했어요!\n물건: ${aucItemName(m)}${m.n > 1 ? ' ' + m.n + ' 개' : ''} · 시작가 ${Number(m.start).toLocaleString()} G\n장소: ${zn}\n지금 당장 오투모를 찾아가 봐요!`, [['확인', closeTalk]], '오투모 둘레 노란 원 안에 들어가면 값을 부를 수 있어요', true);
    } }

}
// 내가 맡긴 골드 정리: 밀렸거나 취소되면 돌려받고, 낙찰되면 물건을 받아요
function aucSettle(){
  if (admin || !me || !me.aucHold || !auc) return;
  const h = me.aucHold, m = auc.meta, hist = auc.hist && auc.hist[h.id];
  const refund = msg => { me.inv.gold += h.p; me.aucHold = null; saveMe(true); renderHud(); toast(msg); };
  const res = (m && m.id === h.id && (m.done || m.cancel)) ? (m.cancel ? {cancel:1} : (m.win || {})) : hist;
  if (res){
    if (res.uid === uid && !res.cancel){ const k = auc.meta?.id === h.id ? auc.meta.k : res.k, n = (auc.meta?.id === h.id ? auc.meta.n : res.n) || 1;
      if (k && k.startsWith('ring:')){ const id = k.slice(5); if ((me.inv.rings || []).includes(id)) return refund('이미 가진 반지라 맡긴 골드를 돌려받았어요'); me.inv.rings = [...(me.inv.rings || []), id]; }
      else if (k) invAdd(k, n);
      me.aucHold = null; stat('aucWon'); saveMe(true); renderHud(); toast(`🔨 낙찰! ${res.name || itemName(k)} 을(를) ${Number(h.p).toLocaleString()} G 에 샀어요`); return; }
    return refund(res.cancel ? '경매가 취소돼서 맡긴 골드를 돌려받았어요' : '다른 사람이 낙찰받아서 맡긴 골드를 돌려받았어요');

}
async function aucBid(p){

  if (Date.now() + serverOffset > aucEnd()) return toast('경매가 끝났어요');

  if (!ok) return toast('그새 다른 사람이 더 높게 불렀어요. 다시 불러 봐요');
  me.inv.gold += hold; me.inv.gold -= p; me.aucHold = {id:m.id, p}; saveMe(true); renderHud(); toast(`${p.toLocaleString()} G 불렀어요! (골드는 경매가 끝날 때까지 맡겨 둬요)`);

const aucInRange = () => aucLive() && me && !admin && zoneId === auc.meta.z && Math.hypot((pos.x - auc.meta.x) / 1, (pos.y - auc.meta.y) / .6) < AUC_R;

    `<button class="np" data-id="play"><span class="np-name">놀아 주기 <small>친밀도 +2 · 배부름 −${PET_PLAY_COST} (배가 고프면 못 놀아요)</small></span></button>` +
    `<button class="np" data-id="pat"><span class="np-name">쓰다듬기 <small>한 시간에 한 번 친해져요</small></span></button>` +
    (`<button class="np" data-id="walk"><span class="np-name">${pt.walk ? '산책 그만하기' : '산책 데리고 다니기'} <small>${pt.walk ? '지금 밖에서 따라다녀요 · 걸으면 배가 고파져요' : (CARRIED.has(pt.sp) ? '켜면 어항째 품에 안고 다녀요 (한 마리만)' : '켜면 밖에서 나를 따라다녀요 (한 마리만)')}</small></span></button>`) +
    `<button class="np" data-id="name"><span class="np-name">이름 바꾸기 <small>지금 이름: ${esc(pt.name)}</small></span></button>`,
    b=>{ const id = b.dataset.id;
      if (id==='feed'){ const k = b.dataset.k, fd = PET_FOODS[k]; if (!petFoodCount(k)) return toast(`${fd.name}이(가) 없어요. 공방 거리 보호소에서 살 수 있어요`); if (fullness(pt) >= 95) return toast(`${pt.name}은(는) 배불러요`);
        me.inv.pfood[k]--; pt.full = Math.min(100, fullness(pt) + fd.full); pt.fullAt = Date.now(); pt.fedAt = Date.now(); pt.love = (pt.love||0) + fd.love; stat('petFed'); saveMe(); toast(`${pt.name}이(가) ${fd.name}을(를) 맛있게 먹었어요`); }
      if (id==='play'){ if (fullness(pt) < 15 + PET_PLAY_COST) return toast(`${pt.name}이(가) 배고파서 놀 기운이 없어요`); if (Date.now() - (pt.playAt||0) < 600000) return toast(`${pt.name}이(가) 조금 쉬고 싶대요 (10 분 뒤에 다시)`); pt.playAt = Date.now(); petSpend(pt, PET_PLAY_COST); pt.love = (pt.love||0) + 2; saveMe(); toast(`${pt.name}이(가) 신나게 뛰어놀았어요`); }
      if (id==='pat'){ if (Date.now() - (pt.petAt||0) < 3600000){ toast(`${pt.name}이(가) 좋아해요`); return; } pt.petAt = Date.now(); pt.love = (pt.love||0) + 2; saveMe(); toast(`${pt.name}이(가) 꼬리를 흔들어요`); }
      if (id==='walk'){ const on = !pt.walk; if (on && fullness(pt) < 15) return toast(`${pt.name}이(가) 배고파서 나가기 싫대요. 밥을 먼저 주세요`); for (const p of myPets()) p.walk = false; pt.walk = on; saveMe(); toast(on ? `${pt.name}이(가) 산책을 따라가요` : `${pt.name}은(는) 집에서 쉬어요`); }
      if (id==='name'){ const nm = prompt('새 이름 (8 글자까지)', pt.name); if (nm && nm.trim()){ pt.name = nm.trim().slice(0,8); saveMe(); toast(`이제 '${pt.name}'(이)라고 불러요`); } }
      petPanel(pt); });
}

  const e = bubbles.get(key+'-emo'), b = bubbles.get(key);

  else if (e && t-e.at < 3000) bubble(ctx, e.text, x, y-80);
}
