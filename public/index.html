<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>핑키 디저트 아일랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#6b3a4d;--soft:#a5768a;--card:#fffaf7;--pink:#ff8fb3;--pinkd:#e5588a;--line:#f2cfdc;--sea:#8fd3f5}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font:16px/1.5 "Jua",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:linear-gradient(#fff,#ffeef4);border-radius:16px;box-shadow:inset 0 -3px 0 #f6c3d5,0 4px 12px #c9708f33}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
#hud{font-size:13px!important;gap:6px 10px!important;flex-wrap:wrap;max-width:calc(100vw - 20px - min(260px,52vw) - 10px);position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:15px;z-index:5}
#hud i{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:4px}
#quest{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-width:min(260px,52vw);padding:8px 12px;font-size:14px;z-index:5}
#quest b{display:block;font-size:12px;color:var(--soft)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:6px;z-index:5}
#bar div{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-size:24px;box-shadow:inset 0 -2px 0 #f2d6e0}
#bar div.off{opacity:.28;filter:grayscale(1)}
#bar span{position:absolute;right:3px;bottom:0;font-size:12px;color:var(--ink)}
#chatbox{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(320px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:2px;font-size:14px;text-shadow:0 1px 0 #fff,0 0 4px #fff}
#log p{margin:0;transition:opacity 1s}
#log p.sys{color:var(--pinkd)}
#chatrow{display:flex;gap:6px;pointer-events:auto}
#chatin{flex:1;min-width:0;font:15px "Jua",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffffff0;color:var(--ink)}
.emo{border:0;border-radius:12px;background:#fff;width:38px;font-size:18px;box-shadow:inset 0 -2px 0 #f2d6e0}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(520px,calc(100vw - 20px));padding:14px 16px;z-index:8}
#talk h3{margin:0 0 4px;font-size:18px;color:var(--pinkd)}
#talk p{margin:0 0 10px;font-size:16px;white-space:pre-line}
#talk #talkNote{font-size:13px;color:var(--soft);margin-top:-6px}
#talk .act{flex-wrap:wrap}
#talk .act.choices{flex-direction:column;align-items:stretch}
.btn.choice{background:#fff;color:var(--ink);text-align:left;box-shadow:inset 0 -3px 0 #f2d6e0,0 0 0 2px #ffd3e2}
.btn.choice::before{content:'▸ ';color:var(--pinkd)}
.mini{border:0;border-radius:10px;background:var(--pink);color:#fff;font-size:13px;padding:2px 10px;box-shadow:inset 0 -2px 0 #e5588a}
#npcPanel{z-index:10;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:10px;width:min(360px,calc(100vw - 20px));max-height:calc(100% - 150px);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.np{border:0;background:#fff;border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px;box-shadow:inset 0 -2px 0 #f2d6e0}
.np-name{font-size:15px}.np-name small{color:var(--soft);font-size:12px}
.np-place{font-size:12px;color:var(--soft);text-align:right}
.np-h{color:#ff5a88;font-size:12px;letter-spacing:1px}
.np-day{font-size:12px;color:var(--soft);text-align:right}
.np-h small{color:var(--soft);letter-spacing:0}
.np-keep{grid-column:1/-1;font-size:12px;color:var(--pinkd)}
#sideBtns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:flex;flex-direction:column;gap:8px;z-index:5}
.round{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(#fff,#ffeef4);color:var(--ink);font-size:14px;box-shadow:inset 0 -3px 0 #f6c3d5,0 4px 12px #c9708f33}
#mapPanel{z-index:10;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100% - 150px);overflow:auto;padding:10px;touch-action:pan-y}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px;margin-top:6px}
.mz{background:#fff;border-radius:10px;padding:5px 3px;text-align:center;font-size:11px;line-height:1.25;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 -2px 0 #f2d6e0;min-height:52px;justify-content:center}
.mz b{font-size:12px;font-weight:normal}
.mz small{color:var(--soft);font-size:10px}
.mz i{font-style:normal;color:#fff;background:var(--pink);border-radius:8px;padding:0 4px;align-self:center;font-size:10px}
.mz.here{outline:3px solid var(--pinkd)}
.mnote{font-size:12px;color:var(--soft);margin:8px 2px 0}
#fade{position:fixed;inset:0;background:#fff7f2;opacity:0;pointer-events:none;z-index:6}
.btn{border:0;border-radius:12px;padding:7px 16px;background:var(--pink);color:#fff;font-size:16px;box-shadow:inset 0 -3px 0 #e5588a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #f2d6e0}
.btn:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);padding:8px 16px;z-index:9;font-size:15px;transition:opacity .4s;pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}
#ob{position:fixed;inset:0;z-index:20;background:#fde9f0;overflow:auto;touch-action:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 40px}
.obc{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.obc h1{margin:0;font-size:34px;color:var(--pinkd);line-height:1.15}
.obc h2{margin:0;font-size:22px}
.obc .sub{margin:0;color:var(--soft);font-size:15px}
.steps{display:flex;gap:6px;font-size:13px;color:var(--soft);flex-wrap:wrap}
.steps span{background:#fff;border-radius:999px;padding:2px 10px}
.steps span.on{background:var(--pink);color:#fff}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.maker{grid-template-columns:1fr}}
.prev{background:#fff7f2;border-radius:16px;aspect-ratio:2/1;overflow:hidden}
.prev canvas{width:100%;height:100%;display:block}
.ctrls{display:flex;flex-direction:column;gap:8px}
.row b{font-size:14px;color:var(--soft);display:block;margin-bottom:3px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px}
.opts button.sw{width:26px;height:26px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.opts button[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.opts button.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pinkd)}
.nick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nick input{font:18px "Jua",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 12px;width:min(220px,60vw);color:var(--ink)}
.err{color:#d6335f;font-size:14px;min-height:1.4em;margin:0}
.roofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.roofs button{border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.roofs button i{width:52px;height:26px;border-radius:14px 14px 4px 4px;display:block;box-shadow:inset 0 -4px 0 #0002}
.roofs button small{font-size:12px;color:var(--soft)}
.roofs button[aria-pressed="true"]{border-color:var(--pinkd)}
.roofs button:disabled{opacity:.45;cursor:default}
.lots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lots button{border:2px dashed #e6b9c9;background:#fff;border-radius:12px;padding:6px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center}
.lots button i{width:30px;height:16px;border-radius:9px 9px 3px 3px;display:block}
.lots button:disabled{border-style:solid;border-color:transparent;cursor:default}
.lots button[aria-pressed="true"]{border:2px solid var(--pinkd);background:#fff0f5}
.lots .gap{grid-column:span 7;text-align:center;font-size:13px;color:var(--soft);padding:2px}
.act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.note{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;color:var(--soft)}
</style>
</head>
<body>

<canvas id="game" aria-label="게임 화면"></canvas>
<div id="hud" class="pill" hidden></div>
<div id="quest" class="pill" hidden></div>
<div id="bar" class="pill" hidden></div>
<div id="chatbox" hidden>
  <div id="log" aria-live="polite"></div>
  <div id="chatrow">
    <input id="chatin" maxlength="80" placeholder="Enter로 채팅" autocomplete="off">
    <button class="emo" data-e="👋" aria-label="손 흔들기">👋</button>
    <button class="emo" data-e="❤️" aria-label="하트">❤️</button>
    <button class="emo" data-e="✨" aria-label="반짝">✨</button>
    <button class="emo" data-e="😢" aria-label="눈물">😢</button>
  </div>
</div>
<div id="talk" class="pill" hidden><h3 id="talkName"></h3><p id="talkText"></p><p id="talkNote" hidden></p><div class="act" id="talkAct"></div></div>
<div id="npcPanel" class="pill" hidden></div>
<div id="mapPanel" class="pill" hidden></div>
<div id="sideBtns" hidden><button id="mapBtn" class="round">지도</button><button id="npcBtn" class="round">주민</button></div>
<div id="fade"></div>
<div id="toast" class="pill" style="opacity:0"></div>
<div id="ob"><div class="obc" id="obc"><h1>핑키 디저트 아일랜드</h1><p class="sub">섬에 연결하는 중이에요…</p></div></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { NPC_TEXT } from './npcs.js';
const P = {grass:'#b5e6a3',grass2:'#9fdb8c',path:'#ffe0bf',water:'#9fd9ff',waterHi:'#e8f7ff',cream:'#fff0e0',pink:'#ffa6c9',choco:'#9a5a45',cherry:'#ff5a78',candyA:'#ffa6cf',candyB:'#fff09a',stick:'#fff',soil:'#d69a70',berry:'#ff5a78',leaf:'#6cc46a',rock:'#c3b8d2',gem:'#bf8cff',dust:'#bdb5c9',blush:'#ffadc4',eye:'#5b3345',stitch:'#ffffff',bubble:'#fff',text:'#8a4b63'};
const OPT = {
  skin:  { label:'피부 색', color:true, v:['#ffe4d2','#f9d3b8','#eebd98','#d9a07a','#b87a55','#8d5a3c'] },
  hairA: { label:'머리 모양 (남)', target:'hair', v:[['short','숏컷'],['part','가르마'],['dandy','댄디컷'],['center','가운데 가르마'],['perm','파마']] },
  hairB: { label:'머리 모양 (여)', target:'hair', v:[['bob','단발'],['long','긴 생머리'],['pony','포니테일'],['wave','웨이브'],['bun','똥머리']] },
  hairColor: { label:'머리 색', color:true, v:['#2f2a2e','#4a3228','#7a5236','#a8784c','#e8c77a','#9a9aa6','#f2a0b8','#8fc3ea'] },
  eyes:  { label:'눈', v:[['round','동글 눈'],['lash','속눈썹 눈'],['smile','웃는 눈'],['sleepy','졸린 눈']] },
  outfit:{ label:'옷', v:[['tee','티셔츠'],['shirt','셔츠'],['hoodie','후드'],['overall','멜빵바지'],['dress','원피스']] },
  outfitColor: { label:'옷 색', color:true, v:['#ff9fbf','#ffe07a','#9fd6ff','#b9ec9f','#d2b8ff','#ffb27a','#ffffff','#7c86d6'] },
  hat:   { label:'모자', v:[['none','없음'],['straw','밀짚모자'],['beanie','비니'],['cap','캡모자'],['pin','리본핀']] },
};
let EDIT = { skin:'#f9d3b8', hair:'long', hairColor:'#7a5236', eyes:'lash', outfit:'overall', outfitColor:'#ff9fbf', hat:'pin' };

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

function painter(ctx){
  function paint(path, key, [cx,cy,r]){
    const col = P[key] || key;
    ctx.save(); if (r>=7){ ctx.shadowColor='rgba(150,70,100,.22)'; ctx.shadowBlur=5; ctx.shadowOffsetY=2; }
    const g=ctx.createRadialGradient(cx-r*.35,cy-r*.45,r*.05,cx,cy,r*1.25);
    g.addColorStop(0,shade(col,.5)); g.addColorStop(.55,col); g.addColorStop(1,shade(col,-.16));
    path(); ctx.fillStyle=g; ctx.fill(); ctx.restore();
  }
  return { ctx,
    circle:(x,y,r,k)=>paint(()=>{ctx.beginPath();ctx.arc(x,y,r,0,7);},k,[x,y,r]),
    ell:(x,y,rx,ry,k)=>paint(()=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);},k,[x,y,Math.max(rx,ry)]),
    rr:(x,y,w,h,r,k)=>paint(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);},k,[x+w/2,y+h/2,Math.max(w,h)/2]),
    tri:(pts,k)=>paint(()=>{ctx.beginPath();ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1]);ctx.lineTo(...pts[2]);ctx.closePath();},k,[pts[1][0],pts[1][1]+6,8]),
    dot:(x,y,r,k,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=P[k]||k;ctx.fill();ctx.restore();},
    shape:(fn,k,box)=>paint(fn,k,box),
    stitch:(fn,k='stitch',a=.85)=>{ctx.save();ctx.globalAlpha=a;ctx.setLineDash([2,1.6]);ctx.lineWidth=.9;ctx.strokeStyle=P[k]||k;ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
    line:(fn,k,w=1)=>{ctx.save();ctx.strokeStyle=P[k]||k;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
  };
}

// 플레이어: 사람 비율에 가까운 인형. dir = down | up | right | left
const FRINGE = new Set(['dandy','bob','bun']);
function player(d, x, y, L, dir, t, walk=true, s=1){
  const c = d.ctx, ph = t*8 + x*.37, step = walk ? Math.sin(ph) : 0, bob = walk ? Math.abs(Math.sin(ph))*1.2 : Math.sin(t*2+x)*.3+.3;
  const side = dir==='left'||dir==='right', up = dir==='up';
  c.save(); c.translate(x,y); c.scale(dir==='left'?-s:s, s);
  c.save(); c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(0,1,9,3,0,0,7); c.fill(); c.restore();
  c.translate(0,-bob);
  const hy = -30, H = L.hair, hc = L.hairColor, hd = shade(hc,-.35), sk = L.skin, oc = L.outfitColor, O = L.outfit;
  const top = O==='overall' ? '#fff7ee' : oc;
  const legC = {tee:sk, overall:oc, hoodie:'#5d6b8a', dress:sk, shirt:'#4d5670'}[O];
  const cap = (cx,cy,r)=>d.shape(()=>{c.beginPath();c.arc(cx,cy,r,Math.PI,0);c.closePath();},hc,[cx,cy-r/2,r]);
  // 다리
  if (side){ for (const [lx,k] of [[-2,step],[1.5,-step]]){ d.rr(lx+k*1.8-2,-9,4,9,2,legC); d.ell(lx+k*1.8+.8,.2,3,1.5,'#7a4e42'); } }
  else { const a=Math.max(0,step)*1.5, b=Math.max(0,-step)*1.5; d.rr(-5,-9-a,4,9,2,legC); d.rr(1,-9-b,4,9,2,legC); d.ell(-3,.2-a,2.8,1.5,'#7a4e42'); d.ell(3,.2-b,2.8,1.5,'#7a4e42'); }
  if (O==='tee') d.rr(side?-5:-5.5,-11,side?10:11,4.5,2,'#6f86b8');
  // 뒷머리
  if (!up){
    if (H==='long'||H==='wave') d.rr(side?-11:-10.5, hy-4, side?14:21, 22, 7, hc);
    if (H==='wave' && !side) for (const bx of [-8,-3,3,8]) d.circle(bx,hy+17,3.2,hc);
    if (H==='bob') d.rr(side?-11:-11, hy-4, side?15:22, 14, 6, hc);
    if (H==='pony') side ? d.ell(-12,hy+3,3.4,7,hc) : d.ell(10,hy+4,2.8,6,hc);
  }
  // 몸통 + 옷
  if (O==='dress'){ d.ell(0,-8.5,side?6.5:8.5,4,oc); d.rr(side?-5:-6,-21,side?10:12,12,4.5,oc); }
  else d.rr(side?-5:-6.5,-21,side?10:13,13,4.5,top);
  if (!side && !up){
    if (O==='overall'){ d.rr(-5,-16,10,8,2,oc); d.line(c=>{c.moveTo(-3.5,-21);c.lineTo(-3.5,-16);c.moveTo(3.5,-21);c.lineTo(3.5,-16);},oc,1.6); d.dot(-3.2,-15,.7,'#fff'); d.dot(3.2,-15,.7,'#fff'); }
    if (O==='hoodie'){ d.rr(-4,-14,8,3.5,1.5,shade(oc,-.1)); d.line(c=>{c.moveTo(-1.8,-21);c.lineTo(-1.8,-17.5);c.moveTo(1.8,-21);c.lineTo(1.8,-17.5);},'#ffffff',.8); }
    if (O==='shirt'){ d.tri([[-3.5,-21],[0,-18.5],[0,-21]],'#ffffff'); d.tri([[3.5,-21],[0,-18.5],[0,-21]],'#ffffff'); for (const by of [-17,-14,-11]) d.dot(0,by,.6,'#ffffff'); }
    d.stitch(c=>{c.moveTo(-5,-9.5);c.lineTo(5,-9.5);},'#ffffff',.5);
  }
  if (up && O==='hoodie') d.ell(0,-21,5.5,2.4,shade(oc,-.1));
  // 팔
  const short = O==='tee'||O==='dress';
  const arm = (ax,ay)=>{ if (short){ d.ell(ax,ay-2.8,2.4,2.4,top); d.ell(ax,ay+.5,1.8,3.6,sk);} else d.ell(ax,ay,2.2,4.6,top); d.circle(ax-.1,ay+4.4,1.8,sk); };
  if (side) arm(step*1.5,-16); else { arm(-7.8,-16+step*.6); arm(7.8,-16-step*.6); }
  // 머리
  if (!up && !side){ d.circle(-10,hy+1.5,2.2,sk); d.circle(10,hy+1.5,2.2,sk); }
  d.ell(0,hy,10.5,10,sk);
  if (up){
    d.circle(0,hy,11,hc);
    if (H==='long'||H==='wave') d.rr(-10.5,hy,21,18,7,hc);
    if (H==='bob') d.rr(-11,hy,22,10,6,hc);
    if (H==='pony') d.ell(0,hy+9,3.2,7,hc);
    if (H==='perm') for (let a=0;a<6.28;a+=.7) d.circle(Math.cos(a)*9,hy+Math.sin(a)*9,3.2,hc);
    d.stitch(c=>{for (const o of [-4,0,4]){c.moveTo(o,hy-10);c.quadraticCurveTo(o*1.3,hy-2,o*1.1,hy+7);}},hd,.5);
  } else if (side){
    d.ell(-2.5,hy-1,9,9.8,hc); cap(0,hy-1.5,11);
    if (H==='short'||H==='part'||H==='center'||H==='dandy') d.rr(-3,hy-3,3,6,1.5,hc);
    if (!['short','perm'].includes(H)) d.ell(5,hy-2.5,5.5,3,hc);

const TORI_PATH = [[1180,912],[880,912],[880,620],[560,560],[880,620],[1240,560],[880,620],[880,912]];
const TORI_SEGS = TORI_PATH.map((a,i)=>{ const b = TORI_PATH[(i+1)%TORI_PATH.length]; return {a, b, walk:Math.hypot(b[0]-a[0], b[1]-a[1])/60*1000}; });
const TORI_TOTAL = TORI_SEGS.reduce((s,g)=>s+g.walk+3000, 0);
function toriPos(now){
  let t = now % TORI_TOTAL;
  for (const g of TORI_SEGS){
    if (t < 3000) return {x:g.a[0], y:g.a[1], mv:false, dx:0};
    t -= 3000;
    if (t < g.walk){ const k = t/g.walk; return {x:g.a[0]+(g.b[0]-g.a[0])*k, y:g.a[1]+(g.b[1]-g.a[1])*k, mv:true, dx:g.b[0]-g.a[0]}; }
    t -= g.walk;
  }
  return {x:TORI_PATH[0][0], y:TORI_PATH[0][1], mv:false, dx:0};
}

  for (const [x,y] of z.trees) o.circles.push({x, y:y+22, r:24});
  for (const p of z.places){
    if (p.kind==='house') o.rects.push(houseRect(p));
    if (p.kind==='fountain') o.circles.push({x:p.x, y:p.y, r:44});
    if (p.kind==='tree') o.circles.push({x:p.x, y:p.y+40, r:46});
    if (p.kind==='pond') o.ells.push({x:p.x, y:p.y, rx:p.rx, ry:p.ry});
    if (p.kind==='lighthouse') o.rects.push({x:p.x-28, y:p.y-150, w:56, h:155});
    if (p.kind==='sea') o.rects.push({x:0, y:0, w:z.W, h:250});
    if (p.kind==='mine'){ o.ells.push({x:520,y:900,rx:220,ry:150}, {x:1080,y:900,rx:220,ry:150}); }
    if (p.kind==='logs') o.rects.push({x:p.x-60, y:p.y-30, w:120, h:40});
  }
  if (zoneId==='home') for (const p of Object.values(players)) if (p.lot!=null){ const L=LOTS[p.lot]; o.rects.push({x:L.x-54,y:L.y-106,w:108,h:108}); }
  Object.assign(obstacles, o);
}
function inCorridor(x, y){
  const z = Z(), ex = z.exits;
  if (ex.n && y < M+10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.s && y > z.H-M-10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.w && x < M+10 && Math.abs(y-z.H/2) < GAP) return true;
  if (ex.e && x > z.W-M-10 && Math.abs(y-z.H/2) < GAP) return true;
  return false;
}
function blocked(x,y){
  const z = Z();
  if (x<4||y<4||x>z.W-4||y>z.H-4) return true;
  if ((x<M||x>z.W-M||y<M||y>z.H-M) && !inCorridor(x,y)) return true;
  for (const e of obstacles.ells) if (((x-e.x)/(e.rx+6))**2 + ((y-e.y)/(e.ry+6))**2 < 1) return true;
  for (const c of obstacles.circles) if ((x-c.x)**2+(y-c.y)**2 < c.r*c.r) return true;
  for (const r of obstacles.rects) if (x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h) return true;
  return false;
}
// 구역 가장자리 길 끝에 닿으면 다음 구역으로 넘어가요
function checkExit(){
  const z = Z(), ex = z.exits;
  let side = null;
  if (ex.n && pos.y < 30) side = 'n'; else if (ex.s && pos.y > z.H-30) side = 's';
  else if (ex.w && pos.x < 30) side = 'w'; else if (ex.e && pos.x > z.W-30) side = 'e';
  if (side) enterZone(ex[side], {n:'s', s:'n', w:'e', e:'w'}[side]);
}
let fadeT = 0;
function enterZone(id, from, x, y){
  if (!ZONES[id]) id = 'home';
  zoneId = id; const z = Z(); target = null; staticSig = '';
  if (x!=null){ pos.x = x; pos.y = y; }
  else if (from==='n'){ pos.x = z.W/2; pos.y = M+40; }
  else if (from==='s'){ pos.x = z.W/2; pos.y = z.H-M-30; }
  else if (from==='w'){ pos.x = M+40; pos.y = z.H/2; }
  else if (from==='e'){ pos.x = z.W-M-40; pos.y = z.H/2; }
  rebuildObstacles(); fadeT = performance.now();
  if (me){ me.zone = id; me.zx = Math.round(pos.x); me.zy = Math.round(pos.y); saveMe(); renderHud(); if (!$('mapPanel').hidden) renderMap(); }
  toast(`${z.name}`);
}

function hexShade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return '#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}

  if (A==='cap'||A==='police'){ const col = A==='police' ? '#5361b3' : '#5fb3ff'; d.shape(()=>{c.beginPath();c.arc(0,hy-5,11.5,Math.PI,0);c.closePath();},col,[0,hy-9,11]); d.ell(0,hy-4.5,10.5,2.6,hexShade(col,-.15)); if (A==='police') d.dot(0,hy-10,1.8,'#ffd84f'); }
  if (A==='helmet'){ d.shape(()=>{c.beginPath();c.arc(0,hy-4,12.5,Math.PI,0);c.closePath();},'#ffd84f',[0,hy-8,12]); d.circle(0,hy-13,3.2,'#fff6b0'); }
  if (A==='bandana') d.tri([[-7,-18.5],[0,-12],[7,-18.5]],'#ff5a5a');
  if (A==='glasses') d.line(c=>{c.arc(-5,ey,3.8,0,7);c.moveTo(8.8,ey);c.arc(5,ey,3.8,0,7);c.moveTo(-1.2,ey);c.lineTo(1.2,ey);},'#5b3345',.9);
  if (A==='bow'){ d.tri([[5,hy-9],[-1,hy-13],[-1,hy-5]],'#ff8fc4'); d.tri([[5,hy-9],[11,hy-13],[11,hy-5]],'#ff8fc4'); d.circle(5,hy-9,1.7,'#ffb3d9'); }
  if (A==='chef'){ d.circle(-5,hy-14,5,'#fff'); d.circle(5,hy-14,5,'#fff'); d.circle(0,hy-17,5.5,'#fff'); d.rr(-8.5,hy-12,17,5,2,'#fff'); }
  if (A==='flower'){ for (let ang=0;ang<6.28;ang+=1.256) d.dot(7+Math.cos(ang)*2.6,hy-8+Math.sin(ang)*2.6,2,'#ff8fc4'); d.dot(7,hy-8,1.5,'#ffe066'); }
  if (A==='cane'){ d.line(c=>{c.moveTo(11,-11);c.lineTo(12,1);},'#8a5a3b',1.6); }
  c.restore();
}

// Realtime Database는 배열 속 null을 지워 버려서, 텃밭 칸은 false 또는 {stage, wateredAt}로 저장해요 (stage -1 = 빈 텃밭)
function fromDB(p){
  if (!p) return p;
  const g = p.gardens || [];
  return { ...p, rel:p.rel||{}, inv:{garden:0, seed:0, tomato:0, can:false, gold:0, ...(p.inv||{})},
    gardens:[0,1].map(i=>{ const s = g[i]; if (!s) return null; return {crop: s.stage>=0 ? {stage:s.stage, wateredAt:s.wateredAt||null} : null}; }) };
}
function toDB(p){
  return { ...p, gardens: p.gardens.map(g => g ? {stage: g.crop ? g.crop.stage : -1, wateredAt: (g.crop && g.crop.wateredAt) || 0} : false) };
}
// 입주하지 않은 채 10분이 지난 선점은 다른 사람이 가져갈 수 있어요
function abandoned(c){ return !players[c.uid] && Date.now() - (c.at||0) > 600000; }

let saving=false, saveAgain=false;
async function saveMe(){
  if (saving){ saveAgain=true; return; }
  saving=true;
  try { await net.savePlayer(toDB(me)); }
  catch(e){ toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  saving=false;
  if (saveAgain){ saveAgain=false; saveMe(); }
}

// ===== 데이터 수신 =====
let firstPlayers = true, firstOnline = true;
function onPlayers(raw){
  const next = {};
  for (const [k,v] of Object.entries(raw||{})) if (v) next[k] = fromDB(v);
  players = next;
  rebuildObstacles();
  if (firstPlayers){ firstPlayers = false; if (players[uid]) enterGame(structuredClone(players[uid])); else showMaker(); }
  else if (obStep) renderOb();
}
function onRoofs(raw){
  const next = {};
  for (const [k,v] of Object.entries(raw||{})) if (v) next['roof-'+k] = v;
  claims = next; if (obStep && obStep!=='maker') renderOb();
}
function onOnline(raw){
  const seen = new Set();
  for (const [id, s] of Object.entries(raw||{})){
    if (id===uid || !s || typeof s.x!=='number' || !s.look) continue;
    seen.add(id);
    let o = others.get(id);
    if (!o){ o = {x:s.x, y:s.y, emoAt:s.emoAt}; others.set(id, o); if (!firstOnline) addLog(`${String(s.nick||'누군가').slice(0,8)}님이 섬에 왔어요`, true); }
    if (s.emoAt && s.emoAt!==o.emoAt){ o.emoAt = s.emoAt; if (s.emo && Date.now()-s.emoAt < 5000) bubbles.set(id+'-emo', {text:String(s.emo).slice(0,4), at:performance.now()}); }
    const oz = typeof s.z==='string' && ZONES[s.z] ? s.z : 'home';
    if (o.z && o.z!==oz){ o.x = s.x; o.y = s.y; }
    o.z = oz;
    Object.assign(o, {sx:s.x, sy:s.y, dir:s.dir||'down', mvRemote:s.mv, look:s.look, nick:String(s.nick||'').slice(0,8), uid:id});
    if (typeof s.tx==='number'){ o.goal = {x:s.tx, y:s.ty}; if (Math.hypot(o.x-s.x, o.y-s.y) > 48){ o.x = s.x; o.y = s.y; } }
    else o.goal = null;
  }
  for (const [id,o] of [...others]) if (!seen.has(id)){ others.delete(id); addLog(`${o.nick}님이 집에 갔어요`, true); }
  firstOnline = false;
  if (me) renderHud();
}
function onChat(m){
  if (!m || typeof m.t!=='string' || !m.t) return;
  const t = m.t.slice(0,80), age = Math.max(0, Date.now() - (m.at||Date.now()));
  addLog(`${String(m.nick||'누군가').slice(0,8)}: ${t}`);
  if (age < 5000) bubbles.set(m.uid===uid ? 'me' : m.uid, {text:t, at:performance.now()-age});
}

// ===== 연결 =====
function soloNet(){
  const st = {players:{}, roofs:{}};
  return {
    savePlayer: async d => { st.players[uid] = structuredClone(d); onPlayers(structuredClone(st.players)); },
    claimRoof: async i => { st.roofs[i] = {uid, nick:nickVal, at:Date.now()}; onRoofs(st.roofs); return true; },
    releaseRoof: async i => { delete st.roofs[i]; onRoofs(st.roofs); },
    claimLot: async () => true,
    presence: async () => {},
    sendChat: async t => onChat({uid, nick:me.nick, t, at:Date.now()}),
    listen(){ setTimeout(()=>{ onRoofs({}); onPlayers({}); }); },
  };
}
function firebaseNet(){
  const db = F.getDatabase(app), meRef = F.ref(db, 'online/'+uid);
  F.onDisconnect(meRef).remove();
  const tx = async (path, data) => {
    try {
      const r = await F.runTransaction(F.ref(db, path), cur => (!cur || cur.uid===uid || abandoned(cur)) ? data : undefined);
      return r.committed && r.snapshot.val()?.uid===uid;
    } catch(e){ return false; }
  };
  return {
    savePlayer: d => F.set(F.ref(db, 'players/'+uid), d),
    claimRoof: i => tx('roofs/'+i, {uid, nick:nickVal, at:Date.now()}),
    releaseRoof: i => F.remove(F.ref(db, 'roofs/'+i)).catch(()=>{}),
    claimLot: i => tx('lots/'+i, {uid, at:Date.now()}),
    presence: p => F.set(meRef, p),
    sendChat: t => F.push(F.ref(db, 'chat'), {uid, nick:me.nick, t, at:F.serverTimestamp()}),
    listen(){
      F.onValue(F.ref(db, 'players'), s=>onPlayers(s.val()), ()=>toast('섬 정보를 불러오지 못했어요.'));
      F.onValue(F.ref(db, 'roofs'), s=>onRoofs(s.val()));
      F.onValue(F.ref(db, 'online'), s=>onOnline(s.val()));
      F.onChildAdded(F.query(F.ref(db, 'chat'), F.limitToLast(15)), s=>onChat(s.val()));
    },
  };
}

(async function boot(){
  const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith('YOUR');
  if (!configured){
    solo = true;
    try { uid = localStorage.getItem('pinky-uid'); } catch(e){}
    if (!uid){ uid = 'local-' + Math.random().toString(36).slice(2,10); try { localStorage.setItem('pinky-uid', uid); } catch(e){} }
    net = soloNet(); start(); return;
  }
  try {
    const mods = await Promise.all(['firebase-app.js','firebase-auth.js','firebase-database.js'].map(f=>import(FB+f)));
    F = Object.assign({}, ...mods);
  } catch(e){ obc.innerHTML = '<h1>핑키 디저트 아일랜드</h1><p class="err">게임을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; return; }
  app = F.initializeApp(firebaseConfig);
  const auth = F.getAuth(app);
  F.onAuthStateChanged(auth, user => {
    if (!user){ showLogin(auth); return; }
    if (net) return;
    uid = user.uid; net = firebaseNet(); start();
  });
})();

function roofHolder(c, i){ if (!c || !c.uid) return null; const p = players[c.uid]; if (p) return p.roof===i ? c : null; return Date.now()-(c.at||0) < 600000 ? c : null; }
function takenBy(kind, i){ const c = roofHolder(claims[kind+'-'+i], i); return c && c.uid!==uid ? c : null; }

// ===== 주민 호감도: 1~3 아는 사이 / 4~6 괜찮은 사람 / 7~9 친한 친구 / 10 소중한 짝 =====
function relOf(id){ me.rel = me.rel || {}; return me.rel[id] = me.rel[id] || {pts:0, talkDay:0, giftDay:0}; }
function heartsN(n){ return heartsOf(relOf(n.id).pts); }
function tierLabel(n){ const h = heartsN(n); return `${TIERS[tierOf(h)]} ♥${h}`; }
function title(n){ return `${n.name} · ${n.animal} ${n.role} · ${tierLabel(n)}`; }
const fillName = s => String(s||'').replace(/\{name\}/g, me.nick);
const lastPick = {};
function pickLine(arr, key){
  if (!arr || !arr.length) return '';
  let i = Math.floor(Math.random()*arr.length);
  if (arr.length > 1 && lastPick[key] === i) i = (i+1) % arr.length;
  lastPick[key] = i; return fillName(arr[i]);
}
function addPts(n, v){
  const r = relOf(n.id), before = heartsOf(r.pts);
  r.pts = Math.max(0, Math.min(500, r.pts + v));
  const after = heartsOf(r.pts);
  return [4,7,10].filter(h => before < h && after >= h && !r['ev'+h]);
}
// 하트 4·7·10이 되는 순간 그 주민의 이야기가 열려요
function playEvents(n, list){
  const h = list[0]; if (h==null) return closeTalk();
  const ev = (n.events && n.events[h]) || {title:'조금 더 가까워졌어요', pages:['(조금 더 가까워진 것 같다)'], keepsake:''};
  const pages = ev.pages.map(fillName);
  let i = 0;
  const show = () => {
    const last = i === pages.length-1;
    if (!last) return say(`${n.name} · ${ev.title}`, pages[i], [['다음', ()=>{ i++; show(); }]], `${i+1}/${pages.length}`, true);
    const r = relOf(n.id); r['ev'+h] = true;
    me.inv.gold += STORY_GOLD[h];
    if (ev.keepsake){ me.keep = me.keep || {}; me.keep[n.id] = [...(me.keep[n.id]||[]), ev.keepsake]; }
    saveMe(); renderHud();
    const rest = list.slice(1);
    say(`${n.name} · ${ev.title}`, pages[i], rest.length ? [['다음 이야기', ()=>playEvents(n, rest)]] : [],
      `관계가 '${TIERS[tierOf(h)]}'(으)로 깊어졌어요 · ${STORY_GOLD[h]}G${ev.keepsake ? ` · 기념품 '${ev.keepsake}'` : ''}`);
  };
  show();
}
function npcActions(n){
  const r = relOf(n.id), acts = [];
  if (n.id==='momo'){
    if (me.inv.tomato) acts.push([`토마토 ${me.inv.tomato}개 팔기 (+${me.inv.tomato*TOMATO_PRICE}G)`, ()=>{ const g = me.inv.tomato*TOMATO_PRICE; me.inv.gold += g; me.inv.tomato = 0; saveMe(); renderHud(); say(title(n), `${g}G 여기 있어요~ 또 와 주세요!`, npcActions(n)); }]);
    acts.push([`씨앗 사기 (${SEED_PRICE}G)`, ()=>{ if (me.inv.gold < SEED_PRICE) return toast('돈이 모자라요'); me.inv.gold -= SEED_PRICE; me.inv.seed++; saveMe(); renderHud(); toast('토마토 씨앗 1개를 샀어요'); }]);
  }
  if (n.id==='toto' && me.daily !== today()) acts.push([`출석 선물 받기 (${DAILY_GOLD}G)`, ()=>{ me.daily = today(); me.inv.gold += DAILY_GOLD; saveMe(); renderHud(); say(title(n), `허허… 오늘도 와 주었구먼. 자, ${DAILY_GOLD}G일세.`, npcActions(n)); }]);
  if (r.giftDay !== today() && Object.keys(GIFT_ITEMS).some(k=>me.inv[k]>0)) acts.push(['선물하기', ()=>giftMenu(n)]);
  return acts;
}
function giftMenu(n){
  const acts = Object.entries(GIFT_ITEMS).filter(([k])=>me.inv[k]>0).map(([k,name])=>[`${name} (${me.inv[k]})`, ()=>giveGift(n,k)]);
  say(title(n), '무엇을 선물할까요? 하루에 한 번 줄 수 있어요.', acts);
}
function giveGift(n, item){
  const r = relOf(n.id);
  if (r.giftDay === today() || !(me.inv[item]>0)) return closeTalk();
  me.inv[item]--; r.giftDay = today();
  const taste = tasteOf(n, item), ups = addPts(n, GIFT_PTS[taste]);
  saveMe(); renderHud();
  const text = pickLine(n.react && n.react[taste], n.id+'r') || {loved:'정말 좋아해! 고마워!', liked:'고마워!', neutral:'고마워.', disliked:'음... 마음만 받을게.'}[taste];
  const note = `${GIFT_ITEMS[item]} 선물 · 호감도 ${GIFT_PTS[taste]>0?'+':''}${GIFT_PTS[taste]}`;
  if (ups.length) say(title(n), text, [['이야기 듣기', ()=>playEvents(n, ups)]], note + ' · 무언가 이야기하고 싶은 눈치예요', true);
  else say(title(n), text, [], note);
}
// ===== 대화: 주민이 3~5줄 말하고 → 선택지 → 대답에 따라 3~5줄 더 =====
function pickTalk(n){
  const r = relOf(n.id), tier = tierOf(heartsN(n)), talks = n.talks || [];
  const seen = (r.seen||'').split(',');
  const next = talks.find(t=>!seen.includes(t.id));
  if (next && next.tier <= tier) return {talk:next};
  if (next) return {locked:true};
  const cur = talks.filter(t=>t.tier===tier);
  return cur.length ? {talk:cur[Math.floor(Math.random()*cur.length)]} : {};
}
function runTalk(n, talk, opening, note, ups){
  const lines = [opening, ...talk.lines].filter(Boolean).map(fillName);
  let i = 0;
  const show = () => {
    const nt = i===0 ? note : '';
    if (i < lines.length-1) return say(title(n), lines[i], [['다음', ()=>{ i++; show(); }]], nt, true);
    say(title(n), lines[i], talk.choices.map(c=>[fillName(c.text), ()=>choose(c)]), nt, true, true);
  };
  const choose = c => {
    const r = relOf(n.id); let gain = 0, more = [];
    if (r.choiceDay !== today()){ r.choiceDay = today(); gain = c.pts||0; more = addPts(n, gain); }
    r.seen = [...(r.seen||'').split(',').filter(Boolean).filter(x=>x!==talk.id), talk.id].slice(-40).join(',');
    saveMe(); renderHud();
    const rep = (c.reply||['...']).map(fillName); let j = 0;
    const after = () => {
      if (j < rep.length-1) return say(title(n), rep[j], [['다음', ()=>{ j++; after(); }]], '', true);
      const all = [...new Set([...ups, ...more])].sort((a,b)=>a-b);
      const nt = gain ? `대답에 ${gain>0 ? '마음이 열렸어요' : '조금 서운해해요'} · 호감도 ${gain>0?'+':''}${gain}` : '';
      if (all.length) say(title(n), rep[j], [['이야기 듣기', ()=>playEvents(n, all)]], nt ? nt+' · 무언가 이야기하고 싶은 눈치예요' : '무언가 이야기하고 싶은 눈치예요', true);
      else say(title(n), rep[j], npcActions(n), nt);
    };
    after();
  };
  show();
}
function talkTo(n){
  const r = relOf(n.id), first = r.talkDay !== today();
  let note = '', ups = [];
  if (first){ r.talkDay = today(); ups = addPts(n, 10); note = '오늘 첫 대화 · 호감도 +10'; }
  if (n.soon) note = [note, n.soon].filter(Boolean).join(' · ');
  const hr = kstHour();
  const opening = first && n.greet ? pickLine(n.greet[hr>=5&&hr<11 ? 'morning' : hr>=11&&hr<18 ? 'day' : 'night'], n.id+'g') : '';
  let text = '';
  if (n.id==='hana' && me.quest < 6){
    if (me.quest<=1) text = '안녕! 나는 하나야! 먼저 웰컴 팩을 열고, 집 앞 빈 자리에 텃밭 2칸을 놓아 봐!';
    else if (me.quest===2){ me.inv.can = true; me.quest = 3; text = '텃밭 다 놓았구나! 자, 내 물뿌리개 줄게! 토마토 씨앗 심고 물 줘 봐! 헤헤.'; }
    else if (me.quest<5) text = '씨앗 심고 물 주면 30초마다 한 단계씩 자라! 단계마다 물 또 줘야 해!';
    else text = '토마토가 빨개지면 텃밭을 눌러서 수확해!';
  }
  if (n.id==='hana' && me.quest>=6 && !me.inv.seed && !me.gardens.some(g=>g&&g.crop) && me.inv.gold < SEED_PRICE){ me.inv.seed += 2; toast('하나가 토마토 씨앗 2개를 나눠 줬어요'); }
  saveMe(); renderHud();
  const pk = text ? {} : pickTalk(n);
  if (pk.talk) return runTalk(n, pk.talk, opening, note, ups);
  if (!text) text = [opening, pickLine(n.lines && n.lines[tierOf(heartsN(n))], n.id+'l')].filter(Boolean).join('\n') || '...';
  if (pk.locked) note = [note, '조금 더 친해지면 다음 이야기를 들려줄 것 같아요'].filter(Boolean).join(' · ');
  if (ups.length) say(title(n), text, [['이야기 듣기', ()=>playEvents(n, ups)]], (note ? note+' · ' : '') + '무언가 이야기하고 싶은 눈치예요', true);
  else say(title(n), text, npcActions(n), note);
}

function useSlot(i){
  const g = me.gardens[i], now = Date.now();
  if (!g){
    if (!me.inv.garden) return toast('놓을 텃밭이 없어요.');
    me.gardens[i] = {crop:null}; me.inv.garden--;
    if (me.quest===1 && me.gardens.every(Boolean)) { me.quest = 2; toast('텃밭 완성! 섬 서쪽 텃밭의 하나에게 가 봐요'); } else toast('텃밭을 놓았어요');
  } else if (!g.crop){
    if (!me.inv.seed) return toast(me.inv.can ? '씨앗이 없어요. 하나에게 가 봐요.' : '씨앗이 없어요.');
    g.crop = {stage:0, wateredAt:null}; me.inv.seed--;
    if (me.quest===3) me.quest = 4;
    toast('토마토 씨앗을 심었어요');
  } else {
    const c = cropNow(g.crop, now); g.crop = c;
    if (c.stage>=4){
      g.crop = null; me.inv.tomato += 3;
      if (me.quest<=5 && me.quest>=4){ me.quest = 6; me.inv.seed += 2; say('하나 · 꼬마 농부', '첫 수확 축하해! 기념으로 토마토 씨앗 2개 더 줄게. 다음에는 낚시, 채굴, 전투도 열릴 거야!'); }
      else toast('토마토 3개를 수확했어요!');
    } else if (!c.wateredAt){
      if (!me.inv.can) return toast('물뿌리개가 필요해요. 하나를 찾아가요.');
      g.crop = {stage:c.stage, wateredAt:now};
      if (me.quest===4) me.quest = 5;
      toast('물을 줬어요. 30초 뒤에 자라요');
    } else return toast(`${STAGE_NAMES[c.stage]} 단계 · ${Math.ceil((c.wateredAt+STAGE_MS-now)/1000)}초 뒤에 자라요`);
  }
  saveMe(); renderHud();
}

function interactNear(){

  for (const n of NPCS){ if (n.zone!==zoneId) continue; const d = Math.hypot(pos.x-n.x, pos.y-n.y); if (d<64 && d<bd){ bd=d; best=()=>talkTo(n); } }
  if (zoneId==='home' && me.lot!=null) slotsOf(me.lot).forEach((s,i)=>{ const d = Math.hypot(pos.x-s.x, pos.y-s.y-10); if (d<48 && d<bd){ bd=d; best=()=>useSlot(i); } });

// ===== 이동 =====
let stuckT = 0;
function step(dt){
  let vx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let vy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  keyMoving = !!(vx||vy);
  if (vx||vy) target = null;
  else if (target){
    const dx = target.x-pos.x, dy = target.y-pos.y, d = Math.hypot(dx,dy);
    if (d < 5 || (target.act && d < 30)){ const a = target.act; target = null; if (a) a(); }
    else { vx = dx/d; vy = dy/d; }
  }
  const len = Math.hypot(vx,vy);
  pos.moving = len>0;
  if (!len) return;
  vx/=len; vy/=len;
  pos.dir = Math.abs(vx) > Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
  const ox = pos.x, oy = pos.y, nx = pos.x + vx*SPEED*dt, ny = pos.y + vy*SPEED*dt;
  if (!blocked(nx, pos.y)) pos.x = nx;
  if (!blocked(pos.x, ny)) pos.y = ny;
  checkExit();
  if (target && Math.hypot(pos.x-ox, pos.y-oy) < SPEED*dt*.2){ stuckT += dt; if (stuckT>.35){ const tg = target; target = null; stuckT = 0; if (tg.act && Math.hypot(pos.x-tg.x, pos.y-tg.y) < 64) tg.act(); } } else stuckT = 0;
}

let lastPres = 0, presSig = '', lastTarget = null;
function sendPresence(t){
  if (!net || !me) return;
  const tgt = target && !keyMoving ? target : null;
  const p = {z:zoneId, nick:me.nick, look:me.look, roof:me.roof, x:Math.round(pos.x), y:Math.round(pos.y), dir:pos.dir, mv:pos.moving?1:0, emo:emo.e||'', emoAt:emo.at||0};
  if (tgt){ p.tx = Math.round(tgt.x); p.ty = Math.round(tgt.y); }
  const sig = JSON.stringify(tgt ? {...p, x:0, y:0, dir:0, mv:0} : p);
  let go = false;
  if (tgt !== lastTarget) go = true;                              // 목적지가 바뀌면 바로 보내요 (나머지는 각자 화면에서 걸어가요)
  else if (keyMoving) go = t-lastPres >= 250;                     // 키보드로 걸을 땐 0.25초마다
  else if (sig !== presSig) go = t-lastPres >= 120;               // 멈춤, 방향, 이모티콘
  if (!go) return;
  lastTarget = tgt; presSig = sig; lastPres = t;
  net.presence(p).catch(()=>{});
}
function moveOthers(dt){
  for (const o of others.values()){
    if (o.goal){
      const dx = o.goal.x-o.x, dy = o.goal.y-o.y, d = Math.hypot(dx,dy);
      if (d < 4){ o.goal = null; o.mv = 0; continue; }
      const st = Math.min(d, SPEED*dt); o.x += dx/d*st; o.y += dy/d*st; o.mv = 1;
      o.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    } else {
      const k = Math.min(1, dt*8); o.x += (o.sx-o.x)*k; o.y += (o.sy-o.y)*k;
      o.mv = o.mvRemote || Math.hypot(o.sx-o.x, o.sy-o.y) > 2 ? 1 : 0;
    }
  }
}

// ===== 그리기 =====
function drawTree(d, x, y, i){
  d.rr(x-3,y,6,38,3,'stick');
  d.circle(x,y,20,i%2?'candyB':'candyA'); d.circle(x,y,11,i%2?'candyA':'candyB'); d.circle(x,y,4,i%2?'candyB':'candyA');
}
function drawBuilding(d, x, y, roof, label, w=92){
  const h = w/2;
  d.rr(x-h,y-72,w,72,10,'cream');
  d.rr(x-h-8,y-102,w+16,38,16,roof);
  const n = Math.round(w/15); for (let i=0;i<=n;i++) d.circle(x-h+1+i*(w-2)/n,y-66,7,roof);
  d.stitch(c=>{c.moveTo(x-h-2,y-92);c.lineTo(x+h+2,y-92);});
  d.rr(x-11,y-36,22,36,9,'choco'); d.dot(x+6,y-18,1.8,'#ffd84f');
  d.circle(x-h+17,y-40,8,'waterHi'); d.circle(x+h-17,y-40,8,'waterHi');
  if (label){ const c=d.ctx; c.font='13px "Jua",sans-serif'; c.textAlign='center'; c.fillStyle='rgba(255,255,255,.95)'; c.fillText(label, x, y-80); }
}
function drawHouse(d, x, y, roof, nick){ drawBuilding(d, x, y, roof, nick, 92); }
function signPost(d, text, x, y){
  const c = d.ctx; c.font='12px "Jua",sans-serif'; const w = c.measureText(text).width+16;
  d.rr(x-2,y-6,4,24,2,'#c79a74'); d.rr(x-w/2,y-24,w,20,7,'#f3d9b8');
  c.textAlign='center'; c.fillStyle='#7a5040'; c.fillText(text, x, y-9);
}
function drawZonePlace(d, z, p){
  const c = d.ctx;
  if (p.kind==='house'){ drawBuilding(d, p.x, p.y, p.roof, p.label, p.wide ? 140 : 92); c.font='22px sans-serif'; c.textAlign='center'; c.fillText(p.icon||'', p.x, p.y-108); }
  else if (p.kind==='fountain'){ d.ell(p.x,p.y,200,110,'path'); d.circle(p.x,p.y,40,'#ffd1e1'); d.circle(p.x,p.y,28,'water'); d.circle(p.x-6,p.y-8,9,'waterHi'); }
  else if (p.kind==='pond'){ d.ell(p.x,p.y,p.rx,p.ry,'water'); d.ell(p.x-p.rx*.3,p.y-p.ry*.35,p.rx*.25,10,'waterHi'); d.circle(p.x+p.rx*.5,p.y+p.ry*.3,9,'leaf'); d.circle(p.x-p.rx*.55,p.y+p.ry*.4,7,'leaf'); d.dot(p.x+p.rx*.5,p.y+p.ry*.3-2,2.5,'#ff8fc4'); }
  else if (p.kind==='field'){
    d.rr(p.x-95,p.y-95,190,110,14,'soil');
    for (let i=0;i<4;i++) for (let j=0;j<2;j++){ const x = p.x-66+i*44, y = p.y-62+j*44; d.circle(x-5,y,6,'leaf'); d.circle(x+5,y-1,6,'leaf'); d.circle(x,y-6,6,'#7fd07a'); d.circle(x-4,y+1,3.4,'#ff4f4f'); d.circle(x+4,y-3,3.4,'#ff5a5a'); }
    d.rr(p.x+108,p.y-90,5,60,2,'#c79a74'); d.rr(p.x+96,p.y-74,30,5,2,'#c79a74'); d.circle(p.x+110,p.y-94,9,'#f3d27a'); d.ell(p.x+110,p.y-101,13,3,'#e8b84f');
    signPost(d, '하나의 텃밭', p.x-130, p.y+20);
  }
  else if (p.kind==='mine'){
    d.ell(520,900,220,150,'#b3a8b8'); d.ell(1080,900,220,150,'#b3a8b8'); d.ell(420,840,90,60,'#c6bccd'); d.ell(1180,850,80,55,'#a99fb0');
    d.rr(744,980,112,120,50,'#4a3f52'); d.rr(736,972,128,16,8,'#c79a74');
    d.dot(600,820,4,'#bf8cff'); d.dot(1000,840,3.5,'#ffd84f'); d.dot(460,960,3,'#7cc8ff');
  }
  else if (p.kind==='lighthouse'){
    const x = p.x, y = p.y;
    d.rr(x-22,y-150,44,150,12,'#ffffff'); for (const yy of [y-124,y-80,y-36]) d.rr(x-22,yy,44,16,3,'#ff6b6b');
    d.rr(x-28,y-176,56,28,10,'#ffd84f'); d.tri([[x-32,y-174],[x,y-200],[x+32,y-174]],'#ff6b6b');
    signPost(d, '펭펭 등대', x-100, y+20);
  }
  else if (p.kind==='sea'){ c.fillStyle='#8fd3f5'; c.fillRect(0,0,z.W,240); c.fillStyle='#b4e3fa'; for (let i=0;i<30;i++) c.fillRect((i*197)%z.W, 30+(i*61)%180, 22, 3); d.rr(-20,226,z.W+40,30,15,'#fff7e6'); }
  else if (p.kind==='tree'){ d.rr(p.x-8,p.y-10,16,60,6,'#a8744f'); d.circle(p.x,p.y-30,60,'#c9a6ff'); d.circle(p.x-40,p.y-10,36,'#d9c2ff'); d.circle(p.x+42,p.y-14,34,'#b58cff'); for (let i=0;i<10;i++) d.dot(p.x-50+((i*37)%100),p.y-70+((i*53)%80),3,'#fff6b0'); }
  else if (p.kind==='logs'){ d.rr(p.x-60,p.y-30,120,40,10,'#c98e5b'); for (const [lx,ly] of [[-36,-10],[0,-10],[36,-10],[-18,-30],[18,-30]]) { d.circle(p.x+lx,p.y+ly,16,'#d9a46f'); d.circle(p.x+lx,p.y+ly,7,'#e8c39e'); } }
  else if (p.kind==='crystals'){ for (const [x,y,col] of [[300,300,'#bf8cff'],[1300,320,'#7cc8ff'],[260,800,'#ff8fc4'],[1320,820,'#bf8cff'],[700,260,'#6fe0c4'],[1000,880,'#ffd84f']]){ d.tri([[x-10,y+10],[x,y-24],[x+10,y+10]],col); d.tri([[x+6,y+12],[x+16,y-8],[x+22,y+12]],col); } }
  else if (p.kind==='sign') signPost(d, p.text, p.x, p.y);
}
function buildStatic(){
  const z = Z(), T = THEME[z.theme];
  const s = Math.min(1.6, view.dpr*view.zoom);
  const sig = zoneId+'|'+s+'|'+(zoneId==='home' ? Object.entries(players).map(([k,p])=>k+p.lot+p.roof+p.nick).join(',') : '');
  if (sig===staticSig && staticLayer) return;
  staticSig = sig;
  staticLayer = staticLayer || document.createElement('canvas');
  staticLayer.width = z.W*s; staticLayer.height = z.H*s;
  const c = staticLayer.getContext('2d'); c.setTransform(s,0,0,s,0,0);
  const d = painter(c);
  c.fillStyle = T.ground; c.fillRect(0,0,z.W,z.H);
  for (let i=0;i<14;i++) d.ell((i*331)%z.W, (i*197)%z.H, 50+(i%3)*20, 16+(i%2)*6, T.ground2);
  if (z.theme==='flower') for (let i=0;i<120;i++) d.dot(M+(i*173)%(z.W-2*M), M+(i*97)%(z.H-2*M), 2.6, ['#ff8fc4','#ffe066','#ffffff','#c9a6ff'][i%4]);
  if (z.theme==='night') for (let i=0;i<70;i++) d.dot((i*223)%z.W, (i*137)%z.H, 1.6, '#fff6b0', .8);
  // 구역 길: 출구에서 가운데로
  const cx = z.W/2, cy = z.H/2, ex = z.exits;
  if (ex.n) d.rr(cx-17,-10,34,cy+10,17,T.path); if (ex.s) d.rr(cx-17,cy,34,z.H/2+10,17,T.path);
  if (ex.w) d.rr(-10,cy-17,cx+10,34,17,T.path); if (ex.e) d.rr(cx,cy-17,z.W/2+10,34,17,T.path);
  for (const p of z.places) drawZonePlace(d, z, p);
  // 가장자리: 나무 / 바위 (출구 자리는 비워요)
  const edgeCol = z.theme==='cave' ? '#5b5266' : z.theme==='sand' ? '#ffd29a' : T.edge;
  const open = (x,y) => (ex.n && y<M && Math.abs(x-cx)<GAP+20) || (ex.s && y>z.H-M && Math.abs(x-cx)<GAP+20) || (ex.w && x<M && Math.abs(y-cy)<GAP+20) || (ex.e && x>z.W-M && Math.abs(y-cy)<GAP+20);
  for (let x=20; x<z.W; x+=64) for (const y of [26, z.H-26]) if (!open(x,y)) d.circle(x+(y%7), y, 44, edgeCol);
  for (let y=20; y<z.H; y+=64) for (const x of [26, z.W-26]) if (!open(x,y)) d.circle(x, y+(x%5), 44, edgeCol);
  for (const [x,y] of z.trees) drawTree(d,x,y,x+y);
  if (zoneId==='home') LOTS.forEach((L,i)=>{
    const owner = Object.values(players).find(p=>p.lot===i);
    if (owner) drawHouse(d, L.x, L.y, ROOFS[owner.roof][1], owner.nick);
    else {
      c.save(); c.setLineDash([6,5]); c.lineWidth=2; c.strokeStyle='#ffffffcc'; c.beginPath(); c.roundRect(L.x-48,L.y-78,96,78,12); c.stroke(); c.restore();
      d.rr(L.x-2,L.y-40,4,24,2,'#c79a74'); d.rr(L.x-20,L.y-56,40,18,5,'#e8c39e');
      c.font='11px "Jua",sans-serif'; c.textAlign='center'; c.fillStyle='#7a5040'; c.fillText(`${i+1}번 빈 집터`, L.x, L.y-43);
    }
  });
  // 출구 표지판
  if (ex.n) signPost(d, `↑ ${ZONES[ex.n].name}`, cx+110, M+50);
  if (ex.s) signPost(d, `↓ ${ZONES[ex.s].name}`, cx+110, z.H-M-10);
  if (ex.w) signPost(d, `← ${ZONES[ex.w].name}`, M+80, cy-50);
  if (ex.e) signPost(d, `→ ${ZONES[ex.e].name}`, z.W-M-80, cy-50);
}
function drawSlot(d, s, g, now, mine){
  const c = d.ctx;
  if (!g){
    if (!mine || !me.inv.garden) return;
    c.save(); c.setLineDash([4,4]); c.lineWidth=2; c.strokeStyle = (now/400|0)%2 ? '#ff8fb3' : '#ffffff'; c.beginPath(); c.roundRect(s.x-15,s.y-15,30,30,8); c.stroke(); c.restore();
    c.font='18px "Jua",sans-serif'; c.textAlign='center'; c.fillStyle='#ff8fb3'; c.fillText('+', s.x, s.y+6);
    return;
  }
  const cr = cropNow(g.crop, now);
  d.rr(s.x-15,s.y-15,30,30,8, cr && cr.wateredAt ? '#b07a55' : 'soil');
  d.stitch(c=>c.roundRect(s.x-12,s.y-12,24,24,6),'#ffffff',.45);
  if (!cr) return;
  const st = cr.stage, x = s.x, y = s.y+4;
  if (st===0){ d.dot(x-4,y-2,1.6,'#6b4a35'); d.dot(x+3,y-5,1.6,'#6b4a35'); d.dot(x,y+1,1.6,'#6b4a35'); }
  if (st>=1){ d.line(c=>{c.moveTo(x,y);c.lineTo(x,y-8-st*3);},'#4f9e46',2); d.ell(x-4,y-8,4,2,'leaf'); d.ell(x+4,y-10,4,2,'leaf'); }
  if (st>=2){ d.circle(x-6,y-14,6,'leaf'); d.circle(x+6,y-15,6,'leaf'); d.circle(x,y-20,6,'#7fd07a'); }
  if (st===3){ d.dot(x-6,y-17,2,'#ffe066'); d.dot(x+5,y-20,2,'#ffe066'); d.dot(x+1,y-25,2,'#ffe066'); }
  if (st===4){ d.circle(x-6,y-12,4.5,'#ff4f4f'); d.circle(x+6,y-14,4.5,'#ff4f4f'); d.circle(x,y-21,4.5,'#ff5a5a'); }
  if (mine && st<4 && !cr.wateredAt){ const b = Math.sin(now/250)*2; d.dot(x+13,y-28+b,4,'#6fc3ff'); d.tri([[x+9.8,y-29+b],[x+13,y-36+b],[x+16.2,y-29+b]],'#6fc3ff'); }
  if (mine && st===4){ const b = Math.sin(now/250)*2; c.font='14px "Jua",sans-serif'; c.textAlign='center'; c.fillText('✨', x+14, y-26+b); }
}
function tag(c, text, x, y, color){
  c.font='13px "Jua",sans-serif'; c.textAlign='center';
  const w = c.measureText(text).width + 12;
  c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.roundRect(x-w/2, y-12, w, 17, 8); c.fill();
  if (color){ c.fillStyle=color; c.beginPath(); c.roundRect(x-w/2, y-12, 5, 17, [8,0,0,8]); c.fill(); }
  c.fillStyle='#6b3a4d'; c.fillText(text, x+(color?2:0), y+1);
}
function bubble(c, text, x, y){
  c.font='14px "Jua",sans-serif'; c.textAlign='center';
  const w = Math.min(200, c.measureText(text).width + 18);
  c.fillStyle='#fff'; c.beginPath(); c.roundRect(x-w/2, y-24, w, 24, 12); c.fill();
  c.beginPath(); c.moveTo(x-5,y); c.lineTo(x,y+6); c.lineTo(x+5,y); c.fill();
  c.fillStyle='#6b3a4d'; c.fillText(text.length>16 ? text.slice(0,15)+'…' : text, x, y-7);
}

let lastT = performance.now();
function frame(t){
  const dt = Math.min(.05, (t-lastT)/1000); lastT = t;
  if (obStep==='maker'){ const pc = $('obprev'); if (pc && pc.width){ const c = pc.getContext('2d'), k = pc.width/240; c.setTransform(k,0,0,k,0,0); c.fillStyle='#fff7f2'; c.fillRect(0,0,240,120); const d = painter(c); d.ell(120,104,110,9,'#f6dcd3'); player(d,45,102,EDIT,'down',t/1000,true,1.95); player(d,120,102,EDIT,'right',t/1000,true,1.95); player(d,195,102,EDIT,'up',t/1000,true,1.95); } }
  if (me && !obStep){
    const tp = toriPos(Date.now()), tori = NPC.tori; tori.x = tp.x; tori.y = tp.y; tori.mv = tp.mv; if (tp.dx) tori.flip = tp.dx < 0;
    step(dt); moveOthers(dt); sendPresence(t);
    buildStatic();
    const z = view.zoom, vw = view.w/z, vh = view.h/z;
    const W = Z().W, H = Z().H;
    view.cx = Math.max(0, Math.min(W-vw, pos.x - vw/2)); view.cy = Math.max(0, Math.min(H-vh, pos.y - 20 - vh/2));
    if (vw > W) view.cx = (W-vw)/2; if (vh > H) view.cy = (H-vh)/2;
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#8fd3f5'; ctx.fillRect(0,0,cv.width,cv.height);
    const s = view.dpr*z; ctx.setTransform(s,0,0,s,-view.cx*s,-view.cy*s);
    ctx.drawImage(staticLayer, 0, 0, W, H);
    const d = painter(ctx), now = Date.now();
    if (zoneId==='home') for (const [id,p] of Object.entries(players)){ if (p.lot==null) continue; const g = id===uid ? me.gardens : (p.gardens||[]); slotsOf(p.lot).forEach((sl,i)=>drawSlot(d, sl, g[i], now, id===uid)); }
    if (target && !target.act){ const a = (t-target.mark)/600; ctx.save(); ctx.globalAlpha = Math.max(0,1-a*.5); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(target.x,target.y,10,5,0,0,7); ctx.stroke(); ctx.restore(); }
    const ents = [
      ...NPCS.filter(n=>n.zone===zoneId).map(n=>({y:n.y, draw:()=>critter(d,n.x,n.y,n.look||{kind:n.sp.kind,fur:n.sp.fur},t/1000,!!n.mv,1), label:()=>tag(ctx, n.name, n.x, n.y-50, null)})),
      ...[...others.entries()].filter(([k,o])=>o.z===zoneId).map(([k,o])=>({y:o.y, draw:()=>player(d,o.x,o.y,o.look,o.dir||'down',t/1000,!!o.mv,1), label:()=>{ tag(ctx,o.nick,o.x,o.y-54,o.uid&&players[o.uid]?ROOFS[players[o.uid].roof][1]:null); talkBubble(k,o.x,o.y,t); }})),
      {y:pos.y, draw:()=>player(d,pos.x,pos.y,me.look,pos.dir,t/1000,pos.moving,1), label:()=>{ tag(ctx,me.nick,pos.x,pos.y-54,ROOFS[me.roof][1]); talkBubble('me',pos.x,pos.y,t); }},
    ].sort((a,b)=>a.y-b.y);
    for (const e of ents) e.draw();
    for (const e of ents) e.label();
    $('fade').style.opacity = Math.max(0, 1 - (t - fadeT)/450);
  }
  requestAnimationFrame(frame);
}
function talkBubble(key, x, y, t){
  const e = bubbles.get(key+'-emo'), b = bubbles.get(key);
  if (b && t-b.at < 5000) bubble(ctx, b.text, x, y-70);
  else if (e && t-e.at < 3000) bubble(ctx, e.text, x, y-70);
}
requestAnimationFrame(frame);
if (solo) window.__pinky = { useSlot, talkTo, giveGift, NPCS, pos, view, painter, animalNpc, enterZone, addPts, playEvents, get zone(){ return zoneId; }, get me(){ return me; } }; // 혼자 보기 모드 테스트용
