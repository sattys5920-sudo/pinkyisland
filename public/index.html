<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>pinkyisland</title>
<meta name="theme-color" content="#fffafb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pinkyisland">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="preload" href="fonts/Maplestory_Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Maplestory_Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--ink:#2a2429;--soft:#6f6569;--card:#fffdfd;--pink:#fbdbe5;--pinkd:#e48fac;--line:#f7e6ec;--sea:#cfeefb}
[hidden]{display:none!important}
button,a,label,input,select,.tile,.btn,.pill{touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
/* 게임 전체 글꼴: 메이플스토리체 (넥슨). 예전 Dongle 크기에 맞춘 화면이라 "Dongle" 이름으로 70% 크기로 불러요 */
@font-face{font-family:"Dongle";font-weight:100 500;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Dongle";font-weight:600 900;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:100 500;font-display:swap;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:600 900;font-display:swap;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
body{margin:0;background:var(--sea);color:var(--ink);font:700 21px/1.15 "Dongle",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#kicked{position:fixed;inset:0;z-index:50;background:rgba(60,30,50,.45);display:grid;place-items:center;padding:16px}#kicked .pill{max-width:340px;padding:18px 20px;text-align:center}#kicked b{font-size:24px}#kicked p{font-size:18px;color:var(--soft)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:linear-gradient(#fff,#fff8fa);border-radius:16px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
#hud{left:calc(env(safe-area-inset-left,0px) + 10px)!important;font-size:18px!important;gap:6px 10px!important;flex-wrap:wrap;max-width:calc(100vw - 20px - min(260px,46vw) - 10px);position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:20px;z-index:5}
#stats{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 56px);width:min(330px,calc(100vw - 20px - min(260px,46vw) - 10px));display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 4px;gap:3px 6px;align-items:center;padding:5px 8px 4px;background:rgba(255,250,252,.9);border-radius:12px;box-shadow:inset 0 -2px 0 #f7e3ea,0 3px 10px #d4a3b51f}
#stats #lvTag{grid-row:1/3;background:#b58cff;color:#fff;border-radius:9px;padding:1px 7px;font-size:17px;font-weight:normal;line-height:1.3}
#stats .sb{position:relative;height:16px;border-radius:8px;background:#f6e3ea;overflow:hidden;box-shadow:inset 0 1px 2px #0001}
#stats .sb s{position:absolute;left:0;top:0;bottom:0;border-radius:8px;text-decoration:none;transition:width .25s}
#stats .sb.hp s{background:linear-gradient(#ff9bb5,#ff6b8f)}
#stats .sb.st s{background:linear-gradient(#ffe27a,#ffc23f)}
#stats .sb.low{animation:lowPulse .8s ease-in-out infinite}
@keyframes lowPulse{50%{box-shadow:0 0 0 2px #ff6b8f}}
#stats .sb em{position:absolute;inset:0;font-style:normal;font-size:14px;line-height:16px;text-align:center;color:#5a3a4a;white-space:nowrap}
#stats .xb{grid-column:2/4;height:4px;border-radius:2px;background:#efe6fb;overflow:hidden;position:relative}
#stats .xb s{position:absolute;left:0;top:0;bottom:0;background:#b58cff;text-decoration:none;transition:width .25s}
#stats .xb em{display:none}
body.dlg-on #stats{visibility:hidden}
#hud u{text-decoration:none;font-size:.62em;margin-right:3px;vertical-align:1px}
img.ui{width:1.05em;height:1.05em;vertical-align:-.2em;margin:0 .12em}
#hud img.ui{width:20px;height:20px;vertical-align:-4px;margin:0 3px 0 0}
img.mi{width:30px;height:30px;vertical-align:middle;display:block}
img.bi{width:34px;height:34px;display:block;pointer-events:none}
.emo img.bi{width:30px;height:30px;margin:auto}
.btn img.ui{width:1.15em;height:1.15em}
.np-name img.ui{width:28px;height:28px;vertical-align:-8px;margin:0 6px 0 0}
#hud b{font-weight:inherit}
#hud i{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:4px}
#quest{right:calc(env(safe-area-inset-right,0px) + 10px)!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-width:min(260px,46vw);padding:8px 12px;font-size:19px;z-index:5}
#quest b{display:block;font-size:16px;color:var(--soft)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:6px;z-index:5}
#bar div{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-size:32px;box-shadow:inset 0 -2px 0 #f6e6ec}
#bar div.off{opacity:.28;filter:grayscale(1)}
#bar span{position:absolute;right:3px;bottom:0;font-size:16px;color:var(--ink)}
#chatbox{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(320px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:4px;font-size:19px;text-shadow:0 1px 0 #fff,0 0 4px #fff}
#log p{margin:0;transition:opacity 1s}
#log p.sys{color:var(--ink);opacity:.85}
#chatrow{display:flex;gap:6px;pointer-events:auto}
#friendBtn{position:relative}#dmBadge{position:absolute;right:-2px;top:-2px;min-width:20px;height:20px;border-radius:10px;background:#ff5a8a;color:#fff;font-size:14px;line-height:20px;font-weight:normal;padding:0 5px}
.np.dm-row{grid-template-columns:auto 1fr auto;align-items:center;gap:0 8px}.np.dm-row .np-name{text-align:left;min-width:0}.dm-dot{width:10px;height:10px;border-radius:50%;background:#cfc3c9;align-self:center;margin-right:2px}.dm-dot.on{background:#5fd07a;box-shadow:0 0 0 3px #5fd07a33}
.dm-unread{background:#ff5a8a;color:#fff;border-radius:10px;padding:0 7px;font-size:14px;margin-left:4px}
.dm-head{flex:none;display:flex;align-items:center;gap:8px}.dm-head b{font-size:20px;font-weight:normal}.dm-head small{color:var(--soft);font-size:15px;margin-right:auto}
.dm-list{flex:1 1 auto;min-height:180px;max-height:46dvh;overflow:auto;display:flex;flex-direction:column;gap:6px;background:#fff6f9;border-radius:14px;padding:10px}
.dm-msg{max-width:78%;align-self:flex-start;background:#fff;border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:18px;line-height:1.35;box-shadow:inset 0 -2px 0 #f3dbe5;white-space:pre-wrap;overflow-wrap:anywhere}
.dm-msg.me{align-self:flex-end;background:var(--pink);border-radius:14px 14px 4px 14px;box-shadow:inset 0 -2px 0 #f2c3d3}
.dm-msg small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.dm-line{display:flex;gap:6px;align-items:flex-start;align-self:flex-start;max-width:86%}.dm-line .dm-msg{max-width:100%;align-self:flex-start}.dm-col{display:flex;flex-direction:column;gap:2px;min-width:0}.dm-col b{font-weight:normal;font-size:14px;color:var(--soft);margin-left:2px}
.dm-pic{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:#ffeaf2;box-shadow:0 0 0 2px #fff}span.dm-pic{background:none;box-shadow:none}span.dm-pic.dm-init{background:#ffd6e6;box-shadow:0 0 0 2px #fff;display:grid;place-items:center;font-size:18px;color:var(--ink)}
.dm-ava{position:relative;width:42px;height:42px;flex:none}.dm-ava img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ffeaf2;box-shadow:0 0 0 2px #fff}.dm-ava .dm-dot{position:absolute;right:-1px;bottom:-1px;margin:0;border:2px solid #fff}
.dm-day{align-self:center;font-size:13px;color:var(--soft);background:#fff;border-radius:10px;padding:0 10px}
.dm-in{flex:none;display:flex;gap:6px}.dm-in input{flex:1;min-width:0;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink)}
body:not(.chat-open) #chatrow,body:not(.chat-open) #emorow,body:not(.chat-open) #chatHist{display:none}
body.chat-open #log{display:none}
#chatHist{pointer-events:auto;max-height:min(38vh,320px);overflow-y:auto;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 8px;box-shadow:0 2px 8px rgba(80,40,60,.12);display:flex;flex-direction:column;gap:3px;font-size:15px;overscroll-behavior:contain}
#chatHist p{margin:0;line-height:1.35;word-break:break-all}#chatHist p b{color:#c2457a;margin-right:6px}#chatHist p.me b{color:#7a5cc9}#chatHist time{color:#b9a0ac;font-size:11px;margin-left:6px}#chatHist p.sys{color:#9b7d8b;font-size:13px}
body.typing #chatHist{max-height:min(22vh,160px)} /* 채팅은 [채팅] 버튼을 누를 때만 열려요 (평소엔 화면을 가리지 않게) */
#emorow{display:flex;gap:6px;pointer-events:auto}
#log p{background:rgba(255,255,255,.72);border-radius:10px;padding:2px 10px;align-self:flex-start;max-width:100%;text-shadow:none}
#chatin{flex:1;min-width:0;font:700 20px "Dongle",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffffff0;color:var(--ink)}
.tv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tv-cell{background:#fff;border-radius:10px;padding:3px 6px;text-align:center;line-height:1.05}.tv-cell small{display:block;font-size:15px;color:var(--soft)}.tv-cell.on{background:#ffe0ec;outline:2px solid #ff8fb6}
.emo.send{width:auto;padding:0 12px;font:700 21px "Dongle",sans-serif;color:#fff;background:#ff8fb6;box-shadow:inset 0 -2px 0 #e06a96}
.emo{border:0;border-radius:12px;background:#fff;width:44px;min-height:44px;font-size:25px;box-shadow:inset 0 -2px 0 #f6e6ec}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(520px,calc(100vw - 20px));padding:14px 16px;z-index:13}
#talk h3{margin:0 0 4px;font-size:25px;color:var(--ink)}
#talk p{margin:0 0 10px;font-size:21px;white-space:pre-line}
#talk .sd{color:#9a8792;font-weight:400;font-style:italic}
/* ===== 이야기 대화창 ===== */

:root{--dlg-k:1}
#dlgDim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:13}
body.dlg-on #bar,body.dlg-on #sideBtns,body.dlg-on #chatbox,body.dlg-on #quest{visibility:hidden}
body.dlg-on #toast{z-index:16}
#dlg{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;min-height:140px;box-sizing:border-box;padding:34px 20px 20px;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;box-shadow:0 6px 0 #f0d3df,0 14px 30px rgba(90,40,64,.22);z-index:14;font-family:Maple,system-ui,sans-serif;color:#3a2c33;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation}
#dlg .dlg-who{position:absolute;top:-34px;left:16px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#dlg .dlg-who.right{left:auto;right:58px;flex-direction:row-reverse}
#dlg .dlg-who.off{visibility:hidden}
#dlg .dlg-face{width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-sizing:content-box;background:#ffe8f1;box-shadow:0 3px 8px rgba(90,40,64,.18);object-fit:cover}
#dlg .dlg-name{margin-bottom:12px;background:var(--nc,#d0457a);color:#fff;font-weight:800;font-size:16px;line-height:1;padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
#dlg .dlg-heart{margin-bottom:15px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#c2456f}
#dlg .dlg-heart em{display:block;width:34px;height:6px;border-radius:3px;background:#f6dbe6;overflow:hidden}#dlg .dlg-heart em s{display:block;height:100%;background:#ff7aa8;text-decoration:none}
#dlg .dlg-who.right .dlg-heart{display:none}
#dlg .dlg-logbtn{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid #f3d6e2;background:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#dlg .dlg-body{position:relative;min-height:calc(18px*var(--dlg-k)*1.6*2)}
#dlg .dlg-text{margin:0;font-size:calc(18px*var(--dlg-k));line-height:1.6;font-weight:400;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;padding-right:34px}
#dlg .dlg-text.narr{font-size:calc(15px*var(--dlg-k));color:#7a6670;font-weight:400}
#dlg .dlg-text.narr::before{content:'✦ ';color:#e79bbb}
#dlg .dlg-more{position:absolute;right:0;bottom:2px;font-size:13px;color:#e07aa3;animation:dlgBob 1.1s ease-in-out infinite}
@keyframes dlgBob{50%{transform:translateY(4px)}}
#dlg .dlg-choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dlg .dlg-choices button{height:48px;width:100%;border:2px solid #f3d6e2;border-radius:16px;background:#fff0f6;color:#3a2c33;font:400 calc(16px*var(--dlg-k)) Maple,system-ui,sans-serif;text-align:left;padding:0 16px;box-shadow:0 3px 0 #f0d3df;cursor:pointer}
#dlg .dlg-choices button:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3df}
#dlg .dlg-hint{margin:10px 0 0;font-size:13px;color:#9a8792}
#dlg .dlg-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#dlg .dlg-acts button{border:0;border-radius:999px;background:#ffe3ee;color:#5a3a4a;font:600 14px Maple,system-ui,sans-serif;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #f2c9d9}
#dlg .dlg-acts button.ghost{background:#fff;border:2px solid #f3d6e2;box-shadow:none}
#dlg .dlg-acts img{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
#dlg .dlg-pop{position:absolute;top:-58px;left:92px;background:#fff;border:2px solid #ffc2d7;color:#d0457a;font:800 15px Maple,system-ui,sans-serif;padding:4px 10px;border-radius:999px;opacity:0;pointer-events:none}
#dlg .dlg-pop.on{animation:dlgPop 1.8s ease-out forwards}
@keyframes dlgPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#dlgCard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;padding:18px 28px;text-align:center;box-shadow:0 6px 0 #f0d3df,0 16px 34px rgba(90,40,64,.25);font-family:Maple,system-ui,sans-serif;animation:dlgCard 1.5s ease forwards;pointer-events:none;max-width:calc(100vw - 48px)}
#dlgCard small{display:block;font-size:14px;color:#9a8792;font-weight:600}#dlgCard b{display:block;margin-top:4px;font-size:22px;color:#3a2c33;font-weight:800}
@keyframes dlgCard{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#dlgLog{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;z-index:17;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;display:flex;flex-direction:column;font-family:Maple,system-ui,sans-serif;color:#3a2c33;box-shadow:0 14px 30px rgba(90,40,64,.25)}
#dlgLog .dl-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:2px solid #f6e3eb}#dlgLog .dl-head b{font-size:17px;margin-right:auto;white-space:nowrap}#dlgLog .dl-head span{white-space:nowrap}#dlgLog .dl-head{gap:5px}
#dlgLog .dl-head button{border:2px solid #f3d6e2;background:#fff;border-radius:999px;padding:4px 9px;font-size:14px;font-weight:600;font-family:inherit;color:#5a3a4a;cursor:pointer;white-space:nowrap;line-height:1.2}#dlgLog .dl-head button.on{background:#ffe3ee}
#dlgLog .dl-list{overflow:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#dlgLog .dl-row{font-size:calc(15px*var(--dlg-k));line-height:1.55}#dlgLog .dl-row b{display:block;font-size:13px;color:var(--nc,#d0457a)}#dlgLog .dl-row.narr{color:#7a6670}#dlgLog .dl-row.narr::before{content:'✦ ';color:#e79bbb}#dlgLog .dl-row.player{text-align:right}
#talk #talkNote{font-size:18px;color:var(--soft);margin-top:-6px}
#talk .act{flex-wrap:wrap}
#talk .act.choices{flex-direction:column;align-items:stretch}
.btn.choice{background:#fff;color:var(--ink);text-align:left;box-shadow:inset 0 -3px 0 #f6e6ec,0 0 0 2px #fbe3ea}
.btn.choice::before{content:'▸ ';color:var(--pinkd)}
.mini{border:0;border-radius:10px;background:var(--pink);color:var(--ink);font-size:18px;padding:2px 10px;box-shadow:inset 0 -2px 0 #f2c3d3}
#npcPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 40px));max-height:min(76vh,calc(100% - 120px));overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;border-radius:20px}
#dim{display:none;position:fixed;inset:0;background:rgba(60,30,50,.22);z-index:9}
body:has(#npcPanel:not([hidden])) #dim,body:has(#mapPanel:not([hidden])) #dim{display:block}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.np-head b{font-size:1.15em}
.np{border:0;background:#fff;border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px;box-shadow:inset 0 -2px 0 #f6e6ec}
.np-name{font-size:20px}.np-name small{color:var(--soft);font-size:16px}
.np-place{font-size:16px;color:var(--soft);text-align:right}
.np-h{color:#f08aa8;font-size:16px;letter-spacing:1px}
.np-day{font-size:16px;color:var(--soft);text-align:right}
.np-h small{color:var(--soft);letter-spacing:0}
.np-keep{grid-column:1/-1;font-size:16px;color:var(--ink);opacity:.8}
.dk-q{font-size:18px;line-height:1.5;margin:4px 2px 10px;white-space:pre-wrap}.dk-ans{display:flex;gap:6px;margin-bottom:8px}.dk-ans input{flex:1;min-width:0;font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid #f2c6d6}.dk-ok{color:#2f9b57;font-size:17px}.adm-lhead i.rd{color:#7dff9a;margin-left:6px;font-style:normal}.adm-lhead i.unrd{color:#ffb86b;margin-left:6px;font-style:normal}

/* ===== 폰 화면 (아이폰·갤럭시): 위는 한 줄 정보바, 창은 아래에서 올라오는 시트 ===== */
@media (max-width:640px){
  #hud{left:10px!important;right:10px;max-width:none!important;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;white-space:nowrap;gap:0 10px!important;padding:5px 12px;border-radius:14px}
  #hud::-webkit-scrollbar{display:none}
  #hud span{flex:none}
  #stats{left:10px;right:10px;width:auto}
  #quest{top:calc(env(safe-area-inset-top,0px) + 54px);left:10px;right:10px!important;max-width:none;padding:4px 12px;font-size:16px;display:flex;gap:6px;align-items:baseline;border-radius:12px}
  #quest b{display:inline;font-size:13px;flex:none}
  #npcPanel,#mapPanel{top:auto;left:0;right:0;width:auto;transform:none;bottom:0;max-height:min(72dvh,calc(100% - 120px));border-radius:22px 22px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -6px 24px #c08aa02e;z-index:12}
  #npcPanel::before,#mapPanel::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px;flex:none}
  #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:calc(100vw - 16px)}
  #sideBtns{bottom:calc(env(safe-area-inset-bottom,0px) + 74px);gap:6px}
  .round{width:48px;height:48px;font-size:15px}
  .round.swing{width:60px;height:60px}
  #chatbox{width:calc(100vw - 20px - 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
  #log{font-size:15px;max-height:6em;overflow:hidden;justify-content:flex-end}
  #chatin{min-width:0}
  #toast{top:calc(env(safe-area-inset-top,0px) + 100px)}
  #bar{padding:5px}
  #bar div{width:44px;height:44px}
  #fishGame{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .mini{min-height:34px}
  .obc h1{font-size:34px}
}
/* 가로로 눕힌 폰: 높이가 낮아요 */
@media (max-height:460px){
  #quest{display:none}
  #npcPanel,#mapPanel{top:calc(env(safe-area-inset-top,0px) + 50px);bottom:auto;left:calc(env(safe-area-inset-left,0px) + 10px);right:auto;width:min(420px,60vw);max-height:calc(100% - 60px);border-radius:16px;transform:none}
  #npcPanel::before,#mapPanel::before{display:none}
  #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:min(560px,calc(100vw - 180px))}
  #bar{padding:4px}
  #bar div{width:40px;height:40px;font-size:20px}
  #sideBtns{flex-direction:row;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 10px)}
  .round{width:44px;height:44px;font-size:14px}
  .round.swing{width:52px;height:52px}
  #chatbox{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:min(260px,30vw)}
  #log{max-height:4.5em;overflow:hidden;justify-content:flex-end}
}

body.typing #chatin{background:#fff}

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { NPC_TEXT } from './npcs.js';
import * as CH from './char.js';
import { QUESTS as NPC_QUESTS } from './quests.js';

import { UI, EMOJI_UI } from './art/ui.js';
import { FURN_ALL, FURN_DRAW } from './art/furniture.js';
import { PET_SPECIES, PET_DRAW } from './art/pets.js';
import { FORAGE, FORAGE_DRAW, SPOT_OF, SPOT_NAME, SPOT_DRAW } from './forage.js';
import { DARK_ORDER, DARK_LIMIT_MS, DARK_ROOM, DARK_BOSS, DARK_REWARD, DARK_ROOMS, placeholderPuzzles } from './dark.js';
import { ART_PART as ART_FISH_A } from './art/fish_a.js';
import { ART_PART as ART_FISH_B } from './art/fish_b.js';
import { ART_PART as ART_CROPS } from './art/crops.js';
import { ART_PART as ART_ORES } from './art/ores.js';
import { ART_PART as ART_MON } from './art/monsters.js';
import { ART_PART as ART_DISH } from './art/dishes.js';
const P = {grass:'#b5e6a3',grass2:'#9fdb8c',path:'#ffe0bf',water:'#9fd9ff',waterHi:'#e8f7ff',cream:'#fff0e0',pink:'#ffa6c9',choco:'#9a5a45',cherry:'#ff5a78',candyA:'#ffa6cf',candyB:'#fff09a',stick:'#fff',soil:'#d69a70',berry:'#ff5a78',leaf:'#6cc46a',rock:'#c3b8d2',gem:'#bf8cff',dust:'#bdb5c9',blush:'#ffadc4',eye:'#5b3345',stitch:'#ffffff',bubble:'#fff',text:'#8a4b63'};
// 캐릭터 만들기: 피부·머리·표정과 기본 옷(상의 5 · 하의 5 · 신발 3)을 색까지 골라요. 기본 옷은 다섯 색 모두 무료
const BASIC = cat => Object.keys(CH[cat]).filter(id => CH.FREE.includes(id));
const OPT = () => ({
  skin:  { label:'피부색', color:true, v:CH.SKINS },
  hairA: { label:'머리 모양 (남)', target:'hair', v:CH.HAIR_M.map(k=>[k, CH.HAIR[k].label]) },
  hairB: { label:'머리 모양 (여)', target:'hair', v:CH.HAIR_F.map(k=>[k, CH.HAIR[k].label]) },
  hairColor: { label:'머리 색', color:true, v:CH.HAIR_COLORS },
  expr:  { label:'표정 (한 번 고르면 계속 이 얼굴이에요)', v:CH.EXPRS },
  top:   { label:'상의', v:BASIC('TOPS').map(id=>[id, CH.TOPS[id].name]) },
  tc:    { label:'상의 색', swatch:CH.colorsOf('top', EDIT.top) },
  bottom:{ label:'하의', v:BASIC('BOTTOMS').map(id=>[id, CH.BOTTOMS[id].name]) },
  bc:    { label:'하의 색', swatch:CH.colorsOf('bottom', EDIT.bottom) },
  shoes: { label:'신발', v:BASIC('SHOES').map(id=>[id, CH.SHOES[id].name]) },
  sc:    { label:'신발 색', swatch:CH.colorsOf('shoes', EDIT.shoes) },
});
let EDIT = { ...CH.defaultLook(), tc:'0', bc:'0', sc:'0' };
function applyStarter(L){ const n = {...L, set:'', cc:{top:+L.tc||0, bottom:+L.bc||0, shoes:+L.sc||0}}; delete n.tc; delete n.bc; delete n.sc; return n; }

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

// 클레이 질감: 블러 그림자 대신 (1) 바닥에 붙은 접촉 그림자 (2) 매트한 몸통 그라데이션 (3) 위쪽 가장자리 림 라이트 (4) 아래 가장자리 어두운 음영 (5) 고운 입자
let grainCanvas = null;
function grainPattern(ctx){
  if (ctx.__grain) return ctx.__grain;
  if (!grainCanvas){
    grainCanvas = document.createElement('canvas'); grainCanvas.width = grainCanvas.height = 96;
    const g = grainCanvas.getContext('2d'), img = g.createImageData(96, 96), d = img.data;
    let seed = 7; for (let i=0;i<d.length;i+=4){ seed = (seed*1103515245 + 12345) & 0x7fffffff; const v = seed % 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    g.putImageData(img, 0, 0);
  }
  return ctx.__grain = ctx.createPattern(grainCanvas, 'repeat');
}
function mixHex(a, b, k){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16); const f=(x,y)=>Math.round(x+(y-x)*k); return '#'+[f(A>>16,B>>16),f(A>>8&255,B>>8&255),f(A&255,B&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
const toHex = col => col.startsWith('#') ? (col.length===4 ? '#'+[...col.slice(1)].map(c=>c+c).join('') : col.slice(0,7)) : (()=>{ const m = col.match(/\d+/g); return m ? '#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('') : '#cccccc'; })();
function painter(ctx){
  function paint(path, key, [cx,cy,r]){
    const col = toHex(P[key] || key), big = r >= 6, huge = r > 60, k = huge ? .35 : 1; // 큰 바닥 모양은 효과를 약하게
    ctx.save();
    if (big){ // 접촉 그림자: 같은 모양을 살짝 아래로 어둡게
      ctx.save(); ctx.translate(Math.min(2.5, r*.08), Math.min(5, Math.max(1.2, r*.16))); ctx.globalAlpha = r > 60 ? .08 : .16; path(); ctx.fillStyle = '#5a2e48'; ctx.fill(); ctx.restore();
    }
    const g = ctx.createRadialGradient(cx-r*.38, cy-r*.42, r*.08, cx, cy, r*1.18);
    g.addColorStop(0, mixHex(col, '#fff7ef', .42*k)); g.addColorStop(.5, col); g.addColorStop(1, mixHex(col, '#4a2a40', .26*k));
    path(); ctx.fillStyle = g; ctx.fill();
    if (big){
      path(); ctx.clip();
      // 아래 가장자리 음영 (덩어리감)
      const ao = ctx.createRadialGradient(cx+r*.15, cy+r*.35, r*.55, cx+r*.15, cy+r*.35, r*1.15);
      ao.addColorStop(0, 'rgba(70,30,60,0)'); ao.addColorStop(1, `rgba(70,30,60,${.28*k})`);
      ctx.fillStyle = ao; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 위쪽 림 라이트
      const rim = ctx.createRadialGradient(cx-r*.25, cy-r*.3, r*.78, cx-r*.25, cy-r*.3, r*1.08);
      rim.addColorStop(0, 'rgba(255,250,245,0)'); rim.addColorStop(.75, `rgba(255,250,245,${.42*k})`); rim.addColorStop(1, 'rgba(255,250,245,0)');
      ctx.fillStyle = rim; ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6);
      // 입자
      if (r >= 9){ ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = grainPattern(ctx); ctx.fillRect(cx-r*1.3, cy-r*1.3, r*2.6, r*2.6); }
    }
    ctx.restore();
  }
  return { ctx,
    circle:(x,y,r,k)=>paint(()=>{ctx.beginPath();ctx.arc(x,y,r,0,7);},k,[x,y,r]),
    ell:(x,y,rx,ry,k)=>paint(()=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);},k,[x,y,Math.max(rx,ry)]),
    rr:(x,y,w,h,r,k)=>paint(()=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);},k,[x+w/2,y+h/2,Math.max(w,h)/2]),
    tri:(pts,k)=>paint(()=>{ctx.beginPath();ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1]);ctx.lineTo(...pts[2]);ctx.closePath();},k,[pts[1][0],pts[1][1]+6,8]),
    dot:(x,y,r,k,a=1)=>{ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=P[k]||k;ctx.fill();ctx.restore();},
    shape:(fn,k,box)=>paint(fn,k,box||[0,0,12]),
    stitch:(fn,k='stitch',a=.85)=>{ctx.save();ctx.globalAlpha=a;ctx.setLineDash([2,1.6]);ctx.lineWidth=.9;ctx.strokeStyle=P[k]||k;ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
    line:(fn,k,w=1)=>{ctx.save();ctx.strokeStyle=P[k]||k;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();fn(ctx);ctx.stroke();ctx.restore();},
  };
}

// ===== 스프라이트 캐시: 캐릭터는 자세별로 한 번만 그리고, 그 뒤로는 그림을 붙여 넣어요 (끊김 방지) =====
const spriteCache = new Map(), SPRITE_MAX = 420, TAU = Math.PI*2;
function sprite(key, w, h, ox, oy, drawFn){
  let sp = spriteCache.get(key);
  if (!sp){
    const sc = Math.min(3, Math.max(1, Math.round(view.dpr*view.zoom*2)/2));
    const c = document.createElement('canvas'); c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const x = c.getContext('2d'); x.setTransform(sc,0,0,sc,ox*sc,oy*sc);
    drawFn(painter(x));
    sp = {c, sc, ox, oy};
    if (spriteCache.size >= SPRITE_MAX) spriteCache.delete(spriteCache.keys().next().value);
    spriteCache.set(key, sp);
  }
  return sp;
}
const qphase = (ph, n) => Math.round((((ph % TAU) + TAU) % TAU) / TAU * n) % n;
// 플레이어: 걷기 8 단계, 서 있기 4 단계. 매트 클레이 페인터로 그려요
function drawPlayer(c, x, y, L, dir, t, walk, s=1, expr='dot'){
  if (!L || !('top' in L) && !L.set) L = CH.migrateLook(L);
  const ph = t*8 + x*.37, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'p|'+JSON.stringify(L)+'|'+dir+'|'+(walk?'w':'i')+q+'|'+expr+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/8 : q/4*TAU/2;
  const B = CH.FIG_BOX;
  const sp = sprite(key, B.w, B.h, B.ox, B.oy, d=>CH.figure(CH.mattePainter(d.ctx), L, dir, t2, walk, expr));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}
// 표정: 캐릭터를 만들 때 고른 표정을 계속 써요 (상황에 따라 바뀌지 않아요)

function drawCritter(c, x, y, v, t, walk, s=1, flip=false){
  if (v && v.a1) return drawPlayer(c, x, y, v.a1, walk ? (flip ? 'left' : 'right') : 'down', t, walk, s, 'dot');
  if (flip){ c.save(); c.translate(x, 0); c.scale(-1, 1); drawCritter(c, 0, y, v, t, walk, s, false); c.restore(); return; }
  const ph = t*7 + x*.3, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'c|'+JSON.stringify(v)+'|'+(walk?'w':'i')+q+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/7 : q/4*TAU/2;
  const sp = sprite(key, 80, 100, 40, 88, d=>critter(d, 0, 0, v, t2, walk, 1));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function blob(d, x, y, fabric, acc, t){
  const c=d.ctx, bob=Math.abs(Math.sin(t*2.5+x))*1.5;
  c.save(); c.translate(x,y);
  d.dot(0,2,11,'rgba(0,0,0,.13)'); c.translate(0,-bob);
  d.ell(-5,1,4,2.6,shade(fabric,-.12)); d.ell(5,1,4,2.6,shade(fabric,-.12));
  d.ell(0,-13,13,13,fabric); d.ell(-14,-11,3.2,4.5,fabric); d.ell(14,-11,3.2,4.5,fabric);
  d.stitch(c=>{c.moveTo(0,-24.5);c.quadraticCurveTo(2,-20,0,-16);});
  for (const ex of [-4.5,4.5]){ d.dot(ex,-14,2.4,'eye'); d.dot(ex-.7,-14.5,.5,'#fff'); d.dot(ex+.7,-13.5,.5,'#fff'); }
  d.dot(-7.5,-10,2.3,'blush',.8); d.dot(7.5,-10,2.3,'blush',.8);
  if (acc==='apron') d.rr(-6,-9,12,8,3,'#ffffff');
  if (acc==='cap'){ d.ell(0,-25,10,4.5,'#5fb3ff'); d.ell(6,-23,7,2,'#4a9be8'); }
  c.restore();
}

function tasteOf(npc, item){
  const exact = item.split('_')[0], cat = item.split(':')[0];
  for (const k of ['loved','liked','disliked']) if ((npc.tastes[k]||[]).includes(exact)) return k;

// 우체부 토리는 시계를 기준으로 마을을 돌아서 모두의 화면에 같은 자리에 보여요
const TORI_PATH = [[1180,912],[880,912],[880,620],[560,560],[880,620],[1240,560],[880,620],[880,912]].map(([x,y])=>[zk(x), zk(y)]);
const TORI_SEGS = TORI_PATH.map((a,i)=>{ const b = TORI_PATH[(i+1)%TORI_PATH.length]; return {a, b, walk:Math.hypot(b[0]-a[0], b[1]-a[1])/60*1000}; });
const TORI_TOTAL = TORI_SEGS.reduce((s,g)=>s+g.walk+3000, 0);
function toriPos(now){
  let t = now % TORI_TOTAL;
  for (const g of TORI_SEGS){
    if (t < 3000) return {x:g.a[0], y:g.a[1], mv:false, dx:0};
    t -= 3000;
    if (t < g.walk){ const k = t/g.walk; return {x:g.a[0]+(g.b[0]-g.a[0])*k, y:g.a[1]+(g.b[1]-g.a[1])*k, mv:true, dx:g.b[0]-g.a[0]}; }
    t -= g.walk;
  }
  return {x:TORI_PATH[0][0], y:TORI_PATH[0][1], mv:false, dx:0};
}

const NPC_RANGE = {momo:55, dandan:55, mongsil:55, bori:60, olly:60, toto:70, pengpeng:80, dodo:70, hana:110, bami:80, kongi:120};
const WANDER_MS = 7000, WANDER_PAUSE = 2800;
function wanderSpot(n, k){
  const h = hash(n.id + '|' + k), r = (NPC_RANGE[n.id] || 70) * (0.35 + (h % 1000) / 1000 * 0.65), a = ((h >>> 10) % 6283) / 1000;
  const x = n.home[0] + Math.cos(a)*r, y = n.home[1] + Math.sin(a)*r*0.6; // 위아래로는 조금만
  return blocked(x, y) ? {x:n.home[0], y:n.home[1]} : {x, y};
}
function wanderPos(n, now){
  const k = Math.floor(now / WANDER_MS), t = now - k*WANDER_MS, a = wanderSpot(n, k-1), b = wanderSpot(n, k);
  if (t < WANDER_PAUSE) return {x:a.x, y:a.y, mv:false, dx:0};
  const u = (t - WANDER_PAUSE) / (WANDER_MS - WANDER_PAUSE), e = u*u*(3-2*u);
  return {x:a.x + (b.x-a.x)*e, y:a.y + (b.y-a.y)*e, mv:Math.hypot(b.x-a.x, b.y-a.y) > 4, dx:b.x-a.x};
}
function updateNpcs(now){
  for (const n of NPCS){
    if (n.zone !== zoneId) continue;
    if (!n.home) n.home = [n.x, n.y];
    const p = n.id==='tori' ? toriPos(now) : wanderPos(n, now);
    n.x = p.x; n.y = p.y; n.mv = p.mv; if (p.dx) n.flip = p.dx < 0;
  }
}
// 텃밭은 집 앞 울타리 안에만 놓여요 (5 × 2 = 최대 10 칸). 옆집 울타리와 겹치지 않게 집터 간격(190) 안에 들어가요
const PLOT_MAX = 10, FENCE = {w:182, top:22, h:86};
const SLOT_POS = [[-68,46],[-34,46],[0,46],[34,46],[68,46],[-68,82],[-34,82],[0,82],[34,82],[68,82]];
const SLOT_ORDER = [1,2,3,6,7,8,0,4,5,9]; // 가운데부터 채워요
function slotsOf(lot, n=2){ const L = LOTS[lot]; return SLOT_ORDER.slice(0, Math.max(2, Math.min(PLOT_MAX, n))).map(k=>({x:L.x+SLOT_POS[k][0], y:L.y+SLOT_POS[k][1]})); }
function drawFence(d, L){
  const c = d.ctx, x0 = L.x - FENCE.w/2, x1 = L.x + FENCE.w/2, y0 = L.y + FENCE.top, y1 = y0 + FENCE.h, gate = 18;
  c.save(); c.globalAlpha = .9; c.fillStyle = 'rgba(176,122,85,.10)'; c.beginPath(); c.roundRect(x0, y0, FENCE.w, FENCE.h, 10); c.fill(); c.restore();
  const rail = (ax, ay, bx, by) => { d.line(k=>{ k.moveTo(ax, ay-4); k.lineTo(bx, by-4); k.moveTo(ax, ay+1); k.lineTo(bx, by+1); }, '#d9a877', 2.2, 1); };
  rail(x0, y0, L.x-gate, y0); rail(L.x+gate, y0, x1, y0); rail(x0, y1, x1, y1); rail(x0, y0, x0, y1); rail(x1, y0, x1, y1);
  const post = (x, y) => { d.rr(x-2.6, y-9, 5.2, 11, 2, '#c98e5b'); d.circle(x, y-9, 2.8, '#e8c39e'); };
  for (let x = x0; x <= L.x-gate+0.1; x += (L.x-gate-x0)/3) post(x, y0); for (let x = L.x+gate; x <= x1+0.1; x += (x1-L.x-gate)/3) post(x, y0);
  for (let x = x0; x <= x1+0.1; x += FENCE.w/6) post(x, y1);
  for (const x of [x0, x1]) for (let y = y0 + FENCE.h/3; y < y1-1; y += FENCE.h/3) post(x, y);
}

}
function inCorridor(x, y){
  const z = Z(), ex = z.exits;
  if (ex.n && y < M+10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.s && y > z.H-M-10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.w && x < M+10 && Math.abs(y-z.H/2) < GAP) return true;
  if (ex.e && x > z.W-M-10 && Math.abs(y-z.H/2) < GAP) return true;

}
function blocked(x,y){
  const z = Z();
  if (x<4||y<4||x>z.W-4||y>z.H-4) return true;
  if ((x<M||x>z.W-M||y<M||y>z.H-M) && !inCorridor(x,y)) return true;
  if (z.theme==='room' && y < 250) return true;
  for (const e of obstacles.ells) if (((x-e.x)/(e.rx+6))**2 + ((y-e.y)/(e.ry+6))**2 < 1) return true;
  for (const c of obstacles.circles) if ((x-c.x)**2+(y-c.y)**2 < c.r*c.r) return true;

  return false;
}
// 구역 가장자리 길 끝에 닿으면 다음 구역으로 넘어가요

function freeSpot(x, y){

  for (let r=0; r<900; r+=24) for (let a=0; a<6.28; a+=r ? 24/r : 7){ const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r; if (!blocked(nx, ny)) return [nx, ny]; }

function hexShade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return '#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}

function fromDB(p){
  if (!p) return p;
  const g = p.gardens || [], inv = {garden:0, can:false, gold:0, rod:false, pick:false, sword:false, ...(p.inv||{})};
  for (const k of ['seeds','crops','fish','ores','loot']) inv[k] = {...(inv[k]||{})};
  if (inv.seed){ inv.seeds.c01 = (inv.seeds.c01||0) + inv.seed; } delete inv.seed;
  if (inv.tomato){ inv.crops.c01 = (inv.crops.c01||0) + inv.tomato; } delete inv.tomato;
  const lk = CH.migrateLook(p.look), worn = Object.entries(lk.cc||{}).filter(([,c])=>c).map(([slot,c])=>{ const id = slot==='set' ? lk.set : lk[slot]; return id && id!=='none' ? id+'#'+c : null; }).filter(Boolean);
  const closet = [...new Set([...CH.FREE, ...(p.closet||[]), ...(p.hats ? p.hats.split(',') : []), ...CH.lookItems(lk), ...worn])].filter(k=>k.split('#')[0] !== 'none' && CH.ITEM(k.split('#')[0]));
  return { ...p, look:CH.migrateLook(p.look), closet, rel:p.rel||{}, inv,
    gardens:Array.from({length:Math.max(2, Math.min(PLOT_MAX, p.plots||2))}, (_,i)=>i).map(i=>{ const s = g[i]; if (!s) return null; return {crop: s.stage>=0 ? {type:s.type||'c01', stage:s.stage, wateredAt:s.wateredAt||null} : null}; }) };
}
function toDB(p){
  const inv = p.inv && p.inv.wear ? {...p.inv, wear:Object.fromEntries(Object.entries(p.inv.wear).map(([k,n])=>[k.replace(/[#.$\[\]\/]/g, '~'), n]))} : p.inv; // 저장 못 하는 글자는 ~ 로
  return { ...p, inv, gardens: p.gardens.map(g => g ? {stage: g.crop ? g.crop.stage : -1, wateredAt: (g.crop && g.crop.wateredAt) || 0, type: (g.crop && g.crop.type) || ''} : false) };
}

function onRoofs(raw){
  const next = {};
  for (const [k,v] of Object.entries(raw||{})) if (v) next['roof-'+k] = v;
  claims = next; if (obStep && obStep!=='maker') renderOb();
}
function onOnline(raw){
  const seen = new Set();
  for (const [id, s] of Object.entries(raw||{})){
    if (id===uid || !s || typeof s.x!=='number' || !s.look) continue;
    seen.add(id);
    let o = others.get(id);
    if (!o){ o = {x:s.x, y:s.y, emoAt:s.emoAt}; others.set(id, o); if (!firstOnline) addLog(`${String(s.nick||'누군가').slice(0,8)} 님이 섬에 왔어요`, true); }
    if (s.emoAt && s.emoAt!==o.emoAt){ o.emoAt = s.emoAt; if (s.emo && Date.now()-s.emoAt < 5000) bubbles.set(id+'-emo', {text:String(s.emo).slice(0,4), at:performance.now()}); }
    const oz = zoneOk(s.z) ? s.z : 'home';
    if (o.z && o.z!==oz){ o.x = s.x; o.y = s.y; }
    o.z = oz;
    Object.assign(o, {um: umbOk(s.um), down: !!s.down, sx:s.x, sy:s.y, dir:s.dir||'down', mvRemote:s.mv, look:CH.migrateLook(s.look), ex:typeof s.ex==='string' ? s.ex : 'dot', pet: s.pet && PET_DRAW[s.pet.sp] ? {sp:s.pet.sp, col:Math.max(0, Math.min(2, s.pet.col|0)), name:String(s.pet.name||'').slice(0,8)} : null, ti:String(s.ti||'').slice(0,12), nick:String(s.nick||'').slice(0,8), uid:id});
    if (typeof s.tx==='number'){ o.goal = {x:s.tx, y:s.ty}; if (Math.hypot(o.x-s.x, o.y-s.y) > 48){ o.x = s.x; o.y = s.y; } }
    else o.goal = null;
  }
  for (const [id,o] of [...others]) if (!seen.has(id)){ others.delete(id); addLog(`${o.nick} 님이 집에 갔어요`, true); }
  firstOnline = false;
  if (me) renderHud();
}
// ===== 채팅: 같은 장소에 있는 사람끼리만 보여요. 장소마다 최근 100 줄을 남기고, [채팅]을 열면 지난 대화가 보여요 =====
const CHAT_KEEP = 100;
let chatHist = [], chatSeen = new Set(), chatUnsub = null, chatZoneId = null;
function chatZone(){
  if (!net || !me || admin || chatZoneId===zoneId) return;
  chatZoneId = zoneId; if (chatUnsub) chatUnsub(); chatSeen = null; chatHist = []; renderChatHist();
  chatUnsub = net.chatZone(zoneId, v=>{
    const list = Object.entries(v).filter(([,m])=>m && typeof m.t==='string' && m.t && m.z===chatZoneId).sort(([a],[b])=>a<b ? -1 : 1);
    const first = !chatSeen; if (first) chatSeen = new Set();
    for (const [k,m] of list) if (!chatSeen.has(k)){ chatSeen.add(k); if (!first || Date.now() - (m.at||0) < 60000) onChat(m); }
    chatHist = list.map(([,m])=>m); renderChatHist();
  });
}
function renderChatHist(){
  const el = $('chatHist'); if (!el) return;
  const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = chatHist.length ? chatHist.map(m=>{ const d = new Date((m.at||0) + 9*3600000); return `<p${m.uid===uid ? ' class="me"' : ''}><b>${esc(String(m.nick||'누군가').slice(0,8))}</b>${esc(m.t.slice(0,80))}<time>${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}</time></p>`; }).join('')
    : `<p class="sys">${esc(Z().name || '여기')}에서 나눈 대화가 아직 없어요</p>`;
  if (stick || !el.dataset.init){ el.scrollTop = el.scrollHeight; el.dataset.init = 1; }
}
function onChat(m){
  if (!m || typeof m.t!=='string' || !m.t) return;
  const t = m.t.slice(0,80), age = Math.max(0, Date.now() - (m.at||Date.now()));
  addLog(`${String(m.nick||'누군가').slice(0,8)}: ${t}`);
  if (age < 5000) bubbles.set(m.uid===uid ? 'me' : m.uid, {text:t, at:performance.now()-age});
}

function soloNet(){
  const st = {players:{}, roofs:{}};
  return {
    savePlayer: async d => { st.players[uid] = structuredClone(d); onPlayers(structuredClone(st.players)); },
    claimRoof: async i => { st.roofs[i] = {uid, nick:nickVal, at:Date.now()}; onRoofs(st.roofs); return true; },
    releaseRoof: async i => { delete st.roofs[i]; onRoofs(st.roofs); },
    claimLot: async () => true,
    cleanupClaims: async () => {},
    petClaim: async sp => { petClaims[sp] = {uid}; return true; },
    snowman: async s => { snowmen[uid] = s; },
    museumGive: async (cat, id) => { const c = museum[cat] || (museum[cat] = {}); if (c[id]) return false; c[id] = {uid, nick:me.nick, at:Date.now()}; onMuseum(museum); return true; },
    darkTx: async (npc, fn) => { const st_ = soloNet.dark || (soloNet.dark = {}); const r = fn(st_[npc] ? structuredClone(st_[npc]) : null); if (r !== undefined){ if (r === null) delete st_[npc]; else st_[npc] = r; } onDarkRooms(structuredClone(st_)); return r !== undefined; },
    reviveSend: async (id, by) => { if (id === uid) onRevive({by, at:darkNow()}); },
    reviveClear: async () => {},
    darkWipe: async npc => { const st_ = soloNet.dark || (soloNet.dark = {}); if (npc) delete st_[npc]; else for (const k in st_) delete st_[k]; onDarkRooms(structuredClone(st_)); },
    adminRemove: async id => { delete st.players[id]; onPlayers(structuredClone(st.players)); },
    sessionClaim: () => {},
    presence: async () => {},
    presenceOff: async () => {},
    sendChat: async t => { const m = {uid, nick:me.nick, t, z:zoneId, at:Date.now()}; st.chat = {...(st.chat||{}), ['c'+Date.now()+String(Math.random()).slice(2,6)]: m}; st.zoneCb && st.zoneCb(Object.fromEntries(Object.entries(st.chat).filter(([,v])=>v.z===st.zone).slice(-CHAT_KEEP))); st.chatCb && st.chatCb(st.chat); },
    chatLog: cb => { st.chatCb = cb; cb(st.chat||{}); },
    chatZone: (z, cb) => { st.zone = z; st.zoneCb = cb; cb(Object.fromEntries(Object.entries(st.chat||{}).filter(([,v])=>v.z===z).slice(-CHAT_KEEP))); return ()=>{ st.zoneCb = null; }; },
    chatTrim: async () => {},
    wipeAll: async withChat => { st.players = {}; st.roofs = {}; st.market = {}; if (withChat){ st.chat = {}; st.chatCb && st.chatCb({}); } onPlayers({}); onRoofs({}); onMarket({}); },
    contestSubmit: async (w, size) => { contestBoard = [{nick:me.nick, size}]; },
    mailSend: async () => { throw new Error('solo'); },
    letterSend: async (to, l) => { st.letters = st.letters || {}; const id = 'l'+Date.now()+Math.random().toString(36).slice(2,6); (st.letters[to] = st.letters[to] || {})[id] = {...l, at:Date.now()}; st.out = {...(st.out||{}), [id]: {...l, to, at:Date.now()}}; onLettersOut(st.out); if (to===uid) onLetters(st.letters[uid]); st.adminCb && st.adminCb(st.letters); },
    letterMark: async (to, id, v) => { const l = st.letters?.[to]?.[id]; if (l){ Object.assign(l, v); if (to===uid) onLetters(st.letters[uid]); st.adminCb && st.adminCb(st.letters); } },
    letterDel: async (to, id) => { if (st.letters?.[to]) delete st.letters[to][id]; if (to===uid) onLetters(st.letters[uid]); },
    adminLetters: cb => { st.adminCb = cb; cb(st.letters||{}); },
    dmSend: async (cid, other, m) => { st.dms = st.dms || {}; st.dmIdx = st.dmIdx || {}; const id = 'd'+Date.now()+Math.random().toString(36).slice(2,5), v = {...m, at:Date.now()}; (st.dms[cid] = st.dms[cid] || {})[id] = v; for (const u of [uid, other]) (st.dmIdx[u] = st.dmIdx[u] || {})[cid] = v; onDmIndex(st.dmIdx[uid]); st.dmCb && st.dmCid===cid && st.dmCb(st.dms[cid]); st.admDmCb && st.admDmCb(st.dms); },
    dmWatch: (cid, cb) => { st.dmCid = cid; st.dmCb = cb; cb((st.dms||{})[cid]||{}); return ()=>{ st.dmCb = null; }; },
    adminDms: cb => { st.admDmCb = cb; cb(st.dms||{}); },
    marketList: async l => { st.market = st.market || {}; st.market['m'+Date.now()] = {...l, at:Date.now()}; onMarket(st.market); },
    marketBuy: async id => { const l = st.market?.[id]; if (!l || l.buyer) return false; l.buyer = uid; l.bnick = me.nick; onMarket(st.market); return true; },
    marketCancel: async id => { const l = st.market?.[id]; if (!l || l.buyer || l.uid!==uid) return false; delete st.market[id]; onMarket(st.market); return true; },
    marketCollect: async id => { const l = st.market?.[id]; if (!l || !l.buyer) return false; delete st.market[id]; setTimeout(()=>onMarket(st.market)); return true; },
    bossReset: (gen, max) => { onBoss({hp:max, max, gen}); },
    bossHit: dmg => { onBoss({...boss, hp: boss.hp - dmg}); },
    setWorld: async v => { st.world = {...(st.world||{}), ...v}; onWorld(st.world); },
    listen(){ setTimeout(()=>{ onRoofs({}); onPlayers({}); onBoss(null); }); },
  };
}
function firebaseNet(){
  const db = F.getDatabase(app), meRef = F.ref(db, 'online/'+uid);
  F.onDisconnect(meRef).remove();
  const tx = async (path, data, kind, i) => {
    try {
      const r = await F.runTransaction(F.ref(db, path), cur => (!cur || cur.uid===uid || abandoned(cur, kind, i)) ? data : undefined);
      return r.committed && r.snapshot.val()?.uid===uid;
    } catch(e){ return false; }
  };
  return {
    savePlayer: d => F.set(F.ref(db, 'players/'+uid), d),
    claimRoof: i => tx('roofs/'+i, {uid, nick:nickVal, at:Date.now()}, 'roof', i),
    releaseRoof: i => F.remove(F.ref(db, 'roofs/'+i)).catch(()=>{}),
    claimLot: i => tx('lots/'+i, {uid, at:Date.now()}, 'lot', i),
    petClaim: sp => tx('petClaims/'+sp, {uid, at:Date.now()}),
    snowman: s => F.set(F.ref(db, 'snowmen/'+uid), s),
    museumGive: async (cat, id) => { try { const r = await F.runTransaction(F.ref(db, 'museum/'+cat+'/'+id), cur => cur ? undefined : {uid, nick:String(me.nick||'').slice(0,16), at:Date.now() + serverOffset}); return r.committed; } catch(e){ return false; } },
    darkTx: async (npc, fn) => { try { const r = await F.runTransaction(F.ref(db, 'darkRooms/'+npc), cur => fn(cur)); return r.committed; } catch(e){ return false; } },
    darkWipe: npc => F.remove(F.ref(db, 'darkRooms' + (npc ? '/'+npc : ''))),
    reviveSend: (id, by) => F.set(F.ref(db, 'revive/'+id), {by:String(by).slice(0,12), at:F.serverTimestamp()}),
    reviveClear: () => F.remove(F.ref(db, 'revive/'+uid)).catch(()=>{}),
    // 입주한 뒤 남아 있는 내 옛 선점(다른 지붕·집터)을 풀어 줘요
    cleanupClaims: async (roof, lot) => { for (const [kind, mine] of [['roofs', roof], ['lots', lot]]){ try { const v = (await F.get(F.ref(db, kind))).val() || {}; for (const [k,c] of Object.entries(v)) if (c && c.uid===uid && +k !== mine) await F.remove(F.ref(db, kind+'/'+k)).catch(()=>{}); } catch(e){} } },
    adminRemove: (id, roof, lot) => F.update(F.ref(db), {...Object.fromEntries(Object.entries(petClaims).filter(([,c])=>c && c.uid===id).map(([sp])=>['petClaims/'+sp, null])), ['players/'+id]:null, ['online/'+id]:null, ['sessions/'+id]:null, ['snowmen/'+id]:null, ...(roof!=null ? {['roofs/'+roof]:null} : {}), ...(lot!=null ? {['lots/'+lot]:null} : {})}),
    sessionClaim: sid => { const r = F.ref(db, 'sessions/'+uid); F.set(r, sid).catch(()=>{}); F.onValue(r, s=>{ const v = s.val(); if (v && v !== sid) onKicked(); }); },
    presence: p => F.set(meRef, p),
    presenceOff: () => F.onDisconnect(meRef).cancel().catch(()=>{}),
    presenceLeave: async () => { await F.onDisconnect(meRef).cancel().catch(()=>{}); await F.remove(meRef).catch(()=>{}); }, // 밀려난 창은 닫혀도 지금 창의 접속 표시를 지우지 않게
    sendChat: t => F.push(F.ref(db, 'chat'), {uid, nick:me.nick, t, z:zoneId, at:F.serverTimestamp()}),
    // 이 장소의 대화 최근 100 줄만 받아요
    chatZone: (z, cb) => F.onValue(F.query(F.ref(db, 'chat'), F.orderByChild('z'), F.equalTo(z), F.limitToLast(CHAT_KEEP)), s=>cb(s.val()||{}), ()=>{}),
    // 장소마다 100 줄만 남기고 오래된 줄은 지워요
    chatTrim: async z => { try { const v = (await F.get(F.query(F.ref(db, 'chat'), F.orderByChild('z'), F.equalTo(z)))).val() || {}; const ks = Object.keys(v).sort(); if (ks.length > CHAT_KEEP) await F.update(F.ref(db, 'chat'), Object.fromEntries(ks.slice(0, ks.length - CHAT_KEEP).map(k=>[k, null]))); } catch(e){} },
    chatLog: cb => F.onValue(F.query(F.ref(db, 'chat'), F.limitToLast(3000)), s=>cb(s.val()||{}), ()=>{}),
    wipeAll: withChat => F.update(F.ref(db), {players:null, roofs:null, lots:null, online:null, contest:null, mail:null, letters:null, lettersOut:null, dms:null, dmIndex:null, petClaims:null, snowmen:null, museum:null, darkRooms:null, market:null, boss:null, ...(withChat ? {chat:null} : {})}),
    listen(){
      F.onValue(F.ref(db, 'players'), s=>onPlayers(s.val()), ()=>toast('섬 정보를 불러오지 못했어요.'));
      F.onValue(F.ref(db, 'roofs'), s=>onRoofs(s.val()));
      F.onValue(F.ref(db, 'online'), s=>onOnline(s.val()));
      F.onValue(F.ref(db, 'contest/'+weekKey()), s=>{ contestBoard = Object.values(s.val()||{}).filter(r=>r && typeof r.size==='number').sort((a,b)=>b.size-a.size); });
      F.onChildAdded(F.ref(db, 'mail/'+uid), s=>onMail(s.val(), ()=>F.remove(s.ref).catch(()=>{})));
      F.onValue(F.ref(db, '.info/serverTimeOffset'), s=>{ serverOffset = s.val() || 0; });
      // 인터넷이 잠깐 끊겼다 다시 이어지면: 창을 닫을 때 지우는 약속을 다시 걸고, 내 위치를 바로 다시 보내요
      F.onValue(F.ref(db, '.info/connected'), s=>{ if (s.val() === true && !kicked){ F.onDisconnect(meRef).remove(); presSig = ''; lastPres = 0; } });
      F.onValue(F.ref(db, 'boss'), s=>onBoss(s.val()));
      F.onValue(F.ref(db, 'letters/'+uid), s=>onLetters(s.val()), ()=>{});
      F.onValue(F.ref(db, 'dmIndex/'+uid), s=>onDmIndex(s.val()), ()=>{});
      F.onValue(F.ref(db, 'petClaims'), s=>{ petClaims = s.val() || {}; }, ()=>{});
      F.onValue(F.ref(db, 'snowmen'), s=>{ snowmen = s.val() || {}; }, ()=>{});
      F.onValue(F.ref(db, 'museum'), s=>onMuseum(s.val()), ()=>{});
      F.onValue(F.ref(db, 'darkRooms'), s=>onDarkRooms(s.val()), ()=>{});
      F.onValue(F.ref(db, 'revive/'+uid), s=>onRevive(s.val()), ()=>{});
      F.onValue(F.ref(db, 'lettersOut/'+uid), s=>onLettersOut(s.val()), ()=>{});
      F.onValue(F.ref(db, 'market'), s=>onMarket(s.val()));
      F.onValue(F.ref(db, 'world'), s=>onWorld(s.val()), ()=>{});
    },
    setWorld: v => F.update(F.ref(db, 'world'), v),
    contestSubmit: (w, size) => F.set(F.ref(db, 'contest/'+w+'/'+uid), {nick:me.nick, size}),
    marketList: l => F.push(F.ref(db, 'market'), {...l, at:F.serverTimestamp()}),
    marketBuy: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && !cur.buyer && cur.uid!==uid) ? {...cur, buyer:uid, bnick:me.nick} : undefined, {applyLocally:false}); return r.committed && r.snapshot.val()?.buyer===uid; } catch(e){ return false; } },
    marketCancel: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && !cur.buyer) ? null : undefined, {applyLocally:false}); return r.committed && !r.snapshot.exists(); } catch(e){ return false; } },
    marketCollect: async id => { if (collecting.has(id)) return false; collecting.add(id); try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && cur.buyer) ? null : undefined, {applyLocally:false}); const ok = r.committed && !r.snapshot.exists(); if (!ok) collecting.delete(id); return ok; } catch(e){ collecting.delete(id); return false; } },
    letterSend: async (to, l) => { const id = F.push(F.ref(db, 'letters/'+to)).key; await F.set(F.ref(db, 'letters/'+to+'/'+id), {...l, at:F.serverTimestamp()}); if (!admin) await F.set(F.ref(db, 'lettersOut/'+uid+'/'+id), {...l, to, at:F.serverTimestamp()}).catch(()=>{}); },
    letterMark: (to, id, v) => F.update(F.ref(db, 'letters/'+to+'/'+id), v),
    letterDel: (to, id) => F.remove(F.ref(db, 'letters/'+to+'/'+id)),
    adminLetters: cb => F.onValue(F.ref(db, 'letters'), s=>cb(s.val()||{}), ()=>{}),
    dmSend: async (cid, other, m) => { const v = {...m, at:F.serverTimestamp()}; await F.push(F.ref(db, 'dms/'+cid), v); await F.update(F.ref(db), {['dmIndex/'+uid+'/'+cid]:v, ['dmIndex/'+other+'/'+cid]:v}).catch(()=>{}); },
    dmWatch: (cid, cb) => F.onValue(F.query(F.ref(db, 'dms/'+cid), F.limitToLast(150)), s=>cb(s.val()||{}), ()=>{}),
    adminDms: cb => F.onValue(F.ref(db, 'dms'), s=>cb(s.val()||{}), ()=>{}),
    bossReset: (gen, max) => F.runTransaction(F.ref(db, 'boss'), cur => (!cur || cur.gen !== gen) ? {hp:max, max, gen} : undefined).catch(()=>{}),
    bossHit: dmg => F.runTransaction(F.ref(db, 'boss/hp'), cur => typeof cur==='number' ? Math.max(0, cur - dmg) : cur).catch(()=>{}),
  };
}

    const flush = () => { if (buf.length){ out.push({who, text:buf.join('\n')}); buf = []; } };
    for (const line of dlgText(pg).split('\n')) for (const part of line.split(/(\([^()]*\))/)){

      if (/^\(.*\)$/.test(p)){ flush(); out.push({who:'narr', text:p.slice(1, -1).trim()}); }

  if (['crop','fish','ore','loot','dish','seed'].reduce((a,c)=>a+countOf(c),0) >= 1500) add('bagHeavy');
  if ((me.title||'')) add('hasTitle');
  if (WEAPON_LIST.findIndex(x=>x[0]===(me.inv.weapon||'w1')) >= 4) add('strongWeapon');
  if (me.look && me.look.set && me.look.set!=='none') add('wearSet');
  if (me.look && me.look.hat && me.look.hat!=='none') add('wearHat');
  if (countOf('loot') >= 5) add('hasLoot'); if (countOf('ore') >= 5) add('hasOre'); if (countOf('fish') >= 5) add('hasFish');
  if ((me.ach||[]).length >= 20) add('achMany');
  if ((me.furn||[]).length + Object.values(me.inv.furn||{}).reduce((a,b)=>a+b,0) >= 15) add('manyFurn');
  // 사람
  if (others.size >= 3) add('crowded'); else if (!solo && others.size === 0) add('alone');
  // 날씨·시간·계절 (마지막)
  if (wx==='흐림') add('cloudy'); if (wx==='맑음' && hr>=11 && hr<18) add('sunny');
  if (w===0 || w===6) add('weekend');
  add(m>=3 && m<=5 ? 'spring' : m>=6 && m<=8 ? 'summer' : m>=9 && m<=11 ? 'autumn' : 'winter');
  return out;
}
// 상황 하나를 골라 대사를 돌려줘요. 앞쪽(중요한) 상황일수록 잘 뽑히고, 같은 상황 대사가 연달아 나오지 않게 해요.
function situationLine(n, isNew){
  const S = SITUATIONS[n.id]; if (!S) return '';
  const list = situationsNow(n, isNew).filter(x=>S[x.id] && S[x.id].length);
  if (!list.length) return '';
  const r = relOf(n.id), last = r.sit || '';
  let pick = list[0];
  if (list.length > 1){ const w = list.map((_,i)=>Math.pow(.5, i)); let t = Math.random()*w.reduce((a,b)=>a+b,0); for (let i=0;i<list.length;i++){ if ((t -= w[i]) <= 0){ pick = list[i]; break; } } if (pick.id===last && list.length>1) pick = list.find(x=>x.id!==last) || pick; }
  r.sit = pick.id;
  return pickLine(S[pick.id], n.id+'s:'+pick.id).replace(/\{item\}/g, pick.item);
}
function talkTo(n){
  const r = relOf(n.id), first = r.talkDay !== today();
  const sit = situationLine(n, !r.pts && !r.talkDay); // 호감도가 오르기 전에 상황을 봐야 '첫 만남'을 알아요
  let note = ''; questEvent('talk', n.id); dlgPts0 = r.pts || 0;
  if (first){ r.talkDay = today(); addPts(n, TALK_PTS); note = `오늘 첫 대화 · 호감도 +${TALK_PTS}`; }
  if (n.id==='dodo' && !me.inv.pick){ me.inv.pick = true; note = [note, '도도에게 곡괭이를 받았어요! 바위를 눌러 캐 봐요'].filter(Boolean).join(' · '); }
  if (n.id==='kongi' && !me.inv.sword){ me.inv.sword = true; me.inv.weapon = 'w1'; me.inv.weapons = ['w1']; note = [note, '콩이에게 경비대 나무 검을 받았어요! 몬스터를 바라보고 휘두르기(F 키)를 눌러 싸워요'].filter(Boolean).join(' · '); }
  if (n.id==='pengpeng' && !me.inv.rod){ me.inv.rod = true; note = [note, '펭펭에게 낚싯대를 받았어요! 물을 눌러 낚시해 봐요'].filter(Boolean).join(' · '); }
  if (n.soon) note = [note, n.soon].filter(Boolean).join(' · ');
  const hr = kstHour();
  const opening = first ? (sit || (n.greet ? pickLine(n.greet[hr>=5&&hr<11 ? 'morning' : hr>=11&&hr<18 ? 'day' : 'night'], n.id+'g') : '')) : '';
  let text = '';
  if (n.id==='hana' && me.quest < 6){
    if (me.quest<=1) text = '안녕! 나는 하나야! 먼저 웰컴 팩을 열고, 집 앞 빈자리에 텃밭 2 칸을 놓아 봐!';
    else if (me.quest===2){ me.inv.can = true; me.quest = 3; tutorialFix(); text = '텃밭 다 놓았구나! 자, 내 물뿌리개 줄게! 토마토 씨앗 심고 물 줘 봐! 헤헤.'; }
    else if (me.quest<5) text = '씨앗 심고 물 한 번만 주면 새싹, 잎, 꽃 거쳐서 저절로 빨개져! 헤헤.';
    else text = '토마토가 빨개지면 텃밭을 눌러서 수확해!';
  }
  if (n.id==='hana' && me.quest>=6 && !countOf('seed') && !me.gardens.some(g=>g&&g.crop) && me.inv.gold < CROPS.c01.seed){ invAdd('seed:c01', 2); toast('하나가 토마토 씨앗 2 개를 나눠 줬어요'); }
  saveMe(); renderHud();
  if (!text && playNext(n, '', note.replace(/^오늘 첫 대화 · 호감도 \+\d+( · )?/, ''))) return; // 들을 차례인 이야기가 있으면 바로 들려줘요 (하트마다 한 화)
  // 아직 다음 이야기 차례가 아니면: 지금 하트에 맞는 평소 말 (하트가 오를 때마다 조금씩 달라져요)
  const h = heartsN(n), pool = (n.lines && n.lines[tierOf(h)]) || [], heartLine = pool.length ? fillName(pool[h % pool.length]) : '', aft = afterLine(n) || heartLine;
  if (!text) text = (first ? [opening, aft].filter(Boolean).join('\n') : aft) || '...';
  const sys = note.replace(/^오늘 첫 대화 · 호감도 \+\d+( · )?/, ''); // 호감도는 끝나고 하트로 보여 줘요
  story({n, beats:[...(sys ? [{who:'narr', text:sys}] : []), ...toBeats([text])], hint: storyHint(n)});
}

function drawMap(){

    const g = mapGeo[id], T = THEME[z.theme] || THEME.grass, sx = g.w/z.W, sy = g.h/z.H, X = x => g.x + x*sx, Y = y => g.y + y*sy;

      else if (p.kind==='house'){ c.fillStyle = '#fff6ee'; c.fillRect(X(p.x)-4, Y(p.y)-5, 8, 5); c.fillStyle = p.roof; c.beginPath(); c.moveTo(X(p.x)-5.5, Y(p.y)-5); c.lineTo(X(p.x), Y(p.y)-10); c.lineTo(X(p.x)+5.5, Y(p.y)-5); c.fill(); }

      else if (p.kind==='tree'){ c.fillStyle = '#c9a6ff'; c.beginPath(); c.arc(X(p.x), Y(p.y)-3, 5, 0, 7); c.fill(); }
      else if (p.kind==='lighthouse'){ c.fillStyle = '#fff'; c.fillRect(X(p.x)-2, Y(p.y)-11, 4, 11); c.fillStyle = '#ff6b6b'; c.fillRect(X(p.x)-2, Y(p.y)-8, 4, 2); }
      else if (p.kind==='mine'){ c.fillStyle = '#b3a8b8'; const k = z.k||1; for (const mx of [520,1080]){ c.beginPath(); c.ellipse(X(mx*k), Y(900*k), 220*k*sx, 150*k*sy, 0, 0, 7); c.fill(); } }
      else if (p.kind==='crystals'){ c.fillStyle = '#bf8cff'; const k = z.k||1; for (const [qx,qy] of [[300,300],[1300,320],[260,800],[1320,820],[700,260],[1000,880]]){ c.beginPath(); c.moveTo(X(qx*k)-2, Y(qy*k)+2); c.lineTo(X(qx*k), Y(qy*k)-4); c.lineTo(X(qx*k)+2, Y(qy*k)+2); c.fill(); } }

}

// 무기: 콩이의 경비대 무기고에서 광석과 골드로 만들어요. 좋은 무기일수록 공격력이 세요
const WEAPON_LIST = [

function swordAtk(){ const a = weapon().atk, v = a + Math.floor(Math.random()*(a*.25+1)); return swingTired ? Math.ceil(v/2) : v; }
function weaponPanel(){

const DIRV = {left:[-1,0], right:[1,0], up:[0,-1], down:[0,1]};
let swingAt = -1e9, swingDir = 'down', lunge = 0;
function pushPlayer(dx, dy, dist){
  const l = Math.hypot(dx,dy)||1, nx = pos.x + dx/l*dist, ny = pos.y + dy/l*dist;
  if (!blocked(nx, pos.y)) pos.x = nx; if (!blocked(pos.x, ny)) pos.y = ny;
}
function faceTo(x, y){ const dx = x-pos.x, dy = y-pos.y; pos.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }
function nearFoe(r=110){ return mobs.some(m=>Math.hypot(pos.x-m.x, pos.y-m.y) < r) || (bossAlive() && Math.hypot(pos.x-BOSS.x, pos.y-BOSS.y) < r+40); }
// 휘두르기: 바라보는 쪽으로 한 발 내딛으며 검을 휘둘러요. 닿은 몬스터는 밀려나요
function swing(){
  if (darkDown) return;
  if (!me.inv.sword){ toast('검이 없어요. 마을 광장의 콩이에게 가 봐요'); return; }
  const t = performance.now(); if (t - swingAt < 380) return;
  if (fishing) return;
  swingAt = t; swingDir = pos.dir; lunge = .12; target = null; swingTired = !useSta('swing');
  const [vx,vy] = DIRV[pos.dir] || DIRV.down;
  const cx = pos.x + vx*26, cy = pos.y + vy*26;
  for (const mob of [...mobs]){
    const dx = mob.x-pos.x, dy = mob.y-pos.y;
    if (Math.hypot(mob.x-cx, mob.y-cy) < 58 && dx*vx + dy*vy > -12) hitMob(mob, t, vx, vy);
  }
  darkSwing(cx, cy, vx, vy, t);
  if (bossAlive()){
    const dx = BOSS.x-pos.x, dy = BOSS.y-pos.y;
    if (Math.hypot(BOSS.x-cx, BOSS.y-cy) < 100 && dx*vx + dy*vy > -20){
      const dmg = swordAtk(); bossPending += dmg; bossHurt = .2; fx.push({x:BOSS.x+(Math.random()-.5)*40, y:BOSS.y-90, text:String(dmg), t, color:'#ffffff'});
      if (me.bossHit !== today()){ me.bossHit = today(); saveMe(); }
    }
  }
}
function updateSwing(dt){
  if (lunge > 0){ lunge -= dt; const [vx,vy] = DIRV[swingDir] || DIRV.down; pushPlayer(vx, vy, 170*dt); }
}
function drawSwing(c, t){
  const a = (t - swingAt)/180; if (a < 0 || a > 1) return;
  const base = {right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[swingDir] ?? Math.PI/2;
  const from = base - 1.2, to = from + 2.4*Math.min(1, a*1.6), col = weapon().color;
  c.save(); c.translate(pos.x, pos.y-20); c.globalAlpha = 1 - a*.7; c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 9; c.beginPath(); c.arc(0,0,40,from,to); c.stroke();
  c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(0,0,40,from,to); c.stroke();
  c.rotate(to); c.fillStyle = col; c.strokeStyle = '#6e5260'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(14,-3,34,6,3); c.fill(); c.stroke();
  c.restore();
}
function hitMob(mob, t, vx, vy){
  const dmg = swordAtk(); mob.hp -= dmg; mob.hurt = .3;
  const dx = mob.x-pos.x, dy = mob.y-pos.y, l = Math.hypot(dx,dy)||1;
  const kx = dx/l + (vx||0), ky = dy/l + (vy||0), kl = Math.hypot(kx,ky)||1, power = 300 / (1 + MONSTERS[mob.id].hp/400);
  mob.kvx = kx/kl*power; mob.kvy = ky/kl*power; mob.kb = .18;
  fx.push({x:mob.x, y:mob.y-40, text:String(dmg), t, color:'#ffffff'});
  if (mob.hp <= 0){
    mobs = mobs.filter(m=>m!==mob); stat('monsterKills'); if (mob.id==='m28') stat('caveBossKills'); questEvent('kill', mob.id);
    const m = MONSTERS[mob.id], gold = Math.round(m.atk * (0.8 + Math.random()*.4));
    invAdd('loot:'+mob.id, 1); me.inv.gold += gold;
    me.mdex = me.mdex || {}; const first = !me.mdex[mob.id]; me.mdex[mob.id] = (me.mdex[mob.id]||0) + 1;
    gainExp(Math.max(3, Math.round(m.hp/6 + m.atk)));

    toast(`${m.name}을(를) 물리쳤어요! ${m.drop} · ${gold} G${first ? ' · 처음 물리친 몬스터!' : ''}`, 'loot:'+mob.id);
    if (mob.id==='m28' && net && net.sendChat) net.sendChat('(동굴의 주인을 물리쳤다!)').catch(()=>{});
  }
}

function drawMob(d, mob, t){
  const m = MONSTERS[mob.id], c = d.ctx, x = mob.x, y = mob.y, s = .9 + Math.min(1, m.hp/200)*.35, bob = Math.sin(t/180 + x)*1.5;

function contentTarget(w){
  for (const mob of mobs) if (Math.abs(w.x-mob.x) < 24 && w.y > mob.y-40 && w.y < mob.y+8){
    if (!me.inv.sword){ toast('검이 없어요. 마을 광장의 콩이에게 가 봐요'); return {x:pos.x, y:pos.y, act:null, mark:performance.now()}; }

function plant(i, type, quiet=false){

// 튜토리얼은 순서대로: 아직 차례가 아닌 행동은 막고 지금 할 일을 알려 줘요. 예전에 순서가 꼬여 멈춘 경우도 이어지게 고쳐요

function errandsToday(){
  const r = seeded(hash(uid + ':' + today())), list = [];
  const crops = Object.keys(CROPS).filter(id=>CROPS[id].min <= 120), fish = Object.keys(FISH).filter(id=>FISH[id].weight >= 8), ores = Object.keys(ORES).filter(id=>ORES[id].tier<=2 && !ORES[id].sea), loot = Object.keys(MONSTERS).filter(id=>MONSTERS[id].zone==='forest');
  const pick = a => a[Math.floor(r()*a.length)];
  const kinds = ['crop','fish','ore','loot'];
  for (let i=0;i<3;i++){
    const k = kinds[Math.floor(r()*4)];
    if (k==='crop'){ const id = pick(crops); list.push({key:'crop:'+id, n:1+Math.floor(r()*3), label:CROPS[id].name}); }
    if (k==='fish'){ const id = pick(fish), st = r()<.3 ? 2 : 1; list.push({key:'fish:'+id, st, n:1, label:`${FISH[id].name} ${'★'.repeat(st)} 이상`}); }
    if (k==='ore'){ const id = pick(ores); list.push({key:'ore:'+id, n:1+Math.floor(r()*3), label:ORES[id].name}); }
    if (k==='loot'){ const id = pick(loot); list.push({key:'loot:'+id, n:1+Math.floor(r()*2), label:MONSTERS[id].drop}); }
  }
  return list.map((e,i)=>({...e, i, reward: 150 + Math.round(e.key.startsWith('fish:') ? fishPrice(e.key.slice(5)+'_'+e.st)*2.2 : itemPrice(e.key)*e.n*2.2)}));

const swatchCache = new Map();
function swatchURL(kind, id){
  const k = kind+id; if (swatchCache.has(k)) return swatchCache.get(k);
  const cv = document.createElement('canvas'); cv.width = cv.height = 88; const c = cv.getContext('2d');
  c.save(); c.beginPath(); c.roundRect(0,0,88,88,16); c.clip();
  (kind==='wall' ? WALLS : FLOORS)[id].draw(c, painter(c), 0, 0, 88, 88, ROOFS[(me && me.roof) || 0][1]); // 관리자는 me 가 없어요 c.restore();
  const url = cv.toDataURL(); swatchCache.set(k, url); return url;
}

function drawRoomStatic(c, d, z){
  const own = z.house, p = own===uid ? me : players[own], roof = p ? ROOFS[p.roof][1] : '#ff9fbf', H = houseOf(p), lv = H.lv;
  c.fillStyle = '#5b4a5f'; c.fillRect(0,0,z.W,z.H);
  const wallH = 190 + lv*8, wy = 40, fy = wy + wallH - 10;
  c.save(); c.beginPath(); c.roundRect(60, wy, z.W-120, wallH, 16); c.clip(); (WALLS[H.wall] || WALLS.w00).draw(c, d, 60, wy, z.W-120, wallH, roof); c.restore();
  c.save(); c.beginPath(); c.roundRect(60, fy, z.W-120, z.H-fy-50, 14); c.clip(); (FLOORS[H.floor] || FLOORS.f00).draw(c, d, 60, fy, z.W-120, z.H-fy-50); c.restore();
  // 벽 아래 걸레받이와 그림자
  d.rr(60, fy-6, z.W-120, 12, 6, '#fff7ef'); c.fillStyle='rgba(60,30,50,.10)'; c.fillRect(64, fy+6, z.W-128, 10);
  // 창문: 넓을수록 여러 개
  const nWin = Math.max(1, Math.round((z.W-200)/420));
  for (let i=0; i<nWin; i++){ const wx = 100 + (i+.5)*(z.W-200)/nWin;
    d.rr(wx-80, wy+40, 160, 100, 12, '#bfe8ff'); d.line(k=>{ k.moveTo(wx, wy+40); k.lineTo(wx, wy+140); k.moveTo(wx-80, wy+90); k.lineTo(wx+80, wy+90); }, '#ffffff', 4);
    if (lv>=3){ d.rr(wx-96, wy+30, 24, 120, 10, shade(roof,.25)); d.rr(wx+72, wy+30, 24, 120, 10, shade(roof,.25)); } }
  if (lv>=4){ // 2층으로 가는 계단 (장식)
    const sx = z.W-200; for (let i=0; i<6; i++) d.rr(sx+i*14, fy-20-i*22, 110-i*14, 24, 5, i%2 ? '#c98e5b' : '#d9a06a');
    d.rr(sx+92, fy-160, 8, 150, 4, '#a8744f'); }
  if (lv>=5){ // 샹들리에
    const cx = z.W/2; d.line(k=>{ k.moveTo(cx, 0); k.lineTo(cx, wy+18); }, '#c9a85a', 3);
    d.ell(cx, wy+26, 54, 14, '#ffd76a'); for (let i=-2; i<=2; i++) d.circle(cx+i*22, wy+40, 7, '#fff6c2'); }
  d.rr(z.W/2-40, z.H-60, 80, 60, 8, '#8a5a3b');

function wearPreview(L, size=96){
  const key = JSON.stringify(L)+'|'+size; if (previewCache.has(key)) return previewCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  const sc = size/80; x.setTransform(sc,0,0,sc,size/2, size-5); // 새 몸은 키가 커서 모자까지 다 들어가게
  try { CH.figure(CH.mattePainter(x), L, 'down', 0, false, 'dot'); } catch(e){}
  const url = c.toDataURL(); if (previewCache.size > 200) previewCache.clear(); previewCache.set(key, url); return url;
}

// ===== 옷·우산·벽지·바닥도 모두 가방 아이템: 사면 가방에 들어가고, 가방에서 입거나 쓰면 원래 것이 가방으로 돌아와요 =====
const slotOfWear = id => (CH.CATS.find(([,,cat])=>cat[id] && id!=='none') || [])[0];
const emptyOf = sl => sl==='hat' || sl==='acc' ? 'none' : '';
const SLOT_NAME = Object.fromEntries(CH.CATS.map(([k,l])=>[k,l]));
function takeOff(sl){ const id = me.look[sl]; if (!id || id==='none') return false; invAdd('wear:'+bagKey(id, me.look.cc?.[sl]||0), 1); me.look = {...me.look, [sl]: emptyOf(sl)}; return true; }
function lookChanged(){ spriteCache.clear(); previewCache.clear(); saveMe(); }
function wearItem(k){
  const [id, c] = k.slice(5).split(/[~#]/), sl = slotOfWear(id); if (!sl || invCount(k) < 1) return;
  invAdd(k, -1);
  { const ck = ownKey(id, +c||0); if (!CLOSET().includes(ck)) CLOSET().push(ck); } // 거래소에서 산 옷도 모은 옷으로
  for (const o of sl==='set' ? ['set','top','bottom'] : sl==='top' || sl==='bottom' ? [sl, 'set'] : [sl]) takeOff(o); // 한 벌을 입으면 상의·하의도 벗어 가방에
  me.look = {...me.look, [sl]: id, cc:{...(me.look.cc||{}), [sl]: +c||0}};
  stat('outfitChanged'); lookChanged(); toast(`${itemName(k)}을(를) 입었어요 · 입던 옷은 가방에 넣었어요`);
}
function unwear(sl){ if (takeOff(sl)){ lookChanged(); toast(`${SLOT_NAME[sl]}을(를) 벗어 가방에 넣었어요`); } }
function useUmb(k){
  const id = k.slice(4); if (!UMB[id] || invCount(k) < 1) return;
  invAdd(k, -1); if (me.umb && UMB[me.umb]) invAdd('umb:'+me.umb, 1); me.umb = id; saveMe(); toast(`${UMB[id].name} 우산을 골랐어요${isRain() ? '' : ' · 비가 오면 펼쳐요'}`);
}
function umbOff(){ if (me.umb && UMB[me.umb]){ invAdd('umb:'+me.umb, 1); toast('우산을 가방에 넣었어요'); } me.umb = ''; saveMe(); }
function useInterior(k){
  const [cat, id] = k.split(':'), H = myHouse(), cur = cat==='wall' ? 'wall' : 'floor', list = cat==='wall' ? WALLS : FLOORS;

  H[cur] = id; const key = cat==='wall' ? 'walls' : 'floors'; if (!H[key].includes(id)) H[key] = [...H[key], id]; saveMe(); staticSig = ''; toast(`${list[id].name}${cat==='wall' ? ' 벽지를 발랐어요' : ' 바닥을 깔았어요'} · 쓰던 건 가방에 넣었어요`);
}
// 가방 맨 위: 지금 입은 옷·고른 우산 (누르면 벗어서 가방에)
function wornRow(){

// 옛 저장(옷장·우산 목록·산 벽지 목록)을 한 번만 가방 아이템으로 옮겨요. 지금 입고·쓰고 있는 건 그대로
function migrateItems(){
  if ((me.invV|0) >= 2) return;
  const L = me.look || {};
  if (L.set) for (const sl of ['top','bottom']) if (L[sl] && L[sl]!=='none'){ if (!freeItem(CH.ITEM(L[sl]))) invAdd('wear:'+bagKey(L[sl], L.cc?.[sl]||0), 1); me.look = {...me.look, [sl]: ''}; }
  const worn = new Set(CH.CATS.map(([sl])=>me.look[sl] && me.look[sl]!=='none' ? ownKey(me.look[sl], me.look.cc?.[sl]||0) : '').filter(Boolean));
  for (const k of [...new Set(me.closet || [])]) if (!worn.has(k) && CH.ITEM(k.split('#')[0]) && !freeItem(CH.ITEM(k.split('#')[0]))) invAdd('wear:'+k.replace('#', '~'), 1);
  for (const id of Object.keys(me.umbs || {})) if (UMB[id] && id !== me.umb) invAdd('umb:'+id, 1);
  delete me.umbs;
  const H = myHouse();
  for (const [cat, list, ownedL, cur] of [['wall', WALLS, H.walls, H.wall], ['floor', FLOORS, H.floors, H.floor]]) for (const id of ownedL || []) if (id !== cur && list[id] && list[id].price > 0) invAdd(cat+':'+id, 1);

    const cost = it.need ? `${it.price?it.price.toLocaleString()+' G + ':''}${itemName(it.need)} ${invCount(it.need)}/${it.n}` : `${it.price.toLocaleString()} G`;
    const can = it.need ? (me.inv.gold >= it.price && invCount(it.need) >= it.n) : me.inv.gold >= it.price;

  const pn = $('npcPanel');

// 색 고르기: 같은 옷의 다섯 색을 입어 본 모습으로 보여 주고, 가진 색은 바로 입고 없는 색은 사요

    if (!can) return toast(it.need ? '재료나 돈이 모자라요' : '돈이 모자라요');

      me.inv.gold -= it.price; if (it.need) invAdd(it.need, -it.n); invAdd('wear:'+bagKey(id, c), 1); if (!CLOSET().includes(ownKey(id, c))) CLOSET().push(ownKey(id, c)); stat('bought'); syncStats(); saveMe(true); renderHud(); closeTalk(); colorPanel(slot, id); toast(`${it.name}(${c+1} 번 색)을(를) ${it.need?'만들었어요':'샀어요'} · 가방에서 [입기]로 입어요`); }], ['그만두기', ()=>{ closeTalk(); colorPanel(slot, id); }]], '', true);

// ===== 올리 박물관: 섬 주민 12 명이 함께 채워요 =====
// museum/<f|o|m>/<id> = {uid, nick, at} · 한 칸은 먼저 기증한 한 사람만 (이름이 남아요)
// me.museum 은 '내가 기증한 것' 목록이에요. 10 점마다 받는 보상은 사람마다 따로예요.
const MUSEUM_CAT = {f:'물고기', o:'광석', m:'몬스터 전리품'};
let museum = {f:{}, o:{}, m:{}}, museumView = 'give', museumBusy = false;
function onMuseum(v){ v = v || {}; museum = {f:v.f || {}, o:v.o || {}, m:v.m || {}}; museumSync();
  const p = $('npcPanel'); if (p && !p.hidden && p.dataset.museum && !museumBusy) museumPanel(); }
function museumSet(k){ return new Set(((me.museum||{})[k]||'').split(',').filter(Boolean)); }
function museumTotal(){ return me ? ['f','o','m'].reduce((a,k)=>a+museumSet(k).size, 0) : 0; } // 내가 기증한 수
function museumShared(){ return ['f','o','m'].reduce((a,k)=>a+Object.keys(museum[k]).length, 0); } // 섬 전체
function museumName(cat, id){ return cat==='f' ? FISH[id]?.name : cat==='o' ? ORES[id]?.name : MONSTERS[id]?.drop; }
// 함께 쓰기 전에 혼자 기증해 둔 것은 비어 있는 칸이면 내 이름으로 올려요
let museumSynced = false;
function museumSync(){ if (museumSynced || !me || !net || !net.museumGive || admin) return; museumSynced = true;
  for (const k of ['f','o','m']) for (const id of museumSet(k)) if (!museum[k][id]) net.museumGive(k, id).catch(()=>{}); }
function museumPanel(){
  if (!me) return;
  const shared = museumShared(), mine = museumTotal(), rows = [];
  const has = (cat, id) => !!museum[cat][id];
  for (const [k] of itemsOf('fish')){ const id = parseFish(k.slice(5)).id; if (!has('f', id) && !rows.some(r=>r.id===id)) rows.push({cat:'f', id, key:k, name:FISH[id].name}); }
  for (const [k] of itemsOf('ore')){ const id = k.slice(4); if (!has('o', id)) rows.push({cat:'o', id, key:k, name:ORES[id].name}); }
  for (const [k] of itemsOf('loot')){ const id = k.slice(5); if (!has('m', id)) rows.push({cat:'m', id, key:k, name:MONSTERS[id].drop}); }
  const cnt = k => Object.keys(museum[k]).length;
  const head = `<div class="np" style="display:block"><b>섬 박물관 ${shared}/120</b> · 물고기 ${cnt('f')}/50 · 광석 ${cnt('o')}/40 · 전리품 ${cnt('m')}/30<br><small>내가 기증한 것 ${mine} 점 · 내가 10 점 기증할 때마다 800 G (다음 보상까지 ${10 - mine % 10} 점)</small></div>
    <div style="display:flex;gap:6px"><button class="mini ${museumView==='give' ? 'on' : ''}" data-mv="give">기증하기</button><button class="mini ${museumView==='list' ? 'on' : ''}" data-mv="list">기증 목록 · 누가 했나</button></div>`;
  let body;
  if (museumView === 'list'){
    body = ['f','o','m'].map(k=>{ const e = Object.entries(museum[k]).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
      return `<p class="mnote" style="margin:6px 0 2px"><b>${MUSEUM_CAT[k]} ${e.length}</b></p>` + (e.length ? e.map(([id,d])=>`<div class="np"><span class="np-name">${esc(museumName(k, id) || id)}</span><span class="np-place">${d.uid===uid ? '나' : esc(d.nick || '누군가')}</span></div>`).join('') : '<p class="mnote">아직 없어요</p>'); }).join('');
  } else body = rows.length ? rows.map((r,i)=>`<button class="np" data-id="${i}"><span class="np-name">${iconImg(r.key)}${r.name}</span><span class="np-place">기증하기</span></button>`).join('') : '<p class="mnote">기증할 새 물건이 없어요. 아직 박물관에 없는 물고기·광석·전리품을 가져와요. 다른 주민이 이미 기증한 건 다시 못 해요.</p>';
  openPanel(`올리 박물관 · 섬 전체 ${shared}/120`, head + body);
  const P = $('npcPanel'); P.dataset.museum = '1';
  P.querySelectorAll('button[data-mv]').forEach(b=>b.onclick = ()=>{ museumView = b.dataset.mv; museumPanel(); });
  P.querySelectorAll('button[data-id]').forEach(b=>b.onclick = async ()=>{
    if (museumBusy) return; const r = rows[+b.dataset.id]; if (!r || invCount(r.key) < 1) return museumPanel();
    museumBusy = true; b.disabled = true;
    const ok = await net.museumGive(r.cat, r.id); museumBusy = false;
    if (!ok){ toast(`방금 다른 주민이 ${r.name}을(를) 먼저 기증했어요`); return museumPanel(); }
    invAdd(r.key, -1);
    me.museum = me.museum || {}; me.museum[r.cat] = [...museumSet(r.cat), r.id].join(',');
    const t = museumTotal(); if (t % 10 === 0){ me.inv.gold += 800; addPts(NPC.olly, 20); toast(`내 기증 ${t} 점 달성! 800 G를 받았어요`); } else toast(`${r.name}을(를) 기증했어요 · 내 이름이 남아요`);
    saveMe(); renderHud(); museumPanel();
  });
}

// ===== 날씨 (펭펭) =====
// 날씨는 4 시간마다 바뀌어요 (하루 6 번). 모두에게 같은 날씨예요. 계절 없이 맑음 45 · 흐림 20 · 비 17 · 눈 13 · 무지개 5 %
const WX = {sun:['맑음','☀️'], cloud:['흐림','☁️'], rain:['비','🌧️'], snow:['눈','❄️'], rainbow:['무지개','🌈']};
const WX_BLOCK = 4;
const wxBlock = (t=Date.now()) => Math.floor((t + serverOffset + 9*3600000) / (WX_BLOCK*3600000));
function weatherOf(dayOrBlock, isBlock){
  const b = isBlock ? dayOrBlock : wxBlock();
  const table = [['sun',45],['cloud',20],['rain',17],['snow',13],['rainbow',5]]; // 계절 없이 언제나 같은 확률
  let r = hash('wx'+b) % 100; for (const [k,w] of table){ if ((r -= w) < 0) return [...WX[k], k]; } return [...WX.sun, 'sun'];
}
const wxNow = () => weatherOf(wxBlock(), true);
const isRain = () => wxNow()[2]==='rain';
const isSnow = () => wxNow()[2]==='snow';
const isRainbow = () => wxNow()[2]==='rainbow';
function forecast(){
  const a = wxNow(), b = weatherOf(wxBlock()+1, true), nextH = ((wxBlock()+1)*WX_BLOCK) % 24;
  return `지금은 ${a[1]} ${a[0]}, ${nextH} 시부터는 ${b[1]} ${b[0]}! ${a[2]==='rain' ? '비가 오면 텃밭에 물을 안 줘도 되고, 희귀한 물고기가 잘 나와. 몽실이네 우산 하나 챙겨!' : a[2]==='snow' ? '눈 오는 날은 포근하게 입어. 바깥에서 눈사람도 만들 수 있어. 눈이 그치면 녹지만!' : a[2]==='rainbow' ? '무지개 뜬 날엔 바위에서 귀한 광석이 잘 나와!' : ''}`;
}
let rainT = 0;
function rainWater(t){
  if (!isRain() || t - rainT < 20000) return; rainT = t;
  let n = 0; const now = Date.now();
  for (const g of me.gardens) if (g && g.crop){ const c = cropNow(g.crop, now); if (c.stage < 4 && !c.wateredAt){ g.crop = {type:c.type, stage:c.stage, wateredAt:now}; n++; } else g.crop = c; }
  if (n){ saveMe(); toast(`비가 와서 텃밭 ${n} 칸에 물이 들었어요`); }
}
const drops = Array.from({length:70}, (_,i)=>({x:Math.random(), y:Math.random(), s:.6+Math.random()*.6}));
const flakes = Array.from({length:90}, ()=>({x:Math.random(), y:Math.random(), s:.35+Math.random()*.5, r:1.2+Math.random()*2.2, p:Math.random()*6.28}));
// ===== 우산: 몽실이네 우산 가게에서 무늬를 사고 색은 마음대로 골라요. 골라 두면 비 올 때 바깥에서 저절로 펼쳐 써요 (다른 사람에게도 보여요) =====
const UMB = { // 무늬 7 가지 (u1~u7)
  u1:{name:'민무늬', price:3000}, u2:{name:'땡땡이', price:8000}, u3:{name:'줄무늬', price:12000}, u4:{name:'구름', price:18000},
  u5:{name:'하트', price:28000}, u6:{name:'별', price:45000}, u7:{name:'무지개', price:70000, rainbow:true},
};
const UMB_COLS = [['분홍','#ff9cc0'],['딸기','#ff6b7a'],['귤','#ffa94d'],['레몬','#ffd84d'],['풀잎','#9ad66b'],['하늘','#8cc8ff'],['라벤더','#b49bff'],['크림','#f6efe6']];
const RAINBOW = ['#ff7a88','#ffad5c','#ffe070','#8fd68a','#7cbcff','#b49bff'];
const umbKey = () => me.umb && UMB[me.umb] ? me.umb + ':' + Math.max(0, Math.min(UMB_COLS.length-1, me.umbCol|0)) : '';
function umbOk(k){ const [id, ci] = String(k||'').split(':'); return UMB[id] && UMB_COLS[ci|0] ? id+':'+(ci|0) : ''; }
// 클레이 우산: 볼록한 지붕(그라데이션·가장자리 음영) + 동글동글 끝 구슬 + 홈 파인 살 + 나무 손잡이
function drawUmbrella(c, x, y, key, dir, t, walk){
  const [id, ci] = String(key).split(':'), U = UMB[id]; if (!U) return;
  const col = UMB_COLS[ci|0][1], d = painter(c), light = ['#ffd84d','#f6efe6','#9ad66b'].includes(col), ink = light ? '#ff8fb6' : '#fff8f0';

    for (let i=0;i<4;i++){ const a = cx+R - i*R/2; c.quadraticCurveTo(a - R/4, cy+1, a - R/2, cy+8); } c.closePath(); };
  d.shape(dome, U.rainbow ? RAINBOW[2] : col, [cx, cy-10, R]);
  c.save(); dome(); c.clip();
  if (U.rainbow) RAINBOW.forEach((k,i)=>{ const w = 2*R/RAINBOW.length; c.globalAlpha = .9; c.fillStyle = k; c.fillRect(cx-R+i*w, cy-32, w+.6, 44); });
  c.globalAlpha = .92; c.fillStyle = ink;

  if (id==='u4') for (const [dx,dy] of [[-14,-8],[14,-16]]) for (const [ox,oy,r] of [[-6,1,5],[0,-3,6.5],[7,1,5],[0,3,5]]) { c.beginPath(); c.arc(cx+dx+ox, cy+dy+oy, r, 0, 7); c.fill(); }
  if (id==='u5') for (const [dx,dy,k] of [[-18,-6,1],[0,-18,.9],[16,-4,1],[-4,2,.7],[24,-16,.6],[-26,-17,.6]]) { const hx2 = cx+dx, hy = cy+dy; c.beginPath(); c.moveTo(hx2, hy+4*k); c.bezierCurveTo(hx2-7*k, hy-1*k, hx2-4*k, hy-7*k, hx2, hy-3*k); c.bezierCurveTo(hx2+4*k, hy-7*k, hx2+7*k, hy-1*k, hx2, hy+4*k); c.fill(); }
  if (id==='u6') for (const [dx,dy,k] of [[-17,-5,1],[3,-17,.9],[18,-3,1],[-1,3,.6],[-26,-17,.55],[24,-18,.55]]) { c.beginPath(); for (let i=0;i<10;i++){ const r = (i%2 ? 2.3 : 5.4)*k, a = -Math.PI/2 + i*Math.PI/5; c.lineTo(cx+dx + Math.cos(a)*r, cy+dy + Math.sin(a)*r); } c.closePath(); c.fill(); }
  // 살 홈: 어두운 선 + 바로 옆 밝은 선
  c.globalAlpha = 1; for (const k of [-.5, 0, .5]) for (const [o, st] of [[0, 'rgba(90,40,70,.20)'], [1.2, 'rgba(255,255,255,.28)']]){ c.strokeStyle = st; c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx+o, cy-29); c.quadraticCurveTo(cx + k*R*.88 + o, cy-14, cx + k*R + o, cy+7); c.stroke(); }
