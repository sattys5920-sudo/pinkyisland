// ===== 경제: 판매처 · 오늘의 시세 · 거래소 =====
// 판매처: 모모는 뭐든 사 주고, 전문 상인은 자기 분야를 더 비싸게 사 줘요. 친한 친구(♥7)가 되면 +10%
const BUYERS = {
  momo:{cats:['crop','fish','ore','loot','dish','furn'], bonus:{}, line:'뭐든 가져와요~ 다 사 줄게요!'},
  hana:{cats:['crop'], bonus:{crop:1.25}, line:'작물이면 내가 제일 비싸게 사 줄게!'},
  lulu:{cats:['fish'], bonus:{fish:1.25}, line:'…물고기면… 좋은 값 쳐 줄게…'},
  pengpeng:{cats:['fish'], bonus:{fish:1.15}, line:'펭! 바다 물고기 환영!'},
  dodo:{cats:['ore'], bonus:{ore:1.25}, line:'광석이라면 내가 제값 쳐 주지.'},
  bibi:{cats:['loot'], bonus:{loot:1.25}, line:'전리품? 좋아, 비싸게 사 주마!'},
  dandan:{cats:['dish','crop'], bonus:{dish:1.25, crop:1.05}, line:'요리라면 우리 카페에서 사 갈게요.'},
};
const SELL_CATS = {crop:'작물', fish:'물고기', ore:'광석', loot:'전리품', dish:'요리', furn:'가구'};
const baseKey = key => { const [cat, id] = key.split(':'); return cat==='fish' ? 'fish:'+parseFish(id).id : key; };
// 오늘의 인기 품목: 작물·물고기·광석에서 하나씩, 오늘은 2배 값
function hotToday(){
  const d = today(), pick = (list, salt) => list[hash(d+salt) % list.length];
  return [ 'crop:'+pick(Object.keys(CROPS),'c'), 'fish:'+pick(Object.keys(FISH),'f'), 'ore:'+pick(Object.keys(ORES).filter(id=>ORES[id].tier<=3),'o') ];
}
// 시세: 날마다 품목별로 70%~140% 사이에서 바뀌어요
function marketMul(key){ const b = baseKey(key); if (hotToday().includes(b)) return 2; return .7 + (hash(today()+'|'+b) % 71)/100; }
function soldToday(){ if (!me.sold || me.sold.d !== today()) me.sold = {d:today(), c:{}}; return me.sold.c; }
// 같은 물건을 하루에 많이 팔면 값이 조금씩 내려가요 (개당 -3%, 최저 50%)
const glut = (key, extra=0) => Math.max(.5, 1 - .03*((soldToday()[baseKey(key).replace(':','_')]||0) + extra));
function buyerBonus(n, key){
  const by = BUYERS[n.id], cat = key.split(':')[0];
  return (by?.bonus[cat] || 1) + (heartsN(n) >= 7 ? .1 : 0);
}
function unitPrice(key, n, extra=0){ return Math.max(1, Math.round(itemPrice(key) * marketMul(key) * glut(key, extra) * (n ? buyerBonus(n, key) : 1))); }
function sellTotal(key, cnt, n){ let s = 0; for (let i=0;i<cnt;i++) s += unitPrice(key, n, i); return s; }
function sellItem(key, cnt, n){
  cnt = Math.min(cnt, invCount(key)); if (cnt <= 0) return 0;
  const g = sellTotal(key, cnt, n), sk = baseKey(key).replace(':','_'), c = soldToday();
  invAdd(key, -cnt); c[sk] = (c[sk]||0) + cnt; me.inv.gold += g;
  me.earned = (me.earned||0) + g;
  return g;
}
const trend = key => { const m = marketMul(key); return m >= 2 ? '<b style="color:#e48fac">인기 ×2</b>' : m >= 1.15 ? '<span style="color:#e48fac">▲</span>' : m <= .85 ? '<span style="color:#7fa6d9">▼</span>' : '<span style="color:var(--soft)">–</span>'; };
function sellPanel(n){
  const by = BUYERS[n.id] || BUYERS.momo;
  const rows = by.cats.flatMap(cat=>itemsOf(cat).map(([k,c])=>({k,c,cat})));
  const all = rows.reduce((a,r)=>a+sellTotal(r.k, r.c, n), 0);
  const bon = Object.entries(by.bonus).map(([c,b])=>`${SELL_CATS[c]} +${Math.round((b-1)*100)}%`).concat(heartsN(n) >= 7 ? ['친한 친구 +10%'] : []).join(' · ');
  openPanel(`${n.name}에게 팔기 · 💰 ${me.inv.gold}G`,
    `<p class="mnote" style="margin-top:0">${esc(by.line)}${bon ? ` <b style="color:var(--pinkd)">${bon}</b>` : ''}<br>오늘의 인기: ${hotToday().map(k=>itemName(k)).join(', ')} (2배)</p>` +
    (rows.length ? `<button class="mini" id="spAll" style="align-self:flex-start">전부 팔기 +${all}G</button>` +
      rows.map(r=>`<button class="np" data-id="${r.k}"><span class="np-name">${iconImg(r.k)}${esc(itemName(r.k))} <small>×${r.c}</small></span><span class="np-place">${unitPrice(r.k, n)}G ${trend(r.k)}</span><span class="np-day">전부 ${sellTotal(r.k, r.c, n)}G</span></button>`).join('')
      : `<p class="mnote">${n.name}에게 팔 수 있는 물건이 없어요.</p>`),
    b=>{ const k = b.dataset.id, c = invCount(k);
      const opts = [[`1개 팔기 (+${sellTotal(k,1,n)}G)`, ()=>{ const g = sellItem(k,1,n); saveMe(); renderHud(); toast(`${itemName(k)} 1개 · +${g}G`, k); sellPanel(n); }]];
      if (c > 1) opts.push([`${c}개 전부 팔기 (+${sellTotal(k,c,n)}G)`, ()=>{ const g = sellItem(k,c,n); saveMe(); renderHud(); toast(`${itemName(k)} ${c}개 · +${g}G`, k); sellPanel(n); }]);
      opts.push(['그만두기', ()=>sellPanel(n)]);
      withIcon(k); say(itemName(k), `오늘 시세 ${Math.round(marketMul(k)*100)}% · 1개 ${unitPrice(k,n)}G`, opts, '같은 물건을 많이 팔면 값이 조금씩 내려가요', true); });
  const allBtn = $('spAll'); if (allBtn) allBtn.onclick = ()=>{ let g = 0; for (const r of rows) g += sellItem(r.k, r.c, n); saveMe(); renderHud(); toast(`전부 팔았어요 · +${g}G`); sellPanel(n); };
}
function pricePanel(){
  const hot = hotToday();
  const pick = (cat, list) => list.map(id=>cat+':'+id).sort((a,b)=>marketMul(b)-marketMul(a));
  const sec = (label, keys) => `<div class="bag-sec"><b>${label}</b>${keys.slice(0,5).map(k=>`<div class="np"><span class="np-name">${iconImg(k)}${esc(itemName(k))}</span><span class="np-place">${Math.round(marketMul(k)*100)}% ${trend(k)}</span></div>`).join('')}</div>`;
  openPanel('오늘의 시세', `<p class="mnote" style="margin-top:0">시세는 매일 아침 바뀌어요. 인기 품목은 2배! 전문 상인(하나·루루·펭펭·도도·비비·단단)에게 팔면 더 비싸요.</p>
    ${sec('오늘의 인기 품목', hot)}${sec('작물 비싼 순', pick('crop', Object.keys(CROPS)).filter(k=>!hot.includes(k)))}${sec('물고기 비싼 순', pick('fish', Object.keys(FISH)).filter(k=>!hot.includes(k)))}${sec('광석 비싼 순', pick('ore', Object.keys(ORES)).filter(k=>!hot.includes(k)))}`);
}

// 거래소: 주민(플레이어)끼리 물건을 골드로 사고팔아요. 팔리면 수수료 5%를 빼고 받아요
const MARKET_FEE = .05, MARKET_MAX = 5;
let market = {};
const validListing = l => l && typeof l.item==='string' && /^(dish|crop|fish|ore|loot|seed|furn):[a-z0-9_]{2,8}$/.test(l.item) && l.n>=1 && l.n<=99 && l.price>=1 && typeof l.uid==='string';
function onMarket(v){
  market = {};
  for (const [id,l] of Object.entries(v||{})) if (validListing(l)) market[id] = l;
  // 내 물건이 팔렸으면 골드를 받아요
  for (const [id,l] of Object.entries(market)) if (l.uid===uid && l.buyer){
    net.marketCollect(id).then(ok=>{ if (!ok) return; const g = Math.floor(l.price*(1-MARKET_FEE)); me.inv.gold += g; me.earned = (me.earned||0) + g; saveMe(); renderHud();
      addLog(`거래소: ${String(l.bnick||'누군가').slice(0,8)}님이 ${itemName(l.item)} ${l.n}개를 샀어요! +${g}G`, true); }).catch(()=>{});
  }
  if (!$('npcPanel').hidden && $('npcPanel').dataset.market) marketPanel();
}
function marketPanel(){
  const list = Object.entries(market).filter(([,l])=>!l.buyer).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  const mine = list.filter(([,l])=>l.uid===uid), others = list.filter(([,l])=>l.uid!==uid);
  const row = ([id,l]) => { const each = Math.round(l.price/l.n), ref = unitPrice(l.item);
    return `<button class="np" data-id="${id}"><span class="np-name">${iconImg(l.item)}${esc(itemName(l.item))} <small>×${l.n} · ${esc(String(l.nick||'').slice(0,8))}</small></span><span class="np-place">${l.price}G</span><span class="np-day">${l.uid===uid ? '내리기' : `개당 ${each}G · 상점 시세 ${ref}G`}</span></button>`; };
  openPanel(`거래소 · 💰 ${me.inv.gold}G`,
    `<p class="mnote" style="margin-top:0">친구들이 올린 물건을 사거나, 내 물건을 원하는 값에 올려요. 팔리면 수수료 5%를 빼고 골드가 들어와요. (최대 ${MARKET_MAX}개)</p>
     <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="mkAdd">물건 올리기</button><button class="mini" id="mkPrice">오늘의 시세</button></div>
     <div class="bag-sec"><b>사고 싶은 물건 ${others.length}</b>${others.map(row).join('') || '<p class="mnote">아직 올라온 물건이 없어요.</p>'}</div>
     ${mine.length ? `<div class="bag-sec"><b>내가 올린 물건 ${mine.length}/${MARKET_MAX}</b>${mine.map(row).join('')}</div>` : ''}`,
    b=>{ const id = b.dataset.id, l = market[id]; if (!l) return;
      if (l.uid===uid) return say('거래소', `${itemName(l.item)} ${l.n}개를 내릴까요?`, [['내리기', async ()=>{ if (await net.marketCancel(id)){ invAdd(l.item, l.n); saveMe(); renderHud(); toast('물건을 돌려받았어요'); } else toast('이미 팔렸거나 내릴 수 없어요'); closeTalk(); marketPanel(); }], ['그만두기', marketPanel]], '', true);
      if (me.inv.gold < l.price) return toast('골드가 모자라요');
      if (invRoom(l.item) < l.n) return toast(`${itemName(l.item)}은(는) 가방에 ${invRoom(l.item)}개까지만 더 넣을 수 있어요`);
      withIcon(l.item);
      say('거래소', `${String(l.nick||'').slice(0,8)}님의 ${itemName(l.item)} ${l.n}개를 ${l.price}G에 살까요?`, [['사기', async ()=>{
        if (me.inv.gold < l.price) return toast('골드가 모자라요');
        if (await net.marketBuy(id)){ me.inv.gold -= l.price; invAdd(l.item, l.n); saveMe(); renderHud(); toast(`${itemName(l.item)} ${l.n}개를 샀어요!`, l.item); }
        else toast('앗, 이미 다른 사람이 샀어요');
        closeTalk(); marketPanel(); }], ['그만두기', marketPanel]], `상점 시세로는 개당 ${unitPrice(l.item)}G예요`, true); });
  $('npcPanel').dataset.market = '1';
  $('mkAdd').onclick = marketAdd; $('mkPrice').onclick = pricePanel;
}
function marketAdd(){

function stockNews(day){

let stuckT = 0;
function step(dt){
  let vx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let vy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  keyMoving = !!(vx||vy);
  if (fishing && fishing.phase!=='game' && (vx||vy||target)) stopFishing('낚싯대를 거뒀어요');
  if (fishing && fishing.phase==='game'){ vx = 0; vy = 0; }
  if (vx||vy) target = null;
  else if (target){
    const dx = target.x-pos.x, dy = target.y-pos.y, d = Math.hypot(dx,dy);
    if (d < 5 || (target.act && d < 30)){ const a = target.act; target = null; if (a) a(); }
    else { vx = dx/d; vy = dy/d; }
  }
  const len = Math.hypot(vx,vy);
  pos.moving = len>0;
  if (!len) return;
  vx/=len; vy/=len;
  pos.dir = Math.abs(vx) > Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
  const ox = pos.x, oy = pos.y, nx = pos.x + vx*SPEED*dt, ny = pos.y + vy*SPEED*dt;
  if (!blocked(nx, pos.y)) pos.x = nx;
  if (!blocked(pos.x, ny)) pos.y = ny;
  checkExit();
  if (target && Math.hypot(pos.x-ox, pos.y-oy) < SPEED*dt*.2){ stuckT += dt; if (stuckT>.35){ const tg = target; target = null; stuckT = 0; if (tg.act && Math.hypot(pos.x-tg.x, pos.y-tg.y) < 64) tg.act(); } } else stuckT = 0;
}

let lastPres = 0, presSig = '', lastTarget = null;
function sendPresence(t){
  if (!net || !me) return;
  const tgt = target && !keyMoving ? target : null;
  const p = {z:zoneId, nick:me.nick, look:me.look, roof:me.roof, x:Math.round(pos.x), y:Math.round(pos.y), dir:pos.dir, mv:pos.moving?1:0, emo:emo.e||'', emoAt:emo.at||0, ex:myExpr()};
  if (tgt){ p.tx = Math.round(tgt.x); p.ty = Math.round(tgt.y); }
  const sig = JSON.stringify(tgt ? {...p, x:0, y:0, dir:0, mv:0} : p);
  let go = false;
  if (tgt !== lastTarget) go = true;                              // 목적지가 바뀌면 바로 보내요 (나머지는 각자 화면에서 걸어가요)
  else if (keyMoving) go = t-lastPres >= 250;                     // 키보드로 걸을 땐 0.25초마다
  else if (sig !== presSig) go = t-lastPres >= 120;               // 멈춤, 방향, 이모티콘
  if (!go) return;
  lastTarget = tgt; presSig = sig; lastPres = t;
  net.presence(p).catch(()=>{});
}
function moveOthers(dt){
  for (const o of others.values()){
    if (o.goal){
      const dx = o.goal.x-o.x, dy = o.goal.y-o.y, d = Math.hypot(dx,dy);
      if (d < 4){ o.goal = null; o.mv = 0; continue; }
      const st = Math.min(d, SPEED*dt); o.x += dx/d*st; o.y += dy/d*st; o.mv = 1;
      o.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    } else {
      const k = Math.min(1, dt*8); o.x += (o.sx-o.x)*k; o.y += (o.sy-o.y)*k;
      o.mv = o.mvRemote || Math.hypot(o.sx-o.x, o.sy-o.y) > 2 ? 1 : 0;
    }
  }
}

  if (z.theme==='room'){ drawRoomStatic(c, d, z); return; }
  c.fillStyle = T.ground; c.fillRect(0,0,z.W,z.H);
  // 바닥 클레이 질감: 넓은 명암 얼룩 + 고운 입자 + 가장자리 어둡게
  for (let i=0;i<22;i++){ const x = (i*331+77)%z.W, y = (i*197+41)%z.H, r = 140+(i%4)*60; const g = c.createRadialGradient(x,y,0,x,y,r); const lite = i%3===0; g.addColorStop(0, lite ? 'rgba(255,255,240,.16)' : 'rgba(60,40,70,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x-r,y-r,r*2,r*2); }
  c.save(); c.globalAlpha = .07; c.globalCompositeOperation = 'multiply'; c.fillStyle = grainPattern(c); c.fillRect(0,0,z.W,z.H); c.restore();
  { const v = c.createRadialGradient(z.W/2, z.H/2, Math.min(z.W,z.H)*.35, z.W/2, z.H/2, Math.max(z.W,z.H)*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(60,30,60,.14)'); c.fillStyle = v; c.fillRect(0,0,z.W,z.H); }
  for (let i=0;i<14;i++){ const x=(i*331)%z.W, y=(i*197)%z.H, rx=50+(i%3)*20, ry=16+(i%2)*6; c.save(); c.globalAlpha=.55; c.fillStyle=T.ground2; c.beginPath(); c.ellipse(x,y,rx,ry,0,0,7); c.fill(); c.restore(); }
  if (z.theme==='flower') for (let i=0;i<120;i++) d.dot(M+(i*173)%(z.W-2*M), M+(i*97)%(z.H-2*M), 2.6, ['#ff8fc4','#ffe066','#ffffff','#c9a6ff'][i%4]);
  if (z.theme==='night') for (let i=0;i<70;i++) d.dot((i*223)%z.W, (i*137)%z.H, 1.6, '#fff6b0', .8);
  // 구역 길: 출구에서 가운데로
  const cx = z.W/2, cy = z.H/2, ex = z.exits;
  d.shape(()=>{ c.beginPath(); if (ex.n) c.roundRect(cx-17,-10,34,cy+27,17); if (ex.s) c.roundRect(cx-17,cy-17,34,z.H/2+27,17); if (ex.w) c.roundRect(-10,cy-17,cx+27,34,17); if (ex.e) c.roundRect(cx-17,cy-17,z.W/2+27,34,17); }, T.path, [cx,cy,Math.max(z.W,z.H)/2]);
  for (const p of z.places) drawZonePlace(d, z, p);
  // 가장자리: 나무 / 바위 (출구 자리는 비워요)
  const edgeCol = z.theme==='cave' ? '#5b5266' : z.theme==='sand' ? '#ffd29a' : T.edge;
  const open = (x,y) => (ex.n && y<M && Math.abs(x-cx)<GAP+20) || (ex.s && y>z.H-M && Math.abs(x-cx)<GAP+20) || (ex.w && x<M && Math.abs(y-cy)<GAP+20) || (ex.e && x>z.W-M && Math.abs(y-cy)<GAP+20);
  for (let x=20; x<z.W; x+=64) for (const y of [26, z.H-26]) if (!open(x,y)) d.circle(x+(y%7), y, 44, edgeCol);
  for (let y=20; y<z.H; y+=64) for (const x of [26, z.W-26]) if (!open(x,y)) d.circle(x, y+(x%5), 44, edgeCol);
  for (const [x,y] of z.trees) drawTree(d,x,y,x+y);
  if (zoneId==='home') LOTS.forEach((L,i)=>{
    const owner = Object.values(players).find(p=>p.lot===i);
    if (owner) drawHouse(d, L.x, L.y, ROOFS[owner.roof][1], owner.nick);
    else {
      c.save(); c.setLineDash([6,5]); c.lineWidth=2; c.strokeStyle='#ffffffcc'; c.beginPath(); c.roundRect(L.x-48,L.y-78,96,78,12); c.stroke(); c.restore();
      d.rr(L.x-2,L.y-40,4,24,2,'#c79a74'); d.rr(L.x-20,L.y-56,40,18,5,'#e8c39e');
      c.font='bold 15px "Dongle",sans-serif'; c.textAlign='center'; c.fillStyle='#7a5040'; c.fillText(`${i+1}번 빈 집터`, L.x, L.y-43);
    }
  });
  // 출구 표지판
  if (ex.n) signPost(d, `↑ ${ZONES[ex.n].name}`, cx+110, M+50);
  if (ex.s) signPost(d, `↓ ${ZONES[ex.s].name}`, cx+110, z.H-M-10);
  if (ex.w) signPost(d, `← ${ZONES[ex.w].name}`, M+80, cy-50);
  if (ex.e) signPost(d, `→ ${ZONES[ex.e].name}`, z.W-M-80, cy-50);
}
function tag(c, text, x, y, color){
  c.font='bold 18px "Dongle",sans-serif'; c.textAlign='center';
  const w = c.measureText(text).width + 12;
  c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.roundRect(x-w/2, y-12, w, 17, 8); c.fill();
  if (color){ c.fillStyle=color; c.beginPath(); c.roundRect(x-w/2, y-12, 5, 17, [8,0,0,8]); c.fill(); }
  c.fillStyle='#6b3a4d'; c.fillText(text, x+(color?2:0), y+1);
}
function bubble(c, text, x, y){
  c.font='bold 19px "Dongle",sans-serif'; c.textAlign='center';
  const w = Math.min(200, c.measureText(text).width + 18);
  c.fillStyle='#fff'; c.beginPath(); c.roundRect(x-w/2, y-24, w, 24, 12); c.fill();
  c.beginPath(); c.moveTo(x-5,y); c.lineTo(x,y+6); c.lineTo(x+5,y); c.fill();
  c.fillStyle='#6b3a4d'; c.fillText(text.length>16 ? text.slice(0,15)+'…' : text, x, y-7);
}

let lastT = performance.now(), lastFade = -1;
function frame(t){
  const dt = Math.min(.05, (t-lastT)/1000); lastT = t;
  if (obStep==='maker'){ const pc = $('obprev'); if (pc && pc.width){ const c = pc.getContext('2d'), k = pc.width/240; c.setTransform(k,0,0,k,0,0); c.fillStyle='#fffafb'; c.fillRect(0,0,240,120); const d = CH.mattePainter(c); d.ell(120,108,110,9,'#f6dcd3',{flat:true,noShadow:true}); const L = applyStarter(EDIT); for (const [px,dir] of [[45,'down'],[120,'right'],[195,'up']]){ c.save(); c.translate(px,108); c.scale(1.7,1.7); CH.figure(d, L, dir, t/1000, true, 'dot'); c.restore(); } } }
  if (me && !obStep){
    updateNpcs(Date.now());
    step(dt); moveOthers(dt); sendPresence(t); updateFishing(dt, t); updateMobs(dt, t); updateBoss(dt, t); updateSwing(dt); updateStars(t); rainWater(t);
    const hpEl = $('hpv'); if (hpEl && hpEl.textContent !== String(Math.ceil(playerHp))) hpEl.textContent = Math.ceil(playerHp);
    buildStatic();
    const z = view.zoom, vw = view.w/z, vh = view.h/z;
    const W = Z().W, H = Z().H;
    view.cx = Math.max(0, Math.min(W-vw, pos.x - vw/2)); view.cy = Math.max(0, Math.min(H-vh, pos.y - 20 - vh/2));
    if (vw > W) view.cx = (W-vw)/2; if (vh > H) view.cy = (H-vh)/2;
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#8fd3f5'; ctx.fillRect(0,0,cv.width,cv.height);
    const s = view.dpr*z; ctx.setTransform(s,0,0,s,-view.cx*s,-view.cy*s);
    ctx.drawImage(staticLayer, 0, 0, W, H);
    const d = painter(ctx), now = Date.now();
    if (zoneId==='home') for (const [id,p] of Object.entries(players)){ if (p.lot==null) continue; const g = id===uid ? me.gardens : (p.gardens||[]); slotsOf(p.lot, id===uid ? me.plots : p.plots).forEach((sl,i)=>drawSlot(d, sl, g[i], now, id===uid)); }
    drawRocks(d, t);
    if (target && !target.act){ const a = (t-target.mark)/600; ctx.save(); ctx.globalAlpha = Math.max(0,1-a*.5); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(target.x,target.y,10,5,0,0,7); ctx.stroke(); ctx.restore(); }
    const ents = [
      ...NPCS.filter(n=>n.zone===zoneId).map(n=>({y:n.y, draw:()=>drawCritter(ctx,n.x,n.y,n.look||{kind:n.sp.kind,fur:n.sp.fur},t/1000,!!n.mv,1,!!n.flip), label:()=>tag(ctx, n.name, n.x, n.y-50, null)})),
      ...[...others.entries()].filter(([k,o])=>o.z===zoneId).map(([k,o])=>({y:o.y, draw:()=>drawPlayer(ctx,o.x,o.y,o.look,o.dir||'down',t/1000,!!o.mv,1,o.ex||'dot'), label:()=>{ tag(ctx,o.nick,o.x,o.y-64,o.uid&&players[o.uid]?ROOFS[players[o.uid].roof][1]:null); talkBubble(k,o.x,o.y,t); }})),
      ...mobs.map(mob=>({y:mob.y, draw:()=>drawMob(d, mob, t), label:()=>{}})),
      ...(bossAlive() ? [{y:BOSS.y, draw:()=>drawBoss(d, t), label:()=>{}}] : []),
      ...(Z().house ? furnOf(Z().house).map(f=>({y:f.y, draw:()=>drawFurn(d, f, f.x, f.y), label:()=>{}})) : []),
      {y:pos.y, draw:()=>drawPlayer(ctx,pos.x,pos.y,me.look,pos.dir,t/1000,pos.moving,1,myExpr()), label:()=>{ tag(ctx,me.nick,pos.x,pos.y-64,ROOFS[me.roof][1]); talkBubble('me',pos.x,pos.y,t); }},
    ].sort((a,b)=>a.y-b.y);
    for (const e of ents) e.draw();
    drawFishing(ctx, t); drawStars(ctx, t); drawSwing(ctx, t); drawFx(ctx, t);

}
function talkBubble(key, x, y, t){

  if (b && t-b.at < 5000) bubble(ctx, b.text, x, y-80);
  else if (e && t-e.at < 3000) bubble(ctx, e.text, x, y-80);
}
requestAnimationFrame(frame);
