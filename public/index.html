<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>핑키 디저트 아일랜드</title>
<meta name="theme-color" content="#fffafb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핑키 섬">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/Maplestory_Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Maplestory_Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--ink:#2a2429;--soft:#6f6569;--card:#fffdfd;--pink:#fbdbe5;--pinkd:#e48fac;--line:#f7e6ec;--sea:#cfeefb}
[hidden]{display:none!important}
button,a,label,input,select,.tile,.btn,.pill{touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
/* 게임 전체 글꼴: 메이플스토리체 (넥슨). 예전 Dongle 크기에 맞춘 화면이라 "Dongle" 이름으로 70% 크기로 불러요 */
@font-face{font-family:"Dongle";font-weight:100 500;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Dongle";font-weight:600 900;font-display:swap;size-adjust:70%;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:100 500;font-display:swap;src:url("fonts/Maplestory_Light.woff2") format("woff2")}
@font-face{font-family:"Maple";font-weight:600 900;font-display:swap;src:url("fonts/Maplestory_Bold.woff2") format("woff2")}
body{margin:0;background:var(--sea);color:var(--ink);font:700 21px/1.15 "Dongle",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:linear-gradient(#fff,#fff8fa);border-radius:16px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
#hud{left:calc(env(safe-area-inset-left,0px) + 10px)!important;font-size:18px!important;gap:6px 10px!important;flex-wrap:wrap;max-width:calc(100vw - 20px - min(260px,46vw) - 10px);position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:20px;z-index:5}
#stats{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 56px);width:min(330px,calc(100vw - 20px - min(260px,46vw) - 10px));display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 4px;gap:3px 6px;align-items:center;padding:5px 8px 4px;background:rgba(255,250,252,.9);border-radius:12px;box-shadow:inset 0 -2px 0 #f7e3ea,0 3px 10px #d4a3b51f}
#stats #lvTag{grid-row:1/3;background:#b58cff;color:#fff;border-radius:9px;padding:1px 7px;font-size:17px;font-weight:normal;line-height:1.3}
#stats .sb{position:relative;height:16px;border-radius:8px;background:#f6e3ea;overflow:hidden;box-shadow:inset 0 1px 2px #0001}
#stats .sb s{position:absolute;left:0;top:0;bottom:0;border-radius:8px;text-decoration:none;transition:width .25s}
#stats .sb.hp s{background:linear-gradient(#ff9bb5,#ff6b8f)}
#stats .sb.st s{background:linear-gradient(#ffe27a,#ffc23f)}
#stats .sb.low{animation:lowPulse .8s ease-in-out infinite}
@keyframes lowPulse{50%{box-shadow:0 0 0 2px #ff6b8f}}
#stats .sb em{position:absolute;inset:0;font-style:normal;font-size:14px;line-height:16px;text-align:center;color:#5a3a4a;white-space:nowrap}
#stats .xb{grid-column:2/4;height:4px;border-radius:2px;background:#efe6fb;overflow:hidden;position:relative}
#stats .xb s{position:absolute;left:0;top:0;bottom:0;background:#b58cff;text-decoration:none;transition:width .25s}
#stats .xb em{display:none}
body.dlg-on #stats{visibility:hidden}
#hud u{text-decoration:none;font-size:.62em;margin-right:3px;vertical-align:1px}
img.ui{width:1.05em;height:1.05em;vertical-align:-.2em;margin:0 .12em}
#hud img.ui{width:20px;height:20px;vertical-align:-4px;margin:0 3px 0 0}
img.mi{width:30px;height:30px;vertical-align:middle;display:block}
img.bi{width:34px;height:34px;display:block;pointer-events:none}
.emo img.bi{width:30px;height:30px;margin:auto}
.btn img.ui{width:1.15em;height:1.15em}
.np-name img.ui{width:28px;height:28px;vertical-align:-8px;margin:0 6px 0 0}
#hud b{font-weight:inherit}
#hud i{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:4px}
#quest{right:calc(env(safe-area-inset-right,0px) + 10px)!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-width:min(260px,46vw);padding:8px 12px;font-size:19px;z-index:5}
#quest b{display:block;font-size:16px;color:var(--soft)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;padding:6px;z-index:5}
#bar div{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-size:32px;box-shadow:inset 0 -2px 0 #f6e6ec}
#bar div.off{opacity:.28;filter:grayscale(1)}
#bar span{position:absolute;right:3px;bottom:0;font-size:16px;color:var(--ink)}
#chatbox{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(320px,calc(100vw - 20px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:4px;font-size:19px;text-shadow:0 1px 0 #fff,0 0 4px #fff}
#log p{margin:0;transition:opacity 1s}
#log p.sys{color:var(--ink);opacity:.85}
#chatrow{display:flex;gap:6px;pointer-events:auto}
body:not(.chat-open) #chatrow,body:not(.chat-open) #emorow{display:none} /* 채팅은 [채팅] 버튼을 누를 때만 열려요 (평소엔 화면을 가리지 않게) */
#emorow{display:flex;gap:6px;pointer-events:auto}
#log p{background:rgba(255,255,255,.72);border-radius:10px;padding:2px 10px;align-self:flex-start;max-width:100%;text-shadow:none}
#chatin{flex:1;min-width:0;font:700 20px "Dongle",sans-serif;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fffffff0;color:var(--ink)}
.tv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tv-cell{background:#fff;border-radius:10px;padding:3px 6px;text-align:center;line-height:1.05}.tv-cell small{display:block;font-size:15px;color:var(--soft)}.tv-cell.on{background:#ffe0ec;outline:2px solid #ff8fb6}
.emo.send{width:auto;padding:0 12px;font:700 21px "Dongle",sans-serif;color:#fff;background:#ff8fb6;box-shadow:inset 0 -2px 0 #e06a96}
.emo{border:0;border-radius:12px;background:#fff;width:44px;min-height:44px;font-size:25px;box-shadow:inset 0 -2px 0 #f6e6ec}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(520px,calc(100vw - 20px));padding:14px 16px;z-index:13}
#talk h3{margin:0 0 4px;font-size:25px;color:var(--ink)}
#talk p{margin:0 0 10px;font-size:21px;white-space:pre-line}
#talk .sd{color:#9a8792;font-weight:400;font-style:italic}
/* ===== 이야기 대화창 ===== */

:root{--dlg-k:1}
#dlgDim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:13}
body.dlg-on #bar,body.dlg-on #sideBtns,body.dlg-on #chatbox,body.dlg-on #quest{visibility:hidden}
body.dlg-on #toast{z-index:16}
#dlg{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;min-height:140px;box-sizing:border-box;padding:34px 20px 20px;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;box-shadow:0 6px 0 #f0d3df,0 14px 30px rgba(90,40,64,.22);z-index:14;font-family:Maple,system-ui,sans-serif;color:#3a2c33;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation}
#dlg .dlg-who{position:absolute;top:-34px;left:16px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#dlg .dlg-who.right{left:auto;right:58px;flex-direction:row-reverse}
#dlg .dlg-who.off{visibility:hidden}
#dlg .dlg-face{width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-sizing:content-box;background:#ffe8f1;box-shadow:0 3px 8px rgba(90,40,64,.18);object-fit:cover}
#dlg .dlg-name{margin-bottom:12px;background:var(--nc,#d0457a);color:#fff;font-weight:800;font-size:16px;line-height:1;padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
#dlg .dlg-heart{margin-bottom:15px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#c2456f}
#dlg .dlg-heart em{display:block;width:34px;height:6px;border-radius:3px;background:#f6dbe6;overflow:hidden}#dlg .dlg-heart em s{display:block;height:100%;background:#ff7aa8;text-decoration:none}
#dlg .dlg-who.right .dlg-heart{display:none}
#dlg .dlg-logbtn{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid #f3d6e2;background:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#dlg .dlg-body{position:relative;min-height:calc(18px*var(--dlg-k)*1.6*2)}
#dlg .dlg-text{margin:0;font-size:calc(18px*var(--dlg-k));line-height:1.6;font-weight:400;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;padding-right:34px}
#dlg .dlg-text.narr{font-size:calc(15px*var(--dlg-k));color:#7a6670;font-weight:400}
#dlg .dlg-text.narr::before{content:'✦ ';color:#e79bbb}
#dlg .dlg-more{position:absolute;right:0;bottom:2px;font-size:13px;color:#e07aa3;animation:dlgBob 1.1s ease-in-out infinite}
@keyframes dlgBob{50%{transform:translateY(4px)}}
#dlg .dlg-choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dlg .dlg-choices button{height:48px;width:100%;border:2px solid #f3d6e2;border-radius:16px;background:#fff0f6;color:#3a2c33;font:400 calc(16px*var(--dlg-k)) Maple,system-ui,sans-serif;text-align:left;padding:0 16px;box-shadow:0 3px 0 #f0d3df;cursor:pointer}
#dlg .dlg-choices button:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3df}
#dlg .dlg-hint{margin:10px 0 0;font-size:13px;color:#9a8792}
#dlg .dlg-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#dlg .dlg-acts button{border:0;border-radius:999px;background:#ffe3ee;color:#5a3a4a;font:600 14px Maple,system-ui,sans-serif;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #f2c9d9}
#dlg .dlg-acts button.ghost{background:#fff;border:2px solid #f3d6e2;box-shadow:none}
#dlg .dlg-acts img{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
#dlg .dlg-pop{position:absolute;top:-58px;left:92px;background:#fff;border:2px solid #ffc2d7;color:#d0457a;font:800 15px Maple,system-ui,sans-serif;padding:4px 10px;border-radius:999px;opacity:0;pointer-events:none}
#dlg .dlg-pop.on{animation:dlgPop 1.8s ease-out forwards}
@keyframes dlgPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#dlgCard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;padding:18px 28px;text-align:center;box-shadow:0 6px 0 #f0d3df,0 16px 34px rgba(90,40,64,.25);font-family:Maple,system-ui,sans-serif;animation:dlgCard 1.5s ease forwards;pointer-events:none;max-width:calc(100vw - 48px)}
#dlgCard small{display:block;font-size:14px;color:#9a8792;font-weight:600}#dlgCard b{display:block;margin-top:4px;font-size:22px;color:#3a2c33;font-weight:800}
@keyframes dlgCard{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#dlgLog{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;z-index:17;background:#fffafc;border:2px solid #f3d6e2;border-radius:24px;display:flex;flex-direction:column;font-family:Maple,system-ui,sans-serif;color:#3a2c33;box-shadow:0 14px 30px rgba(90,40,64,.25)}
#dlgLog .dl-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:2px solid #f6e3eb}#dlgLog .dl-head b{font-size:17px;margin-right:auto;white-space:nowrap}#dlgLog .dl-head span{white-space:nowrap}#dlgLog .dl-head{gap:5px}
#dlgLog .dl-head button{border:2px solid #f3d6e2;background:#fff;border-radius:999px;padding:4px 9px;font-size:14px;font-weight:600;font-family:inherit;color:#5a3a4a;cursor:pointer;white-space:nowrap;line-height:1.2}#dlgLog .dl-head button.on{background:#ffe3ee}
#dlgLog .dl-list{overflow:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#dlgLog .dl-row{font-size:calc(15px*var(--dlg-k));line-height:1.55}#dlgLog .dl-row b{display:block;font-size:13px;color:var(--nc,#d0457a)}#dlgLog .dl-row.narr{color:#7a6670}#dlgLog .dl-row.narr::before{content:'✦ ';color:#e79bbb}#dlgLog .dl-row.player{text-align:right}
#talk #talkNote{font-size:18px;color:var(--soft);margin-top:-6px}
#talk .act{flex-wrap:wrap}
#talk .act.choices{flex-direction:column;align-items:stretch}
.btn.choice{background:#fff;color:var(--ink);text-align:left;box-shadow:inset 0 -3px 0 #f6e6ec,0 0 0 2px #fbe3ea}
.btn.choice::before{content:'▸ ';color:var(--pinkd)}
.mini{border:0;border-radius:10px;background:var(--pink);color:var(--ink);font-size:18px;padding:2px 10px;box-shadow:inset 0 -2px 0 #f2c3d3}
#npcPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 40px));max-height:min(76vh,calc(100% - 120px));overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;border-radius:20px}
#dim{display:none;position:fixed;inset:0;background:rgba(60,30,50,.22);z-index:9}
body:has(#npcPanel:not([hidden])) #dim,body:has(#mapPanel:not([hidden])) #dim{display:block}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.np-head b{font-size:1.15em}
.np{border:0;background:#fff;border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px;box-shadow:inset 0 -2px 0 #f6e6ec}
.np-name{font-size:20px}.np-name small{color:var(--soft);font-size:16px}
.np-place{font-size:16px;color:var(--soft);text-align:right}
.np-h{color:#f08aa8;font-size:16px;letter-spacing:1px}
.np-day{font-size:16px;color:var(--soft);text-align:right}
.np-h small{color:var(--soft);letter-spacing:0}
.np-keep{grid-column:1/-1;font-size:16px;color:var(--ink);opacity:.8}
#sideBtns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:flex;flex-direction:column;gap:8px;z-index:5}
.round.swing{width:64px;height:64px;font-size:16px;letter-spacing:-.5px;background:linear-gradient(#fff,#fde4ec);box-shadow:inset 0 -3px 0 #f2c3d3,0 4px 14px #d4a3b52e}
.round{width:50px;height:50px;border-radius:50%;border:0;padding:0;line-height:1.05;white-space:nowrap;background:linear-gradient(#fff,#fff8fa);color:var(--ink);font-size:18px;box-shadow:inset 0 -2px 0 #f7e3ea,0 4px 14px #d4a3b51f}
#mapPanel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:10;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 40px));max-height:min(76vh,calc(100% - 120px));overflow:auto;padding:14px 16px;touch-action:pan-y;border-radius:20px}
#mapCv{display:block;width:100%;margin-top:6px;border-radius:14px;touch-action:manipulation;cursor:pointer}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--soft);margin:6px 2px}.mlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0;border:1.5px solid #fff;box-shadow:0 0 0 1px #0002}.mlegend .dim{margin-left:auto}
#mapInfo{margin-top:4px}
.mnote{font-size:16px;color:var(--soft);margin:8px 2px 0}
#fishGame{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(440px,calc(100vw - 20px));padding:12px 14px;z-index:11;display:flex;flex-direction:column;gap:8px;touch-action:none}
#fishGame b{font-size:24px;color:var(--ink)}
#fishGame small{font-size:16px;color:var(--soft)}
#fishGame p{margin:0;font-size:19px}
#fgTrack{position:relative;height:54px;border-radius:14px;background:linear-gradient(#bfe6fb,#8fd3f5);overflow:hidden;cursor:grab}
#fgZone{position:absolute;top:6px;bottom:6px;border-radius:10px;background:#ffffff66;border:2px solid #fff}
#fgZone.on{background:#fde4ecaa;border-color:#f2b6c9}
#fgBob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:linear-gradient(#ff5a5a 50%,#fff 50%);box-shadow:0 2px 4px #0003}
#fgMeter{height:10px;border-radius:6px;background:#f6e6ec;overflow:hidden}
#fgBar{height:100%;width:35%;background:#f2b6c9}
img.ic{width:34px;height:34px;vertical-align:middle;margin-right:4px}
img.tic{width:26px;height:26px;vertical-align:middle;margin-right:4px}
#talkIcon{float:right;width:72px;height:72px;margin:-6px -4px 0 8px}
.bag-sec{display:flex;flex-direction:column;gap:4px}
.bag-sec b{font-size:18px;color:var(--soft);padding:0 4px}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.tile{position:relative;border:0;background:#fff;border-radius:12px;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 -2px 0 #f6e6ec;min-height:58px}
.tile img.ic{width:44px;height:44px;margin:0}
.tile i{position:absolute;right:4px;top:2px;font-style:normal;font-size:16px;color:var(--ink)}
.tile s{text-decoration:none;font-size:13px;color:#e8a400;line-height:1}
.tile em{font-style:normal;font-size:13px;line-height:1.2;text-align:center}
.dex .tile s{color:var(--soft)}
.tile.unknown img{opacity:.55}
.tile.on{box-shadow:inset 0 -2px 0 #f6e6ec,0 0 0 2px var(--pinkd)}
.tile.full i{color:#e48fac}
#fade{position:fixed;inset:0;background:#fffafb;opacity:0;pointer-events:none;z-index:6}
.btn{border:0;border-radius:12px;padding:7px 16px;background:var(--pink);color:var(--ink);font-size:21px;box-shadow:inset 0 -3px 0 #f2c3d3}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #f6e6ec}
.btn:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);padding:8px 16px;z-index:9;font-size:20px;transition:opacity .4s;pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}
#ob{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:fixed;inset:0;z-index:20;background:#fffafb;overflow:auto;touch-action:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 40px}

const spriteCache = new Map(), SPRITE_MAX = 420, TAU = Math.PI*2;
function sprite(key, w, h, ox, oy, drawFn){
  let sp = spriteCache.get(key);
  if (!sp){
    const sc = Math.min(3, Math.max(1, Math.round(view.dpr*view.zoom*2)/2));
    const c = document.createElement('canvas'); c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const x = c.getContext('2d'); x.setTransform(sc,0,0,sc,ox*sc,oy*sc);
    drawFn(painter(x));
    sp = {c, sc, ox, oy};
    if (spriteCache.size >= SPRITE_MAX) spriteCache.delete(spriteCache.keys().next().value);
    spriteCache.set(key, sp);
  }
  return sp;
}
const qphase = (ph, n) => Math.round((((ph % TAU) + TAU) % TAU) / TAU * n) % n;
// 플레이어: 걷기 8 단계, 서 있기 4 단계. 매트 클레이 페인터로 그려요
function drawPlayer(c, x, y, L, dir, t, walk, s=1, expr='dot'){
  if (!L || !L.top && !L.set) L = CH.migrateLook(L);
  const ph = t*8 + x*.37, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'p|'+JSON.stringify(L)+'|'+dir+'|'+(walk?'w':'i')+q+'|'+expr+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/8 : q/4*TAU/2;
  const B = CH.FIG_BOX;
  const sp = sprite(key, B.w, B.h, B.ox, B.oy, d=>CH.figure(CH.mattePainter(d.ctx), L, dir, t2, walk, expr));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function drawCritter(c, x, y, v, t, walk, s=1, flip=false){
  if (v && v.a1) return drawPlayer(c, x, y, v.a1, walk ? (flip ? 'left' : 'right') : 'down', t, walk, s, 'dot');
  if (flip){ c.save(); c.translate(x, 0); c.scale(-1, 1); drawCritter(c, 0, y, v, t, walk, s, false); c.restore(); return; }
  const ph = t*7 + x*.3, q = walk ? qphase(ph, 8) : qphase(t*2 + x, 4);
  const key = 'c|'+JSON.stringify(v)+'|'+(walk?'w':'i')+q+'|'+Math.round(view.dpr*view.zoom*2);
  const t2 = walk ? q/8*TAU/7 : q/4*TAU/2;
  const sp = sprite(key, 80, 100, 40, 88, d=>critter(d, 0, 0, v, t2, walk, 1));
  c.drawImage(sp.c, x - sp.ox*s, y - sp.oy*s, sp.c.width/sp.sc*s, sp.c.height/sp.sc*s);
}

function tasteOf(npc, item){
  const exact = item.split('_')[0], cat = item.split(':')[0];
  for (const k of ['loved','liked','disliked']) if ((npc.tastes[k]||[]).includes(exact)) return k;
  for (const k of ['loved','liked','disliked']) if ((npc.tastes[k]||[]).includes(cat)) return k;

// 우체부 토리는 시계를 기준으로 마을을 돌아서 모두의 화면에 같은 자리에 보여요
const TORI_PATH = [[1180,912],[880,912],[880,620],[560,560],[880,620],[1240,560],[880,620],[880,912]].map(([x,y])=>[zk(x), zk(y)]);
const TORI_SEGS = TORI_PATH.map((a,i)=>{ const b = TORI_PATH[(i+1)%TORI_PATH.length]; return {a, b, walk:Math.hypot(b[0]-a[0], b[1]-a[1])/60*1000}; });
const TORI_TOTAL = TORI_SEGS.reduce((s,g)=>s+g.walk+3000, 0);
function toriPos(now){
  let t = now % TORI_TOTAL;
  for (const g of TORI_SEGS){
    if (t < 3000) return {x:g.a[0], y:g.a[1], mv:false, dx:0};
    t -= 3000;
    if (t < g.walk){ const k = t/g.walk; return {x:g.a[0]+(g.b[0]-g.a[0])*k, y:g.a[1]+(g.b[1]-g.a[1])*k, mv:true, dx:g.b[0]-g.a[0]}; }
    t -= g.walk;
  }
  return {x:TORI_PATH[0][0], y:TORI_PATH[0][1], mv:false, dx:0};
}

// 주민 산책: 자기 자리(home) 주위 range 안에서 7 초마다 새 자리로 느긋하게 걸어가요. 시간 기준이라 친구 화면에서도 같은 자리에 있어요
const NPC_RANGE = {momo:55, dandan:55, mongsil:55, bori:60, olly:60, toto:70, pengpeng:80, dodo:70, hana:110, bami:80, kongi:120};
const WANDER_MS = 7000, WANDER_PAUSE = 2800;
function wanderSpot(n, k){
  const h = hash(n.id + '|' + k), r = (NPC_RANGE[n.id] || 70) * (0.35 + (h % 1000) / 1000 * 0.65), a = ((h >>> 10) % 6283) / 1000;
  const x = n.home[0] + Math.cos(a)*r, y = n.home[1] + Math.sin(a)*r*0.6; // 위아래로는 조금만
  return blocked(x, y) ? {x:n.home[0], y:n.home[1]} : {x, y};
}
function wanderPos(n, now){
  const k = Math.floor(now / WANDER_MS), t = now - k*WANDER_MS, a = wanderSpot(n, k-1), b = wanderSpot(n, k);
  if (t < WANDER_PAUSE) return {x:a.x, y:a.y, mv:false, dx:0};
  const u = (t - WANDER_PAUSE) / (WANDER_MS - WANDER_PAUSE), e = u*u*(3-2*u);
  return {x:a.x + (b.x-a.x)*e, y:a.y + (b.y-a.y)*e, mv:Math.hypot(b.x-a.x, b.y-a.y) > 4, dx:b.x-a.x};
}

    n.x = p.x; n.y = p.y; n.mv = p.mv; if (p.dx) n.flip = p.dx < 0;
  }
}

function houseRect(p){ const w = p.wide ? 150 : 112; return {x:p.x-w/2,y:p.y-108,w,h:110}; }
const obstacles = { circles: [], rects: [], ells: [] };
function rebuildObstacles(){
  const z = Z(); const o = {circles:[], rects:[], ells:[]};
  for (const [x,y] of z.trees) o.circles.push({x, y:y+22, r:24});

    if (p.kind==='house') o.rects.push(houseRect(p));

    if (p.kind==='pond') o.ells.push({x:p.x, y:p.y, rx:p.rx, ry:p.ry});
    if (p.kind==='lighthouse') o.rects.push({x:p.x-28, y:p.y-150, w:56, h:155});
    if (p.kind==='sea') o.rects.push({x:0, y:0, w:z.W, h:250});

    if (p.kind==='logs') o.rects.push({x:p.x-60, y:p.y-30, w:120, h:40});

  Object.assign(obstacles, o);
}
function inCorridor(x, y){
  const z = Z(), ex = z.exits;
  if (ex.n && y < M+10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.s && y > z.H-M-10 && Math.abs(x-z.W/2) < GAP) return true;
  if (ex.w && x < M+10 && Math.abs(y-z.H/2) < GAP) return true;
  if (ex.e && x > z.W-M-10 && Math.abs(y-z.H/2) < GAP) return true;
  return false;
}
function blocked(x,y){
  const z = Z();
  if (x<4||y<4||x>z.W-4||y>z.H-4) return true;
  if ((x<M||x>z.W-M||y<M||y>z.H-M) && !inCorridor(x,y)) return true;
  if (z.theme==='room' && y < 250) return true;
  for (const e of obstacles.ells) if (((x-e.x)/(e.rx+6))**2 + ((y-e.y)/(e.ry+6))**2 < 1) return true;
  for (const c of obstacles.circles) if ((x-c.x)**2+(y-c.y)**2 < c.r*c.r) return true;
  for (const r of obstacles.rects) if (x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h) return true;
  return false;
}
// 구역 가장자리 길 끝에 닿으면 다음 구역으로 넘어가요
function checkExit(){

  if (side) enterZone(ex[side], {n:'s', s:'n', w:'e', e:'w'}[side]);
}
function freeSpot(x, y){
  const z = Z(); x = Math.max(M+30, Math.min(z.W-M-30, x)); y = Math.max(M+30, Math.min(z.H-M-30, y));
  for (let r=0; r<900; r+=24) for (let a=0; a<6.28; a+=r ? 24/r : 7){ const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r; if (!blocked(nx, ny)) return [nx, ny]; }
  return [z.W/2, z.H/2];
}
let fadeT = 0;

  if (me){ renderDecor(); me.zone = id.startsWith('house:') ? 'home' : id; me.zx = Math.round(pos.x); me.zy = Math.round(pos.y); saveMe(); renderHud(); if (!$('mapPanel').hidden) renderMap(); }
  toast(`${z.name}`);
}

function hexShade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return '#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}

  const K = v.kind, f = v.fur, f2 = v.fur2 || hexShade(f,.55), dark = hexShade(f,-.25), oc = v.color, hy = -27;

// Realtime Database는 배열 속 null을 지워 버려서, 텃밭 칸은 false 또는 {stage, wateredAt}로 저장해요 (stage -1 = 빈 텃밭)
function fromDB(p){
  if (!p) return p;
  const g = p.gardens || [], inv = {garden:0, can:false, gold:0, rod:false, pick:false, sword:false, ...(p.inv||{})};
  for (const k of ['seeds','crops','fish','ores','loot']) inv[k] = {...(inv[k]||{})};
  if (inv.seed){ inv.seeds.c01 = (inv.seeds.c01||0) + inv.seed; } delete inv.seed;
  if (inv.tomato){ inv.crops.c01 = (inv.crops.c01||0) + inv.tomato; } delete inv.tomato;
  const lk = CH.migrateLook(p.look), worn = Object.entries(lk.cc||{}).filter(([,c])=>c).map(([slot,c])=>{ const id = slot==='set' ? lk.set : lk[slot]; return id ? id+'#'+c : null; }).filter(Boolean);
  const closet = [...new Set([...CH.FREE, ...(p.closet||[]), ...(p.hats ? p.hats.split(',') : []), ...CH.lookItems(lk), ...worn])].filter(k=>CH.ITEM(k.split('#')[0]));
  return { ...p, look:CH.migrateLook(p.look), closet, rel:p.rel||{}, inv,
    gardens:Array.from({length:Math.max(2, Math.min(6, p.plots||2))}, (_,i)=>i).map(i=>{ const s = g[i]; if (!s) return null; return {crop: s.stage>=0 ? {type:s.type||'c01', stage:s.stage, wateredAt:s.wateredAt||null} : null}; }) };
}
function toDB(p){
  return { ...p, gardens: p.gardens.map(g => g ? {stage: g.crop ? g.crop.stage : -1, wateredAt: (g.crop && g.crop.wateredAt) || 0, type: (g.crop && g.crop.type) || ''} : false) };
}

function abandoned(c){ return !players[c.uid] && Date.now() - (c.at||0) > 600000; }

let saving=false, saveAgain=false;
async function saveMe(){
  if (admin || !me) return;
  if (saving){ saveAgain=true; return; }
  saving=true;
  me.hp = Math.max(1, Math.round(playerHp)); me.sta = Math.round(playerSta);
  try { await net.savePlayer(toDB(me)); }
  catch(e){ toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  saving=false;
  if (saveAgain){ saveAgain=false; saveMe(); }
}

  players = next;
  rebuildObstacles();
  if (firstPlayers){ firstPlayers = false; if (admin) enterAdmin(); else if (players[uid]) enterGame(structuredClone(players[uid])); else showMaker(); }
  else if (admin) renderAdmin();
  else if (obStep) renderOb();
}
function onRoofs(raw){

  for (const [k,v] of Object.entries(raw||{})) if (v) next['roof-'+k] = v;
  claims = next; if (obStep && obStep!=='maker') renderOb();

function onOnline(raw){

    if (!o){ o = {x:s.x, y:s.y, emoAt:s.emoAt}; others.set(id, o); if (!firstOnline) addLog(`${String(s.nick||'누군가').slice(0,8)} 님이 섬에 왔어요`, true); }

    const oz = zoneOk(s.z) ? s.z : 'home';
    if (o.z && o.z!==oz){ o.x = s.x; o.y = s.y; }
    o.z = oz;

function soloNet(){
  const st = {players:{}, roofs:{}};
  return {
    savePlayer: async d => { st.players[uid] = structuredClone(d); onPlayers(structuredClone(st.players)); },
    claimRoof: async i => { st.roofs[i] = {uid, nick:nickVal, at:Date.now()}; onRoofs(st.roofs); return true; },
    releaseRoof: async i => { delete st.roofs[i]; onRoofs(st.roofs); },
    claimLot: async () => true,
    presence: async () => {},
    sendChat: async t => { const m = {uid, nick:me.nick, t, z:zoneId, at:Date.now()}; st.chat = {...(st.chat||{}), ['c'+Date.now()+Math.random()]: m}; onChat(m); st.chatCb && st.chatCb(st.chat); },
    chatLog: cb => { st.chatCb = cb; cb(st.chat||{}); },
    wipeAll: async withChat => { st.players = {}; st.roofs = {}; st.market = {}; if (withChat){ st.chat = {}; st.chatCb && st.chatCb({}); } onPlayers({}); onRoofs({}); onMarket({}); },
    contestSubmit: async (w, size) => { contestBoard = [{nick:me.nick, size}]; },
    mailSend: async () => { throw new Error('solo'); },
    marketList: async l => { st.market = st.market || {}; st.market['m'+Date.now()] = {...l, at:Date.now()}; onMarket(st.market); },
    marketBuy: async id => { const l = st.market?.[id]; if (!l || l.buyer) return false; l.buyer = uid; l.bnick = me.nick; onMarket(st.market); return true; },
    marketCancel: async id => { const l = st.market?.[id]; if (!l || l.buyer || l.uid!==uid) return false; delete st.market[id]; onMarket(st.market); return true; },
    marketCollect: async id => { const l = st.market?.[id]; if (!l || !l.buyer) return false; delete st.market[id]; setTimeout(()=>onMarket(st.market)); return true; },
    bossReset: (gen, max) => { onBoss({hp:max, max, gen}); },
    bossHit: dmg => { onBoss({...boss, hp: boss.hp - dmg}); },
    setWorld: async v => { st.world = {...(st.world||{}), ...v}; onWorld(st.world); },
    listen(){ setTimeout(()=>{ onRoofs({}); onPlayers({}); onBoss(null); }); },
  };
}
function firebaseNet(){
  const db = F.getDatabase(app), meRef = F.ref(db, 'online/'+uid);
  F.onDisconnect(meRef).remove();
  const tx = async (path, data) => {
    try {
      const r = await F.runTransaction(F.ref(db, path), cur => (!cur || cur.uid===uid || abandoned(cur)) ? data : undefined);
      return r.committed && r.snapshot.val()?.uid===uid;
    } catch(e){ return false; }
  };
  return {
    savePlayer: d => F.set(F.ref(db, 'players/'+uid), d),
    claimRoof: i => tx('roofs/'+i, {uid, nick:nickVal, at:Date.now()}),
    releaseRoof: i => F.remove(F.ref(db, 'roofs/'+i)).catch(()=>{}),
    claimLot: i => tx('lots/'+i, {uid, at:Date.now()}),
    presence: p => F.set(meRef, p),
    sendChat: t => F.push(F.ref(db, 'chat'), {uid, nick:me.nick, t, z:zoneId, at:F.serverTimestamp()}),
    chatLog: cb => F.onValue(F.query(F.ref(db, 'chat'), F.limitToLast(3000)), s=>cb(s.val()||{}), ()=>{}),
    wipeAll: withChat => F.update(F.ref(db), {players:null, roofs:null, lots:null, online:null, contest:null, mail:null, market:null, boss:null, ...(withChat ? {chat:null} : {})}),
    listen(){
      F.onValue(F.ref(db, 'players'), s=>onPlayers(s.val()), ()=>toast('섬 정보를 불러오지 못했어요.'));
      F.onValue(F.ref(db, 'roofs'), s=>onRoofs(s.val()));
      F.onValue(F.ref(db, 'online'), s=>onOnline(s.val()));
      F.onChildAdded(F.query(F.ref(db, 'chat'), F.limitToLast(15)), s=>onChat(s.val()));
      F.onValue(F.ref(db, 'contest/'+weekKey()), s=>{ contestBoard = Object.values(s.val()||{}).filter(r=>r && typeof r.size==='number').sort((a,b)=>b.size-a.size); });
      F.onChildAdded(F.ref(db, 'mail/'+uid), s=>onMail(s.val(), ()=>F.remove(s.ref).catch(()=>{})));
      F.onValue(F.ref(db, 'boss'), s=>onBoss(s.val()));
      F.onValue(F.ref(db, 'market'), s=>onMarket(s.val()));
      F.onValue(F.ref(db, 'world'), s=>onWorld(s.val()), ()=>{});
    },
    setWorld: v => F.update(F.ref(db, 'world'), v),
    contestSubmit: (w, size) => F.set(F.ref(db, 'contest/'+w+'/'+uid), {nick:me.nick, size}),
    marketList: l => F.push(F.ref(db, 'market'), {...l, at:F.serverTimestamp()}),
    marketBuy: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && !cur.buyer && cur.uid!==uid) ? {...cur, buyer:uid, bnick:me.nick} : undefined, {applyLocally:false}); return r.committed && r.snapshot.val()?.buyer===uid; } catch(e){ return false; } },
    marketCancel: async id => { try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && !cur.buyer) ? null : undefined, {applyLocally:false}); return r.committed && !r.snapshot.exists(); } catch(e){ return false; } },
    marketCollect: async id => { if (collecting.has(id)) return false; collecting.add(id); try { const r = await F.runTransaction(F.ref(db, 'market/'+id), cur => (cur && cur.uid===uid && cur.buyer) ? null : undefined, {applyLocally:false}); return r.committed && !r.snapshot.exists(); } catch(e){ collecting.delete(id); return false; } },
    mailSend: (to, item) => F.push(F.ref(db, 'mail/'+to), {from:uid, nick:me.nick, item, at:F.serverTimestamp()}),
    bossReset: (gen, max) => F.runTransaction(F.ref(db, 'boss'), cur => (!cur || cur.gen !== gen) ? {hp:max, max, gen} : undefined).catch(()=>{}),
    bossHit: dmg => F.runTransaction(F.ref(db, 'boss/hp'), cur => typeof cur==='number' ? Math.max(0, cur - dmg) : cur).catch(()=>{}),
  };
}

function dlgText(t){

  return t.replace(/(^|[\s"'“‘(~])([가-힣]{1,2}), (?=([가-힣]))/g, (m, a, b, c) => cho(b[0]) === cho(c) ? a + b + PAUSE + ' ' : m);

function toBeats(pages, who='npc'){
  const out = [];
  for (const pg of pages){ if (!pg) continue; let buf = [];
    const flush = () => { if (buf.length){ out.push({who, text:buf.join('\n')}); buf = []; } };
    for (const line of dlgText(pg).split('\n')) for (const part of line.split(/(\([^()]*\))/)){
      const p = part.trim(); if (!p) continue;
      if (/^\(.*\)$/.test(p)){ flush(); out.push({who:'narr', text:p.slice(1, -1).trim()}); }
      else { if (buf.length && (buf.join('').length + p.length > 52 || buf.length >= 3)) flush(); buf.push(p); }

function exprOf(t, who){

  if (/헤헤|하하|호호|허허|좋아|최고|고마|기뻐|신난|냠|웃/.test(t)) return 'happy';
  if (t.includes(PAUSE) || /부끄|얼굴을 가린/.test(t)) return 'shy';
  if (/음냐|졸려|하아암/.test(t)) return 'sleepy';

// ===== 상황별 대사: 지금 섬·플레이어 상태에 맞는 상황을 우선순위대로 골라요 (대사는 situations.js) =====

function fishTap(){

  if (fishing.phase==='wait'){ stopFishing('너무 일찍 당겼어요. 느낌표가 뜰 때까지 기다려요'); return true; }
  if (fishing.phase==='bite'){ startFishGame(); return true; }
  return fishing.phase==='game';
}
const fg = {x:.5, tx:.5, zone:.5, ztarget:.5, progress:.35, next:0, held:false};
function startFishGame(){
  const f = FISH[fishing.id];
  fishing.phase = 'game';
  Object.assign(fg, {x:.5, tx:.5, zone:.5, ztarget:.5, progress:.35, next:0, w: .30 - f.diff*.14});
  $('fgZone').style.width = (fg.w*100)+'%';
  $('fishGame').hidden = false;
}
function setZoneFromPointer(e){ const r = $('fgTrack').getBoundingClientRect(); fg.ztarget = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)); }
function updateFishing(dt, t){
  if (!fishing) return;
  if (fishing.phase==='wait' && t >= fishing.biteAt){ const f = FISH[fishing.id]; fishing.phase = 'bite'; fishing.biteEnd = t + 1100 - f.diff*450; }
  else if (fishing.phase==='bite' && t > fishing.biteEnd) stopFishing('앗, 물고기가 도망갔어요.......');
  else if (fishing.phase==='game'){
    const f = FISH[fishing.id];
    if (t > fg.next){ fg.tx = Math.random(); fg.next = t + 350 + Math.random()*(1100 - f.diff*700); }
    const sp = .5 + f.diff*1.6;
    fg.x += Math.max(-sp*dt, Math.min(sp*dt, fg.tx - fg.x)) + (Math.random()-.5)*f.diff*.02;
    fg.x = Math.max(0, Math.min(1, fg.x));
    if (keys.arrowleft||keys.a) fg.ztarget = Math.max(0, fg.ztarget - dt*1.2);
    if (keys.arrowright||keys.d) fg.ztarget = Math.min(1, fg.ztarget + dt*1.2);
    fg.zone += (fg.ztarget - fg.zone) * Math.min(1, dt*10);
    const inside = Math.abs(fg.x - fg.zone) < fg.w/2;
    fg.progress += (inside ? .32 : -.24) * dt;
    $('fgZone').style.left = ((fg.zone - fg.w/2)*100)+'%';
    $('fgZone').classList.toggle('on', inside);
    $('fgBob').style.left = (fg.x*100)+'%';
    $('fgBar').style.width = Math.max(0, Math.min(100, fg.progress*100))+'%';
    $('fgText').textContent = inside ? `끌어오는 중.... ${Math.round(fg.progress*100)}%` : '찌를 놓치고 있어요! 따라가요';
    if (fg.progress >= 1) catchFish();
    else if (fg.progress <= 0) stopFishing('줄이 풀려서 물고기가 도망갔어요.......');
  }
}
function catchFish(){
  const id = fishing.id, f = FISH[id];
  stopFishing();
  const ratio = Math.pow(Math.random(), 1.5), size = Math.round((f.min + (f.max-f.min)*ratio)*10)/10;
  const st = ratio >= .85 ? 3 : ratio >= .5 ? 2 : 1, k = fishKey(id, st);
  setExpr(st===3 || f.weight < 10 ? 'sparkle' : 'happy', 2500); stat('fishCaught'); if (st===3) stat('fish3Star'); gainExp(3 + st*2); questEvent('catch', 'fish:'+k);
  invAdd('fish:'+k, 1);
  me.dex = me.dex || {}; const dx = me.dex[id] || {n:0, best:0, st:0};
  const record = size > dx.best; me.dex[id] = {n:dx.n+1, best:Math.max(dx.best,size), st:Math.max(dx.st,st)};
  saveMe(); renderHud(); contestSubmit(id, size);
  withIcon('fish:'+k); say('낚시', `${f.name}을(를) 낚았어요! ${'★'.repeat(st)}${'☆'.repeat(3-st)}\n크기 ${size} cm${dx.n===0 ? ' · 처음 낚은 물고기!' : record ? ' · 최고 기록!' : ''}`, [], `도감 ${Object.keys(me.dex).length}/50 · 모모 케이크에서 ${fishPrice(k)} G에 팔 수 있어요`);
  if (f.weight <= 2) { if (net && net.sendChat) net.sendChat(`(전설의 ${f.name}을 낚았다! ${size} cm)`).catch(()=>{}); }
}
function drawFishing(ctx, t){
  if (!fishing) return;
  const hx = pos.x + ({left:-12,right:12,up:4,down:8}[pos.dir]||0), hy = pos.y - 22;
  const bob = Math.sin(t/300)*1.5 + (fishing.phase!=='wait' ? Math.sin(t/40)*2 : 0);
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.quadraticCurveTo((hx+fishing.bx)/2, Math.min(hy,fishing.by)-30, fishing.bx, fishing.by+bob); ctx.stroke();
  ctx.fillStyle='#ff5a5a'; ctx.beginPath(); ctx.arc(fishing.bx, fishing.by+bob-2, 4, Math.PI, 0); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(fishing.bx, fishing.by+bob-2, 4, 0, Math.PI); ctx.fill();
  if (fishing.phase!=='wait'){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(fishing.bx, fishing.by+2, 8+Math.sin(t/80)*3, 3, 0, 0, 7); ctx.stroke(); }
  ctx.restore();
  if (fishing.phase==='bite'){ const s = 1 + Math.sin(t/60)*.12; ctx.save(); ctx.translate(pos.x, pos.y-74); ctx.scale(s,s); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill(); ctx.fillStyle='#ff3b6b'; ctx.font='bold 27px "Dongle",sans-serif'; ctx.textAlign='center'; ctx.fillText('!', 0, 7); ctx.restore(); }
}

const CATS = {seed:'seeds', crop:'crops', fish:'fish', ore:'ores', loot:'loot', dish:'dishes', furn:'furn'};
function bagOf(cat){ me.inv[CATS[cat]] = me.inv[CATS[cat]] || {}; return me.inv[CATS[cat]]; }
function invCount(key){ const [cat, id] = key.split(':'); return bagOf(cat)[id] || 0; }
// 가방: 같은 물건은 한 칸에 겹쳐 쌓여요. 한 칸 최대 500 개 — 넘치는 만큼은 버려지고 알려 줘요
const STACK_MAX = 500;
let stackToastT = 0;
function invAdd(key, n=1){
  const [cat, id] = key.split(':'); const b = bagOf(cat); const cur = b[id]||0; let next = cur + n;
  if (next > STACK_MAX){ const over = next - STACK_MAX; next = STACK_MAX; const now = performance.now(); if (now - stackToastT > 1500){ stackToastT = now; toast(`${itemName(key)}은(는) 500 개까지만 쌓여요. ${over} 개는 가방에 못 넣었어요`); } }
  b[id] = next; if (b[id] <= 0) delete b[id];
  return next - cur;
}
const invRoom = key => STACK_MAX - invCount(key);
function itemName(key){
  const [cat, id] = key.split(':');
  if (cat==='fish') return fishName(id);
  if (cat==='crop') return CROPS[id]?.name || '작물';
  if (cat==='seed') return (CROPS[id]?.name || '') + ' 씨앗';
  if (cat==='ore') return ORES[id]?.name || '광석';
  if (cat==='loot') return MONSTERS[id]?.drop || '전리품';
  if (cat==='dish') return DISHES[id]?.name || '요리';
  if (cat==='furn') return FURN[id]?.name || '가구';
  return key;
}
function itemPrice(key){
  const [cat, id] = key.split(':');
  if (cat==='fish') return fishPrice(id);
  if (cat==='crop') return CROPS[id]?.sell || 0;
  if (cat==='seed') return Math.round((CROPS[id]?.seed || 0) / 2);
  if (cat==='ore') return ORES[id]?.price || 0;
  if (cat==='loot') return MONSTERS[id]?.dropPrice || 0;
  if (cat==='dish') return DISHES[id] ? dishPrice(id) : 0;
  if (cat==='furn') return FURN[id] ? Math.round(FURN[id].gold/2) : 0;
  return 0;
}
function itemsOf(cat){ return Object.entries(bagOf(cat)).filter(([,n])=>n>0).map(([id,n])=>[cat+':'+id, n]); }
function sumValue(cat){ return itemsOf(cat).reduce((a,[k,n])=>a+itemPrice(k)*n, 0); }
function countOf(cat){ return itemsOf(cat).reduce((a,[,n])=>a+n, 0); }

function rollOre(zid){
  const mz = MINE_ZONES[zid];
  const list = Object.entries(ORES).filter(([,o])=>mz.tiers.includes(o.tier) && (mz.sea || !o.sea));

function plant(i, type, quiet=false){

function drawSlot(d, s, g, now, mine){

  if (st===3){ d.dot(x-6,y-17,2,'#ffe066'); d.dot(x+5,y-20,2,'#ffe066'); d.dot(x+1,y-25,2,'#ffe066'); }
  if (st===4 && ART[cr.type]){ d.ell(x-6,y-6,6,3,'leaf'); d.ell(x+6,y-7,6,3,'leaf'); c.save(); c.translate(x, y-14); c.scale(.62,.62); ART[cr.type](d, 0); c.restore(); }
  else if (st===4){
    if (cd.shape==='fruit'){ d.circle(x-6,y-14,6,'leaf'); d.circle(x+6,y-15,6,'leaf'); d.circle(x,y-20,6,'#7fd07a'); d.circle(x-6,y-12,4.5,col); d.circle(x+6,y-14,4.5,col); d.circle(x,y-21,4.5,col); }
    else if (cd.shape==='root'){ d.ell(x-5,y-12,3,7,'leaf'); d.ell(x+5,y-12,3,7,'leaf'); d.ell(x,y-14,3,8,'#7fd07a'); d.ell(x,y-2,7,5,col); }

    else if (cd.shape==='flower'){ d.line(c=>{c.moveTo(x,y);c.lineTo(x,y-20);},'#4f9e46',2); d.ell(x-5,y-8,4,2,'leaf'); for (let a=0;a<6.28;a+=1.05) d.circle(x+Math.cos(a)*5,y-22+Math.sin(a)*5,3.6,col); d.dot(x,y-22,2.6,'#ffe066'); }
    else { d.rr(x-2,y-30,4,30,2,'#5aa857'); d.ell(x-6,y-14,6,2.4,'leaf'); d.ell(x+6,y-20,6,2.4,'leaf'); d.ell(x,y-32,4.5,7,col); }
  }
  if (mine && st<4 && !cr.wateredAt){ const b = Math.sin(now/250)*2; d.dot(x+13,y-28+b,4,'#6fc3ff'); d.tri([[x+9.8,y-29+b],[x+13,y-36+b],[x+16.2,y-29+b]],'#6fc3ff'); }
  if (mine && st===4){ const b = Math.sin(now/250)*2; c.drawImage(uiCanvas('sparkle', 64), x+5, y-38+b, 18, 18); }
}

function anyFishKeys(){ return itemsOf('fish').sort((a,b)=>fishPrice(a[0].slice(5))-fishPrice(b[0].slice(5))); }
function canCook(id){ return DISHES[id].need.every(([k,n])=> k==='fish:*' ? countOf('fish') >= n : invCount(k) >= n); }

function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed){ let s = seed || 1; return ()=>{ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// ===== 오늘의 심부름 (토리) =====
function errandsToday(){
  const r = seeded(hash(uid + ':' + today())), list = [];
  const crops = Object.keys(CROPS).filter(id=>CROPS[id].min <= 120), fish = Object.keys(FISH).filter(id=>FISH[id].weight >= 8), ores = Object.keys(ORES).filter(id=>ORES[id].tier<=2 && !ORES[id].sea), loot = Object.keys(MONSTERS).filter(id=>MONSTERS[id].zone==='forest');
  const pick = a => a[Math.floor(r()*a.length)];
  const kinds = ['crop','fish','ore','loot'];
  for (let i=0;i<3;i++){
    const k = kinds[Math.floor(r()*4)];
    if (k==='crop'){ const id = pick(crops); list.push({key:'crop:'+id, n:1+Math.floor(r()*3), label:CROPS[id].name}); }
    if (k==='fish'){ const id = pick(fish), st = r()<.3 ? 2 : 1; list.push({key:'fish:'+id, st, n:1, label:`${FISH[id].name} ${'★'.repeat(st)} 이상`}); }
    if (k==='ore'){ const id = pick(ores); list.push({key:'ore:'+id, n:1+Math.floor(r()*3), label:ORES[id].name}); }
    if (k==='loot'){ const id = pick(loot); list.push({key:'loot:'+id, n:1+Math.floor(r()*2), label:MONSTERS[id].drop}); }
  }
  return list.map((e,i)=>({...e, i, reward: 150 + Math.round(e.key.startsWith('fish:') ? fishPrice(e.key.slice(5)+'_'+e.st)*2.2 : itemPrice(e.key)*e.n*2.2)}));
}
function errandHave(e){
  if (e.key.startsWith('fish:')){ const id = e.key.slice(5); return itemsOf('fish').filter(([k])=>{ const p = parseFish(k.slice(5)); return p.id===id && p.st>=e.st; }).reduce((a,[,n])=>a+n,0) >= e.n; }
  return invCount(e.key) >= e.n;
}
function errandPanel(){
  const st = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
  openPanel('토리의 오늘의 심부름', errandsToday().map(e=>{
    const done = st.includes(String(e.i)), ok = errandHave(e);
    return `<button class="np" data-id="${e.i}" ${done||!ok?'style="opacity:.55"':''}><span class="np-name">${iconImg(e.key)}${e.label} ${e.n} 개 <small>가져다주기</small></span><span class="np-place">${done?'완료 ✓':ok?'전달하기':'아직 없어요'}</span><span class="np-day">보상 ${e.reward} G · 토리 호감도 +5</span></button>`;
  }).join('') + '<p class="mnote">심부름은 매일 바뀌어요.</p>', b=>{
    const e = errandsToday()[+b.dataset.id];
    const done = me.errand && me.errand.day===today() ? me.errand.done.split(',') : [];
    if (done.includes(String(e.i))) return toast('이미 끝낸 심부름이에요');

    if (e.key.startsWith('fish:')){ let left = e.n; for (const [k,c] of itemsOf('fish')){ const p = parseFish(k.slice(5)); if (p.id!==e.key.slice(5) || p.st<e.st) continue; const t = Math.min(left,c); invAdd(k,-t); left -= t; if (!left) break; } }
    else invAdd(e.key, -e.n);
    me.inv.gold += e.reward; addPts(NPC.tori, 5); gainExp(25);
    me.errand = {day:today(), done:[...done, String(e.i)].filter(Boolean).join(',')}; stat('errandsDone');
    saveMe(); renderHud(); toast(`심부름 완료! ${e.reward} G를 받았어요`); errandPanel();

const zoneOk = id => typeof id==='string' && (!!ZONES[id] || (id.startsWith('house:') && (id.slice(6)===uid || !!players[id.slice(6)])));
function furnOf(owner){ const p = owner===uid ? me : players[owner]; return (p && Array.isArray(p.furn)) ? p.furn : (p && p.furn ? Object.values(p.furn) : []); }
let decorating = null; // 고른 가구 id
function drawFurn(d, f, x, y){
  if (f.f && !f._flipping){ const c = d.ctx; c.save(); c.translate(x, 0); c.scale(-1, 1); c.translate(-x, 0); drawFurn(d, {...f, _flipping:true}, x, y); c.restore(); return; }
  const F = FURN[f.id]; if (!F || !FURN_DRAW[F.shape]) return;
  FURN_DRAW[F.shape](CH.mattePainter(d.ctx), x, y, F.color); // 유아용 점토: 캐릭터와 같은 매트 페인터
}
let movingFurn = -1;
function houseTap(w){
  const z = Z(); if (!z.house || z.house!==uid) return null;
  if (!decorating){ const tv = furnOf(uid).find(f=>f.id===TV_ID && Math.abs(f.x-w.x)<40 && w.y>f.y-80 && w.y<f.y+14); return tv ? {x:tv.x, y:tv.y+34, act:tvPanel} : null; }
  const stay = {x:pos.x, y:pos.y, act:null, mark:performance.now()}, list = furnOf(uid);
  const hit = () => list.findIndex(f=>Math.abs(f.x-w.x)<38 && w.y>f.y-70 && w.y<f.y+12);
  const onFloor = w.y >= 250 && w.y <= z.H-70 && w.x >= 80 && w.x <= z.W-80;
  if (decorating==='pick' || decorating==='flip'){
    const i = hit(); if (i<0){ toast(decorating==='pick' ? '치울 가구를 눌러요' : '뒤집을 가구를 눌러요'); return stay; }
    if (decorating==='flip'){ list[i] = {...list[i], f: list[i].f ? 0 : 1}; me.furn = [...list]; saveMe(); return stay; }
    const f = list.splice(i,1)[0]; me.furn = list; invAdd('furn:'+f.id, 1); saveMe(); toast(`${FURN[f.id].name}을(를) 가방에 넣었어요`); return stay;
  }
  if (decorating==='move'){
    if (movingFurn < 0){ const i = hit(); if (i<0){ toast('옮길 가구를 눌러요'); return stay; } movingFurn = i; toast(`${FURN[list[i].id].name}: 놓을 자리를 눌러요`); return stay; }
    if (!onFloor){ toast('바닥을 눌러 놓아요'); return stay; }
    if (list[movingFurn]){ list[movingFurn] = {...list[movingFurn], x:Math.round(w.x), y:Math.round(w.y)}; me.furn = [...list]; saveMe(); }
    movingFurn = -1; toast('옮겼어요. 다른 가구도 눌러서 옮길 수 있어요'); return stay;
  }
  if (!onFloor){ toast('바닥을 눌러 놓아요'); return stay; }
  if (!invCount('furn:'+decorating)) { decorating = null; renderDecor(); return null; }
  const max = HOUSE_LV[myHouse().lv-1].max;
  if (list.length >= max){ toast(`지금 집에는 가구를 ${max} 개까지 놓을 수 있어요. 보리 공방에서 집을 늘려요`); return stay; }
  invAdd('furn:'+decorating, -1); me.furn = [...list, {id:decorating, x:Math.round(w.x), y:Math.round(w.y)}]; saveMe();
  toast(`${FURN[decorating].name}을(를) 놓았어요 (${me.furn.length}/${max})`);
  if (!invCount('furn:'+decorating)) decorating = null;
  renderDecor();
  return stay;
}

// ===== 몽실 옷가게: 상의·하의·세트·모자·악세사리·신발. 사면 옷장에 들어가고, 입는 건 무료 =====
let shopTab = 'top';
const CLOSET = () => { me.closet = me.closet || [...CH.FREE]; return me.closet; };
const wearing = id => CH.lookItems(me.look).includes(id);
const previewCache = new Map();
// 옷 미리보기: 내 캐릭터가 그 옷을 입은 모습 (정면)
function wearPreview(L, size=96){
  const key = JSON.stringify(L)+'|'+size; if (previewCache.has(key)) return previewCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  const sc = size/80; x.setTransform(sc,0,0,sc,size/2, size-5); // 새 몸은 키가 커서 모자까지 다 들어가게
  try { CH.figure(CH.mattePainter(x), L, 'down', 0, false, 'dot'); } catch(e){}
  const url = c.toDataURL(); if (previewCache.size > 200) previewCache.clear(); previewCache.set(key, url); return url;
}
// 옷마다 색 5 가지. 옷장에는 '아이디'(1 번 색) 또는 '아이디#색번호'로 들어가요. 기본 옷은 모든 색이 무료
const ownKey = (id, c) => c ? `${id}#${c}` : id;
const freeItem = it => it && it.price===0 && !it.need;
const owns = (id, c=0) => freeItem(CH.ITEM(id)) || CLOSET().includes(ownKey(id, c));
const ownsAny = id => freeItem(CH.ITEM(id)) || CLOSET().some(k=>k.split('#')[0]===id);
function tryOn(L, slot, id, c=0){ const n = {...L, cc:{...(L.cc||{}), [slot]:c}}; if (slot==='set'){ n.set = id; } else if (slot==='top' || slot==='bottom'){ n.set = ''; n[slot] = id; } else n[slot] = id; return n; }
function wear(slot, id, c=0){ me.look = tryOn(me.look, slot, id, c); if (id !== 'none') stat('outfitChanged'); saveMe(); spriteCache.clear(); toast(id==='none' ? '벗었어요' : `${CH.ITEM(id).name}을(를) 입었어요`); if (id==='none') clothesPanel(); else colorPanel(slot, id); }
function clothesPanel(){
  const [slot, label, cat] = CH.CATS.find(c=>c[0]===shopTab);
  const tabs = CH.CATS.map(([k,l])=>`<button class="mini" data-tab="${k}" style="${k===shopTab?'':'background:#fff'}">${l}</button>`).join('');
  const rows = Object.entries(cat).map(([id,it])=>{
    const own = ownsAny(id), on = wearing(id) || (id==='none' && (slot==='hat' ? me.look.hat==='none' : slot==='acc' ? me.look.acc==='none' : false));

    const can = it.need ? (me.inv.gold >= it.price && invCount(it.need) >= it.n) : me.inv.gold >= it.price;
    return `<button class="tile ${on?'on':''}" data-id="${id}" title="${esc(it.name)}">${id==='none' ? '<span style="font-size:30px;line-height:44px">✕</span>' : `<img class="ic" src="${wearPreview(tryOn(me.look, slot, id))}" alt="">`}<em>${esc(it.name)}</em><s style="color:${own?'var(--soft)':can?'#e48fac':'#c9b3bc'}">${own ? (on ? '입는 중' : '입기') : cost}</s></button>`; }).join('');
  openPanel(`몽실 옷가게 · 💰 ${me.inv.gold} G`, `<div style="display:flex;gap:5px;flex-wrap:wrap">${tabs}</div><p class="mnote" style="margin:4px 2px 0">옷을 누르면 색 5 가지 중에서 골라요. 산 옷은 옷장에 들어가고, 갈아입는 건 공짜예요. 한 벌을 입으면 상의·하의는 가려져요.</p><div class="bag-grid">${rows}</div>`);
  const pn = $('npcPanel');
  pn.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>{ shopTab = b.dataset.tab; clothesPanel(); });

// 색 고르기: 같은 옷의 다섯 색을 입어 본 모습으로 보여 주고, 가진 색은 바로 입고 없는 색은 사요
function colorPanel(slot, id){
  const it = CH.ITEM(id), cols = CH.colorsOf(slot, id), cur = wearing(id) ? (me.look.cc?.[slot] || 0) : -1, free = freeItem(it);

  openPanel(`${it.name} · 색 고르기 · ${me.inv.gold} G`, `<button class="mini" id="cpBack" style="background:#fff">← 목록으로</button><p class="mnote" style="margin:4px 2px 0">${free ? '기본 옷이라 모든 색이 무료예요.' : '색마다 따로 사요. 산 색은 옷장에 들어가고 언제든 갈아입을 수 있어요.'}</p><div class="bag-grid">${tiles}</div>`);
  const pn = $('npcPanel');
  $('cpBack').onclick = ()=>clothesPanel();
  pn.querySelectorAll('.tile[data-c]').forEach(b=>b.onclick = ()=>{

    if (!can) return toast(it.need ? '재료나 돈이 모자라요' : '돈이 모자라요');
    say(it.name, it.need ? `${it.price?it.price+' G와 ':''}${itemName(it.need)} ${it.n} 개로 ${c+1} 번 색을 만들까요?` : `${c+1} 번 색을 ${it.price} G에 살까요? 사면 옷장에 들어가요.`, [[it.need ? '만들기' : '사기', ()=>{
      me.inv.gold -= it.price; if (it.need) invAdd(it.need, -it.n); CLOSET().push(ownKey(id, c)); stat('bought'); syncStats(); renderHud(); closeTalk(); wear(slot, id, c); toast(`${it.name}(${c+1} 번 색)을(를) ${it.need?'만들어':'사서'} 입었어요!`); }], ['그만두기', ()=>{ closeTalk(); colorPanel(slot, id); }]], '', true);
  });

// ===== 날씨 (펭펭) =====
const WEATHER = [['맑음','☀️',60],['흐림','☁️',20],['비','🌧️',15],['무지개','🌈',5]];
function weatherOf(day){ let r = hash('w'+day) % 100; for (const w of WEATHER){ if ((r -= w[2]) < 0) return w; } return WEATHER[0]; }
const isRain = () => weatherOf(today())[0]==='비';
const isRainbow = () => weatherOf(today())[0]==='무지개';
function forecast(){
  const a = weatherOf(today()), b = weatherOf(today()+1);
  return `오늘은 ${a[1]} ${a[0]}, 내일은 ${b[1]} ${b[0]}! ${a[0]==='비' ? '비 오는 날엔 텃밭에 물을 안 줘도 되고, 희귀한 물고기가 잘 나와.' : a[0]==='무지개' ? '무지개 뜬 날엔 바위에서 귀한 광석이 잘 나와!' : ''}`;
}
let rainT = 0;
function rainWater(t){
  if (!isRain() || t - rainT < 20000) return; rainT = t;
  let n = 0; const now = Date.now();
  for (const g of me.gardens) if (g && g.crop){ const c = cropNow(g.crop, now); if (c.stage < 4 && !c.wateredAt){ g.crop = {type:c.type, stage:c.stage, wateredAt:now}; n++; } else g.crop = c; }
  if (n){ saveMe(); toast(`비가 와서 텃밭 ${n} 칸에 물이 들었어요`); }
}
const drops = Array.from({length:70}, (_,i)=>({x:Math.random(), y:Math.random(), s:.6+Math.random()*.6}));
function drawWeather(c, t){
  const z = Z(); if (z.theme==='cave' || z.theme==='room') return;
  const w = cv.width, h = cv.height;
  if (isRain()){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle='rgba(90,110,150,.12)'; c.fillRect(0,0,w,h); c.strokeStyle='rgba(220,235,255,.7)'; c.lineWidth=1.5*view.dpr;
    for (const d of drops){ const y = ((d.y + t/1500*d.s) % 1)*h, x = d.x*w; c.beginPath(); c.moveTo(x,y); c.lineTo(x-3*view.dpr,y+12*view.dpr); c.stroke(); } c.restore(); }
  if (isRainbow()){ c.save(); c.setTransform(1,0,0,1,0,0); c.globalAlpha=.18; ['#ff6b6b','#ffa14f','#ffd84f','#5cc46a','#5b8cff','#a77bff'].forEach((col,i)=>{ c.strokeStyle=col; c.lineWidth=8*view.dpr; c.beginPath(); c.arc(w*.5, h*1.1, h*.9-i*8*view.dpr, Math.PI, 0); c.stroke(); }); c.restore(); }
}

}

// ===== 경제: 판매처 · 오늘의 시세 · 거래소 =====
// 판매처: 모모는 뭐든 사 주고, 전문 상인은 자기 분야를 더 비싸게 사 줘요. 친한 친구(♥7)가 되면 +10%
const BUYERS = {
  momo:{cats:['crop','fish','ore','loot','dish','furn'], bonus:{}, line:'뭐든 가져와요~ 다 사 줄게요!'},
  hana:{cats:['crop'], bonus:{crop:1.25}, line:'작물이면 내가 제일 비싸게 사 줄게!'},
  pengpeng:{cats:['fish'], bonus:{fish:1.25}, line:'펭! 물고기라면 제일 비싸게 사 줄게!'},
  dodo:{cats:['ore'], bonus:{ore:1.25}, line:'광석이라면 내가 제값 쳐 주지.'},
  kongi:{cats:['loot'], bonus:{loot:1.25}, line:'충성! 전리품은 경비대가 비싸게 사겠습니다!'},
  dandan:{cats:['dish','crop'], bonus:{dish:1.25, crop:1.05}, line:'요리라면 우리 카페에서 사 갈게요.'},
};
const SELL_CATS = {crop:'작물', fish:'물고기', ore:'광석', loot:'전리품', dish:'요리', furn:'가구'};
const baseKey = key => { const [cat, id] = key.split(':'); return cat==='fish' ? 'fish:'+parseFish(id).id : key; };
// 오늘의 인기 품목: 작물·물고기·광석에서 하나씩, 오늘은 2 배 값
function hotToday(){
  const d = today(), pick = (list, salt) => list[hash(d+salt) % list.length];
  return [ 'crop:'+pick(Object.keys(CROPS),'c'), 'fish:'+pick(Object.keys(FISH),'f'), 'ore:'+pick(Object.keys(ORES).filter(id=>ORES[id].tier<=3),'o') ];
}
// 시세: 날마다 품목별로 70%~140% 사이에서 바뀌어요
function marketMul(key){ const b = baseKey(key); if (hotToday().includes(b)) return 2; return .7 + (hash(today()+'|'+b) % 71)/100; }
function soldToday(){ if (!me.sold || me.sold.d !== today()) me.sold = {d:today(), c:{}}; return me.sold.c; }
// 같은 물건을 하루에 많이 팔면 값이 조금씩 내려가요 (개당 -3%, 최저 50%)
const glut = (key, extra=0) => Math.max(.5, 1 - .03*((soldToday()[baseKey(key).replace(':','_')]||0) + extra));
function buyerBonus(n, key){
  const by = BUYERS[n.id], cat = key.split(':')[0];
  return (by?.bonus[cat] || 1) + (heartsN(n) >= 7 ? .1 : 0);
}
function unitPrice(key, n, extra=0){ return Math.max(1, Math.round(itemPrice(key) * marketMul(key) * glut(key, extra) * (n ? buyerBonus(n, key) : 1))); }
function sellTotal(key, cnt, n){ let s = 0; for (let i=0;i<cnt;i++) s += unitPrice(key, n, i); return s; }
function sellItem(key, cnt, n){
  cnt = Math.min(cnt, invCount(key)); if (cnt <= 0) return 0;
  const g = sellTotal(key, cnt, n), sk = baseKey(key).replace(':','_'), c = soldToday();
  invAdd(key, -cnt); c[sk] = (c[sk]||0) + cnt; me.inv.gold += g;
  me.earned = (me.earned||0) + g; stat('sold', cnt); questEvent('sell', key, cnt); syncStats();
  return g;
}
const trend = key => { const m = marketMul(key); return m >= 2 ? '<b style="color:#e48fac">인기 ×2</b>' : m >= 1.15 ? '<span style="color:#e48fac">▲</span>' : m <= .85 ? '<span style="color:#7fa6d9">▼</span>' : '<span style="color:var(--soft)">–</span>'; };
function sellPanel(n){
  const by = BUYERS[n.id] || BUYERS.momo;
  const rows = by.cats.flatMap(cat=>itemsOf(cat).map(([k,c])=>({k,c,cat})));
  const all = rows.reduce((a,r)=>a+sellTotal(r.k, r.c, n), 0);
  const bon = Object.entries(by.bonus).map(([c,b])=>`${SELL_CATS[c]} +${Math.round((b-1)*100)}%`).concat(heartsN(n) >= 7 ? ['친한 친구 +10%'] : []).join(' · ');
  openPanel(`${n.name}에게 팔기 · 💰 ${me.inv.gold} G`,
    `<p class="mnote" style="margin-top:0">${esc(by.line)}${bon ? ` <b style="color:var(--ink)">${bon}</b>` : ''}<br>오늘의 인기: ${hotToday().map(k=>itemName(k)).join(', ')} (2 배)</p>` +
    (rows.length ? `<button class="mini" id="spAll" style="align-self:flex-start">전부 팔기 +${all} G</button>` +
      rows.map(r=>`<button class="np" data-id="${r.k}"><span class="np-name">${iconImg(r.k)}${esc(itemName(r.k))} <small>×${r.c}</small></span><span class="np-place">${unitPrice(r.k, n)} G ${trend(r.k)}</span><span class="np-day">전부 ${sellTotal(r.k, r.c, n)} G</span></button>`).join('')
      : `<p class="mnote">${n.name}에게 팔 수 있는 물건이 없어요.</p>`),
    b=>{ const k = b.dataset.id, c = invCount(k);
      const opts = [[`1 개 팔기 (+${sellTotal(k,1,n)} G)`, ()=>{ const g = sellItem(k,1,n); saveMe(); renderHud(); toast(`${itemName(k)} 1 개 · +${g} G`, k); sellPanel(n); }]];
      if (c > 1) opts.push([`${c} 개 전부 팔기 (+${sellTotal(k,c,n)} G)`, ()=>{ const g = sellItem(k,c,n); saveMe(); renderHud(); toast(`${itemName(k)} ${c} 개 · +${g} G`, k); sellPanel(n); }]);
      opts.push(['그만두기', ()=>sellPanel(n)]);
      withIcon(k); say(itemName(k), `오늘 시세 ${Math.round(marketMul(k)*100)}% · 1 개 ${unitPrice(k,n)} G`, opts, '같은 물건을 많이 팔면 값이 조금씩 내려가요', true); });
  const allBtn = $('spAll'); if (allBtn) allBtn.onclick = ()=>{ let g = 0; for (const r of rows) g += sellItem(r.k, r.c, n); saveMe(); renderHud(); toast(`전부 팔았어요 · +${g} G`); sellPanel(n); };
}
function pricePanel(){
  const hot = hotToday();
  const pick = (cat, list) => list.map(id=>cat+':'+id).sort((a,b)=>marketMul(b)-marketMul(a));
  const sec = (label, keys) => `<div class="bag-sec"><b>${label}</b>${keys.slice(0,5).map(k=>`<div class="np"><span class="np-name">${iconImg(k)}${esc(itemName(k))}</span><span class="np-place">${Math.round(marketMul(k)*100)}% ${trend(k)}</span></div>`).join('')}</div>`;
  openPanel('오늘의 시세', `<p class="mnote" style="margin-top:0">시세는 매일 아침 바뀌어요. 인기 품목은 2 배! 전문 상인(하나·펭펭·도도·콩이·단단)에게 팔면 더 비싸요.</p>
    ${sec('오늘의 인기 품목', hot)}${sec('작물 비싼 순', pick('crop', Object.keys(CROPS)).filter(k=>!hot.includes(k)))}${sec('물고기 비싼 순', pick('fish', Object.keys(FISH)).filter(k=>!hot.includes(k)))}${sec('광석 비싼 순', pick('ore', Object.keys(ORES)).filter(k=>!hot.includes(k)))}`);
}

// 거래소: 주민(플레이어)끼리 물건을 골드로 사고팔아요. 팔리면 수수료 5%를 빼고 받아요
const MARKET_FEE = .05, MARKET_MAX = 5;
let market = {};
const validListing = l => l && typeof l.item==='string' && /^(dish|crop|fish|ore|loot|seed|furn):[a-z0-9_]{2,8}$/.test(l.item) && l.n>=1 && l.n<=99 && l.price>=1 && typeof l.uid==='string';
function onMarket(v){
  market = {};
  for (const [id,l] of Object.entries(v||{})) if (validListing(l)) market[id] = l;
  // 내 물건이 팔렸으면 골드를 받아요
  for (const [id,l] of Object.entries(market)) if (l.uid===uid && l.buyer){
    net.marketCollect(id).then(ok=>{ if (!ok) return; const g = Math.floor(l.price*(1-MARKET_FEE)); me.inv.gold += g; me.earned = (me.earned||0) + g; saveMe(); renderHud();
      stat('marketSold'); addLog(`거래소: ${String(l.bnick||'누군가').slice(0,8)} 님이 ${itemName(l.item)} ${l.n} 개를 샀어요! +${g} G`, true); }).catch(()=>{});
  }
  if (!$('npcPanel').hidden && $('npcPanel').dataset.market) marketPanel();
}
function marketPanel(){
  const list = Object.entries(market).filter(([,l])=>!l.buyer).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  const mine = list.filter(([,l])=>l.uid===uid), others = list.filter(([,l])=>l.uid!==uid);
  const row = ([id,l]) => { const each = Math.round(l.price/l.n), ref = unitPrice(l.item);
    return `<button class="np" data-id="${id}"><span class="np-name">${iconImg(l.item)}${esc(itemName(l.item))} <small>×${l.n} · ${esc(String(l.nick||'').slice(0,8))}</small></span><span class="np-place">${l.price} G</span><span class="np-day">${l.uid===uid ? '내리기' : `개당 ${each} G · 상점 시세 ${ref} G`}</span></button>`; };
  openPanel(`거래소 · 💰 ${me.inv.gold} G`,
    `<p class="mnote" style="margin-top:0">친구들이 올린 물건을 사거나, 내 물건을 원하는 값에 올려요. 팔리면 수수료 5%를 빼고 골드가 들어와요. (최대 ${MARKET_MAX} 개)</p>
     <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="mkAdd">물건 올리기</button><button class="mini" id="mkPrice">오늘의 시세</button></div>
     <div class="bag-sec"><b>사고 싶은 물건 ${others.length}</b>${others.map(row).join('') || '<p class="mnote">아직 올라온 물건이 없어요.</p>'}</div>
     ${mine.length ? `<div class="bag-sec"><b>내가 올린 물건 ${mine.length}/${MARKET_MAX}</b>${mine.map(row).join('')}</div>` : ''}`,
    b=>{ const id = b.dataset.id, l = market[id]; if (!l) return;
      if (l.uid===uid) return say('거래소', `${itemName(l.item)} ${l.n} 개를 내릴까요?`, [['내리기', async ()=>{ if (await net.marketCancel(id)){ invAdd(l.item, l.n); saveMe(); renderHud(); toast('물건을 돌려받았어요'); } else toast('이미 팔렸거나 내릴 수 없어요'); closeTalk(); marketPanel(); }], ['그만두기', marketPanel]], '', true);
      if (me.inv.gold < l.price) return toast('골드가 모자라요');
      if (invRoom(l.item) < l.n) return toast(`${itemName(l.item)}은(는) 가방에 ${invRoom(l.item)} 개까지만 더 넣을 수 있어요`);
      withIcon(l.item);
      say('거래소', `${String(l.nick||'').slice(0,8)} 님의 ${itemName(l.item)} ${l.n} 개를 ${l.price} G에 살까요?`, [['사기', async ()=>{
        if (me.inv.gold < l.price) return toast('골드가 모자라요');
        if (await net.marketBuy(id)){ me.inv.gold -= l.price; invAdd(l.item, l.n); stat('marketBought'); saveMe(); renderHud(); toast(`${itemName(l.item)} ${l.n} 개를 샀어요!`, l.item); }
        else toast('앗, 이미 다른 사람이 샀어요');
        closeTalk(); marketPanel(); }], ['그만두기', marketPanel]], `상점 시세로는 개당 ${unitPrice(l.item)} G예요`, true); });
  $('npcPanel').dataset.market = '1';
  $('mkAdd').onclick = marketAdd; $('mkPrice').onclick = pricePanel;
}
function marketAdd(){
  if (Object.values(market).filter(l=>l.uid===uid && !l.buyer).length >= MARKET_MAX) return toast(`한 번에 ${MARKET_MAX} 개까지 올릴 수 있어요`);
  const items = ['crop','fish','ore','loot','dish','seed','furn'].flatMap(cat=>itemsOf(cat));
  if (!items.length) return toast('올릴 물건이 없어요');
  say('물건 올리기', '무엇을 올릴까요?', items.slice(0,30).map(([k,c])=>[`${itemName(k)} (${c})`, ()=>{
    const ns = [...new Set([1, 5, 10, Math.min(c, 99)])].filter(x=>x<=c);
    say('물건 올리기', `${itemName(k)}을(를) 몇 개 올릴까요?`, ns.map(q=>[`${q} 개`, ()=>{
      const base = unitPrice(k) * q;
      const ps = [...new Set([.8, 1, 1.3, 1.6, 2].map(m=>Math.max(1, Math.round(base*m/5)*5 || 1)))];
      say('물건 올리기', `${itemName(k)} ${q} 개, 얼마에 팔까요?\n(상점 시세로는 ${base} G)`, ps.map(p=>[`${p} G`, async ()=>{
        if (invCount(k) < q) return closeTalk();
        invAdd(k, -q); saveMe(); renderHud();
        try { await net.marketList({uid, nick:me.nick, item:k, n:q, price:p}); toast(`${itemName(k)} ${q} 개를 ${p} G에 올렸어요`); }
        catch(e){ invAdd(k, q); saveMe(); renderHud(); toast('올리지 못했어요. 잠시 뒤 다시 해 봐요'); }
        closeTalk(); marketPanel();
      }]).concat([['그만두기', marketPanel]]), '', false, true);
    }]), '', false, true);
  }]), '', false, true);
}

// ===== 핑키 홈쇼핑 · 별사탕: 동물의 숲 무처럼 사 두고 값이 오르길 기다려요 =====
// 집에 TV(보리 공방)를 놓으면 볼 수 있어요. 방송은 하루 두 번, 오후 1 시와 밤 10 시에 한 시간씩. 그때만 사고팔 수 있어요.
// 3 일(방송 6 번)이 한 판. 첫 방송 값에서 시작해 판마다 오르내리는 모양이 달라요 (큰 대박 · 작은 대박 · 내리막 · 들쭉날쭉).
// 다음 판 첫 방송이 시작되면 남은 별사탕은 녹아 없어져요. 값은 모두에게 같아요.
const SHOW_HOURS = [13, 22], SHOW_MIN = 60, CANDY_MAX = 500, CANDY_PER = 6;
const TV_ID = Object.keys(FURN).find(k=>FURN[k].shape==='tv');
const kstParts = (t=Date.now()) => { const d = new Date(t + 9*3600000); return {day:Math.floor(d.getTime()/86400000), h:d.getUTCHours(), m:d.getUTCMinutes()}; };
function showLive(){ const {day, h, m} = kstParts(), s = SHOW_HOURS.indexOf(h); return s >= 0 && m < SHOW_MIN ? {slot:day*2 + s, left:SHOW_MIN - m} : null; }
function lastSlot(){ const {day, h} = kstParts(); return h >= SHOW_HOURS[1] ? day*2 + 1 : h >= SHOW_HOURS[0] ? day*2 : day*2 - 1; } // 가장 최근에 시작한 방송
const cycleOf = slot => Math.floor(slot / CANDY_PER);
const slotName = slot => `${['오후 1 시', '밤 10 시'][((slot % 2) + 2) % 2]}`;
const slotTime = slot => (Math.floor(slot/2) * 86400000) - 9*3600000 + SHOW_HOURS[((slot % 2) + 2) % 2] * 3600000; // 방송 시작 시각(ms)
function candyPrice(slot){
  const c = cycleOf(slot), i = slot - c*CANDY_PER, B = 90 + hash('cb'+c) % 21, pat = hash('cp'+c) % 4, r = k => (hash('cr'+c+'|'+k) % 1000) / 1000;
  if (i === 0) return B;
  if (pat <= 1){ const peak = 2 + Math.floor(r('pk') * 4); // 큰 대박(0) · 작은 대박(1): 몇 번 내리다가 한 번 확 올라요
    if (i < peak-1) return Math.round(B * (.9 - .05*i + r(i)*.06));
    if (i === peak-1) return Math.round(B * (pat===0 ? 1.25 + r(i)*.3 : 1.05 + r(i)*.2));
    if (i === peak) return Math.round(B * (pat===0 ? 3 + r(i)*2.5 : 1.4 + r(i)*.6));
    return Math.round(B * (.45 + r(i)*.3)); }
  if (pat === 2) return Math.round(B * (.93 - .09*i + r(i)*.05)); // 내리막
  return Math.round(B * (.6 + r(i)*.85)); // 들쭉날쭉
}
const hasTV = () => !!TV_ID && (me.furn||[]).some(f=>f.id===TV_ID);
// 내 별사탕. 판이 바뀌었으면 녹아요
function myCandy(){
  const c = me.candy;
  if (c && c.n > 0 && c.cycle !== cycleOf(lastSlot())){ toast(`별사탕 ${c.n} 개가 녹아 버렸어요.... 다음엔 3 일 안에 팔아요`); me.candy = null; saveMe(); }
  return me.candy && me.candy.n > 0 ? me.candy : null;
}
function candyTrade(n){
  const live = showLive(); if (!live) return toast('방송 시간에만 사고팔 수 있어요');
  const p = candyPrice(live.slot), c = myCandy();
  if (n > 0){
    n = Math.min(n, CANDY_MAX - (c ? c.n : 0), Math.floor(me.inv.gold / p)); if (n <= 0) return toast(c && c.n >= CANDY_MAX ? `별사탕은 ${CANDY_MAX} 개까지 가질 수 있어요` : '골드가 모자라요');
    me.inv.gold -= p*n; me.candy = {n:(c ? c.n : 0) + n, cost:(c ? c.cost : 0) + p*n, cycle:cycleOf(live.slot)}; stat('candyBought', n);
    toast(`별사탕 ${n} 개를 샀어요 · -${p*n} G`); questEvent('candyBuy', 'candy', n);
  } else {
    if (!c) return; n = Math.min(-n, c.n); const got = p*n, base = Math.round(c.cost * n / c.n);
    c.cost -= base; c.n -= n; if (!c.n) me.candy = null;
    me.inv.gold += got; me.earned = (me.earned||0) + got; if (got > base) stat('stockProfit', got - base); syncStats();
    toast(`별사탕 ${n} 개를 팔았어요 · +${got} G (${got-base >= 0 ? '+' : ''}${got-base} G)`); questEvent('candySell', 'candy', n);
  }
  saveMe(); renderHud(); tvPanel();
}
function tvPanel(){
  if (!hasTV()) return toast('보리 공방에서 동그란 TV를 만들어 집에 놓으면 홈쇼핑을 볼 수 있어요');
  if (Z().house !== uid) return toast('홈쇼핑은 집에 있는 TV로 봐요');
  const live = showLive(), cur = live ? live.slot : lastSlot(), c = myCandy(), cyc = cycleOf(cur), first = cyc * CANDY_PER;
  const nx = live ? null : (()=>{ let k = lastSlot() + 1; return {slot:k, wait:slotTime(k) - Date.now()}; })();
  const rows = Array.from({length:CANDY_PER}, (_,i)=>{ const k = first + i, d = Math.floor(k/2) - Math.floor(first/2) + 1, past = k <= lastSlot();
    return `<div class="tv-cell ${live && k===cur ? 'on' : ''}"><small>${d}일째 ${slotName(k)}</small><b>${past ? candyPrice(k) + ' G' : '?'}</b></div>`; }).join('');
  const price = live ? candyPrice(live.slot) : null;
  openPanel(`📺 핑키 홈쇼핑 · 💰 ${me.inv.gold} G`,
    `<div class="np" style="display:block">${live ? `<b style="color:#e0457b">● 지금 방송 중</b> · ${live.left} 분 남았어요<br>오늘의 별사탕 <b style="font-size:30px">${price} G</b>` : `방송 쉬는 시간이에요. 다음 방송: ${slotName(nx.slot)} (${fmtLeft(nx.wait)} 뒤)`}</div>
     <div class="tv-grid">${rows}</div>
     ${c ? `<div class="np" style="display:block">내 별사탕 <b>${c.n}</b> 개 · 평균 ${Math.round(c.cost/c.n)} G${price ? ` · 지금 팔면 ${price*c.n} G (${price*c.n - c.cost >= 0 ? '+' : ''}${price*c.n - c.cost} G)` : ''}<br><small>이번 판이 끝나는 4 일째 오후 1 시 방송이 시작되면 녹아요</small></div>` : ''}
     ${live ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${[10, 50, 100].map(q=>`<button class="mini" data-q="${q}">${q} 개 사기</button>`).join('')}<button class="mini" data-q="999">최대로 사기</button>${c ? `<button class="mini" data-q="-10">10 개 팔기</button><button class="mini" data-q="-${c.n}">전부 팔기</button>` : ''}</div>` : ''}
     <p class="mnote">방송은 매일 오후 1 시, 밤 10 시에 한 시간씩. 그때만 사고팔 수 있어요. 3 일(방송 6 번)이 한 판이고, 값은 판마다 다르게 오르내려요. 다음 판 첫 방송이 시작되면 남은 별사탕은 녹아요. 최대 ${CANDY_MAX} 개.</p>`);
  $('npcPanel').dataset.tv = '1';

function questFor(n){ const list = NPC_QUESTS[n.id]||[]; const q = qState(); return list.find(x=>!q.done.includes(x.id)) || null; }
function questAvail(n, qq){ const list = NPC_QUESTS[n.id]||[], i = list.indexOf(qq); return heartsN(n) >= (qq.unlock||0) && (i===0 || qState().done.includes(list[i-1].id)); }

// 사건이 일어날 때 호출: type = catch|kill|mine|cook|sell|gift|talk, key = 물건/몬스터/주민 id
function questEvent(type, key, n=1){

  for (const [nid, qid] of Object.entries(q.active)){ const qq = (NPC_QUESTS[nid]||[]).find(x=>x.id===qid); if (!qq || qq.type!==type) continue;
    const match = type==='sell' ? key.startsWith(qq.key+':') : (key===qq.key || (type==='catch' && key.startsWith(qq.key+'_')));
    if (!match) continue; const before = q.prog[qid]||0; if (before >= qq.n) continue; q.prog[qid] = Math.min(qq.n, before + n); changed = true;
    if (q.prog[qid] >= qq.n) toast(`퀘스트 목표 달성! ${NPC[nid].name}에게 돌아가요: ${qq.title}`); }

}

const stars = [];

function updateStars(t){

  if (stars.length < 3 && Math.random() < .01) stars.push({x:150+Math.random()*(Z().W-300), y:120+Math.random()*220, t});
  for (let i=stars.length-1;i>=0;i--) if (t - stars[i].t > 4000) stars.splice(i,1);

    c.save(); c.globalAlpha = 1 - a; c.strokeStyle='#fff6b0'; c.lineWidth=2; c.beginPath(); c.moveTo(x-40,y-22); c.lineTo(x,y); c.stroke(); c.fillStyle='#fffbe0'; c.beginPath(); c.arc(x,y,5,0,7); c.fill(); c.restore(); }

let stuckT = 0, walked = 0;
function step(dt){
  let vx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let vy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  keyMoving = !!(vx||vy);
  if (fishing && fishing.phase!=='game' && (vx||vy||target)) stopFishing('낚싯대를 거뒀어요');
  if (fishing && fishing.phase==='game'){ vx = 0; vy = 0; }
  if (vx||vy) target = null;
  else if (target){
    const dx = target.x-pos.x, dy = target.y-pos.y, d = Math.hypot(dx,dy);
    if (d < 5 || (target.act && d < 30)){ const a = target.act; target = null; if (a) a(); }
    else { vx = dx/d; vy = dy/d; }
  }
  const len = Math.hypot(vx,vy);
  pos.moving = len>0;
  if (!len) return;
  vx/=len; vy/=len;
  pos.dir = Math.abs(vx) > Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
  const ox = pos.x, oy = pos.y, nx = pos.x + vx*SPEED*dt, ny = pos.y + vy*SPEED*dt;
  if (!blocked(nx, pos.y)) pos.x = nx;
  if (!blocked(pos.x, ny)) pos.y = ny;
  walked += Math.hypot(pos.x-ox, pos.y-oy); if (walked > 500){ stats().distanceWalked = (stats().distanceWalked||0) + Math.round(walked); walked = 0; checkAchievements(); }
  checkExit();
  if (target && Math.hypot(pos.x-ox, pos.y-oy) < SPEED*dt*.2){ stuckT += dt; if (stuckT>.35){ const tg = target; target = null; stuckT = 0; if (tg.act && Math.hypot(pos.x-tg.x, pos.y-tg.y) < 64) tg.act(); } } else stuckT = 0;
}

let lastPres = 0, presSig = '', lastTarget = null;
function sendPresence(t){
  if (!net || !me || admin) return;
  const tgt = target && !keyMoving ? target : null;
  const p = {z:zoneId, nick:me.nick, look:me.look, roof:me.roof, x:Math.round(pos.x), y:Math.round(pos.y), dir:pos.dir, mv:pos.moving?1:0, emo:emo.e||'', emoAt:emo.at||0, ex:myExpr(), ti:me.title ? titleOf(me.title) : ''};
  const wp = walkingPet(); if (wp) p.pet = {sp:wp.sp, col:wp.col|0, name:String(wp.name||'').slice(0,8)};
  if (tgt){ p.tx = Math.round(tgt.x); p.ty = Math.round(tgt.y); }
  const sig = JSON.stringify(tgt ? {...p, x:0, y:0, dir:0, mv:0} : p);
  let go = false;
  if (tgt !== lastTarget) go = true;                              // 목적지가 바뀌면 바로 보내요 (나머지는 각자 화면에서 걸어가요)
  else if (keyMoving) go = t-lastPres >= 250;                     // 키보드로 걸을 땐 0.25 초마다
  else if (sig !== presSig) go = t-lastPres >= 120;               // 멈춤, 방향, 이모티콘
  if (!go) return;
  lastTarget = tgt; presSig = sig; lastPres = t;
  net.presence(p).catch(()=>{});
}
function moveOthers(dt){
  for (const o of others.values()){
    if (o.goal){
      const dx = o.goal.x-o.x, dy = o.goal.y-o.y, d = Math.hypot(dx,dy);
      if (d < 4){ o.goal = null; o.mv = 0; continue; }
      const st = Math.min(d, SPEED*dt); o.x += dx/d*st; o.y += dy/d*st; o.mv = 1;
      o.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    } else {
      const k = Math.min(1, dt*8); o.x += (o.sx-o.x)*k; o.y += (o.sy-o.y)*k;
      o.mv = o.mvRemote || Math.hypot(o.sx-o.x, o.sy-o.y) > 2 ? 1 : 0;
    }
  }
}

// 집 안에서는 시간에 따라 천천히 이곳저곳으로 옮겨 다녀요 (모두에게 같은 자리로 보여요)
function petHomePos(owner, i){

  openPanel(`${P.name} 입양하기`, `<button class="mini" id="adBack" style="background:#fff">← 보호소로</button>
    <div class="bag-grid">${P.cols.map((c,i)=>`<button class="tile ${i===col?'on':''}" data-c="${i}"><img class="ic" src="${petIcon(sp, i)}" alt=""><em>${i+1} 번 아이</em></button>`).join('')}</div>
    <label class="field"><b>이름</b><input id="petName" maxlength="8" placeholder="최대 8 글자"></label>
    <div class="act"><button class="btn" id="adGo">우리 집으로 데려가기</button></div>`);
  $('adBack').onclick = shelterPanel;
  $('npcPanel').querySelectorAll('.tile[data-c]').forEach(b=>b.onclick = ()=>{ const nm = $('petName').value; adoptPanel(sp, +b.dataset.c); $('petName').value = nm; });
  $('adGo').onclick = ()=>{ const name = $('petName').value.trim(); if (!name) return toast('이름을 지어 주세요');
    const pets = myPets(); pets.push({sp, col, name:name.slice(0,8), fedAt:Date.now(), love:0, petAt:0, born:Date.now(), walk:false}); me.pets = pets; stat('petsAdopted');
    saveMe(); renderHud(); $('npcPanel').hidden = true; say('반려동물 보호소', `${name}(${P.name})이(가) 우리 집 식구가 됐어요! 집에 가면 만날 수 있어요. 펫 간식을 챙겨 주세요.`); };
}
function petPanel(pt){
  const f = fullness(pt), lv = loveLv(pt), food = me.inv.petFood||0;
  openPanel(`${esc(pt.name)} · ${PET[pt.sp].name}`, `<div class="np" style="grid-template-columns:auto 1fr;align-items:center"><img class="ic" src="${petIcon(pt.sp, pt.col)}" alt="" style="width:64px;height:64px"><span class="np-name">${petMood(pt)} <small>배부름 ${f}/100 · 친밀도 ${'♥'.repeat(lv) || '♡'} (${pt.love||0})</small></span></div>` +
    `<button class="np" data-id="feed"><span class="np-name">간식 주기 <small>가진 간식 ${food} 개</small></span></button>` +
    `<button class="np" data-id="pat"><span class="np-name">쓰다듬기 <small>한 시간에 한 번 친해져요</small></span></button>` +
    `<button class="np" data-id="walk"><span class="np-name">${pt.walk ? '산책 그만하기' : '산책 데리고 다니기'} <small>${pt.walk ? '지금 밖에서 따라다녀요' : '켜면 밖에서 나를 따라다녀요 (한 마리만)'}</small></span></button>`,
    b=>{ const id = b.dataset.id;
      if (id==='feed'){ if (!food) return toast('펫 간식이 없어요. 보호소에서 살 수 있어요'); if (f >= 95) return toast(`${pt.name}은(는) 배불러요`); me.inv.petFood = food - 1; if (f < 60) pt.love = (pt.love||0) + 3; pt.fedAt = Date.now(); saveMe(); toast(`${pt.name}이(가) 맛있게 먹었어요`); }
      if (id==='pat'){ if (Date.now() - (pt.petAt||0) < 3600000){ toast(`${pt.name}이(가) 좋아해요`); return; } pt.petAt = Date.now(); pt.love = (pt.love||0) + 2; saveMe(); toast(`${pt.name}이(가) 꼬리를 흔들어요`); }
      if (id==='walk'){ const on = !pt.walk; for (const p of myPets()) p.walk = false; pt.walk = on; saveMe(); toast(on ? `${pt.name}이(가) 산책을 따라가요` : `${pt.name}은(는) 집에서 쉬어요`); }
      petPanel(pt); });
}
function talkBubble(key, x, y, t){
  const e = bubbles.get(key+'-emo'), b = bubbles.get(key);
  if (b && t-b.at < 5000) bubble(ctx, b.text, x, y-80);
  else if (e && t-e.at < 3000) bubble(ctx, e.text, x, y-80);
}
requestAnimationFrame(frame);
if (solo) window.__pinky = { tvPanel, candyPrice, candyTrade, showLive, lastSlot, adminTest: ()=>{ admin = true; others.set('t1', {x:820, y:640, sx:820, sy:640, z:'village', dir:'down', look:CH.defaultLook(), nick:'테스트', uid:'t1'}); enterAdmin(); }, showAdminLogin, housePanel, myHouse, HOUSE_LV, WALLS, FLOORS, iconURL, uiURL, menuPanel, situationsNow, situationLine, showLogin, logout, questLog, achPanel, questEvent, stat, syncStats, NPC_QUESTS, ACHIEVEMENTS, LORE, dexInfo, CH, clothesPanel, setExpr, wear, sellPanel, pricePanel, marketPanel, marketAdd, unitPrice, marketMul, hotToday, sellItem, get market(){ return market; }, swing, weaponPanel, ART, showBag, useSlot, talkTo, giveGift, NPCS, pos, view, painter, enterZone, addPts, playEvents, castAt, fishTap, mineRock, rocksHere, hitMob, seedShop, showBag, invAdd, invCount, cook, errandsToday, errandPanel, workshopPanel, decorMenu, houseTap, clothesPanel, museumPanel, makeWish, promiseTree, contestPanel, eatDish, forecast, get boss(){ return boss; }, get decorating(){ return decorating; }, set decorating(v){ decorating = v; }, get fishing(){ return fishing; }, get mobs(){ return mobs; }, get hp(){ return playerHp; }, get zone(){ return zoneId; }, get me(){ return me; } }; // 혼자 보기 모드 테스트용
</script>
